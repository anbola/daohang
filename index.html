<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>冬阳汇 · 一个给老师和普通人的导航</title>
<meta name="description" content="冬阳汇：480+ 个实测可用的免费站点与工具，按「真正会遇到的场景」摆好 —— 国家平台、备课出卷、装机必备、AI 工具、剪辑录屏、机房运维、班主任、学籍教务，不卖会员、不掺软文。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232C63D6'/%3E%3Ccircle cx='21.4' cy='10.6' r='4.1' fill='%23F5A24A'/%3E%3Cpath d='M3 26.5l7.6-9.8 5.3 6.3L20.4 18l8.6 8.5z' fill='%23FFFFFF'/%3E%3C/svg%3E">
<style>
/* ==========================================================
   教师导航 · 视觉系统 v3「晨光教室」
   签名元素：首屏晨光渐变带 + 粉笔颗粒质感 + 粉笔色分类板
   ========================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.62;
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;transition:background .35s var(--ease),color .35s var(--ease)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
::selection{background:var(--brand-soft-2);color:var(--brand-ink)}
svg{display:block}

/* ---------- 令牌：浅色 ---------- */
:root{
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);

  --bg:#f5f7fc; --bg-2:#eef1f9;
  --surface:#ffffff; --surface-2:#f7f9fd; --surface-3:#eff3fb;
  --ink:#111722; --ink-2:#3d4859; --ink-3:#646f85;
  --line:#e3e9f4; --line-2:#eef2f8;

  --brand:#4661e8; --brand-ink:#2f4bc4; --brand-soft:rgba(70,97,232,.09); --on-brand:#ffffff;
  --brand-soft-2:rgba(70,97,232,.20);
  --accent:#e8862e; --accent-soft:rgba(232,134,46,.12);
  --ok:#12876a; --ok-bg:rgba(18,135,106,.10);
  --warn:#c2760a; --warn-bg:rgba(194,118,10,.11);
  --info:#0e7490; --info-bg:rgba(14,116,144,.10);
  --purple:#6d3ae0; --purple-bg:rgba(109,58,224,.10);

  --r:16px; --r-s:11px; --r-xs:8px;
  --dawn-op:.62;
  --sh-1:0 1px 2px rgba(20,26,36,.05);
  --sh-2:0 2px 8px -2px rgba(20,26,36,.10),0 1px 2px rgba(20,26,36,.04);
  --sh-3:0 14px 34px -12px rgba(20,26,36,.22),0 3px 10px -3px rgba(20,26,36,.08);
  --sh-brand:0 10px 26px -10px rgba(70,97,232,.5);
  --pad:13px; --side-w:246px; --top-h:64px;
  --t:.18s var(--ease);
}
/* ---------- 令牌：深色（单独调，不是反色） ---------- */
[data-theme="dark"]{
  --bg:#0d1118; --bg-2:#131820;
  --surface:#161c25; --surface-2:#1b222d; --surface-3:#202834;
  --ink:#eef2f9; --ink-2:#bcc7d9; --ink-3:#9aa5ba;
  --line:#242e3c; --line-2:#1d2530;

  --brand:#8fa6ff; --brand-ink:#c2cfff; --brand-soft:rgba(143,166,255,.13); --on-brand:#0d1118;
  --brand-soft-2:rgba(143,166,255,.28);
  --accent:#ffb066; --accent-soft:rgba(255,176,102,.15);
  --ok:#37c48c; --ok-bg:rgba(55,196,140,.14);
  --warn:#e0a04a; --warn-bg:rgba(224,160,74,.15);
  --info:#54b6d6; --info-bg:rgba(84,182,214,.14);
  --purple:#b49bff; --purple-bg:rgba(180,155,255,.15);

  --dawn-op:.38;
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 2px 10px -2px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3);
  --sh-3:0 18px 40px -14px rgba(0,0,0,.75),0 4px 12px -4px rgba(0,0,0,.5);
  --sh-brand:0 10px 28px -10px rgba(143,166,255,.45);
}

/* ---------- 氛围：粉笔颗粒 ---------- */
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.028;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:.03}
[data-theme="dark"] .grain{opacity:.055}

/* ================= 顶栏 ================= */
.top{position:sticky;top:0;z-index:60;height:var(--top-h);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  -webkit-backdrop-filter:saturate(170%) blur(18px);backdrop-filter:saturate(170%) blur(18px);
  border-bottom:1px solid transparent;transition:border-color .3s var(--ease),background .3s var(--ease)}
.top.stuck{border-bottom-color:var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent)}
.top-in{height:100%;display:flex;align-items:center;gap:13px;padding:0 24px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:-.3px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,var(--brand),color-mix(in srgb,var(--brand) 45%,var(--accent)));
  box-shadow:var(--sh-brand);transition:transform .4s var(--spring)}
.brand:hover .mark{transform:rotate(-8deg) scale(1.06)}
.brand .mark svg{width:17px;height:17px}
.brand small{font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.09em;
  padding:2px 6px;border:1px solid var(--line);border-radius:6px;margin-left:2px}
.top-sp{flex:1}
.tbtn{height:35px;min-width:35px;padding:0 11px;border-radius:10px;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;font-size:12.5px;color:var(--ink-2);transition:var(--t);position:relative}
.tbtn:hover{background:var(--surface-3);color:var(--ink);transform:translateY(-1px)}
.tbtn:active{transform:translateY(0) scale(.96)}
.tbtn svg{width:16px;height:16px}
.tbtn.icon-only{padding:0;width:35px}
.tbtn .cnt{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;font-size:10px;font-weight:700;
  color:#fff;background:var(--accent);border-radius:9px;padding:0 4px;line-height:16px;text-align:center;
  box-shadow:0 0 0 2px var(--bg)}
.menu-btn{display:none}

/* ================= 布局 ================= */
.wrap{display:flex;max-width:1560px;margin:0 auto;align-items:flex-start;position:relative;z-index:2}
.side{width:var(--side-w);flex:0 0 var(--side-w);position:sticky;top:var(--top-h);
  height:calc(100vh - var(--top-h));overflow-y:auto;overscroll-behavior:contain;
  padding:18px 12px 40px 20px;scrollbar-width:thin}
.side::-webkit-scrollbar{width:5px}
.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.side::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
.grp-t{font-size:10px;font-weight:800;letter-spacing:.13em;color:var(--ink-3);
  padding:0 12px;margin:4px 0 8px;text-transform:uppercase}
.nav{position:relative}
.nav-pill{position:absolute;left:0;width:100%;border-radius:10px;background:var(--brand-soft);
  z-index:0;pointer-events:none;opacity:0;height:38px;
  transition:transform .4s var(--spring),opacity .25s var(--ease);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 18%,transparent)}
.nav-pill.on{opacity:1}
.nav-i{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;
  font-size:13.5px;color:var(--ink-2);transition:color var(--t);width:100%;text-align:left;position:relative;z-index:1}
.nav-i:hover{color:var(--ink)}
.nav-i.on{color:var(--brand-ink);font-weight:700}
.nav-i .nv-ic{width:18px;height:18px;flex:0 0 18px;opacity:.55;transition:var(--t)}
.nav-i:hover .nv-ic{opacity:.85}
.nav-i.on .nv-ic{opacity:1}
.nav-i .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i .c{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:600}
.nav-i.on .c{color:var(--brand-ink);opacity:1}
.nav-sep{height:1px;background:var(--line);margin:14px 12px}
.main{flex:1;min-width:0;padding:22px 30px 96px}
.cont{max-width:1240px;margin:0 auto}

/* ================= 首屏 ================= */
.hero{position:relative;padding:14px 0 26px}
.hero .dawn{position:absolute;left:-46px;right:-46px;top:-90px;height:330px;z-index:0;opacity:var(--dawn-op);
  will-change:transform,opacity;contain:paint;
  background:
    radial-gradient(58% 100% at 10% 4%,#ffc6a3 0%,rgba(255,198,163,0) 72%),
    radial-gradient(52% 96% at 32% 12%,#ffb0c6 0%,rgba(255,176,198,0) 74%),
    radial-gradient(58% 108% at 56% 2%,#c2aeff 0%,rgba(194,174,255,0) 76%),
    radial-gradient(56% 100% at 78% 10%,#9cc3ff 0%,rgba(156,195,255,0) 74%),
    radial-gradient(52% 96% at 96% 6%,#a6e4da 0%,rgba(166,228,218,0) 76%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 36%,rgba(0,0,0,.42) 66%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 36%,rgba(0,0,0,.42) 66%,transparent 100%);
  animation:dawnRise 1.1s var(--ease-out) both}
@keyframes dawnRise{from{opacity:0;transform:translateY(-14px) scaleX(.94)}to{opacity:var(--dawn-op);transform:none}}
[data-theme="dark"] .hero .dawn{
  background:
    radial-gradient(58% 100% at 10% 4%,var(--dawn-a) 0%,rgba(0,0,0,0) 72%),
    radial-gradient(52% 96% at 32% 12%,var(--dawn-b) 0%,rgba(0,0,0,0) 74%),
    radial-gradient(58% 108% at 56% 2%,var(--dawn-c) 0%,rgba(0,0,0,0) 76%),
    radial-gradient(56% 100% at 78% 10%,var(--dawn-d) 0%,rgba(0,0,0,0) 74%),
    radial-gradient(52% 96% at 96% 6%,var(--dawn-e) 0%,rgba(0,0,0,0) 76%)}
@keyframes dawnBreathe{0%,100%{transform:translateY(0) scaleX(1);opacity:.56}50%{transform:translateY(12px) scaleX(1.05);opacity:.70}}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0 0 8px;font-size:31px;line-height:1.22;letter-spacing:-.9px;font-weight:800;color:var(--ink)}
.hero h1 em{font-style:normal;position:relative;color:var(--brand-ink)}
.hero h1 em::after{content:'';position:absolute;left:-2px;right:-2px;bottom:2px;height:9px;z-index:-1;
  background:var(--dawn);opacity:.55;border-radius:5px;transform:rotate(-.5deg)}
.hero p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:640px}
.hero .stat{margin-top:16px;display:flex;gap:18px;flex-wrap:wrap}
.hero .stat b{font-size:19px;font-weight:800;letter-spacing:-.6px;color:var(--ink);font-variant-numeric:tabular-nums}
.hero .stat span{font-size:11px;color:var(--ink-2);margin-left:4px}

.search{position:relative;margin-top:20px;max-width:640px}
.search input{width:100%;height:52px;padding:0 96px 0 46px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;
  outline:none;transition:border-color .22s var(--ease),box-shadow .22s var(--ease);box-shadow:var(--sh-1)}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft),var(--sh-2)}
.search .si{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:19px;height:19px;color:var(--ink-3);pointer-events:none;transition:color var(--t)}
.search:focus-within .si{color:var(--brand)}
.search .kbd{position:absolute;right:13px;top:50%;transform:translateY(-50%);display:flex;gap:4px;pointer-events:none}
.search .kbd kbd{font-family:inherit;font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface-3);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 6px;line-height:1.4}
.search .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;
  border-radius:50%;display:none;place-items:center;color:var(--ink-3);transition:var(--t)}
.search .clr:hover{background:var(--surface-3);color:var(--ink);transform:translateY(-50%) rotate(90deg)}
.search.val .clr{display:grid}
.search.val .kbd{display:none}

/* ================= 区块 ================= */
.sec{margin:0 0 34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.sec-h h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.3px}
.sec-h .sub{font-size:12px;color:var(--ink-3)}
.sec-h .sp{flex:1}
.sec-h .more{font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:3px;
  padding:4px 9px;border-radius:8px;transition:var(--t)}
.sec-h .more:hover{color:var(--brand-ink);background:var(--brand-soft)}
.sec-h .more svg{width:13px;height:13px;transition:transform var(--t)}
.sec-h .more:hover svg{transform:translateX(3px)}

/* ================= 常用 ================= */
.pinned{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
@media(min-width:900px){.pinned{grid-template-columns:repeat(8,1fr)}}
@media(min-width:1280px){.pinned{grid-template-columns:repeat(12,1fr)}}
.pin{display:flex;flex-direction:column;align-items:center;gap:8px;padding:13px 4px 12px;
  border-radius:14px;transition:transform .3s var(--spring),background .22s var(--ease),box-shadow .22s var(--ease);
  position:relative}
.pin:hover{background:var(--surface);box-shadow:var(--sh-3);transform:translateY(-3px)}
.pin:active{transform:translateY(-1px) scale(.98)}
.pin .lg{width:46px;height:46px;border-radius:15px;font-size:18px;
  box-shadow:0 4px 12px -4px rgba(20,26,36,.28);transition:transform .34s var(--spring)}
.pin:hover .lg{transform:scale(1.1) rotate(-3deg)}
.pin .nm{font-size:11.5px;color:var(--ink-2);text-align:center;line-height:1.34;
  max-width:100%;height:31px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;transition:color var(--t)}
.pin:hover .nm{color:var(--ink)}
.pin .star{position:absolute;top:6px;right:calc(50% - 28px);width:19px;height:19px;border-radius:50%;
  display:none;place-items:center;color:var(--accent);background:var(--surface);
  box-shadow:0 2px 6px rgba(20,26,36,.16)}
.pin:hover .star,.pin:focus-within .star{display:grid}
.pin .star svg{width:11px;height:11px}
.pin .star:hover{transform:scale(1.15)}
@media(hover:none){.pin .star{display:grid;opacity:.28}}

/* logo */
.lg{display:grid;place-items:center;flex:0 0 auto;color:#fff;font-weight:800;
  letter-spacing:-.4px;background:var(--brand);overflow:hidden;position:relative;line-height:1;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.lg::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.30),rgba(255,255,255,0) 55%)}
[data-theme="dark"] .lg{filter:saturate(.86) brightness(.93)}
.lg.sm{width:31px;height:31px;border-radius:10px;font-size:13px}
.lg.md{width:35px;height:35px;border-radius:11px;font-size:14px}
.lg.lg2{width:46px;height:46px;border-radius:15px;font-size:18px}
.lg.xl{width:54px;height:54px;border-radius:17px;font-size:21px}

/* ================= 场景 ================= */
.flows{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:840px){.flows{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.flows{grid-template-columns:repeat(5,1fr)}}
.flow{display:flex;gap:13px;align-items:flex-start;padding:16px 17px;border-radius:15px;
  background:var(--surface);border:1px solid var(--line);
  transition:transform .3s var(--spring),border-color .22s var(--ease),box-shadow .28s var(--ease);
  text-align:left;width:100%;position:relative;overflow:hidden}
.flow::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s var(--ease);
  background:linear-gradient(120deg,var(--brand-soft),transparent 60%)}
.flow:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));box-shadow:var(--sh-3);transform:translateY(-3px)}
.flow:hover::before{opacity:1}
.flow>*{position:relative}
.flow .fi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 38px;
  background:var(--brand-soft);color:var(--brand-ink);transition:transform .34s var(--spring)}
.flow:hover .fi{transform:scale(1.08) rotate(-6deg)}
.flow .fi svg{width:20px;height:20px}
.flow .tx{display:block;min-width:0}
.flow .ft{display:block;font-size:13.5px;font-weight:750;margin-bottom:3px;line-height:1.4;color:var(--ink)}
.flow .fd{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.55}

/* ================= 分类总览 ================= */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:13px}
@media(min-width:1040px){
  .catcard.big{grid-column:span 2;padding:19px;gap:16px}
  .catcard.big .cc-ic{width:56px;height:56px;flex:0 0 56px;border-radius:17px}
  .catcard.big .cc-ic svg{width:27px;height:27px}
  .catcard.big .cc-n{font-size:17px;letter-spacing:-.45px}
  .catcard.big .cc-c{font-size:11.5px}
  .catcard.big .cc-d{font-size:12.5px;-webkit-line-clamp:3;min-height:0;margin-bottom:12px}
}
.catcard{display:flex;gap:13px;align-items:flex-start;padding:16px;border-radius:17px;background:var(--surface);
  border:1px solid var(--line);
  transition:transform .32s var(--spring),border-color .22s var(--ease),box-shadow .3s var(--ease);
  text-align:left;width:100%;position:relative;overflow:hidden}
.cc-body{flex:1;min-width:0;display:block}
.catcard::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .35s var(--ease);
  background:radial-gradient(120% 90% at 12% 0%,color-mix(in srgb,var(--cc) 16%,transparent),transparent 62%)}
.catcard:hover{border-color:color-mix(in srgb,var(--cc) 45%,var(--line));box-shadow:var(--sh-3);transform:translateY(-4px)}
.catcard:hover::before{opacity:1}
.catcard>*{position:relative}
.cc-h{display:flex;align-items:baseline;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.cc-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:0 0 40px;
  background:color-mix(in srgb,var(--cc) 14%,transparent);color:var(--cc);
  transition:transform .34s var(--spring)}
.catcard:hover .cc-ic{transform:scale(1.08) rotate(-5deg)}
.cc-ic svg{width:20px;height:20px}
.cc-n{font-size:14.5px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.cc-c{font-size:11px;color:var(--ink-2);font-weight:600}
.cc-d{font-size:12px;color:var(--ink-2);line-height:1.6;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.cc-tags{display:flex;flex-wrap:wrap;gap:5px}
.cc-tag{font-size:10.5px;color:var(--ink-2);background:var(--surface-3);padding:2.5px 8px;border-radius:6px}
.cc-tag.more{color:var(--brand-ink);background:var(--brand-soft);font-weight:700}

/* ================= 分类页 ================= */
/* 分类风险提示条 */
.warn{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;padding:12px 14px;border-radius:12px;
  background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 26%,transparent);
  animation:riseIn .45s var(--ease-out) both}
.warn>span{width:20px;height:20px;flex:0 0 20px;color:var(--warn);margin-top:1px}
.warn>span svg{width:18px;height:18px}
.warn p{margin:0;font-size:12px;line-height:1.65;color:var(--ink-2)}
[data-theme="dark"] .warn p{color:var(--ink-2)}

.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-bottom:15px}
.crumb a:hover{color:var(--brand-ink)}
.crumb svg{width:12px;height:12px;opacity:.6}
.cat-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.cat-head .cc-ic{width:48px;height:48px;flex:0 0 48px;border-radius:15px;
  background:color-mix(in srgb,var(--cc) 15%,transparent);color:var(--cc);
  box-shadow:0 6px 18px -8px color-mix(in srgb,var(--cc) 60%,transparent)}
.cat-head .cc-ic svg{width:24px;height:24px}
.cat-head h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.7px}
.cat-head p{margin:0;font-size:12.5px;color:var(--ink-3)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px;padding-bottom:20px;
  border-bottom:1px solid var(--line-2)}
.chip{height:32px;padding:0 13px;border-radius:9px;font-size:12.5px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);
  transition:transform .24s var(--spring),border-color .2s var(--ease),background .2s var(--ease);
  white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));color:var(--ink);transform:translateY(-2px)}
.chip.on{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 70%,var(--accent)));
  border-color:transparent;color:var(--on-brand);font-weight:750;box-shadow:var(--sh-brand)}
.chip .n{font-size:10.5px;opacity:.82;font-variant-numeric:tabular-nums}

.sublist{padding-top:4px}
.sgroup{margin-top:26px}
.sgroup:first-child{margin-top:16px}
.sgh{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sgh i{width:4px;height:15px;border-radius:3px;
  background:linear-gradient(180deg,var(--cc,var(--brand)),color-mix(in srgb,var(--cc,var(--brand)) 40%,var(--accent)));
  flex:0 0 4px;display:block}
.sgh b{font-size:13px;font-weight:800;letter-spacing:-.2px;color:var(--ink)}
.sgh span{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(332px,1fr));gap:9px}
.item{display:flex;gap:12px;align-items:flex-start;padding:var(--pad);border-radius:13px;
  background:var(--surface);border:1px solid var(--line-2);
  transition:transform .26s var(--spring),background .2s var(--ease),border-color .2s var(--ease),box-shadow .26s var(--ease);
  position:relative;text-align:left;width:100%}
.item:hover{border-color:color-mix(in srgb,var(--cc,var(--brand)) 38%,var(--line));
  box-shadow:var(--sh-2);transform:translateY(-2px)}
.item .lg{transition:transform .3s var(--spring)}
.item:hover .lg{transform:scale(1.06) rotate(-3deg)}
.item .bd{min-width:0;flex:1}
.item .nm{font-size:13.5px;font-weight:700;line-height:1.45;display:flex;align-items:center;gap:7px;
  flex-wrap:wrap;letter-spacing:-.15px;color:var(--ink)}
.item .ds{font-size:11.8px;color:var(--ink-3);line-height:1.55;margin-top:2px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item:hover .ds{color:var(--ink-2)}
.item .fav{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:7px;
  display:none;place-items:center;color:var(--ink-3);background:var(--surface);
  border:1px solid var(--line);transition:var(--t)}
.item:hover .fav,.item .fav.on{display:grid}
.item .fav svg{width:13px;height:13px}
.item .fav:hover{color:var(--accent);transform:scale(1.12)}
.item .fav.on{color:var(--accent);border-color:transparent;background:transparent}

.bg{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;line-height:1.45;
  letter-spacing:.03em;white-space:nowrap;flex:0 0 auto;position:relative;top:-.5px}
.bg.free{background:var(--ok-bg);color:var(--ok)}
.bg.open{background:var(--purple-bg);color:var(--purple)}
.bg.quota{background:var(--warn-bg);color:var(--warn)}
.bg.part{background:var(--surface-3);color:var(--ink-3)}
.bg.over{background:var(--info-bg);color:var(--info)}

.foot-note{color:var(--ink-3);font-size:11.5px;line-height:1.85;margin-top:22px;padding-top:16px;
  border-top:1px solid var(--line);max-width:820px}
.foot-note a{color:var(--brand-ink);font-weight:700}
.foot-note a:hover{text-decoration:underline}

/* ================= 搜索 / 空态 ================= */
.res-h{display:flex;align-items:baseline;gap:9px;margin-bottom:18px}
.res-h h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.4px}
.res-h span{font-size:12.5px;color:var(--ink-3)}
.hl{background:var(--brand-soft-2);color:var(--brand-ink);border-radius:3px;padding:0 1px;font-weight:800}
.empty{text-align:center;padding:74px 20px;color:var(--ink-3)}
.empty .ei{width:56px;height:56px;margin:0 auto 16px;border-radius:17px;display:grid;place-items:center;
  background:var(--surface-3);color:var(--ink-3)}
.empty .ei svg{width:26px;height:26px}
.empty h3{margin:0 0 7px;font-size:15.5px;color:var(--ink-2);font-weight:750}
.empty p{margin:0;font-size:12.5px;line-height:1.75}
.empty .acts{margin-top:18px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.btn{height:35px;padding:0 15px;border-radius:10px;font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;
  transition:transform .22s var(--spring),background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease);
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.btn:hover{border-color:var(--brand);color:var(--brand-ink);transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 62%,var(--accent)));
  border-color:transparent;color:var(--on-brand);box-shadow:var(--sh-brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:8px}
.btn.gh{background:transparent;border-color:transparent}
.btn.gh:hover{background:var(--surface-3)}
.btn.danger{color:#dc2626;border-color:#dc26264d}
.btn.danger:hover{background:#dc2626;border-color:#dc2626;color:#fff}
.btn svg{width:14px;height:14px}

/* ================= 后台 ================= */
.admin{display:flex;min-height:100vh;padding-top:0}
.admin .side{position:sticky;top:0;height:100vh;padding-top:10px;
  border-right:1px solid var(--line);background:var(--surface-2)}
.admin .main{padding-top:22px}
.abar{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;gap:12px;
  background:var(--bg);border-bottom:1px solid var(--line);margin:-22px -28px 20px;padding:0 28px}
.abar h1{margin:0;font-size:15px;font-weight:800}
.abar .tag{font-size:10.5px;font-weight:800;color:var(--brand-ink);background:var(--brand-soft);
  padding:2px 7px;border-radius:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.panel>h3{margin:0 0 4px;font-size:13.5px;font-weight:800}
.panel>p.hint{margin:0 0 16px;font-size:12px;color:var(--ink-3);line-height:1.65}
.tbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tbar .sp{flex:1}
.inp{height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:13px;outline:none;transition:var(--t);width:100%}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp.w200{width:200px}.inp.w140{width:140px}
select.inp{padding-right:26px;cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b95a8' stroke-width='2.4'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;background-size:13px}
table.tb{width:100%;border-collapse:collapse;font-size:12.8px}
table.tb th{text-align:left;font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.05em;
  padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tb tr:last-child td{border-bottom:0}
table.tb tr:hover td{background:var(--surface-2)}
table.tb .nmx{font-weight:700;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.tb .urlx{color:var(--ink-3);font-size:11px;max-width:200px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
table.tb .op{display:flex;gap:3px;justify-content:flex-end}
.ibtn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3);
  transition:transform .2s var(--spring),background .2s var(--ease),color .2s var(--ease)}
.ibtn:hover{background:var(--surface-3);color:var(--ink)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:13px;height:13px}
.ibtn.d:hover{background:#fee2e2;color:#dc2626}
.limit{max-height:560px;overflow:auto;border-radius:9px}
.limit::-webkit-scrollbar{width:6px}
.limit::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:800;color:var(--ink-2);margin-bottom:6px;letter-spacing:.02em}
.field .tip{font-size:11px;color:var(--ink-3);margin-top:5px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:9px;border:2.5px solid transparent;transition:transform .24s var(--spring);position:relative}
.sw:hover{transform:scale(1.1)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}

.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row .rh{flex:1;min-width:0}
.row .rn{font-size:13px;font-weight:700}
.row .rd{font-size:11px;color:var(--ink-3)}
.tg{width:40px;height:22px;border-radius:20px;background:var(--line);position:relative;transition:background .28s var(--ease);flex:0 0 40px}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .32s var(--spring)}
.tg.on{background:var(--brand)}
.tg.on::after{transform:translateX(18px)}

.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:8px;font-size:12.5px;color:var(--ink-2);transition:var(--t)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:750;box-shadow:var(--sh-1)}

/* 弹层 */
.mask{position:fixed;inset:0;z-index:200;background:rgba(10,14,20,.5);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;
  animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.dlg{width:100%;max-width:540px;max-height:86vh;overflow:auto;background:var(--surface);
  border-radius:20px;box-shadow:0 30px 80px -16px rgba(0,0,0,.42);
  animation:slideUp .28s var(--ease-out);border:1px solid var(--line)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:19px 22px 14px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:15.5px;font-weight:800;flex:1;letter-spacing:-.3px}
.dlg-b{padding:19px 22px}
.dlg-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 22px 20px}
.dlg.sm{max-width:410px}

/* 登录 */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.login .card{width:100%;max-width:376px;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;padding:32px 28px;box-shadow:var(--sh-3);animation:riseIn .5s var(--ease-out) both}
.login .mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;margin-bottom:17px;
  background:linear-gradient(140deg,var(--brand),color-mix(in srgb,var(--brand) 45%,var(--accent)));
  color:#fff;box-shadow:var(--sh-brand)}
.login h2{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.5px}
.login p.s{margin:0 0 22px;font-size:12.5px;color:var(--ink-3);line-height:1.65}
.login .err{font-size:12px;color:#dc2626;margin-top:8px;display:none}
.login .err.on{display:block;animation:riseIn .3s var(--ease-out) both}
.login .foot{margin-top:17px;font-size:11px;color:var(--ink-3);line-height:1.75;
  padding-top:14px;border-top:1px solid var(--line-2)}

/* toast */
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,18px) scale(.96);z-index:300;
  background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700;padding:10px 18px;
  border-radius:12px;opacity:0;pointer-events:none;
  transition:opacity .24s var(--ease),transform .34s var(--spring);box-shadow:0 14px 36px rgba(0,0,0,.24)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}

/* 抽屉 */
.drawer-mask{position:fixed;inset:0;z-index:90;background:rgba(10,14,20,.42);display:none;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.drawer-mask.on{display:block;animation:fadeIn .2s ease}

/* ==========================================================
   动效
   ========================================================== */
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes fadeSlide{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}

/* 入场编排：只对首屏，一次性 */
.anim-in{animation:riseIn .55s var(--ease-out) both}
.pin.anim-in,.catcard.anim-in,.flow.anim-in{animation:popIn .5s var(--spring) both}

/* 滚动揭示 */
.reveal{opacity:0;transform:translateY(18px);
  transition:opacity .55s var(--ease-out),transform .55s var(--ease-out)}
.reveal.in{opacity:1;transform:none}

/* 视图切换 */
#view>*{animation:fadeSlide .34s var(--ease-out) both}
#view[data-mode="search"]>*{animation:none}

/* ================= 响应式 ================= */
@media(max-width:1080px){
  .menu-btn{display:inline-flex}
  .side{position:fixed;left:0;top:0;z-index:100;height:100vh;background:var(--surface);
    transform:translateX(-100%);transition:transform .28s var(--ease-out);
    box-shadow:16px 0 48px rgba(0,0,0,.16);width:274px;flex-basis:274px;padding-top:20px}
  .side.open{transform:none}
  .main{padding:20px 18px 80px}
  .admin .side{position:relative;transform:none;height:auto;width:100%;flex-basis:100%}
  .admin{flex-direction:column}
}
@media(max-width:760px){
  .top-in{padding:0 14px;gap:9px}
  .hero h1{font-size:24px;letter-spacing:-.6px}
  .hero p{font-size:12.5px}
  .hero .dawn{height:190px;top:-56px}
  .search input{height:48px;font-size:13.5px;padding-right:44px}
  .search .kbd{display:none}
  .pinned{grid-template-columns:repeat(4,1fr)}
  .pin .lg{width:42px;height:42px;font-size:16px}
  .items{grid-template-columns:1fr}
  .catgrid{grid-template-columns:1fr}
  .flows{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .main{padding:16px 14px 74px}
  .sec{margin-bottom:26px}
  .brand small{display:none}
  .abar{margin:-16px -14px 16px;padding:0 14px}
  .cat-head h1{font-size:19px}
  .hero .stat{gap:14px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
  .reveal{opacity:1;transform:none}
  .hero .dawn{animation:none}
}

/* 深色微调：场景卡说明提亮、分类图标底色加重 */
[data-theme="dark"] .flow .fd{color:var(--ink-2)}
[data-theme="dark"] .cc-ic{background:color-mix(in srgb,var(--cc) 22%,transparent)}
[data-theme="dark"] .cat-head .cc-ic{background:color-mix(in srgb,var(--cc) 24%,transparent)}
[data-theme="dark"] .pin .lg{filter:saturate(.82) brightness(.88)}
[data-theme="dark"] .empty .ei{background:var(--surface-3)}

/* 后台专属补充（主视觉已在 style.css） */
.ad .panel:last-child{margin-bottom:0}

/* ==================================================================
   v3「粉笔盒」视觉层 —— 排在 style.css 之后，作为覆盖层
   核心决策：取消全站单一品牌色的统治。
   骨架用真正中性的板岩灰，色彩预算全部移交给 15 个分类各自的本色，
   只保留一支「红笔朱砂」作为全站唯一强调色（用于"做事"的动作）。
   ================================================================== */

/* ---------- 1. Token：中性骨架 + 粉笔盒 15 色 ---------- */
:root{
  /* 中性骨架（不掺任何色相，这是去掉"一片蓝紫"的关键） */
  --bg:#F4F5F6;      --bg-2:#EAEDEF;
  --surface:#FFFFFF; --surface-2:#FAFBFB; --surface-3:#F1F3F4;
  --ink:#151A21;     --ink-2:#454E59;     --ink-3:#6E7883;
  --line:#DFE3E6;    --line-2:#E9ECEE;

  /* 唯一强调：红笔批改的朱砂 */
  --verm:#C4341F; --verm-ink:#A02A16; --verm-soft:rgba(196,52,31,.09); --verm-soft-2:rgba(196,52,31,.18);

  /* 旧 brand 语义 → 退化为骨架中性色（28 处引用自动褪色，让分类色上位） */
  --brand:#2A323C;
  --brand-ink:#151A21;
  --brand-soft:rgba(21,26,33,.055);
  --brand-soft-2:rgba(21,26,33,.15);
  --on-brand:#FFFFFF;
  --accent:#3A434E;          /* 保持中性，避免旧 color-mix 渐变出现脏色 */
  --accent-soft:rgba(58,67,78,.08);

  /* 粉笔盒：每个分类一支自己的颜色 */
  --k-gov:#B83A2F;   --k-prep:#2B6CB8;  --k-exam:#C08518;
  --k-video:#6B3FA0; --k-ai:#0E9A8C;    --k-media:#C2185B;
  --k-design:#E07A2F;--k-office:#6B7280;--k-room:#3F8A32;
  --k-bzr:#D97706;   --k-subject:#3D4EA8;--k-maker:#0B7FA8;
  --k-lab:#334155;
  --k-soft:#6D7B2F;  --k-plug:#8B4A2B;  --k-open:#312E81;
  --k-research:#5B4B8A;
  --k-setup:#5D5FEF;

  /* 当前握在手里的那支粉笔（搜索框用） */
  --sc:#2A323C;
  --sc-soft:rgba(42,50,60,.08);
  --sc-soft-2:rgba(42,50,60,.18);

  --r:14px; --r-s:10px; --r-xs:7px;
  --sh-1:0 1px 2px rgba(15,20,26,.05);
  --sh-2:0 2px 8px -2px rgba(15,20,26,.10),0 1px 2px rgba(15,20,26,.04);
  --sh-3:0 14px 34px -12px rgba(15,20,26,.20),0 3px 10px -3px rgba(15,20,26,.07);

  --ui:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

/* 深色模式下：底色翻黑，粉笔色整体提亮，保证暗背景上的可读性 */
[data-theme="dark"]{
  --bg:#0F1318;      --bg-2:#141A21;
  --surface:#171D24; --surface-2:#1B222A; --surface-3:#20282F;
  --ink:#EDF1F4;     --ink-2:#C6CFD8;     --ink-3:#9EAAB6;
  --line:#2A323B;    --line-2:#222A32;
  --verm:#E8674F; --verm-ink:#F08A73; --verm-soft:rgba(232,103,79,.14); --verm-soft-2:rgba(232,103,79,.24);
  --brand:#C8D2DC;
  --brand-ink:#F2F5F8;
  --brand-soft:rgba(200,210,220,.10);
  --brand-soft-2:rgba(200,210,220,.22);
  --on-brand:#0F1318;
  --accent:#AAB5C0;  --accent-soft:rgba(170,181,192,.12);
  --k-gov:#C85B50;   --k-prep:#5189CC;  --k-exam:#CE9C45;
  --k-video:#8761B4; --k-ai:#3CB3A7;    --k-media:#D2457A;
  --k-design:#E79557;--k-office:#888E99;--k-room:#62A356;
  --k-bzr:#E1923B;   --k-subject:#6070BE;--k-maker:#3799BE;
  --k-lab:#7C8CA0;
  --k-soft:#8B9752;  --k-plug:#A66B50;  --k-open:#52509E;
  --k-research:#8B79C4;
  --k-setup:#7C7EF5;
}

/* ---------- 2. 排版：中文无衬线 + 数据等宽，制造两层对比 ---------- */
body{font-family:var(--ui);-webkit-font-smoothing:antialiased}
/* 所有数字交给等宽字体 + 等宽数位，形成"仪器面板"的读数感 */
.stat b,.nav-i .c,.sec-h .sub,.cc-n,.res-h span,.pin .nm,.wt-num,
.kbd kbd,.cc-tag.more,.fmini,.cnt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat b{letter-spacing:-.03em;font-weight:700}
/* 小标签：拉开字距，模仿教具用语牌 */
.grp-t,.sec-h .more,.foot-note,.cr-hint{letter-spacing:.10em}

/* ---------- 3. Hero：把紫色光晕换成「一排粉笔」的多色晕染 ---------- */
".hero .dawn{
  left:0;right:0;top:-120px;height:300px;
  background:repeating-linear-gradient(90deg,
    var(--k-gov) 0.0% 5.8824%,
    var(--k-prep) 5.8824% 11.7647%,
    var(--k-exam) 11.7647% 17.6471%,
    var(--k-video) 17.6471% 23.5294%,
    var(--k-research) 23.5294% 29.4118%,
    var(--k-ai) 29.4118% 35.2941%,
    var(--k-media) 35.2941% 41.1765%,
    var(--k-design) 41.1765% 47.0588%,
    var(--k-office) 47.0588% 52.9412%,
    var(--k-room) 52.9412% 58.8235%,
    var(--k-lab) 58.8235% 64.7059%,
    var(--k-bzr) 64.7059% 70.5882%,
    var(--k-subject) 70.5882% 76.4706%,
    var(--k-maker) 76.4706% 82.3529%,
    var(--k-soft) 82.3529% 88.2353%,
    var(--k-plug) 88.2353% 94.1176%,
    var(--k-open) 94.1176% 100.0%) !important;
  opacity:.13;filter:blur(46px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 22%,transparent 92%);
  mask-image:linear-gradient(180deg,#000 0%,#000 22%,transparent 92%);
  animation:none}
[data-theme="dark"] .hero .dawn{opacity:.20;filter:blur(52px)}

/*  hero 标题里那句强调改用朱砂 */
.hero h1 em{color:var(--verm-ink) !important}
.hero h1 em::after{
  content:"";position:absolute;left:-2px;right:-2px;bottom:.06em;height:.30em;
  background:var(--verm-soft-2);border-radius:2px;z-index:-1}
[data-theme="dark"] .hero h1 em{color:var(--verm) !important}

/* 统计行：改成白卡片 + 左侧一根彩色粉笔做标记 */
.hero .stat{
  display:flex;gap:0;flex-wrap:wrap;padding:0;margin:20px 0 0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-1);overflow:hidden}
.hero .stat>div{
  flex:1 1 120px;min-width:120px;display:flex;flex-direction:column;gap:2px;
  padding:14px 16px;position:relative;border-right:1px solid var(--line-2)}
.hero .stat>div:last-child{border-right:0}
.hero .stat>div::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc-c,var(--line))}
.hero .stat>div:nth-child(1)::before{background:var(--k-gov)}
.hero .stat>div:nth-child(2)::before{background:var(--k-room)}
.hero .stat>div:nth-child(3)::before{background:var(--k-prep)}
.hero .stat>div:nth-child(4)::before{background:var(--k-exam)}
.hero .stat b{font-size:26px;line-height:1.05;color:var(--ink)}
.hero .stat span{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}

/* ---------- 4. 搜索：粉笔盒引擎切换（本页签名元素） ---------- */
.search{
  --sc-soft:color-mix(in srgb,var(--sc) 16%,transparent);
  --sc-soft-2:color-mix(in srgb,var(--sc) 32%,transparent);
  display:flex;align-items:center;gap:8px;
  max-width:760px;min-height:52px;
  border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface);padding:0 8px 0 12px;
  box-shadow:var(--sh-1);transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.search:focus-within{border-color:var(--sc);box-shadow:0 0 0 4px var(--sc-soft),var(--sh-2)}
.search .si{color:var(--sc);flex:0 0 auto;transition:color .2s var(--ease)}
.search input{border:0;background:transparent;flex:1 1 auto;min-width:0;padding:14px 0;
  font-family:var(--ui);font-size:15px;color:var(--ink)}
.search input:focus{border-color:transparent;box-shadow:none}
.search input::placeholder{color:var(--ink-3)}
.search .kbd{flex:0 0 auto}
[data-engine="site"] .search .clear-x{display:inline-flex}

/* 粉笔 individueller Kopf */
.chalk-box{
  display:flex;align-items:flex-end;gap:5px;flex:0 0 auto;
  padding:7px 8px;margin-right:2px;border-radius:9px;
  background:linear-gradient(180deg,var(--surface-3),var(--surface-2));
  border:1px solid var(--line-2)}
.chalk{
  position:relative;width:10px;height:24px;border-radius:5px 5px 4px 4px;
  cursor:pointer;border:0;padding:0;flex:0 0 auto;
  background:
    linear-gradient(180deg,
      color-mix(in srgb,var(--k) 72%,#fff) 0%,
      var(--k) 48%,
      color-mix(in srgb,var(--k) 82%,#000) 100%);
  opacity:.26;filter:saturate(.7);
  transition:opacity .18s var(--ease),transform .22s var(--spring),filter .18s var(--ease);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.10)}
.chalk::after{ /* 粉笔顶端的白色粉末边 */
  content:"";position:absolute;left:1px;right:1px;top:1px;height:4px;
  border-radius:4px 4px 2px 2px;background:rgba(255,255,255,.34)}
.chalk:hover{opacity:.62;transform:translateY(-4px);filter:saturate(1)}
.chalk.on{opacity:1;transform:translateY(-7px);filter:saturate(1.05);
  box-shadow:0 0 0 2px var(--surface),0 3px 9px -2px color-mix(in srgb,var(--k) 60%,transparent)}
.chalk:focus-visible{outline:2px solid var(--verm);outline-offset:3px}

/* 引擎提示气泡 */
.chalk-box-wrap{position:relative;flex:0 0 auto}
.chalk-tip{
  position:absolute;right:0;top:calc(100% + 9px);z-index:30;
  background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;
  padding:5px 9px;border-radius:7px;white-space:nowrap;pointer-events:none;
  opacity:0;transform:translateY(-4px);transition:opacity .16s var(--ease),transform .16s var(--ease);
  box-shadow:var(--sh-3)}
.chalk-box:hover+.chalk-tip,.chalk:hover~.chalk-tip{opacity:1;transform:none}

/* 搜索框内部改成真正的 flex 流：原来的图标/清空键是绝对定位，会和粉笔盒打架 */
.search .si{position:relative;left:auto;top:auto;transform:none;
  width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center}
.search .si svg{width:18px;height:18px}
.search .clr{position:relative;right:auto;top:auto;transform:none;display:none;
  width:28px;height:28px;flex:0 0 28px;align-items:center;justify-content:center}
.search .clr svg{width:14px;height:14px}
.search.val .clr{display:inline-flex}
.search .clr:hover{transform:rotate(90deg);background:var(--surface-3);color:var(--ink)}
.eng-more{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-3);cursor:pointer;transition:var(--t)}
.eng-more:hover{color:var(--ink);border-color:var(--ink-3);background:var(--surface-3)}

/* ---------- 5. 顶栏：时间 + 天气 ---------- */
.wt{
  display:flex;align-items:center;gap:9px;flex:0 0 auto;
  padding:5px 11px;margin-right:2px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  font-size:12.5px;color:var(--ink-2);white-space:nowrap;cursor:pointer;
  transition:border-color .18s var(--ease),background .18s var(--ease)}
.wt:hover{border-color:var(--verm-soft-2);background:var(--surface-3)}
.wt-clk{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;
  font-size:14.5px;color:var(--ink);letter-spacing:.01em}
.wt-sep{width:1px;height:15px;background:var(--line)}
.wt-wx{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.wt-wx svg{width:15px;height:15px;flex:0 0 auto}
.wt-per{color:var(--ink);font-family:var(--mono);font-weight:700}
.wt-sec{font-size:11px;color:var(--verm-ink);background:var(--verm-soft);
  padding:2px 6px;border-radius:5px;font-weight:700;letter-spacing:.02em}
.wt-off{color:var(--ink-3);font-style:normal}
@media (max-width:1080px){.wt-help{display:none}}
@media (max-width:900px){.wt-date,.wt-sep{display:none}}
@media (max-width:720px){.wt{display:none}}

/* ---------- 6. 侧栏：分类色迁移进来 + 拖拽排序 ---------- */
/* 每个分类项带一支自己颜色的粉笔头 */
.nav-i{position:relative}
.nav-i .nv-ic{
  width:26px;height:26px;flex:0 0 26px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;background:var(--surface-3);color:var(--ink-2);
  transition:background .18s var(--ease),color .18s var(--ease)}
.nav-i[data-k] .nv-ic{background:color-mix(in srgb,var(--kc) 13%,transparent);color:var(--kc)}
.nav-i[data-k].on .nv-ic{background:var(--kc);color:#fff}
[data-theme="dark"] .nav-i[data-k].on .nv-ic{color:#fff}
.nav-i.on{color:var(--ink)}
.nav-i .c{opacity:.55}
.nav-i.on .c{opacity:.9;color:var(--ink-2)}
/* 选中态的胶囊降级为中性浅灰，别再抢分类色 */
.nav-pill{background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line)}

/* 拖拽把手：悬停时占位到"数量"的位置，不做额外缩进以免左右不对齐 */
.drag-h{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  width:18px;height:24px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);opacity:0;cursor:grab;border-radius:5px;
  transition:opacity .16s var(--ease),background .16s var(--ease)}
.drag-h svg{width:13px;height:13px}
.nav-i[data-k] .drag-h{opacity:0;pointer-events:auto}
.nav-i[data-k]:hover .drag-h,.nav-i:focus-within .drag-h{opacity:.6}
.drag-h:hover{opacity:1 !important;background:var(--surface-3)}
.nav-i[data-k]:hover .c{opacity:0}
.nav-i.dragging{opacity:.38}
.side.drag-on .nav-i{cursor:grabbing}
/* 拖到此处时画一根朱砂插入线 */
.nav-i.drop-before::after,.nav-i.drop-after::after{
  content:"";position:absolute;left:4px;right:4px;height:2.5px;border-radius:2px;
  background:var(--verm);pointer-events:none}
.nav-i.drop-before::after{top:-1.5px}
.nav-i.drop-after::after{bottom:-1.5px}
/* 拖拽提示条 */
.nav-tip{
  display:flex;align-items:center;gap:5px;margin:6px 0 0;padding:6px 8px;
  font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;line-height:1.4;
  border:1px dashed var(--line);border-radius:8px;background:var(--surface-2)}
.nav-tip svg{width:12px;height:12px;flex:0 0 auto}
.nav-tip b{color:var(--verm-ink);font-weight:700}

/* ---------- 7. 主要动作按钮：唯一强调色朱砂 ---------- */
.btn.pri{
  background:var(--verm) !important;color:#fff !important;border-color:transparent !important;
  box-shadow:0 6px 16px -8px var(--verm-soft-2)}
.btn.pri:hover{background:var(--verm-ink) !important;color:#fff !important}
.btn.danger{color:var(--verm-ink);border-color:var(--verm-soft-2)}
.btn.danger:hover{background:var(--verm-soft);border-color:var(--verm)}
.tg.on{background:var(--verm) !important}
.inp:focus{border-color:var(--ink-3);box-shadow:0 0 0 3px rgba(21,26,33,.07)}
.item .fav.on{color:var(--verm)}
/* 筛选 chip 选中态恢复中性，避免和分类色打架 */
.chip.on{background:var(--ink) !important;color:#fff;border-color:transparent}
[data-theme="dark"] .chip.on{background:var(--brand-ink) !important;color:var(--on-brand)}
/* 搜索命中高亮改朱砂，像红笔圈出来 */
.hl{background:var(--verm-soft-2) !important;color:var(--verm-ink) !important}
/* 链接与次要强调不再蓝 */
.foot-note a,.crumb a:hover,.sec-h .more:hover{color:var(--verm-ink)}
.sec-h .more:hover{background:var(--verm-soft)}

/* ---------- 8. 尊重减少动效 ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
}

/* ---------- 外站搜索大按钮（搜索结果页顶部） ---------- */
.go-out{
  display:flex;align-items:center;gap:11px;margin:14px 0 0;padding:13px 16px;
  text-decoration:none;color:var(--ink);border-radius:var(--r);
  border:1px solid color-mix(in srgb,var(--k) 28%,var(--line));
  background:color-mix(in srgb,var(--k) 6%,var(--surface));
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease)}
.go-out:hover{transform:translateY(-2px);box-shadow:var(--sh-2);
  border-color:var(--k);background:color-mix(in srgb,var(--k) 12%,var(--surface))}
.go-out .go-ic{width:32px;height:32px;flex:0 0 32px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:9px;background:var(--k);color:#fff}
.go-out .go-ic svg{width:17px;height:17px}
.go-out .go-tx{flex:1;font-size:14.5px;font-weight:500}
.go-out .go-tx b{color:var(--k);font-weight:800}
.go-out .go-ar{display:inline-flex;align-items:center;color:var(--ink-3);transition:var(--t)}
.go-out .go-ar svg{width:16px;height:16px}
.go-out:hover .go-ar{color:var(--k);transform:translateX(3px)}
[data-theme="dark"] .go-out{background:color-mix(in srgb,var(--k) 14%,var(--surface))}

/* ---------- 登录页「记住我」 ---------- */
.rme{display:flex;align-items:center;gap:8px;margin-top:12px;
  font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.rme input{width:15px;height:15px;margin:0;accent-color:var(--verm);cursor:pointer;flex:0 0 15px}
.rme:hover{color:var(--ink)}

/* ---------- 9. 自定义搜索引擎管理弹层 ---------- */
.eng-row{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.eng-row .inp{flex:1 1 auto}
.eng-row .nm-inp{flex:0 0 92px}
.eng-row .btn{flex:0 0 auto;padding:7px 9px}
.eng-list{max-height:270px;overflow:auto;padding-right:4px}
.eng-empty{padding:22px 8px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- 10. 侧栏选中态：用分类本色 + 粉笔划线的动效 ---------- */
/* 滑动指示条改造成"一支粉笔划出来的竖线"，颜色跟着当前分类走 */
.nav-pill{
  left:0;width:3px !important;border-radius:2px 2px 2px 2px;
  background:var(--kc,var(--ink));
  box-shadow:0 0 8px -1px color-mix(in srgb,var(--kc,var(--ink)) 55%,transparent);
  transition:transform .38s var(--spring),height .28s var(--ease),background .3s var(--ease)}
.nav-pill.on{animation:pillGlow .5s var(--ease-out) both}
@keyframes pillGlow{
  0%{opacity:0;transform-origin:center}
  100%{opacity:1}}

/* 选中项：整条染上该分类的颜色 */
.nav-i.on{
  color:var(--kc,var(--ink));font-weight:700;
  background:color-mix(in srgb,var(--kc,var(--ink)) 9%,transparent)}
.nav-i.on .c{color:var(--kc,var(--ink));opacity:.85}
.nav-i.on .nv-ic{
  background:var(--kc,var(--ink));color:#fff;opacity:1;
  animation:chalkPop .46s var(--spring) both}
/* 文字轻微右滑进场 */
.nav-i.on .n{animation:chalkSlide .32s var(--ease-out) both}
@keyframes chalkPop{
  0%{transform:scale(.55) rotate(-12deg);opacity:0}
  55%{transform:scale(1.18) rotate(3deg)}
  100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes chalkSlide{
  from{transform:translateX(-5px);opacity:.35}
  to{transform:none;opacity:1}}

/* 未选中项的悬停：图标轻轻抬起并染上本色，给出"可点"的反馈 */
.nav-i:not(.on):hover{
  background:color-mix(in srgb,var(--kc,var(--ink)) 6%,transparent)}
.nav-i:not(.on):hover .nv-ic{
  background:color-mix(in srgb,var(--kc,var(--ink)) 16%,transparent);
  color:var(--kc,var(--ink));opacity:1;transform:scale(1.08)}
.nav-i:not(.on):hover .n{transform:translateX(2px)}
.nav-i .n{transition:transform .2s var(--ease)}
.nav-i .nv-ic{transition:background .2s var(--ease),color .2s var(--ease),transform .26s var(--spring)}

/* 按下时的回弹 */
.nav-i:active{transform:scale(.97)}
.nav-i{transition:transform .12s var(--ease),background .2s var(--ease),color .2s var(--ease)}

/* 分类里的"特别版"二级标签给个醒目的橙色标记 */
.nav-i[data-k="setup"] .nv-ic{position:relative}

/* ---------- 11. 分类卡片 hover：整卡浮起 + 图标转一下 ---------- */
.cc:hover{transform:translateY(-4px)}
.cc:hover .cc-ic{transform:scale(1.06) rotate(-3deg)}
.cc .cc-ic{transition:transform .34s var(--spring)}
.cc{transition:transform .26s var(--ease),box-shadow .26s var(--ease),border-color .26s var(--ease)}

/* 常用区图标：悬停弹一下 */
.pin:hover .lg2,.pin:hover .logo{transform:translateY(-3px) scale(1.06)}
.pin .logo,.pin .lg2{transition:transform .3s var(--spring)}

/* 尊重减少动效：把所有弹跳关掉，只留必要的过渡 */
@media (prefers-reduced-motion:reduce){
  .nav-i.on .nv-ic,.nav-i.on .n,.nav-pill.on{animation:none !important}
  .nav-i:active{transform:none}
}

/* ---------- 12. 站点真实图标：盖在字母块上方，拿不到就静默退回字母 ---------- */
.lg{position:relative;overflow:hidden}
.lg-real{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;padding:15%;border-radius:inherit;
  background:var(--surface);opacity:0;
  transition:opacity .28s var(--ease)}
.lg-real.ok{opacity:1}
.lg-real.dead{display:none}

/* ---------- 13. 直链下载按钮 ---------- */
.item .dl{
  display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;
  height:27px;padding:0 9px;margin-right:2px;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;
  color:#fff;border:none;border-radius:8px;cursor:pointer;
  background:linear-gradient(135deg,var(--cc,var(--ink-2)),color-mix(in srgb,var(--cc,var(--ink-2)) 72%,#000));
  box-shadow:0 2px 7px -2px color-mix(in srgb,var(--cc,var(--ink-2)) 60%,transparent);
  opacity:0;transform:translateY(4px) scale(.9);
  transition:transform .26s var(--spring),opacity .2s var(--ease),box-shadow .2s var(--ease)}
.item:hover .dl,.item:focus-within .dl{opacity:1;transform:none}
.item .dl:hover{
  transform:translateY(-2px) scale(1.05);
  box-shadow:0 5px 14px -3px color-mix(in srgb,var(--cc,var(--ink-2)) 75%,transparent)}
.item .dl:active{transform:scale(.94)}
.dl .dl-ic{width:12px;height:12px;stroke-width:2.2;flex:0 0 auto}
.dl:hover .dl-ic{animation:dlBounce .5s var(--ease-out)}
@keyframes dlBounce{
  0%,100%{transform:translateY(0)}
  45%{transform:translateY(3px)}}

/* 移动端/触屏常驻显示 */
@media (hover:none){
  .item .dl{opacity:1;transform:none}}

/* ---------- 14. 视觉强化：让每个分类的颜色真正"长"在页面上 ---------- */
/* 分类页头部：本色渐变大色块，取代原来的浅灰底 */
.cat-head{
  position:relative;overflow:hidden;
  background:linear-gradient(115deg,
    color-mix(in srgb,var(--cc) 15%,var(--surface)),
    color-mix(in srgb,var(--cc) 4%,var(--surface)) 62%,
    var(--surface));
  border:1px solid color-mix(in srgb,var(--cc) 22%,var(--line));
  border-radius:var(--r);padding:18px 20px;margin:2px 0 16px}
.cat-head::after{
  content:'';position:absolute;right:-56px;top:-56px;
  width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--cc) 20%,transparent),transparent 68%);
  pointer-events:none}
.cat-head .cc-ic{
  background:var(--cc);color:#fff;
  box-shadow:0 6px 18px -5px color-mix(in srgb,var(--cc) 70%,transparent);
  animation:icFloat 4.5s var(--ease) infinite}
@keyframes icFloat{
  0%,100%{transform:translateY(0)}

.cat-head h1{color:color-mix(in srgb,var(--cc) 72%,var(--ink))}

/* 卡片：左侧本色竖条 + hover 时整卡染上本色 */
.item{
  position:relative;overflow:hidden;
  transition:transform .24s var(--ease),box-shadow .24s var(--ease),
             border-color .24s var(--ease),background .24s var(--ease)}
.item::before{
  content:'';position:absolute;left:0;top:14%;bottom:14%;
  width:3px;border-radius:0 3px 3px 0;
  background:var(--cc,var(--line));opacity:0;
  transition:opacity .24s var(--ease),top .24s var(--ease),bottom .24s var(--ease)}
.item:hover::before{opacity:.9;top:6%;bottom:6%}
.item:hover{
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--cc,var(--line)) 42%,var(--line));
  background:color-mix(in srgb,var(--cc,var(--surface)) 5%,var(--surface));
  box-shadow:0 8px 20px -8px color-mix(in srgb,var(--cc,#000) 34%,transparent)}

/* 分组小标题：本色圆点 */
.sgh i{background:var(--cc,var(--ink-3))}
.sgh b{letter-spacing:.01em}

@media (prefers-reduced-motion:reduce){
  .cat-head .cc-ic{animation:none}
  .dl:hover .dl-ic{animation:none}}

/* ---------- 15. 深色模式：警示条文字提亮 ---------- */
[data-theme="dark"] .warn{
  background:color-mix(in srgb,var(--warn) 13%,var(--surface));
  border-color:color-mix(in srgb,var(--warn) 34%,transparent)}
[data-theme="dark"] .warn p{
  color:#F2E4CE;font-size:12.5px;line-height:1.7}
[data-theme="dark"] .warn>span{color:#FFC46B}

/* ---------- 16. Hero：一排粉笔（15 个分类本色，依次弹入） ---------- */
.chalkbar{
  position:relative;z-index:2;
  display:flex;gap:5px;align-items:flex-end;
  height:26px;margin:0 0 18px}
.chalkbar i{
  flex:1 1 0;height:15px;border-radius:3px 3px 2px 2px;
  transform-origin:bottom center;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),
             inset 0 -2px 0 rgba(0,0,0,.13),
             0 1px 3px -1px rgba(0,0,0,.28);
  animation:chalkGrow .5s var(--spring) both}
.chalkbar i:nth-child(3n){height:20px}
.chalkbar i:nth-child(3n+1){height:17px}
.chalkbar i:nth-child(4n){height:23px}
@keyframes chalkGrow{
  0%{transform:scaleY(.2) scaleX(.7);opacity:0}
  60%{opacity:1}
  100%{transform:none;opacity:1}}

/* Hero 背景：细点阵，打破大片留白 */
.hero::before{
  content:'';position:absolute;left:-46px;right:-46px;top:-58px;
  height:300px;z-index:0;pointer-events:none;
  opacity:var(--dawn-op);

    color-mix(in srgb,var(--ink-3) 34%,transparent) 1px,transparent 0);
  background-size:19px 19px;
  mask-image:linear-gradient(180deg,#000 0%,transparent 88%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 88%)}

@media (prefers-reduced-motion:reduce){
  .chalkbar i{animation:none}}

/* ---------- 17. 细节打磨（对应视觉评审 7 项） ---------- */
/* (1) 数字字形统一：关掉斜杠零，用等宽数字 */
.hero .stat b,.hero .stat{
  font-feature-settings:"zero" 0,"tnum" 1;
  font-variant-numeric:tabular-nums lining-nums}
.hero .stat b{font-family:"Segoe UI Variable Display","Segoe UI",var(--sans)}

/* (2) 常用区：统一白色圆角卡片底板，压住各色图标的杂乱感 */
.pin{
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:0 1px 2px -1px rgba(20,26,36,.06)}
.pin:hover{
  border-color:color-mix(in srgb,var(--kc,var(--ink-3)) 42%,var(--line));
  box-shadow:var(--sh-3)}
[data-theme="dark"] .pin{box-shadow:none}

/* (4) 场景卡：每张一个本色，图标底改实心本色块 */
.flow{border:1px solid color-mix(in srgb,var(--fc,var(--line)) 24%,var(--line))}
.flow .fi{
  background:color-mix(in srgb,var(--fc,var(--brand)) 14%,transparent);
  color:var(--fc,var(--brand-ink))}
.flow:hover{
  border-color:color-mix(in srgb,var(--fc,var(--brand)) 55%,var(--line));
  transform:translateY(-3px) scale(1.015)}
.flow:hover .fi{
  background:var(--fc,var(--brand));
  color:#fff;
  transform:scale(1.06) rotate(-4deg)}
.flow:hover::before{
  background:linear-gradient(120deg,
    color-mix(in srgb,var(--fc,var(--brand)) 16%,transparent),transparent 62%)}
.flow .fd{color:var(--ink-2);font-size:11.5px;letter-spacing:.01em}

/* (5) 拖拽说明：改成正式的提示条，不再挡住分类项 */
.nav-tip{
  margin:10px 2px 2px;padding:7px 10px;
  font-size:10.5px;line-height:1.5;
  color:var(--ink-3);
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface-2)}
.nav-tip b{color:var(--accent);font-weight:700}
.nav-tip kbd{
  display:inline-block;padding:0 4px;margin:0 1px;
  font:inherit;font-size:10px;font-weight:700;
  border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;background:var(--surface);
  color:var(--ink-2)}

/* (6) 顶部呼吸：hero 与顶栏之间留一点 */
.hero{padding-top:18px}

/* (7) 全部分类卡片：与主色调体系对齐 */
.catcard:hover{transform:translateY(-3px)}

/* (3) 粉笔盒：常驻显示当前握着哪支粉笔，别让人猜 */
.chalk-box-wrap{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.eng-now{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 8px 3px 6px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:.01em;

  width:9px;height:9px;border-radius:50%;flex:0 0 9px;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--surface) 70%,transparent)}
.eng-now b{color:var(--ink);font-weight:700}
.chalk-tip{
  font-size:10.5px;color:var(--ink-3);white-space:nowrap;
  opacity:.85}
@media(max-width:900px){
  .chalk-tip{display:none}}

/* ---------- 18. 顶栏时间天气：不再截断 ---------- */
.wt{
  max-width:min(44vw,430px);
  overflow:hidden;
  flex:0 1 auto;
  min-width:0}
.wt-date,.wt-clk{flex:0 0 auto}
.wt-help{

/* ---------- 19. 图标风格统一：真实图标落在统一白底上 ---------- */
.lg-real{
  padding:17%;
  background:var(--surface);
  border-radius:inherit}
[data-theme="dark"] .lg-real{background:var(--surface-2)}

/* ---------- 20. 粉笔头质感：像真的插在笔盒里，选中的那支被拔起来 ---------- */
.chalk-box{
  gap:6px;padding:8px 9px 6px;
  background:linear-gradient(180deg,var(--surface-3),var(--surface-2) 55%,var(--surface-3));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 4px -2px rgba(20,26,36,.16)}
[data-theme="dark"] .chalk-box{
  background:linear-gradient(180deg,#2A2E33,#22262B 55%,#2A2E33);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -2px 4px -2px rgba(0,0,0,.5)}

.chalk{
  --rot:-2.5deg;
  width:11px;height:26px;border-radius:5px 5px 3px 3px;
  opacity:.44;filter:saturate(.86);
  transform:rotate(var(--rot)) translateY(0);
  transition:transform .3s var(--spring),opacity .2s var(--ease),filter .2s var(--ease)}
.chalk:nth-child(even){--rot:2.5deg}
.chalk:nth-child(3n){--rot:-1deg}
.chalk:hover{opacity:.8;filter:saturate(1);

.chalk.on{
  opacity:1;filter:saturate(1.04);
  transform:rotate(0) translateY(-9px);
  box-shadow:0 0 0 2px var(--surface),
             0 4px 11px -2px color-mix(in srgb,var(--k) 62%,transparent),
             0 1px 0 2px color-mix(in srgb,var(--k) 24%,transparent)}
/* 笔盒底沿的落影，让粉笔看起来是"插进去"的 */
.chalk-box::after{
  content:"";position:absolute;left:9px;right:9px;bottom:5px;height:3px;
  border-radius:50%;background:rgba(20,26,36,.1);pointer-events:none}
.chalk-box{position:relative}
[data-theme="dark"] .chalk-box::after{background:rgba(0,0,0,.42)}

/* 选中的那支顶上冒一点粉末 */
.chalk.on::after{background:rgba(255,255,255,.55);height:5px}

/* ==========================================================================
   v7 · 蓝白双区皮肤（Deep Navy Chrome + Light Canvas）
   参考结构：AdminLTE / GitHub / AWS Console 的「深色侧栏 + 浅色内容区」
   主色：Tailwind blue-600 #2563EB  ·  点缀：琥珀 #D97706（蓝橙互补）
   左侧一整块深海军蓝画框，右侧浅蓝白内容区 —— 左右颜色明确不同
   ========================================================================== */

/* ---------- 1. 浅色模式 token ---------- */
:root{
  --bg:#EDF2F9; --bg-2:#E4EBF6;
  --surface:#FFFFFF; --surface-2:#F6F9FE; --surface-3:#EAF1FA;
  --ink:#0E1B2E; --ink-2:#41546F; --ink-3:#6B7F9B;
  --line:#DBE5F3; --line-2:#E9F0FA;

  --brand:#2563EB; --brand-ink:#1D4ED8;
  --brand-soft:rgba(37,99,235,.10); --brand-soft-2:rgba(37,99,235,.22);
  --on-brand:#FFFFFF;

  --accent:#D97706; --accent-soft:rgba(217,119,6,.12);
  --verm:#D97706; --verm-ink:#B45309;
  --verm-soft:rgba(217,119,6,.10); --verm-soft-2:rgba(217,119,6,.24);

  --dawn:linear-gradient(180deg,#FFD79A,#F3B255);
  --dawn-op:.42;

  --sh-1:0 1px 2px rgba(16,38,74,.06);
  --sh-2:0 3px 10px -3px rgba(16,38,74,.12),0 1px 2px rgba(16,38,74,.05);
  --sh-3:0 16px 38px -14px rgba(16,38,74,.24),0 3px 10px -4px rgba(16,38,74,.08);
  --sh-brand:0 10px 26px -10px rgba(37,99,235,.55);

  /* 深色画框（顶栏 + 左栏共用同一套色，形成一整块 L 形） */
  --rail-1:#0A2340; --rail-2:#123A61; --rail-3:#0C2B4C;
  --rail-ink:#E6EFFB; --rail-ink-2:#B2C8E2; --rail-ink-3:#7E97B7;
  --rail-line:rgba(255,255,255,.10);
  --rail-hover:rgba(255,255,255,.075);
  --rail-on:rgba(255,255,255,.13);

  --sc:#2563EB; --sc-soft:rgba(37,99,235,.10);
}

/* ---------- 2. 深色模式 token ---------- */
[data-theme="dark"]{
  --bg:#0A1220; --bg-2:#0C1727;
  --surface:#131E2E; --surface-2:#172336; --surface-3:#1C2A3E;
  --ink:#E9F1FB; --ink-2:#B6C6DA; --ink-3:#8798AE;
  --line:#243449; --line-2:#1D2B3E;

  --brand:#4F8CF7; --brand-ink:#8AB4FF;
  --brand-soft:rgba(79,140,247,.14); --brand-soft-2:rgba(79,140,247,.28);
  --accent:#F0A93C; --accent-soft:rgba(240,169,60,.14);
  --verm:#F0A93C; --verm-ink:#FFC46B;
  --verm-soft:rgba(240,169,60,.13); --verm-soft-2:rgba(240,169,60,.26);

  --dawn:linear-gradient(180deg,#8A5A14,#C98A22);
  --dawn-op:.30;

  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 3px 12px -3px rgba(0,0,0,.5);
  --sh-3:0 18px 40px -16px rgba(0,0,0,.7);

  --rail-1:#050C16; --rail-2:#0A1B2E; --rail-3:#071322;
  --rail-ink:#E3EDFA; --rail-ink-2:#A6BCD6; --rail-ink-3:#74909F;
  --rail-line:rgba(255,255,255,.08);
  --rail-hover:rgba(255,255,255,.06);
  --rail-on:rgba(255,255,255,.11);

  --sc:#4F8CF7; --sc-soft:rgba(79,140,247,.16);
}

/* ---------- 3. 顶栏：深海军蓝画框上沿 ---------- */
.top{
  background:color-mix(in srgb,var(--rail-1) 90%,transparent);
  border-bottom:1px solid var(--rail-line);
  -webkit-backdrop-filter:saturate(150%) blur(16px);
  backdrop-filter:saturate(150%) blur(16px)}
.top.stuck{
  background:color-mix(in srgb,var(--rail-1) 97%,transparent);
  border-bottom-color:var(--rail-line)}

.brand{color:var(--rail-ink)}
.brand .mark{
  background:linear-gradient(140deg,#3B7BF5,#1B4FC8);
  box-shadow:0 8px 20px -8px rgba(59,123,245,.85)}
.brand small{
  color:var(--rail-ink-3);border-color:var(--rail-line);
  background:rgba(255,255,255,.06)}

.tbtn{color:var(--rail-ink-2)}
.tbtn:hover{background:var(--rail-hover);color:#fff}
.tbtn .cnt{box-shadow:0 0 0 2px var(--rail-1);background:var(--accent)}
.menu-btn{color:var(--rail-ink-2)}

/* 时间天气块（在深色顶栏里） */
.wt{
  background:rgba(255,255,255,.07);
  border-color:var(--rail-line);
  color:var(--rail-ink-2)}
.wt:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22)}
.wt-clk{color:#fff}
.wt-date{color:var(--rail-ink-2)}
.wt-help{color:var(--rail-ink-3)}
.wt-sec{
  background:rgba(255,196,107,.16)!important;
  color:#FFC46B!important}
.wt-off{color:var(--rail-ink-3)}

/* ---------- 4. 左侧导航栏：同色系的深海军蓝面板 ---------- */
body:not(.admin) .side{
  background:linear-gradient(180deg,var(--rail-1) 0%,var(--rail-3) 52%,var(--rail-2) 100%);
  border-right:1px solid rgba(255,255,255,.07);
  border-radius:0 18px 18px 0;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.045),
             8px 0 28px -22px rgba(10,35,64,.55)}
body:not(.admin) .side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18)}
body:not(.admin) .side::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}

.side .grp-t{color:var(--rail-ink-3);letter-spacing:.14em}

/* 导航项基础色 */
.side .nav-i{color:var(--rail-ink-2)}
.side .nav-i .n{color:inherit}
.side .nav-i .c{color:var(--rail-ink-3);opacity:.85}
.side .nav-i .nv-ic{
  background:rgba(255,255,255,.075);
  color:color-mix(in srgb,var(--kc,#8FA9C6) 42%,#fff)}

/* 悬停：微微提亮 + 图标染上分类本色 */
.side .nav-i:not(.on):hover{background:var(--rail-hover);color:#fff}
.side .nav-i:not(.on):hover .nv-ic{
  background:color-mix(in srgb,var(--kc,#8FA9C6) 30%,transparent);
  color:color-mix(in srgb,var(--kc,#8FA9C6) 45%,#fff)}

/* 选中：半透明白底 + 分类本色图标 + 左侧本色竖条 */
.side .nav-i.on{
  background:var(--rail-on);color:#fff;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.side .nav-i.on .n{color:#fff}
.side .nav-i.on .c{color:rgba(255,255,255,.72)}
.side .nav-i.on .nv-ic{
  background:color-mix(in srgb,var(--kc,#5D5FEF) 76%,#fff);
  color:#0A2340;
  box-shadow:0 4px 12px -4px color-mix(in srgb,var(--kc,#5D5FEF) 85%,transparent)}

/* 左侧那根"粉笔线"：在白底上更亮 */
.side .nav-pill{
  background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--kc,#fff) 68%,#fff));
  box-shadow:0 0 10px -1px color-mix(in srgb,var(--kc,#fff) 70%,transparent)}

.side .nav-sep{background:var(--rail-line)}

/* 底部提示条与管理后台入口 */
.side .nav-tip{
  background:rgba(255,255,255,.055);
  border-color:var(--rail-line);
  color:var(--rail-ink-3)}
.side .nav-tip b{color:#FFC46B}
.side .nav-tip kbd{
  background:rgba(255,255,255,.1);
  border-color:var(--rail-line);
  color:var(--rail-ink-2)}

/* ---------- 5. 内容区：浅蓝白画布 ---------- */
body{background:var(--bg)}
.wrap{background:transparent}

/* Hero 区：从白到浅蓝的柔和渐变卡，替掉原来的粉橙紫光斑 */
.hero .dawn{
  background:
    radial-gradient(62% 100% at 8% 0%,rgba(37,99,235,.16) 0%,rgba(37,99,235,0) 70%),
    radial-gradient(52% 96% at 46% 0%,rgba(56,189,248,.14) 0%,rgba(56,189,248,0) 72%)}
.hero h1 em{color:var(--brand-ink)!important}
.hero h1 em::after{opacity:.5}

/* 卡片：白面 + 蓝调描边与投影 */
.item,.cc,.pin,.flow,.panel,.search input,.search{
  border-color:var(--line)}
.item:hover,.pin:hover,.cc:hover,.flow:hover{
  border-color:color-mix(in srgb,var(--cc,var(--kc,var(--brand))) 38%,var(--line))}

/* 搜索框：聚焦时描边用当前引擎色 */
.search input:focus,.search:focus-within{
  border-color:var(--sc,var(--brand))!important;
  box-shadow:0 0 0 3.5px var(--sc-soft,rgba(37,99,235,.12))}

/* ---------- 6. 按钮：主操作统一成蓝，警示才用琥珀 ---------- */
.btn.pri{
  background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 92%,#fff),var(--brand))!important;
  border-color:transparent!important;color:#fff!important;
  box-shadow:0 8px 18px -9px rgba(37,99,235,.75)}
.btn.pri:hover{
  background:linear-gradient(180deg,var(--brand),var(--brand-ink))!important;
  color:#fff!important}
.btn.danger{color:var(--verm-ink);border-color:var(--verm-soft-2)}

/* ---------- 7. 移动端抽屉：同一块深色面板 ---------- */
@media(max-width:900px){
  body:not(.admin) .side{
    background:linear-gradient(180deg,var(--rail-1),var(--rail-2))!important;
    border-radius:0;
    box-shadow:0 0 60px rgba(0,0,0,.4)}
  .drawer-mask{background:rgba(4,12,24,.55)}
}

/* ---------- 8. 页脚版本标记 ---------- */
.ver-chip{
  display:inline-flex;align-items:center;gap:5px;
  margin-left:8px;padding:1px 7px;border-radius:20px;
  font-size:10.5px;font-weight:700;letter-spacing:.02em;
  color:var(--brand-ink);background:var(--brand-soft);
  border:1px solid var(--brand-soft-2)}

/* 尊重减少动效 */
@media (prefers-reduced-motion:reduce){
  .brand:hover .mark{transform:none}}

/* ---------- 9. 收掉伪元素造成的 16px 横向溢出（不影响 sticky） ---------- */
html,body{overflow-x:clip}
@supports not (overflow:clip){html,body{overflow-x:hidden}}

/* ---------- 10. 首屏统计：改成蓝家族四连，去掉红绿灯观感 ---------- */
.hero .stat{
  margin-top:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;max-width:760px}
.hero .stat>div{
  position:relative;overflow:hidden;
  padding:10px 14px 11px 15px;
  background:var(--surface);border:1px solid var(--line);
  border-right:1px solid var(--line);border-radius:12px;
  box-shadow:var(--sh-1);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),
             border-color .22s var(--ease)}
.hero .stat>div:hover{transform:translateY(-2px);box-shadow:var(--sh-2);
  border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
.hero .stat>div::before{

/* ---------- 11. 首屏留白收口：统计铺满、粉笔条收敛 ---------- */

/* ==========================================================================
   v8 · 配色修复 + 装机必备下载区（2026-10）
   1) 首屏彩虹积木 → 细色尺，不再像随机色块
   2) 图标白块 → 分类本色淡染，页面不再一片惨白
   3) 卡片加版本徽章（官方版 / 特别版）与下载元信息
   4) 文字对比度整体提一档
   ========================================================================== */

/* ---------- 1. 画布：蓝调更明确，内容区顶部一层极淡蓝光 ---------- */
/* 注意：浅色 token 必须写在深色 token 之前，否则同权重下会把深色覆盖掉 */
:root{ --bg:#E9F0F9; --bg-2:#DFE9F5; --ink-3:#5B6E8C; }
[data-theme="dark"]{ --bg:#0A1220; --bg-2:#0C1727; --ink-3:#8EA2B9; }

.main,body:not(.admin) .main{
  background:
    radial-gradient(130% 55% at 46% -14%,rgba(37,99,235,.075),rgba(37,99,235,0) 62%),
    var(--bg)}
[data-theme="dark"] .main,[data-theme="dark"] body:not(.admin) .main{
  background:
    radial-gradient(130% 55% at 46% -14%,rgba(79,140,247,.10),rgba(79,140,247,0) 62%),
    var(--bg)}

/* ---------- 2. 首屏粉笔条：从彩虹积木改成一条细色尺 ---------- */
.chalkbar{
  height:7px;gap:4px;align-items:center;
  margin:0 0 18px;padding:0}
.chalkbar i,
.chalkbar i:nth-child(3n),
.chalkbar i:nth-child(3n+1),
.chalkbar i:nth-child(4n){
  height:7px!important;border-radius:4px;
  box-shadow:none;opacity:.72;
  filter:saturate(.92)}
.chalkbar i:hover{opacity:1;transform:scaleY(1.8)}

/* ---------- 3. 图标：去掉"一堆白块"，换成分类本色淡染 ---------- */
.lg{
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.24),
             0 2px 6px -3px color-mix(in srgb,var(--cc,#2563EB) 55%,transparent)}
.lg-real{
  padding:13%!important;
  background:color-mix(in srgb,var(--cc,#2563EB) 8%,#fff)!important}
[data-theme="dark"] .lg-real{
  background:color-mix(in srgb,var(--cc,#2563EB) 18%,#101C2C)!important}

/* ---------- 4. 分组标题：本色短竖条 + 一条渐隐细线，层次更清楚 ---------- */
.sgh{gap:8px}
.sgh i{
  width:4px!important;height:16px!important;border-radius:2px;
  background:var(--cc,var(--brand))!important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--cc,var(--brand)) 12%,transparent)}
.sgh span{
  order:3;margin-left:2px;font-size:10.5px;
  color:var(--ink-3);background:var(--surface-2);
  border:1px solid var(--line-2);border-radius:20px;padding:1px 7px}
.sgh::after{
  content:'';order:4;flex:1;height:1px;margin-left:6px;
  background:linear-gradient(90deg,var(--line),transparent)}

/* ---------- 5. 版本徽章：官方版（蓝）/ 特别版（琥珀） ---------- */
.ver{
  flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.05em;
  line-height:1.45;padding:2px 6px;border-radius:5px;white-space:nowrap;
  position:relative;top:-.5px}
.ver.off{color:#12507F;background:rgba(37,99,235,.10);border:1px solid rgba(37,99,235,.22)}
.ver.sp{color:#8A4A05;background:rgba(217,119,6,.13);border:1px solid rgba(217,119,6,.30)}
[data-theme="dark"] .ver.off{color:#A9C8FF;background:rgba(79,140,247,.16);border-color:rgba(79,140,247,.32)}
[data-theme="dark"] .ver.sp{color:#FFC46B;background:rgba(240,169,60,.15);border-color:rgba(240,169,60,.32)}

/* ---------- 6. 下载元信息：直链 / 蓝奏 / 发布页 ---------- */
.dmeta{
  display:flex;align-items:center;gap:2px 7px;flex-wrap:wrap;
  margin-top:6px;font-size:10.8px;color:var(--ink-3);line-height:1.6}

.dmeta.rel b{background:#5A6A84}
.dmeta em{font-style:normal;font-variant-numeric:tabular-nums}

/* 提取码：做成琥珀色小牌，不点开卡片就能直接看到 */
.dmeta em.pw{

[data-theme="dark"] .dmeta em.pw{
  color:#FFC46B;background:rgba(240,169,60,.17);border-color:rgba(240,169,60,.36)}

/* ---------- 7. 有下载的卡片：按钮常驻右下角，不再靠 hover 才出现 ---------- */
.item.has-dl{min-height:80px;padding-bottom:calc(var(--pad) + 6px)}
.item.has-dl .bd{padding-right:74px}
.item.has-dl .dl{
  position:absolute;right:9px;bottom:8px;margin:0;

.item.has-dl .fav{
  top:6px;right:6px;
  background:transparent;border-color:transparent}
.item.has-dl .dl span{letter-spacing:.02em}

/* ---------- 8. 文字对比度Overall 提一档 ---------- */
.item .ds{color:var(--ink-3)}
.item:hover .ds{color:var(--ink-2)}

/* ---------- 9. 窄屏：下载按钮改到整行下方，避免压字 ---------- */

/* 名称行的徽章挤在一起时，把免费度标签也一起收细，避免换行 */
