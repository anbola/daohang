/span>'\n      +(x.btn?'<button class=\"btn sm\" data-act=\"'+x.btn.act+'\"'+(x.btn.id?' data-id=\"'+x.btn.id+'\"':'')+'>'+x.btn.n+'<\/button>':'')\n      +'<\/div>';\n  });\n  h+='<\/div><\/div><\/section>';\n\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>最近记的事<\/h2><span class=\"sp\"><\/span>'\n    +'<button class=\"btn gh sm\" data-act=\"tab\" data-tab=\"log\">全部 '+svg('list')+'<\/button><\/div><div class=\"card-b\">';\n  const recs=(DB.logs||[]).slice().sort((a,b)=>(b.date||'')<(a.date||'')?-1:1).slice(0,4);\n  if(!recs.length)h+='<div class=\"empty\">'+svg('clip')+'还没有记录<\/div>';\n  else recs.forEach(r=>{h+=recHTML(r,true)});\n  h+='<\/div><\/section>';\n\n  h+='<\/div>';\n  return h;\n}\n\nfunction todoHTML(t,cls){\n  const d=today();\n  let dueTxt='未定日期';\n  if(t.due){\n    const diff=dayDiff(t.due,d);\n    dueTxt=diff===0?'今天':diff===1?'明天':diff===-1?'昨天':diff<-1?('逾期 '+(-diff)+' 天'):(parseD(t.due).getMonth()+1)+'/'+parseD(t.due).getDate();\n  }\n  const over=t.due&&t.due<d&&!t.done;\n  return '<div class=\"todo '+(cls||'')+(t.done?' done':'')+'\">'\n    +'<button class=\"tck\" data-act=\"tdone\" data-id=\"'+esc(t.id)+'\" aria-label=\"完成\">'+svg('check')+'<\/button>'\n    +'<div class=\"t-body\">'\n      +'<div class=\"t-title\">'+esc(t.t)+'<\/div>'\n      +'<div class=\"t-meta\">'\n        +'<em class=\"'+(t.pri==='P0'?'p0':t.pri==='P1'?'p1':'')+'\">'+(t.pri||'P2')+'<\/em>'\n        +'<em class=\"'+(over?'due-over':'')+'\">'+esc(dueTxt)+'<\/em>'\n        +(t.cat?'<span>'+esc(t.cat)+'<\/span>':'')\n        +(t.note?'<span style=\"color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px\">'+esc(t.note)+'<\/span>':'')\n      +'<\/div><\/div>'\n    +'<button class=\"btn gh sm t-del\" data-act=\"tedit\" data-id=\"'+esc(t.id)+'\" title=\"修改\">'+svg('edit')+'<\/button>'\n    +'<button class=\"btn gh sm t-del\" data-act=\"tdel\" data-id=\"'+esc(t.id)+'\" title=\"删除\">'+svg('trash')+'<\/button>'\n    +'<\/div>';\n}\n\nfunction watchList(){\n  const out=[];\n  const c=cls(); const n=c.students.length;\n  /* 最近一次作业 */\n  const hw=(DB.logs||[]).filter(r=>r.ty==='hw').sort((a,b)=>(b.date||'')<(a.date||'')?-1:1)[0];\n  if(hw&&typeof hw.val==='number'&&hw.val<n){\n    out.push({ic:'clip',cls:'warn',t:'<b>'+esc(hw.title)+'<\/b> 还差 '+(n-hw.val)+' 人没交',btn:{act:'tab',n:'去看'}});\n  }\n  /* 本周考勤异常 */\n  let ab=0;\n  Object.keys(DB.attend||{}).forEach(k=>{\n    const [d,cid]=k.split('|');\n    if(cid!==DB.cur)return;\n    if(dayDiff(today(),d)>7||dayDiff(today(),d)<0)return;\n    const a=DB.attend[k];\n    ab+=(a.absent||[]).length+(a.late||[]).length;\n  });\n  if(ab)out.push({ic:'alert',cls:'warn',t:'本周考勤异常 <b>'+ab+'<\/b> 人次'});\n  /* 长期没沟通 */\n  const last={};\n  (DB.logs||[]).forEach(r=>{if(r.stu&&(r.ty==='home'||r.ty==='talk')){if(!last[r.stu]||r.date>last[r.stu])last[r.stu]=r.date}});\n  const cold=c.students.filter(s=>!last[s.id]||dayDiff(today(),last[s.id])>45);\n  if(cold.length&&cold.length<n)out.push({ic:'phone',cls:'amber',t:'<b>'+cold.length+'<\/b> 名学生 45 天没沟通过'});\n  /* 今天有没有课还没备 —— 有课的当天提醒一句 */\n  const ls=lessonsOf(wd(new Date()));\n  if(ls.length)out.push({ic:'book',cls:'blue',t:'今天 <b>'+ls.length+'<\/b> 节课，第 '+ls[0].p+' 节是'+esc(ls[0].sub)});\n  return out.slice(0,4);\n}\n\n/* ------------------------------ 班级 ------------------------------ */\nfunction renderClass(){\n  const c=cls(); const st=c.students||[]; const s=classStats();\n  const dt=today();\n  const key=dt+'|'+c.id;\n  const at=(DB.attend||{})[key]||{absent:[],late:[]};\n\n  let h='<div class=\"today-hd\"><h2>'+esc(c.name)+'<\/h2>'\n    +'<span class=\"meta\">'+s.n+' 人 · 男 '+s.m+' · 女 '+s.f+(s.tagged?(' · 需关注 '+s.tagged):'')+'<\/span>'\n    +'<span class=\"sp\"><\/span>'\n    +'<div class=\"btnrow\"><button class=\"btn\" data-act=\"paste\">'+svg('ul')+'粘贴导入<\/button>'\n    +'<button class=\"btn\" data-act=\"addstu\">'+svg('plus')+'加学生<\/button>'\n    +'<button class=\"btn\" data-act=\"csvStu\">'+svg('dl')+'导出名单<\/button><\/div><\/div>';\n\n  h+='<div class=\"grid g-2\">';\n\n  /* 花名册 */\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>花名册<\/h2><span class=\"cnt\">'+st.length+'<\/span>'\n    +'<span class=\"sp\"><\/span><span style=\"font-size:11px;color:var(--ink-3)\">点姓名可改资料<\/span><\/div>'\n    +'<div class=\"card-b\">';\n  if(!st.length)h+='<div class=\"empty\">'+svg('users')+'还没有学生，点右上「粘贴导入」从 Excel 粘一列名字进来就行<\/div>';\n  else{\n    h+='<div class=\"tblwrap\"><table class=\"tbl\"><thead><tr><th>学号<\/th><th>姓名 · 需留意<\/th><th>性别<\/th><th class=\"thpts\">积分<\/th><th>家长电话<\/th><th><\/th><\/tr><\/thead><tbody>';\n    st.forEach(x=>{\n      h+='<tr><td class=\"num\" style=\"text-align:left;color:var(--ink-3)\">'+esc(x.no||'')+'<\/td>'\n        +'<td><span class=\"nm\" style=\"cursor:pointer\" data-act=\"editstu\" data-id=\"'+esc(x.id)+'\">'+esc(x.n)+'<\/span>'\n        +(x.tags&&x.tags.length?' '+(x.tags.map(t=>'<span class=\"tagi '+(t==='留守'||t==='单亲'?'a':'r')+'\">'+esc(t)+'<\/span>').join('')):'')\n        +'<\/td>'\n        +'<td>'+(x.sex==='F'?'女':'男')+'<\/td>'\n        +'<td class=\"ptcell\"><button class=\"ptb\" data-act=\"pt\" data-id=\"'+esc(x.id)+'\" data-v=\"-1\" aria-label=\"减一分\">−<\/button>'\n          +'<b>'+((x.pts||0)>0?'+':'')+((x.pts||0))+'<\/b>'\n          +'<button class=\"ptb\" data-act=\"pt\" data-id=\"'+esc(x.id)+'\" data-v=\"1\" aria-label=\"加一分\">+<\/button><\/td>'\n        +'<td style=\"font-family:var(--num);font-size:11.5px;color:var(--ink-2)\">'+esc(x.phone||'—')+'<\/td>'\n        +'<td style=\"text-align:right\"><button class=\"btn gh sm\" data-act=\"delstu\" data-id=\"'+esc(x.id)+'\" title=\"删除\">'+svg('trash')+'<\/button><\/td><\/tr>';\n    });\n    h+='<\/tbody><\/table><\/div>';\n  }\n  h+='<\/div><\/section>';\n\n  /* 考勤 */\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>今天点名<\/h2><span class=\"cnt\">'+cnDate()+'<\/span>'\n    +'<span class=\"sp\"><\/span><span style=\"font-size:11px;color:var(--ink-3)\">点一下切换<\/span><\/div><div class=\"card-b\">';\n  if(!st.length)h+='<div class=\"empty\">'+svg('check')+'先加学生<\/div>';\n  else{\n    h+='<div style=\"display:flex;flex-wrap:wrap;gap:6px\">';\n    st.forEach(x=>{\n      const a=(at.absent||[]).indexOf(x.id)>=0;\n      const l=(at.late||[]).indexOf(x.id)>=0;\n      h+='<button class=\"chip'+(a||l?' on':'')+'\" data-act=\"att\" data-id=\"'+esc(x.id)+'\" '\n        +'style=\"'+(a?'background:var(--verm);border-color:var(--verm)':l?'background:var(--amber);border-color:var(--amber)':'')+'\">'\n        +esc(x.n)+(a?' 缺':l?' 迟':'')+'<\/button>';\n    });\n    h+='<\/div>';\n    h+='<div style=\"margin-top:11px;font-size:11.5px;color:var(--ink-3)\">'\n      +'第一次点：缺勤；再点：迟到；第三次：取消。<b style=\"color:var(--verm)\">缺勤 '+((at.absent||[]).length)\n      +'<\/b> · <b style=\"color:var(--amber)\">迟到 '+((at.late||[]).length)+'<\/b><\/div>';\n  }\n  h+='<\/div><\/section>';\n  h+='<\/div>';\n\n  /* 座位 */\n  const seat=DB.seats[c.id]||{cols:6,order:st.map(x=>x.id)};\n  const cols=V.seatCols||seat.cols||6;\n  const order=(seat.order||[]).filter(id=>st.some(x=>x.id===id));\n  st.forEach(x=>{if(order.indexOf(x.id)<0)order.push(x.id)});\n  h+='<section class=\"card\" style=\"margin-top:14px\"><div class=\"card-h\"><h2>座位表<\/h2>'\n    +'<span class=\"sp\"><\/span>'\n    +'<div class=\"btnrow\"><span class=\"lbl\" style=\"font-size:11.5px;color:var(--ink-3)\">列数<\/span>'\n    +'<select class=\"inp\" style=\"width:66px;height:28px;font-size:12px\" data-act=\"cols\">'\n    +[4,5,6,7,8,9,10].map(n=>'<option value=\"'+n+'\"'+(n===cols?' selected':'')+'>'+n+'<\/option>').join('')+'<\/select>'\n    +'<button class=\"btn sm\" data-act=\"shuffle\">'+svg('shuffle')+'随机排<\/button>'\n    +'<button class=\"btn sm\" data-act=\"orderno\">按学号<\/button>'\n    +'<button class=\"btn sm\" data-act=\"print\">'+svg('print')+'打印<\/button><\/div><\/div>'\n    +'<div class=\"card-b\">';\n  if(!st.length)h+='<div class=\"empty\">'+svg('grid')+'先加学生<\/div>';\n  else{\n    h+='<div class=\"seatgrid\" style=\"grid-template-columns:repeat('+cols+',minmax(0,1fr))\">'\n      +'<div class=\"podium\">讲 台<\/div>';\n    order.forEach(id=>{\n      const x=st.find(s=>s.id===id);\n      if(!x){h+='<div class=\"seat empty-seat\">—<\/div>';return}\n      h+='<div class=\"seat '+(x.sex==='F'?'f':'m')+(V.seatSel===id?' sel':'')+'\" data-act=\"seat\" data-id=\"'+esc(id)+'\">'+esc(x.n)+'<\/div>';\n    });\n    const rest=(cols-order.length%cols)%cols;\n    for(let i=0;i<rest;i++)h+='<div class=\"seat empty-seat\">—<\/div>';\n    h+='<\/div>';\n    h+='<div style=\"margin-top:9px;font-size:11.5px;color:var(--ink-3)\">点两个座位就对调。蓝色男生、红色女生。<\/div>';\n  }\n  h+='<\/div><\/section>';\n  return h;\n}\n\n/* ------------------------------ 成绩 ------------------------------ */\nfunction renderScore(){\n  const exams=(DB.exams||[]).slice().sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);\n  if(!V.examId&&exams.length)V.examId=exams[0].id;\n  const e=exams.find(x=>x.id===V.examId)||exams[0];\n\n  let h='<div class=\"today-hd\"><h2>成绩<\/h2>'\n    +'<span class=\"meta\">'+(e?esc(e.name)+' · '+esc(e.subject)+' · 满分 '+e.full:'还没有考试记录')+'<\/span>'\n    +'<span class=\"sp\"><\/span>'\n    +'<div class=\"btnrow\"><button class=\"btn\" data-act=\"newexam\">'+svg('plus')+'新建考试<\/button>'\n    +(e?'<button class=\"btn\" data-act=\"entry\" data-id=\"'+esc(e.id)+'\">'+svg('edit')+'录入分数<\/button>'\n      +'<button class=\"btn\" data-act=\"csvScore\" data-id=\"'+esc(e.id)+'\">'+svg('dl')+'导出成绩<\/button>':'')\n    +'<\/div><\/div>';\n\n  if(!e)return h+'<section class=\"card\"><div class=\"card-b\"><div class=\"empty\">'+svg('chart')+'还没有成绩，点「新建考试」建一场，然后从 Excel 粘分数进来<\/div><\/div><\/section>';\n\n  const s=examStat(e); const b=bands(e);\n  h+='<section class=\"card\"><div class=\"card-b\"><div class=\"stats\">'\n    +'<div class=\"stat\"><div class=\"k\">参考人数<\/div><div class=\"v\">'+s.n+'<small>人<\/small><\/div><\/div>'\n    +'<div class=\"stat b\"><div class=\"k\">平均分<\/div><div class=\"v\">'+n1(s.avg)+'<\/div><\/div>'\n    +'<div class=\"stat g\"><div class=\"k\">最高分<\/div><div class=\"v\">'+s.max+'<\/div><\/div>'\n    +'<div class=\"stat r\"><div class=\"k\">最低分<\/div><div class=\"v\">'+s.min+'<\/div><\/div>'\n    +'<div class=\"stat\"><div class=\"k\">及格率<\/div><div class=\"v\">'+n1(s.passRate)+'<small>%<\/small><\/div><\/div>'\n    +'<div class=\"stat a\"><div class=\"k\">优秀率<\/div><div class=\"v\">'+n1(s.goodRate)+'<small>%<\/small><\/div><\/div>'\n    +'<div class=\"stat\"><div class=\"k\">标准差<\/div><div class=\"v\">'+n1(s.std)+'<\/div><\/div>'\n    +'<\/div><\/div><\/section>';\n\n  h+='<div class=\"grid g-2\" style=\"margin-top:14px\">';\n\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>分数段分布<\/h2><span class=\"sp\"><\/span>'\n    +'<span style=\"font-size:11px;color:var(--ink-3)\">按满分比例划<\/span><\/div><div class=\"card-b\">'\n    +bandSVG(b)+'<\/div><\/section>';\n\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>学生得分<\/h2><span class=\"cnt\">'+s.arr.length+'<\/span>'\n    +'<span class=\"sp\"><\/span><span style=\"font-size:11px;color:var(--ink-3)\">红=不及格 绿=优秀<\/span><\/div>'\n    +'<div class=\"card-b\">';\n  if(!s.arr.length)h+='<div class=\"empty\">'+svg('chart')+'还没有分数<\/div>';\n  else{\n    const mx=s.max||1;\n    h+='<div class=\"stulist\">';\n    s.arr.forEach((x,i)=>{\n      const pct=x.v/s.full*100;\n      const cl=pct<60?'red':pct>=85?'grn':'';\n      h+='<div class=\"srow\"><span class=\"rk\">'+(i+1)+'<\/span>'\n        +'<span><span class=\"sname\">'+esc(x.s.n)+'<\/span>'\n        +'<span class=\"sbar\" style=\"margin-top:3px\"><i class=\"'+cl+'\" style=\"width:'+clamp(x.v/mx*100,3,100)+'%\"><\/i><\/span><\/span>'\n        +'<span class=\"num\" style=\"font-family:var(--num);font-weight:700;text-align:right\">'+x.v+'<\/span><\/div>';\n    });\n    h+='<\/div>';\n  }\n  h+='<\/div><\/section>';\n  h+='<\/div>';\n\n  /* 历次考试趋势 */\n  if(exams.length>1){\n    h+='<section class=\"card\" style=\"margin-top:14px\"><div class=\"card-h\"><h2>平均分走势<\/h2><\/div><div class=\"card-b\">'\n      +trendSVG(exams.slice().reverse())+'<\/div><\/section>';\n  }\n  return h;\n}\n\nfunction bandSVG(b){\n  const W=560,H=180,pad={l:9,r:9,t:14,b:26};\n  const n=b.cnt.length; const mx=Math.max.apply(null,b.cnt.concat([1]));\n  const bw=(W-pad.l-pad.r)/n;\n  const color=['#C4341F','#D0703A','#C08518','#2B6CB8','#3F8A32','#0E9A8C'];\n  let s='<div class=\"chart\"><svg viewBox=\"0 0 '+W+' '+H+'\" role=\"img\" aria-label=\"分数段分布\">';\n  b.cnt.forEach((v,i)=>{\n    const hh=(H-pad.t-pad.b)*(v/mx);\n    const x=pad.l+i*bw+bw*0.16, y=H-pad.b-hh, w=bw*0.68;\n    s+='<rect class=\"bar\" x=\"'+x.toFixed(1)+'\" y=\"'+y.toFixed(1)+'\" width=\"'+w.toFixed(1)+'\" height=\"'+Math.max(hh,1).toFixed(1)+'\" rx=\"4\" fill=\"'+color[i]+'\" opacity=\"'+(v?0.9:0.18)+'\"/>';\n    if(v)s+='<text class=\"axis\" x=\"'+(x+w/2).toFixed(1)+'\" y=\"'+(y-4).toFixed(1)+'\" text-anchor=\"middle\" font-weight=\"700\">'+v+'<\/text>';\n    s+='<text class=\"axis\" x=\"'+(x+w/2).toFixed(1)+'\" y=\"'+(H-pad.b+14)+'\" text-anchor=\"middle\">'+b.label[i]+'<\/text>';\n  });\n  s+='<line x1=\"'+pad.l+'\" y1=\"'+(H-pad.b)+'\" x2=\"'+(W-pad.r)+'\" y2=\"'+(H-pad.b)+'\" stroke=\"var(--line)\" stroke-width=\"1\"/>';\n  s+='<\/svg><\/div>';\n  return s;\n}\nfunction trendSVG(exams){\n  const W=560,H=170,pad={l:34,r:14,t:14,b:24};\n  const pts=exams.map(e=>{const s=examStat(e);return {n:e.name,v:s.avg,full:e.full}});\n  const mx=Math.max.apply(null,pts.map(p=>p.v).concat([1]))*1.12;\n  const n=pts.length;\n  const x=i=>pad.l+(n===1?(W-pad.l-pad.r)/2:i*(W-pad.l-pad.r)/(n-1));\n  const y=v=>H-pad.b-(H-pad.t-pad.b)*(v/mx);\n  let d='';\n  pts.forEach((p,i)=>{d+=(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)});\n  let s='<div class=\"chart\"><svg viewBox=\"0 0 '+W+' '+H+'\" role=\"img\" aria-label=\"平均分走势\">';\n  s+='<line x1=\"'+pad.l+'\" y1=\"'+(H-pad.b)+'\" x2=\"'+(W-pad.r)+'\" y2=\"'+(H-pad.b)+'\" stroke=\"var(--line)\"/>';\n  s+='<path d=\"'+d+'\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n  pts.forEach((p,i)=>{\n    s+='<circle cx=\"'+x(i).toFixed(1)+'\" cy=\"'+y(p.v).toFixed(1)+'\" r=\"4\" fill=\"var(--surface)\" stroke=\"var(--blue)\" stroke-width=\"2.2\"/>';\n    s+='<text class=\"axis\" x=\"'+x(i).toFixed(1)+'\" y=\"'+(y(p.v)-10).toFixed(1)+'\" text-anchor=\"middle\" font-weight=\"700\" fill=\"var(--ink)\">'+n1(p.v)+'<\/text>';\n    s+='<text class=\"axis\" x=\"'+x(i).toFixed(1)+'\" y=\"'+(H-pad.b+14)+'\" text-anchor=\"middle\">'+esc(p.n.length>7?p.n.slice(0,7)+'…':p.n)+'<\/text>';\n  });\n  s+='<\/svg><\/div>';\n  return s;\n}\n\n/* ------------------------------ 事务 ------------------------------ */\nconst TYPES=[\n  {id:'hw',n:'作业收缴',ic:'clip'},\n  {id:'home',n:'家校沟通',ic:'phone'},\n  {id:'talk',n:'谈心谈话',ic:'mic'},\n  {id:'listen',n:'听课评课',ic:'book'},\n  {id:'meet',n:'班会活动',ic:'users'},\n  {id:'point',n:'奖惩积分',ic:'star'}\n];\nfunction typeOf(id){return TYPES.find(t=>t.id===id)||{id:id,n:'记录',ic:'list'}}\n\nfunction renderLog(){\n  const all=(DB.logs||[]).slice().sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);\n  const f=V.logFilter;\n  const list=f==='all'?all:all.filter(r=>r.ty===f);\n  const cnt=t=>all.filter(r=>r.ty===t).length;\n\n  let h='<div class=\"today-hd\"><h2>事务记录<\/h2><span class=\"meta\">共 '+all.length+' 条 · 家长会、家访、听课都能在这留痕<\/span>'\n    +'<span class=\"sp\"><\/span><button class=\"btn pri\" data-act=\"lnew\">'+svg('plus')+'记一条<\/button><\/div>';\n\n  h+='<div class=\"filters\"><button class=\"chip'+(f==='all'?' on':'')+'\" data-act=\"lf\" data-f=\"all\">全部 <span class=\"n\">'+all.length+'<\/span><\/button>';\n  TYPES.forEach(t=>{h+='<button class=\"chip'+(f===t.id?' on':'')+'\" data-act=\"lf\" data-f=\"'+t.id+'\">'+t.n+' <span class=\"n\">'+cnt(t.id)+'<\/span><\/button>'});\n  h+='<\/div>';\n\n  h+='<section class=\"card\"><div class=\"card-b\">';\n  if(!list.length)h+='<div class=\"empty\">'+svg('clip')+'这一类还没有记录<\/div>';\n  else list.forEach(r=>{h+=recHTML(r,false)});\n  h+='<\/div><\/section>';\n  return h;\n}\nfunction recHTML(r,mini){\n  const t=typeOf(r.ty);\n  const s=r.stu?stu(r.stu):null;\n  return '<div class=\"rec\" data-t=\"'+esc(r.ty)+'\">'\n    +'<span class=\"ty\">'+svg(t.ic)+'<\/span>'\n    +'<div class=\"bd\">'\n      +'<div class=\"ti\">'+esc(r.title)+(s?'<span class=\"tagi b\">'+esc(s.n)+'<\/span>':'')+'<\/div>'\n      +(r.note&&!mini?'<div class=\"ds\">'+esc(r.note)+'<\/div>':'')\n      +'<div class=\"mt\"><span>'+esc(r.date||'')+'<\/span><span>'+esc(t.n)+'<\/span>'\n      +(r.meta?'<span>'+esc(r.meta)+'<\/span>':'')\n      +(mini?'<span style=\"color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px\">'+esc(r.note||'')+'<\/span>':'')\n      +'<\/div><\/div>'\n    +(mini?'':'<button class=\"btn gh sm\" data-act=\"ldel\" data-id=\"'+esc(r.id)+'\" title=\"删除\">'+svg('trash')+'<\/button>')\n    +'<\/div>';\n}\n\n/* ------------------------------ 数据 ------------------------------ */\n\n/* ------------------------------ 课表 ------------------------------\n   一周八节，格子直接点开就能改。周课时、分科课时都从同一份数据算，\n   换班级不用重录 —— 课表本来就不属于某个班，属于老师自己。 */\nfunction renderTT(){\n  const days=[1,2,3,4,5,6,7];\n  const PER=8;\n  const todayWd=wd(new Date());\n  const np=nowPeriod();\n\n  let total=0; const bySub={};\n  days.forEach(d=>lessonsOf(d).forEach(l=>{total++;bySub[l.sub]=(bySub[l.sub]||0)+1}));\n  const subs=Object.keys(bySub).sort((a,b)=>bySub[b]-bySub[a]);\n  const maxN=subs.length?bySub[subs[0]]:1;\n\n  let h='<div class=\"today-hd\"><h2>我的课表<\/h2>'\n    +'<span class=\"meta\">本周 '+total+' 节'+(subs.length?(' · '+subs.length+' 门科目'):'')\n    +'<\/span><span class=\"sp\"><\/span>'\n    +'<button class=\"btn gh\" data-act=\"tt\" >'+svg('edit')+'整表粘贴<\/button>'\n    +'<button class=\"btn pri\" data-act=\"ttclear\">'+svg('trash')+'清空本周<\/button><\/div>';\n\n  /* 课时条：一眼看出哪门课压得最重 */\n  if(subs.length){\n    h+='<section class=\"card\" style=\"margin-bottom:12px\"><div class=\"card-b subbar\">';\n    subs.forEach(su=>{\n      h+='<div class=\"sb-row\"><span class=\"sb-n\">'+esc(su)+'<\/span>'\n        +'<span class=\"sb-t\"><i style=\"width:'+Math.max(6,Math.round(bySub[su]/maxN*100))+'%\"><\/i><\/span>'\n        +'<span class=\"sb-v\">'+bySub[su]+'<\/span><\/div>';\n    });\n    h+='<\/div><\/section>';\n  }\n\n  h+='<section class=\"card\"><div class=\"card-b\" style=\"padding:10px 10px 12px\">'\n    +'<div class=\"ttscroll\"><table class=\"tt\"><thead><tr><th class=\"tt-p\">节<\/th>';\n  days.forEach(d=>{\n    h+='<th'+(d===todayWd?' class=\"now\"':'')+'>'+weekName(d)+(d===todayWd?'<i>今天<\/i>':'')+'<\/th>';\n  });\n  h+='<\/tr><\/thead><tbody>';\n  for(let p=1;p<=PER;p++){\n    h+='<tr><td class=\"tt-p\">'+p+'<\/td>';\n    days.forEach(d=>{\n      const l=lessonsOf(d).find(x=>+x.p===p);\n      const isNow=(d===todayWd&&p===np);\n      h+='<td class=\"tt-c'+(l?' has':'')+(isNow?' now':'')+'\" data-act=\"ttcell\" data-d=\"'+d+'\" data-p=\"'+p+'\"'\n        +(l?' style=\"--sc:color-mix(in srgb,'+subColor(l.sub)+' 90%,#000)\"':'')+'>'\n        +(l?'<b>'+esc(l.sub)+'<\/b>'+(l.cls?'<i>'+esc(l.cls)+'<\/i>':'')+(l.room?'<u>'+esc(l.room)+'<\/u>':'')\n           :'<span class=\"tt-add\">＋<\/span>')+'<\/td>';\n    });\n    h+='<\/tr>';\n  }\n  h+='<\/tbody><\/table><\/div>'\n    +'<div class=\"help\" style=\"margin:9px 2px 0\">点任意格子就能改：科目、班级、教室都可以留空。格子右上角的数字是节次。<\/div>'\n    +'<\/div><\/section>';\n  return h;\n}\n/* 同一门课永远同一个颜色：按科目名做一个稳定的色相 */\nfunction subColor(sub){\n  const PAL=['#2C63D6','#0E8C7F','#C26A18','#7A4BC4','#1F7A46','#B03A5B','#3B6EA5','#8A6A22'];\n  let h=0; const s=String(sub||'');\n  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%997;\n  return PAL[h%PAL.length];\n}\n\nfunction renderData(){\n  const size=(JSON.stringify(DB).length/1024).toFixed(1);\n  const nStu=DB.classes.reduce((a,c)=>a+c.students.length,0);\n  let _io=false;try{_io=localStorage.getItem(KEY+'.didIO')!=='1'}catch(e){}\n\n  let h='<div class=\"today-hd\"><h2>数据与存储<\/h2>'\n    +'<span class=\"meta\">'+nStu+' 名学生 · '+DB.logs.length+' 条记录 · 约 '+size+' KB<\/span>'\n    +'<span class=\"sp\"><\/span><button class=\"btn pri\" data-act=\"saveNow\">'+svg('save')+'立即保存<\/button><\/div>';\n\n  /* 嵌在导航站里时，浏览器不允许页面向你索要文件夹权限（安全策略），\n     这件事必须当面说清楚，不能让人点了没反应还以为坏了 */\n  let embedded=false;\n  try{embedded=window.self!==window.top}catch(e){embedded=true}\n  if(embedded&&!SRV.on&&!FS.handle){\n    h+='<div class=\"storecard off\" style=\"margin-bottom:14px\">'\n      +'<span class=\"ic\">'+svg('alert')+'<\/span><div style=\"flex:1 1 auto;min-width:0\">'\n      +'<h3>现在是嵌在导航站里看<span class=\"tagi a\">有限制<\/span><\/h3>'\n      +'<p>数据照常保存（在浏览器里），但「自动写进 D 盘文件夹」这一项，浏览器只允许在独立页面里授权。'\n      +'想要那一步，用下面两种之一：<br>'\n      +'① 单独打开文件夹里的 <code>教师工作台.html<\/code>（双击即可），再点「选择文件夹」；<br>'\n      +'② 双击 <code>启动手机共享.bat<\/code>，它会自己把数据写到 D 盘，手机也能连。<\/p>'\n      +'<\/div><\/div>';\n  }\n\n  h+='<div class=\"grid g-2\">';\n\n  /* 左：存储 */\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>保存在哪里<\/h2><span class=\"sp\"><\/span>'\n    +'<span style=\"font-size:11px;color:var(--ink-3)\">三层，从下往上兜<\/span><\/div><div class=\"card-b\">';\n\n  h+='<div class=\"storecard '+(FS.handle&&FS.ok?'on':'off')+'\">'\n    +'<span class=\"ic\">'+svg('folder')+'<\/span><div style=\"flex:1 1 auto;min-width:0\">'\n    +'<h3>① 自动写进电脑文件夹'+(FS.handle&&FS.ok?'<span class=\"tagi g\">已连<\/span>':'<span class=\"tagi a\">未连<\/span>')+'<\/h3>'\n    +'<p>选一次文件夹（<b>建议 D:\\\\教师工作台数据<\/b>），以后每次改动自动覆盖写同一个文件，不用手动点。'\n    +'每天第一次改动还会额外存一份当天快照到 <code>每日备份<\/code>，删错了能翻回来。'\n    +(FS.handle?'<div class=\"path\">当前：'+esc(FS.name)+(FS.lastAt?' · 最近写入 '+esc(FS.lastAt):'')+'<\/div>':'')\n    +'<\/p>'\n    +'<div class=\"btnrow\" style=\"margin-top:8px\">'\n    +'<button class=\"btn sm pri\" data-act=\"pick\">'+(FS.handle?'换一个文件夹':'选择文件夹')+'<\/button>'\n    +(FS.handle&&!FS.ok?'<button class=\"btn sm\" data-act=\"reauth\">恢复授权<\/button>':'')\n    +(FS.handle?'<button class=\"btn sm\" data-act=\"writeNow\">立刻写一次<\/button>':'')\n    +'<\/div>'\n    +'<\/div><\/div>';\n\n  h+='<div class=\"storecard '+(SRV.on?'on':'off')+'\">'\n    +'<span class=\"ic\">'+svg('cloud')+'<\/span><div style=\"flex:1 1 auto;min-width:0\">'\n    +'<h3>② 局域网共享（电脑和手机同一份）'+(SRV.on?'<span class=\"tagi g\">已连<\/span>':'<span class=\"tagi a\">未启用<\/span>')+'<\/h3>'\n    +'<p>'+(SRV.on\n        ?'现在这份数据存在电脑的 <code>'+esc(SRV.dir||'本地目录')+'<\/code> 里。手机连同一个 WiFi，打开 <code>'+esc(location.host)+'<\/code> 就是同一份数据，改完电脑上刷新就能看到。'\n        :'想让手机和电脑实时互通，跑一下随附的「启动手机共享」脚本：双击后电脑变成一个小服务器，手机同 WiFi 打开提示的地址即可。数据仍然只存在你自己电脑的 D 盘里，不上云。')\n    +'<\/p>'\n    +(SRV.on?'<div class=\"path\">'+esc(SRV.dir||'')+'<\/div>'\n        :'<div class=\"btnrow\" style=\"margin-top:8px\"><button class=\"btn sm\" data-act=\"srvHelp\">怎么开<\/button><\/div>')\n    +'<\/div><\/div>';\n\n  h+='<div class=\"storecard on\">'\n    +'<span class=\"ic\">'+svg('db')+'<\/span><div style=\"flex:1 1 auto;min-width:0\">'\n    +'<h3>③ 浏览器本机存储<span class=\"tagi g\">始终在<\/span><\/h3>'\n    +'<p>不管上面两样连没连，数据都会实时写进这个浏览器。换电脑、清缓存前，用下面的「导出备份」存一份 JSON 就带得走。<\/p>'\n    +'<\/div><\/div>';\n\n  h+='<\/div><\/section>';\n\n  /* 右：导入导出 */\n  h+='<div class=\"grid\" style=\"gap:14px;align-content:start\">';\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>带走 · 搬回家<\/h2><\/div><div class=\"card-b\">'\n    +'<div style=\"font-size:12px;color:var(--ink-2);line-height:1.7;margin-bottom:10px\">'\n    +'JSON 是整份数据（学生、成绩、记录全在），换电脑、换手机都用它。<br>CSV 是给 Excel 看的，只要名单或成绩单的时候用。<\/div>'\n    +'<div class=\"btnrow\" style=\"flex-wrap:wrap\">'\n    +'<button class=\"btn pri\" data-act=\"expJson\">'+svg('dl')+'导出完整备份<\/button>'\n    +'<button class=\"btn'+(_io?' io-flash':'')+'\" data-act=\"impJson\">'+svg('ul')+'导入备份(JSON)<\/button>'\n    +'<span class=\"sp\"><\/span>'\n    +'<button class=\"btn\" data-act=\"tplStu\">'+svg('edit')+'学生模板<\/button>'\n    +'<button class=\"btn'+(_io?' io-flash':'')+'\" data-act=\"impStuCsv\">'+svg('ul')+'导入学生<\/button>'\n    +'<button class=\"btn\" data-act=\"tplScore\">'+svg('edit')+'成绩模板<\/button>'\n    +'<button class=\"btn'+(_io?' io-flash':'')+'\" data-act=\"impScoreCsv\">'+svg('ul')+'导入成绩<\/button>'\n    +'<input type=\"file\" id=\"impFile\" accept=\".json,application/json\" hidden>'\n    +'<input type=\"file\" id=\"impStuCsv\" accept=\".csv,text/csv\" hidden>'\n    +'<input type=\"file\" id=\"impScoreCsv\" accept=\".csv,text/csv\" hidden>'\n    +'<\/div><\/section>';\n\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>手机怎么用<\/h2><span class=\"sp\"><\/span>'\n    +'<span style=\"font-size:11px;color:var(--ink-3)\">三条路，从省事到彻底<\/span><\/div><div class=\"card-b\"><div class=\"help\">'\n    +'<b>① 同一个 WiFi（推荐，教室场景）<\/b>'\n    +'<ol><li>电脑上双击 <code>启动手机共享.bat<\/code>，窗口里会显示 <code>http://192.168.x.x:8765<\/code><\/li>'\n    +'<li>手机连同一个 WiFi（或电脑开热点给手机），浏览器输这个地址<\/li>'\n    +'<li>手机上改的东西直接落到电脑 D 盘那份文件，电脑刷新就是最新的<\/li><\/ol>'\n    +'<b style=\"display:inline-block;margin-top:9px\">② 导出 → 微信传给自己<\/b>'\n    +'<p style=\"margin:3px 0 0\">手机微信「文件传输助手」发给自己，手机上点开就是同一页面。适合只看不改。<\/p>'\n    +'<b style=\"display:inline-block;margin-top:9px\">③ 云同步（要外网、要配置）<\/b>'\n    +'<p style=\"margin:3px 0 0\">不同网络也想同步，才需要云。这要额外开通一个数据库，我可以在「数据」页给你留接口，但要先确认你愿意折腾。<\/p>'\n    +'<\/div><\/div><\/section>';\n\n  h+='<\/div><\/div>';\n\n  /* 危险区 */\n  h+='<section class=\"card\" style=\"margin-top:14px\"><div class=\"card-h\"><h2>清空与重置<\/h2><\/div><div class=\"card-b\">'\n    +'<div class=\"btnrow\"><button class=\"btn\" data-act=\"resetDemo\">恢复示例数据<\/button>'\n    +'<button class=\"btn\" data-act=\"clearAll\" style=\"color:var(--verm);border-color:rgba(196,52,31,.4)\">'+svg('trash')+'清空全部数据<\/button>'\n    +'<\/div><div style=\"margin-top:8px;font-size:11.5px;color:var(--ink-3)\">清空前会先自动导出一份备份，别怕。<\/div>'\n    +'<\/div><\/section>';\n  return h;\n}\n\n/* ==========================================================================\n   教师工作台 V1.0.6 —— 交互层\n   所有交互：改数据 → scheduleSave() → refreshAll()\n   事件全部委托，不在渲染时绑 handler，避免重渲染丢事件\n   ========================================================================== */\n'use strict';\n\n/* ------------------------------ 弹窗 ------------------------------ */\nlet MODAL_CLOSE=null;\nfunction openModal(opt){\n  const host=$('#modalHost');\n  host.innerHTML='<div class=\"mask\" data-mask=\"1\"><div class=\"dlg\" role=\"dialog\" aria-modal=\"true\">'\n    +'<div class=\"dlg-h\"><h3>'+esc(opt.title)+'<\/h3>'\n    +'<button class=\"xbtn\" data-act=\"mclose\" aria-label=\"关闭\">'+svg('x')+'<\/button><\/div>'\n    +'<div class=\"dlg-b\">'+(opt.body||'')+'<\/div>'\n    +(opt.foot===false?'':'<div class=\"dlg-f\">'+(opt.foot||'')+'<\/div>')\n    +'<\/div><\/div>';\n  MODAL_CLOSE=opt.onClose||null;\n  if(opt.mount)opt.mount();\n}\nfunction closeModal(){\n  const h=$('#modalHost'); if(h)h.innerHTML='';\n  const f=MODAL_CLOSE; MODAL_CLOSE=null;\n  if(f)try{f()}catch(e){}\n}\n\n/* ------------------------------ 表单：待办 ------------------------------ */\nfunction mTodo(id){\n  const t=(DB.todos||[]).find(x=>x.id===id)||{t:'',note:'',due:today(),pri:'P1',cat:'教学'};\n  openModal({\n    title:id?'修改这件事':'记一件事',\n    body:'<div class=\"field\"><label>要做什么<\/label><input class=\"inp\" id=\"fT\" value=\"'+esc(t.t)+'\" placeholder=\"例：把月考卷子印出来\"><\/div>'\n      +'<div class=\"field\"><label>补充（可不填）<\/label><input class=\"inp\" id=\"fN\" value=\"'+esc(t.note||'')+'\" placeholder=\"例：印 2 个班，双面\"><\/div>'\n      +'<div class=\"frow\"><div class=\"field\"><label>什么时候要<\/label><input class=\"inp\" type=\"date\" id=\"fD\" value=\"'+esc(t.due||today())+'\"><\/div>'\n      +'<div class=\"field\"><label>要紧程度<\/label><select class=\"inp\" id=\"fP\">'\n      +['P0','P1','P2'].map(p=>'<option value=\"'+p+'\"'+(t.pri===p?' selected':'')+'>'+p+' · '+(p==='P0'?'今天就得出':p==='P1'?'这周要完':'有空再说')+'<\/option>').join('')\n      +'<\/select><\/div><\/div>'\n      +'<div class=\"field\"><label>归到哪类<\/label><select class=\"inp\" id=\"fC\">'\n      +['教学','班级','家校','材料','其他'].map(c=>'<option'+(t.cat===c?' selected':'')+'>'+c+'<\/option>').join('')\n      +'<\/select><\/div>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">取消<\/button><button class=\"btn pri\" id=\"fOk\">保存<\/button>',\n    mount(){\n      const f=$('#fT'); if(f)f.focus();\n      $('#fOk').onclick=()=>{\n        const v=$('#fT').value.trim();\n        if(!v){toast('写一句话再存');return}\n        const o={t:v,note:$('#fN').value.trim(),due:$('#fD').value||'',pri:$('#fP').value,cat:$('#fC').value};\n        if(id){Object.assign((DB.todos||[]).find(x=>x.id===id),o)}\n        else DB.todos.push(Object.assign({id:uid('t'),done:false,ts:Date.now()},o));\n        closeModal();scheduleSave();refreshAll();toast(id?'改好了':'记下了');\n      };\n      $('#fT').onkeydown=e=>{if(e.key==='Enter')$('#fOk').click()};\n    }\n  });\n}\n\n/* ------------------------------ 表单：学生 ------------------------------ */\nfunction mStudent(id){\n  const c=cls();\n  const s=id?c.students.find(x=>x.id===id):{n:'',no:'',sex:'M',tags:[],phone:''};\n  openModal({\n    title:id?'学生资料':'加一个学生',\n    body:'<div class=\"frow\"><div class=\"field\"><label>姓名<\/label><input class=\"inp\" id=\"sN\" value=\"'+esc(s.n)+'\"><\/div>'\n      +'<div class=\"field\"><label>学号<\/label><input class=\"inp\" id=\"sNo\" value=\"'+esc(s.no||'')+'\"><\/div><\/div>'\n      +'<div class=\"field\"><label>性别<\/label><select class=\"inp\" id=\"sS\"><option value=\"M\"'+(s.sex!=='F'?' selected':'')+'>男<\/option><option value=\"F\"'+(s.sex==='F'?' selected':'')+'>女<\/option><\/select><\/div>'\n      +'<div class=\"field\"><label>需要留意（可多选，逗号隔开）<\/label><input class=\"inp\" id=\"sT\" value=\"'+esc((s.tags||[]).join(','))+'\" placeholder=\"留守 / 单亲 / 学困 / 情绪\"><\/div>'\n      +'<div class=\"field\"><label>家长电话<\/label><input class=\"inp\" id=\"sP\" value=\"'+esc(s.phone||'')+'\"><\/div>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">取消<\/button><button class=\"btn pri\" id=\"sOk\">保存<\/button>',\n    mount(){\n      $('#sN').focus();\n      $('#sOk').onclick=()=>{\n        const n=$('#sN').value.trim(); if(!n){toast('姓名总得有');return}\n        const o={n:n,no:$('#sNo').value.trim(),sex:$('#sS').value,\n          tags:$('#sT').value.split(/[,，\\s]+/).filter(Boolean),phone:$('#sP').value.trim()};\n        if(id)Object.assign(s,o);\n        else{const ns=Object.assign({id:uid('s')},o);c.students.push(ns);\n          const sd=DB.seats[c.id]||(DB.seats[c.id]={cols:6,order:[]});sd.order.push(ns.id);}\n        closeModal();scheduleSave();refreshAll();\n      };\n    }\n  });\n}\n\n/* ------------------------------ 粘贴导入学生 ------------------------------ */\nfunction mPasteStudents(){\n  openModal({\n    title:'粘贴导入学生',\n    body:'<div class=\"help\" style=\"margin-bottom:9px\">从 Excel 里直接复制，一行一个学生。'\n      +'支持这几种顺序：<br><code>姓名<\/code> ／ <code>学号 姓名<\/code> ／ <code>学号 姓名 性别<\/code>'\n      +'（用空格、逗号、Tab 隔开都行）<\/div>'\n      +'<textarea class=\"inp\" id=\"pT\" style=\"min-height:170px;font-family:var(--num);font-size:13px\" '\n      +'placeholder=\"01 张一诺 女&#10;02 李思远 男&#10;王梓涵\"><\/textarea>'\n      +'<label style=\"display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;color:var(--ink-2)\">'\n      +'<input type=\"checkbox\" id=\"pClear\"> 先清空现有名单（学生已有的成绩记录也会一起删）<\/label>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">取消<\/button><button class=\"btn pri\" id=\"pOk\">导入<\/button>',\n    mount(){\n      $('#pT').focus();\n      $('#pOk').onclick=()=>{\n        const raw=$('#pT').value.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);\n        if(!raw.length){toast('什么都没粘进来');return}\n        const c=cls();\n        if($('#pClear').checked){c.students=[];DB.seats[c.id]={cols:6,order:[]}}\n        let add=0;\n        raw.forEach(line=>{\n          const tk=line.split(/[\\t,，]+|\\s{1,}/).filter(Boolean);\n          let no='',n='',sex='';\n          if(/^\\d+$/.test(tk[0])&&tk.length>=2){no=tk[0];n=tk[1];sex=tk[2]||''}\n          else{n=tk[0];sex=tk[1]||''}\n          if(!n)return;\n          sex=/女|F|female/i.test(sex)?'F':(/男|M|male/i.test(sex)?'M':(add%2?'F':'M'));\n          c.students.push({id:uid('s'),n:n,no:no||pad2(c.students.length+1),sex:sex,tags:[],phone:''});\n          add++;\n        });\n        const sd=DB.seats[c.id]||(DB.seats[c.id]={cols:6,order:[]});\n        sd.order=c.students.map(x=>x.id);\n        closeModal();scheduleSave();refreshAll();\n        toast('导入 '+add+' 人');\n      };\n    }\n  });\n}\n\n/* ------------------------------ 成绩录入 ------------------------------ */\nfunction mNewExam(){\n  const c=cls();\n  openModal({\n    title:'新建一场考试',\n    body:'<div class=\"field\"><label>考试名称<\/label><input class=\"inp\" id=\"eN\" placeholder=\"例：第二次月考 / 期中\"><\/div>'\n      +'<div class=\"frow\"><div class=\"field\"><label>日期<\/label><input class=\"inp\" type=\"date\" id=\"eD\" value=\"'+today()+'\"><\/div>'\n      +'<div class=\"field\"><label>科目<\/label><input class=\"inp\" id=\"eS\" value=\"'+esc(DB.profile.subject||'数学')+'\"><\/div><\/div>'\n      +'<div class=\"frow\"><div class=\"field\"><label>满分<\/label><input class=\"inp\" type=\"number\" id=\"eF\" value=\"120\"><\/div>'\n      +'<div class=\"field\"><label>班级<\/label><select class=\"inp\" id=\"eC\">'\n      +DB.classes.map(x=>'<option value=\"'+esc(x.id)+'\"'+(x.id===c.id?' selected':'')+'>'+esc(x.name)+'<\/option>').join('')\n      +'<\/select><\/div><\/div>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">取消<\/button><button class=\"btn pri\" id=\"eOk\">建好去录分<\/button>',\n    mount(){\n      $('#eN').focus();\n      $('#eOk').onclick=()=>{\n        const n=$('#eN').value.trim(); if(!n){toast('给这场考试起个名');return}\n        const e={id:uid('e'),name:n,date:$('#eD').value||today(),subject:$('#eS').value.trim()||'数学',\n          full:+$('#eF').value||120,cls:$('#eC').value,map:{}};\n        DB.exams.push(e); V.examId=e.id; V.tab='score';\n        closeModal();scheduleSave();refreshAll();mEntry(e.id);\n      };\n    }\n  });\n}\nfunction mEntry(id){\n  const e=(DB.exams||[]).find(x=>x.id===id); if(!e)return;\n  const c=DB.classes.find(x=>x.id===e.cls)||cls();\n  const lines=(c.students||[]).map(s=>s.n+'\\t'+(e.map[s.id]==null?'':e.map[s.id])).join('\\n');\n  openModal({\n    title:'录入 '+e.name+' 分数',\n    body:'<div class=\"help\" style=\"margin-bottom:9px\">一行一个：<code>姓名 分数<\/code>，从 Excel 复制两列直接粘进来即可，'\n      +'姓名对得上就自动填。只粘一列数字也行，按花名册顺序对。<\/div>'\n      +'<textarea class=\"inp\" id=\"kT\" style=\"min-height:220px;font-family:var(--num);font-size:13px\">'+esc(lines)+'<\/textarea>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">取消<\/button><button class=\"btn pri\" id=\"kOk\">存进去<\/button>',\n    mount(){\n      $('#kT').focus();\n      $('#kOk').onclick=()=>{\n        const rows=$('#kT').value.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);\n        const map={};let hit=0,miss=0;\n        rows.forEach((line,i)=>{\n          const tk=line.split(/[\\t,，]+|\\s+/).filter(Boolean);\n          if(!tk.length)return;\n          if(tk.length===1){\n            const s=c.students[i];\n            if(s&&/^\\d+(\\.\\d+)?$/.test(tk[0])){map[s.id]=+tk[0];hit++}\n            return;\n          }\n          const n=tk[0], v=parseFloat(tk[tk.length-1]);\n          const s=c.students.find(x=>x.n===n)||c.students.find(x=>x.n.indexOf(n)>=0);\n          if(s&&!isNaN(v)){map[s.id]=v;hit++}else{miss++}\n        });\n        if(!hit){toast('一个都没对上，检查下姓名');return}\n        e.map=map;\n        closeModal();scheduleSave();refreshAll();\n        toast('录了 '+hit+' 人'+(miss?('，'+miss+' 行没对上'):''));\n      };\n    }\n  });\n}\n\n/* ------------------------------ 事务记录 ------------------------------ */\nfunction mLog(){\n  const c=cls();\n  openModal({\n    title:'记一条',\n    body:'<div class=\"field\"><label>类型<\/label><select class=\"inp\" id=\"gY\">'\n      +TYPES.map(t=>'<option value=\"'+t.id+'\">'+t.n+'<\/option>').join('')+'<\/select><\/div>'\n      +'<div class=\"field\"><label>标题<\/label><input class=\"inp\" id=\"gT\" placeholder=\"例：与王梓涵妈妈电话沟通\"><\/div>'\n      +'<div class=\"frow\"><div class=\"field\"><label>日期<\/label><input class=\"inp\" type=\"date\" id=\"gD\" value=\"'+today()+'\"><\/div>'\n      +'<div class=\"field\"><label>涉及学生（可不选）<\/label><select class=\"inp\" id=\"gS\"><option value=\"\">—<\/option>'\n      +c.students.map(s=>'<option value=\"'+esc(s.id)+'\">'+esc(s.n)+'<\/option>').join('')+'<\/select><\/div><\/div>'\n      +'<div class=\"field\"><label>具体情况<\/label><textarea class=\"inp\" id=\"gN\" placeholder=\"发生了什么、怎么处理的、下一步做什么\"><\/textarea><\/div>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">取消<\/button><button class=\"btn pri\" id=\"gOk\">存下<\/button>',\n    mount(){\n      $('#gT').focus();\n      $('#gOk').onclick=()=>{\n        const t=$('#gT').value.trim(); if(!t){toast('写个标题');return}\n        DB.logs.push({id:uid('l'),ty:$('#gY').value,date:$('#gD').value||today(),\n          title:t,note:$('#gN').value.trim(),stu:$('#gS').value||''});\n        closeModal();scheduleSave();refreshAll();toast('记下了');\n      };\n    }\n  });\n}\n\n/* ------------------------------ 课程表 ------------------------------ */\nfunction mTimetable(){\n  const day=wd(new Date());\n  const build=d=>{\n    const arr=lessonsOf(d);\n    return arr.map(l=>l.p+' '+l.sub+' '+(l.cls||'')+' '+(l.room||'')).join('\\n');\n  };\n  openModal({\n    title:'课程表',\n    body:'<div class=\"field\"><label>哪一天<\/label><select class=\"inp\" id=\"wD\">'\n      +[1,2,3,4,5,6,7].map(n=>'<option value=\"'+n+'\"'+(n===day?' selected':'')+'>'+weekName(n)+'<\/option>').join('')\n      +'<\/select><\/div>'\n      +'<div class=\"field\"><label>一节一行：<code>节次 科目 班级 教室<\/code><\/label>'\n      +'<textarea class=\"inp\" id=\"wT\" style=\"min-height:190px;font-family:var(--num);font-size:13px\" placeholder=\"1 数学 高一(3)班 301\"><\/textarea><\/div>'\n      +'<div class=\"help\">节次写数字 1-8；班级和教室可以不写。改哪天就在上面切哪天。<\/div>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">取消<\/button><button class=\"btn pri\" id=\"wOk\">存下<\/button>',\n    mount(){\n      const ta=$('#wT'); if(ta)ta.value=build(day);\n      $('#wD').onchange=()=>{ta.value=build(+$('#wD').value)};\n      $('#wOk').onclick=()=>{\n        const d=$('#wD').value;\n        const arr=$('#wT').value.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean).map(line=>{\n          const tk=line.split(/\\s+/);\n          return {p:+tk[0]||1,sub:tk[1]||'课',cls:tk[2]||'',room:tk[3]||''};\n        }).filter(x=>x.p>=1&&x.p<=8).sort((a,b)=>a.p-b.p);\n        DB.timetable[String(d)]=arr;\n        closeModal();scheduleSave();refreshAll();toast(weekName(+d)+'的课表存好了');\n      };\n    }\n  });\n}\n\n\n/* 点格子改一节：科目 / 班级 / 教室，留空就是删掉这一节 */\nfunction mTTCell(d,p){\n  const arr=lessonsOf(d);\n  const cur=arr.find(x=>+x.p===p)||{};\n  openModal({\n    title:weekName(d)+' 第 '+p+' 节',\n    body:'<div class=\"field\"><label>科目<\/label><input class=\"inp\" id=\"cSub\" value=\"'+esc(cur.sub||'')+'\" placeholder=\"例：数学 / 班会 / 自习\" autofocus><\/div>'\n      +'<div class=\"frow\"><div class=\"field\"><label>班级（可不填）<\/label><input class=\"inp\" id=\"cCls\" value=\"'+esc(cur.cls||'')+'\" placeholder=\"例：高一(3)班\"><\/div>'\n      +'<div class=\"field\"><label>教室（可不填）<\/label><input class=\"inp\" id=\"cRoom\" value=\"'+esc(cur.room||'')+'\" placeholder=\"例：301\"><\/div><\/div>'\n      +'<div class=\"help\">科目留空＝这一节没课，会从课表上摘掉。<\/div>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">取消<\/button>'\n      +(cur.sub?'<button class=\"btn danger\" id=\"cDel\">删掉这节<\/button>':'')\n      +'<button class=\"btn pri\" id=\"cOk\">存下<\/button>',\n    mount(){\n      $('#cSub').focus();\n      if($('#cDel'))$('#cDel').onclick=()=>{\n        DB.timetable[String(d)]=arr.filter(x=>+x.p!==p);\n        closeModal();scheduleSave();refreshAll();toast('这一节已删掉');\n      };\n      $('#cOk').onclick=()=>{\n        const sub=$('#cSub').value.trim();\n        const rest=arr.filter(x=>+x.p!==p);\n        if(sub)rest.push({p:p,sub:sub,cls:$('#cCls').value.trim(),room:$('#cRoom').value.trim()});\n        DB.timetable[String(d)]=rest.sort((a,b)=>a.p-b.p);\n        closeModal();scheduleSave();refreshAll();toast(sub?('已存：'+weekName(d)+' 第 '+p+' 节 '+sub):'这一节已清空');\n      };\n    }\n  });\n}\n\n/* ------------------------------ 课堂小工具 ------------------------------ */\nfunction mPick(){\n  const c=cls(); const pool=c.students;\n  if(!pool.length){toast('先加学生');return}\n  let last='';\n  openModal({\n    title:'随机点名',\n    body:'<div class=\"bigtool\"><div class=\"who\" id=\"pkWho\">准备好了吗<\/div>'\n      +'<div class=\"sub\" id=\"pkSub\">'+pool.length+' 人，点下面的按钮<\/div><\/div>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">关掉<\/button><button class=\"btn pri\" id=\"pkGo\">抽一个<\/button>',\n    mount(){\n      $('#pkGo').onclick=()=>{\n        let s=pool[Math.floor(Math.random()*pool.length)];\n        if(pool.length>1){let g=0;while(s.n===last&&g++<8)s=pool[Math.floor(Math.random()*pool.length)]}\n        last=s.n;\n        $('#pkWho').textContent=s.n;\n        const tag=(s.tags||[]).join(' / ');\n        $('#pkSub').textContent=(s.no?'学号 '+s.no+' · ':'')+(s.sex==='F'?'女':'男')+(tag?' · '+tag:'');\n      };\n      $('#pkGo').click();\n    }\n  });\n}\nfunction mTimer(){\n  let left=300,tid=null,running=false;\n  openModal({\n    title:'课堂倒计时',\n    body:'<div class=\"bigtool\"><div class=\"cnt\" id=\"tmC\">05:00<\/div>'\n      +'<div class=\"sub\">到点了会弹提示<\/div><\/div>'\n      +'<div class=\"btnrow\" style=\"justify-content:center;margin-top:12px\">'\n      +[60,180,300,600].map(n=>'<button class=\"btn\" data-tm=\"'+n+'\">'+(n/60)+' 分钟<\/button>').join('')\n      +'<\/div>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">关掉<\/button><button class=\"btn pri\" id=\"tmGo\">开始<\/button>',\n    mount(){\n      const paint=()=>{\n        const m=Math.floor(left/60),s=left%60;\n        $('#tmC').textContent=pad2(m)+':'+pad2(s);\n        $('#tmC').style.color=left<=10?'var(--verm)':'';\n      };\n      const tick=()=>{\n        left--;paint();\n        if(left<=0){clearInterval(tid);tid=null;running=false;$('#tmGo').textContent='再来一次';left=300;paint();toast('时间到');}\n      };\n      $$('[data-tm]').forEach(b=>{b.onclick=()=>{if(running)return;left=+b.dataset.tm;paint()}});\n      $('#tmGo').onclick=()=>{\n        if(running){clearInterval(tid);tid=null;running=false;$('#tmGo').textContent='继续';return}\n        running=true;$('#tmGo').textContent='暂停';\n        tid=setInterval(tick,1000);\n      };\n      const old=MODAL_CLOSE;\n      MODAL_CLOSE=()=>{if(tid)clearInterval(tid);if(old)old()};\n      paint();\n    }\n  });\n}\n\n/* ------------------------------ 确认框 ------------------------------ */\nfunction confirmBox(title,text,okText,onOk,danger){\n  openModal({\n    title:title,\n    body:'<div style=\"font-size:13px;line-height:1.75;color:var(--ink-2)\">'+text+'<\/div>',\n    foot:'<button class=\"btn\" data-act=\"mclose\">算了<\/button>'\n      +'<button class=\"btn pri\" id=\"cOk\"'+(danger?' style=\"background:var(--verm);border-color:var(--verm)\"':'')+'>'+esc(okText||'确定')+'<\/button>',\n    mount(){$('#cOk').onclick=()=>{closeModal();if(onOk)onOk()}}\n  });\n}\n\n/* ------------------------------ 总事件 ------------------------------ */\nfunction bind(){\n  document.addEventListener('click',e=>{\n    const m=e.target.closest('[data-mask]');\n    if(m&&e.target===m){closeModal();return}\n    const el=e.target.closest('[data-act]');\n    if(!el)return;\n    const act=el.dataset.act, id=el.dataset.id;\n\n    if(act==='mclose'){closeModal();return}\n    if(act==='tab'){V.tab=el.dataset.tab||'home';closeModal();refreshAll();window.scrollTo({top:0});return}\n\n    /* --- 待办 --- */\n    if(act==='tnew'){mTodo();return}\n    if(act==='tedit'){mTodo(id);return}\n    if(act==='tdone'){\n      const t=(DB.todos||[]).find(x=>x.id===id);\n      if(t){t.done=!t.done;t.doneAt=t.done?Date.now():0;scheduleSave();refreshAll()}\n      return;\n    }\n    if(act==='tdel'){\n      const t=(DB.todos||[]).find(x=>x.id===id);\n      if(!t)return;\n      confirmBox('删掉这件事？','「'+esc(t.t)+'」会被删掉，删了不能恢复。',\"删掉\",()=>{\n        DB.todos=DB.todos.filter(x=>x.id!==id);scheduleSave();refreshAll();\n      },true);\n      return;\n    }\n    if(act==='tt'){mTimetable();return}\n    if(act==='ttcell'){mTTCell(+el.dataset.d,+el.dataset.p);return}\n    if(act==='ttclear'){\n      confirmBox('清空整周课表？','七天的课都会清掉，学生、成绩、记录不受影响。','清空',()=>{\n        DB.timetable={};scheduleSave();refreshAll();toast('课表已清空');\n      },true);\n      return;\n    }\n\n    /* --- 班级 --- */\n    if(act==='pick'){mPick();return}\n    if(act==='timer'){mTimer();return}\n    if(act==='addstu'){mStudent();return}\n    if(act==='editstu'){mStudent(id);return}\n    if(act==='delstu'){\n      const s=stu(id); if(!s)return;\n      confirmBox('删掉这名学生？','「'+esc(s.n)+'」会从名单里去掉，他/她的成绩和记录也会一起清掉。','删掉',()=>{\n        const c=cls();c.students=c.students.filter(x=>x.id!==id);\n        DB.logs=(DB.logs||[]).filter(r=>r.stu!==id);\n        DB.exams.forEach(ex=>{delete ex.map[id]});\n        const sd=DB.seats[c.id];if(sd)sd.order=(sd.order||[]).filter(x=>x!==id);\n        scheduleSave();refreshAll();\n      },true);\n      return;\n    }\n    if(act==='pt'){\n      const st=cls().students.find(x=>x.id===id);\n      if(st){st.pts=(st.pts||0)+(+el.dataset.v||0);scheduleSave();refreshAll();}\n      return;\n    }\n    if(act==='paste'){mPasteStudents();return}\n    if(act==='csvStu'){exportStudentsCSV();return}\n    if(act==='shuffle'){\n      const c=cls();const sd=DB.seats[c.id]||(DB.seats[c.id]={cols:6,order:[]});\n      const a=c.students.map(x=>x.id);\n      for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}\n      sd.order=a;V.seatSel=null;scheduleSave();refreshAll();toast('重新排过了');\n      return;\n    }\n    if(act==='orderno'){\n      const c=cls();const sd=DB.seats[c.id]||(DB.seats[c.id]={cols:6,order:[]});\n      sd.order=c.students.slice().sort((a,b)=>String(a.no).localeCompare(String(b.no))).map(x=>x.id);\n      V.seatSel=null;scheduleSave();refreshAll();\n      return;\n    }\n    if(act==='print'){window.print();return}\n\n    /* --- 成绩 --- */\n    if(act==='newexam'){mNewExam();return}\n    if(act==='entry'){mEntry(id);return}\n    if(act==='csvScore'){exportScoresCSV(id||V.examId);return}\n\n    /* --- 事务 --- */\n    if(act==='lf'){V.logFilter=el.dataset.f||'all';refreshAll();return}\n    if(act==='lnew'){mLog();return}\n    if(act==='ldel'){\n      confirmBox('删掉这条记录？','删了不能恢复。','删掉',()=>{\n        DB.logs=DB.logs.filter(x=>x.id!==id);scheduleSave();refreshAll();\n      },true);\n      return;\n    }\n\n    /* --- 数据 --- */\n    if(act==='pick'){\n      FS.pick().then(()=>{refreshAll()});\n      return;\n    }\n    if(act==='reauth'){FS.ensure().then(ok=>{refreshAll();toast(ok?'授权好了':'还是没给权限')});return}\n    if(act==='writeNow'){\n      if(!FS.handle){toast('还没选文件夹');return}\n      FS.write(true).then(ok=>{refreshAll();toast(ok?'已写入「'+FS.name+'」':'写入失败，检查权限')});\n      return;\n    }\n    if(act==='saveNow'){saveNow(true);return}\n    if(act==='srvHelp'){\n      openModal({\n        title:'怎么让手机和电脑同一份数据',\n        body:'<div class=\"help\">'\n          +'<p>这条路不需要云、不花钱，数据只在你电脑的硬盘上。适合教室：电脑在讲台，手机在手里。<\/p>'\n          +'<b style=\"display:inline-block;margin-top:10px\">三步<\/b>'\n          +'<ol><li>把 <code>教师工作台工具包<\/code> 整个文件夹放到电脑上（建议 D 盘）<\/li>'\n          +'<li>双击 <code>启动手机共享.bat<\/code>，黑窗口里会印出两行地址，记下 <code>http://192.168.…:8765<\/code><\/li>'\n          +'<li>手机连同一个 WiFi（电脑没 WiFi 就开热点），浏览器输那个地址<\/li><\/ol>'\n          +'<b style=\"display:inline-block;margin-top:10px\">之后就自动了<\/b>'\n          +'<p>手机上加一条，电脑上刷新就有；电脑上改，手机上刷新也有。数据存在电脑 D 盘里的一个 JSON 文件，'\n          +'即使不联手机，它也在自动备份。<\/p>'\n          +'<b style=\"display:inline-block;margin-top:10px\">注意<\/b>'\n          +'<ul><li>电脑关机、或那个黑窗口关了，手机就连不上（但数据不会丢）<\/li>'\n          +'<li>只在一个 WiFi 里能用，出了学校就不行——那是另一套方案（云同步），要额外配置<\/li><\/ul>'\n          +'<\/div>',\n        foot:'<button class=\"btn pri\" data-act=\"mclose\">知道了<\/button>'\n      });\n      return;\n    }\n    if(act==='expJson'){exportJSON();return}\n    if(act==='impJson'){const f=$('#impFile');if(f)f.click();return}\n    if(act==='tplStu'){tplStudentsCSV();return}\n    if(act==='tplScore'){tplScoresCSV();return}\n    if(act==='impStuCsv'){const f=$('#impStuCsv');if(f)f.click();return}\n    if(act==='impScoreCsv'){const f=$('#impScoreCsv');if(f)f.click();return}\n    if(act==='resetDemo'){\n      confirmBox('恢复示例数据？','现在的数据会被覆盖。我会先导出一份备份。','恢复',()=>{\n        exportJSON();DB=defaults();saveLocal();scheduleSave();refreshAll();toast('已恢复示例');\n      });\n      return;\n    }\n    if(act==='clearAll'){\n      confirmBox('清空全部数据？','学生、成绩、记录全都会没有。我会先自动导出一份备份文件，但请确认你不再需要它们。','清空',()=>{\n        exportJSON();\n        DB=defaults();\n        DB.classes=[{id:'c1',name:'我的班',grade:'',students:[]}];\n        DB.cur='c1';DB.todos=[];DB.exams=[];DB.logs=[];DB.attend={};DB.seats={c1:{cols:6,order:[]}};\n        saveLocal();scheduleSave();refreshAll();toast('已清空，备份已下载');\n      },true);\n      return;\n    }\n  });\n\n  /* 座位对调 */\n  document.addEventListener('click',e=>{\n    const s=e.target.closest('.seat[data-act=\"seat\"]');\n    if(!s)return;\n    const id=s.dataset.id;\n    if(!V.seatSel){V.seatSel=id;refreshAll();return}\n    if(V.seatSel===id){V.seatSel=null;refreshAll();return}\n    const c=cls();const sd=DB.seats[c.id]||(DB.seats[c.id]={cols:6,order:[]});\n    const a=sd.order.indexOf(V.seatSel), b=sd.order.indexOf(id);\n    if(a>=0&&b>=0){const t=sd.order[a];sd.order[a]=sd.order[b];sd.order[b]=t}\n    V.seatSel=null;scheduleSave();refreshAll();\n  });\n\n  /* 考勤三态 */\n  document.addEventListener('click',e=>{\n    const b=e.target.closest('[data-act=\"att\"]');\n    if(!b||b.classList.contains('tool'))return;\n    const id=b.dataset.id; if(!id)return;\n    const key=today()+'|'+DB.cur;\n    const a=(DB.attend[key]=DB.attend[key]||{absent:[],late:[]});\n    a.absent=a.absent||[];a.late=a.late||[];\n    const ai=a.absent.indexOf(id), li=a.late.indexOf(id);\n    if(ai>=0){a.absent.splice(ai,1);a.late.push(id)}\n    else if(li>=0){a.late.splice(li,1)}\n    else{a.absent.push(id)}\n    scheduleSave();refreshAll();\n  });\n\n  /* 列数切换 + 考试切换 */\n  document.addEventListener('change',e=>{\n    const el=e.target;\n    if(el.dataset&&el.dataset.act==='cols'){\n      const c=cls();const sd=DB.seats[c.id]||(DB.seats[c.id]={cols:6,order:[]});\n      sd.cols=+el.value;V.seatCols=+el.value;scheduleSave();refreshAll();return;\n    }\n    if(el.id==='clsSel'){DB.cur=el.value;V.seatSel=null;scheduleSave();refreshAll();return}\n    if(el.id==='impFile'&&el.files&&el.files[0]){importJSON(el.files[0]);el.value='';return}\n    if(el.id==='impStuCsv'&&el.files&&el.files[0]){importStudentsCSV(el.files[0]);el.value='';return}\n    if(el.id==='impScoreCsv'&&el.files&&el.files[0]){importScoresCSV(el.files[0]);el.value='';return}\n  });\n\n  /* 点考试切一场 */\n  document.addEventListener('click',e=>{\n    const el=e.target.closest('[data-exam]');\n    if(!el)return;\n    V.examId=el.dataset.exam;refreshAll();\n  });\n\n  /* 键盘：/ 聚焦，Esc 关窗 */\n  document.addEventListener('keydown',e=>{\n    if(e.key==='Escape'){closeModal();return}\n    if(e.key==='/'&&!/input|textarea|select/i.test((document.activeElement||{}).tagName||'')){\n      e.preventDefault();\n    }\n  });\n\n  /* 其它标签页改了数据，这边跟着刷新 */\n  window.addEventListener('storage',e=>{\n    if(e.key!==KEY||!e.newValue)return;\n    try{DB=normalize(JSON.parse(e.newValue));refreshAll();toast('另一个窗口改了数据，已同步')}catch(err){}\n  });\n\n  window.addEventListener('beforeunload',()=>{try{saveLocal()}catch(e){}});\n}\n\n/* ------------------------------ 启动 ------------------------------ */\n/* 首启引导：只在第一次进入教师工作台时弹（对应班务通\"打开先让你导入\"的优点，\n   但只在进工作台唤起，不在开导航页时弹；之后全自动保存，不再打扰） */\nasync function boot(){\n  const lg=$('#logo'); if(lg)lg.innerHTML=svg('book');\n  loadLocal();\n\n  /* 1) 先看是不是跑在共享服务里（手机同网段场景） */\n  const onSrv=await srvPing();\n  if(onSrv){\n    const d=await srvLoad();\n    if(d&&Array.isArray(d.classes)&&d.classes.length){DB=normalize(d);saveLocal()}\n    else await srvSave();\n  }else{\n    /* 2) 本地：尝试恢复上次选过的文件夹句柄 */\n    await FS.restore();\n  }\n\n  const td=$('#todayD'), tw=$('#todayW');\n  if(td)td.textContent=cnDate();\n  if(tw)tw.textContent=weekName(wd(new Date()));\n\n  bind();\n  refreshAll();\n\n  if(!onSrv&&!FS.handle&&FS.support()){\n    setTimeout(()=>{renderSaveState()},300);\n  }\n}\n/* ==========================================================================\n   教师工作台 v2 · 扩展层\n   竖列模块（工作流）+ 横列子 Tab + 纯前端课堂工具 + 资源集成。\n   原则：零外部依赖（不引任何 CDN）、一份班级名单处处复用、数据只存本机。\n   原 V1.0.6 的今天/课表/班级/成绩/事务/数据六个页面一行未动。\n   ========================================================================== */\nconst TD_KEY='teacherdesk.tools.v2';\nvar TOOL={picked:[],pickOne:'',pickRepeat:false,pickedName:'',\n  groupN:4,groupMode:'n',groupEach:5,groups:[],\n  tmin:5,timer:{mode:'down',left:300,elapsed:0,running:false,endAt:0,startAt:0},\n  score:[{n:'第1组',p:0},{n:'第2组',p:0},{n:'第3组',p:0},{n:'第4组',p:0}],\n  lottery:'',lotteryOne:'',\n  commentStu:'',commentTags:[],commentText:'',\n  certName:'',certAward:'三好学生',certBy:'冬阳汇 · 教师工作台',certDate:today(),\n  text:'',examName:'期末考试',examDate:''};\ntry{var _td=JSON.parse(localStorage.getItem(TD_KEY)||'{}');if(_td&&typeof _td==='object')TOOL=Object.assign(TOOL,_td)}catch(e){}\nfunction saveTool(){try{localStorage.setItem(TD_KEY,JSON.stringify(TOOL))}catch(e){}}\n\n/* 模块 = 竖列菜单；每个模块带自己的一组横列 Tab */\nconst MODS=[\n {id:'class',n:'我的班级',g:'每天',i:'cal',tabs:TABS},\n {id:'tools',n:'课堂工具',g:'上课用',i:'timer',tabs:[\n   {id:'pick',n:'随机点名',i:'kid'},{id:'group',n:'随机分组',i:'users'},\n   {id:'timer',n:'计时倒计时',i:'timer'},{id:'score',n:'小组计分',i:'star'},\n   {id:'lottery',n:'抽签转盘',i:'shuffle'},{id:'comment',n:'评语速写',i:'edit'},\n   {id:'cert',n:'奖状打印',i:'print'},{id:'text',n:'文本工具',i:'clip'}]},\n {id:'prep',n:'备课资源',g:'备课',i:'book',tabs:[\n   {id:'gov',n:'国家平台',i:'home'},{id:'plan',n:'教案课件',i:'book'},\n   {id:'paper',n:'试题试卷',i:'edit'},{id:'subject',n:'学科工具',i:'grid'},\n   {id:'ai',n:'AI 备课',i:'spark'}]},\n {id:'res',n:'教学素材',g:'找素材',i:'spark',tabs:[\n   {id:'photo',n:'图片插画',i:'star'},{id:'audio',n:'音乐音效',i:'mic'},\n   {id:'video',n:'视频素材',i:'home'},{id:'font',n:'字体图标',i:'pin'},\n   {id:'get',n:'下载与转换',i:'dl'},{id:'law',n:'免费宝藏',i:'star'}]},\n {id:'util',n:'效率工具',g:'做东西',i:'grid',tabs:[\n   {id:'pdf',n:'PDF 处理',i:'book'},{id:'img',n:'图片处理',i:'star'},\n   {id:'ocr',n:'OCR 识别',i:'clip'},{id:'send',n:'传文件',i:'cloud'},\n   {id:'map',n:'思维导图',i:'grid'},{id:'rec',n:'录屏剪辑',i:'home'}]},\n {id:'data',n:'数据与同步',g:'我的',i:'db',tabs:[{id:'data',n:'数据与存储',i:'db'}]}\n];\nfunction modOf(id){for(var i=0;i<MODS.length;i++)if(MODS[i].id===id)return MODS[i];return MODS[0]}\nV.mod='class';\n\nfunction renderModNav(){\n  var box=document.getElementById('modNav');if(!box)return;\n  var h='',last='',n=0;\n  try{n=overdueTodos().length+todayTodos().length}catch(e){}\n  MODS.forEach(function(m){\n    if(m.g!==last){h+='<div class=\"mod-g\">'+esc(m.g)+'<\/div>';last=m.g}\n    h+='<button class=\"mod-i'+(V.mod===m.id?' on':'')+'\" data-act=\"mod\" data-mod=\"'+m.id+'\">'\n      +svg(m.i)+'<span class=\"mn\">'+esc(m.n)+'<\/span>'\n      +((m.id==='class'&&n)?'<span class=\"mb\">'+n+'<\/span>':'')+'<\/button>';\n  });\n  h+='<div class=\"mod-foot\">冬阳汇 · 教师工作台<br><span>数据只存本机 · 零外链<\/span><\/div>';\n  box.innerHTML=h;\n}\nrenderTabs=function(){\n  var m=modOf(V.mod),n=0;\n  try{n=overdueTodos().length+todayTodos().length}catch(e){}\n  var box=document.getElementById('tabs');if(!box)return;\n  box.innerHTML=m.tabs.map(function(x){\n    var b=(x.id==='home'&&n)?'<span class=\"badge\">'+n+'<\/span>':'';\n    return '<button class=\"tab'+(V.tab===x.id?' on':'')+'\" data-act=\"tab\" data-tab=\"'+x.id+'\">'\n      +svg(x.i||'grid')+'<span>'+esc(x.n)+'<\/span>'+b+'<\/button>';\n  }).join('');\n};\n\n/* ---------------- 小工具公共件 ---------------- */\nfunction tdStudents(){try{var c=cls();return (c&&c.students)||[]}catch(e){return []}}\nfunction tdCard(title,sub,body){return '<div class=\"tool-card\"><h2>'+esc(title)+'<\/h2><p class=\"tool-sub\">'+sub+'<\/p>'+body+'<\/div>'}\nfunction tdCopy(txt){\n  var ok=function(){toast('已复制到剪贴板')};\n  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){fb()})}else fb();\n  function fb(){\n    var a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;left:-9999px';\n    document.body.appendChild(a);a.select();\n    try{document.execCommand('copy');ok()}catch(e){toast('复制失败，请手动选中复制')}\n    a.remove();\n  }\n}\nfunction tdBeep(){\n  try{var C=window.AudioContext||window.webkitAudioContext,a=new C(),o=a.createOscillator(),g=a.createGain();\n    o.connect(g);g.connect(a.destination);o.frequency.value=880;\n    g.gain.setValueAtTime(.13,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);\n    o.start();o.stop(a.currentTime+.36)}catch(e){}\n}\nfunction tdFmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}\nfunction tdFull(){try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();\n  document.body.classList.add('td-present');toast('投屏模式 · 按 Esc 退出')}catch(e){}}\nfunction tdNoStu(){return '<p class=\"tool-warn\">还没有学生名单。到「我的班级 → 班级」里粘贴导入名单，点名、分组、计分、座位表就都能用了（一份名单，所有工具共用）。<\/p>'}\n\n/* ---------------- 工具页 ---------------- */\nfunction toolPick(){\n  var st=tdStudents(),left=st.filter(function(x){return (TOOL.picked||[]).indexOf(x.id)<0});\n  var b='<div class=\"pick-big\">'+(TOOL.pickOne?esc(TOOL.pickOne):'点下面按钮开始')+'<\/div>'\n    +'<div class=\"btnrow\"><button class=\"btn pri\" data-act=\"x_pickGo\">'+svg('shuffle')+'抽一个<\/button>'\n    +'<button class=\"btn\" data-act=\"x_pickReset\">重置本轮<\/button>'\n    +'<button class=\"btn\" data-act=\"x_full\">'+svg('grid')+'投屏大字<\/button>'\n    +'<label class=\"chk\"><input type=\"che const DESK_TREE=[

function deskFlat(list,out){
  out=out||[];
  (list||[]).forEach(x=>{out.push(x);if(x.subs&&x.subs.length)deskFlat(x.subs,out)});
  return out;
}
function findDesk(id){
  const a=deskFlat(DESK_TREE);
  for(let i=0;i<a.length;i++)if(a[i].id===id)return a[i];

}

/* v21：精品软件从「绿色版/便携版/开源替代」改成按用途分组。
   种子条目按 URL 对上新 sub；用户自己加的那些按旧 id 落到最接近的新组，不让它凭空消失。 */
const SOFT_FALL={setup:'os',sys:'os',oss:'os',clean:'src',portable:'src',batch:'batch',uninst:'safe',tool:'tool',ban:'edu',score:'edu'};
function remapSoft(m){
  const seed=defaults().sites.filter(s=>s.c==='soft');
  const byUrl={};seed.forEach(s=>{byUrl[s.u]=s.t});
  let n=0;
  (m.sites||[]).forEach(s=>{
    if(!s||s.c!=='soft')return;
    const t=byUrl[s.u]||SOFT_FALL[s.t]||'src';
    if(t!==s.t){s.t=t;n++}
  });
  return n;
}

/* v25：Chrome 应用商店在国内打不开，老用户存下的商店地址统一改写成 Crx 搜搜的镜像详情页。
   扩展 ID 是同一串，所以按 ID 重拼即可，用户自己加的商店链接也一并救活。 */
function remapCrx(m){
  let n=0;
  (m.sites||[]).forEach(s=>{
    if(!s||!s.u)return;
    const mm=String(s.u).match(/chromewebstore\.google\.com\/detail\/[^\/]+\/([a-p]{32})/);
    if(mm){s.u='https://www.crxsoso.com/webstore/detail/'+mm[1];n++}
  });

}

/* v12：把内置 SEED 里"本地还没有"的站点补进来。
   只按 URL 判断，不动用户已有的条目和排序；用户删过的地址记在 gone 里，不会被补回来。 */
function mergeSeed(m){
  const seed=defaults();
  /* v14：先摘掉已被替换的旧内置地址 */
  if(Array.isArray(m.sites)&&m.sites.length){
    m.sites=m.sites.filter(s=>s&&SEED_DROP.indexOf(s.u)<0);
  }
  const have={};
  /* v25：按「地址 + 分类」去重。装机必备本来就该和精品软件有交集（同一款软件，
     一个在全集里、一个在筛选后的必备清单里），只按地址去重会把必备那几条吞掉。 */
  (m.sites||[]).forEach(s=>{have[s.u+'|'+s.c]=1});
  const gone=m.gone||(m.gone=[]);
  let n=0;
  seed.sites.forEach(s=>{
    if(!have[s.u+'|'+s.c]&&gone.indexOf(s.u)<0){m.sites.push(s);have[s.u+'|'+s.c]=1;n++}
  });
  m.seedVer=SEED_VER;
  return n;
}
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(LS));
    if(raw&&Array.isArray(raw.sites)&&raw.sites.length){
      const d=defaults();
      const m=Object.assign(d,raw);
      if(!m.cats||!m.cats.length)m.cats=d.cats;
      /* v7：把历届默认品牌色迁移到蓝 600（用户手动选过的其它颜色保持不动） */
      const OLD=['#2f6df6','#4661e8','#17695e'];
      if(OLD.indexOf(String(m.brand||'').toLowerCase())>=0) m.brand='#2563EB';
      /* v8：默认管理口令统一为 admin（历届默认口令一并迁移，自己改过的保持不动） */
      if(!m.pw||m.pw==='teacher2026') m.pw='admin';
      /* v19：天气城市默认改成商洛（空着或还是老默认北京的，一并迁过来） */
      if(!m.wxCity||m.wxCity==='北京') m.wxCity='商洛';
      /* v24：默认不再跟随系统深色 —— 打开就是蓝白，想用深色自己按月亮键 */
      if(m.theme==='auto') m.theme='light';
      /* v12：内置站点有更新就补齐（这是"我改了你看不到"的根因修复） */
      if(raw.seedVer!==SEED_VER){
        /* v4：精选改引用式 —— 老数据里 gem/install 的重复实体清掉，主分类里的原条不动 */
        m.sites=m.sites.filter(s=>s&&s.c!=='gem'&&s.c!=='install');
        remapSoft(m);
        remapCrx(m);
        /* v27：教务软件并入精品软件 —— 旧 jw 分类和 room 里的两条统一迁到 soft/edu */
        m.sites.forEach(function(s){
          if(!s)return;
          if(s.c==='jw'){s.c='soft';s.t='edu'}
          if((s.u==='https://anbola.github.io/fenban/'||s.u==='https://anbola.github.io/chengji/')&&s.c==='room'){
            s.c='soft';s.t='edu';
          }
        });
        m.cats=(m.cats||[]).filter(function(c){return c&&c.id!=='jw'});
        const added=mergeSeed(m);
        SEED_ADDED=added;
        try{localStorage.setItem(LS,JSON.stringify(m))}catch(e){}
      }
      if(!m.picks||!m.picks.gem)m.picks=SEED_PICKS;
      return m;
    }
  }catch(e){}
  return defaults();
}

function hue(str){let h=0,s=String(str);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function abbr(n){
  let s=String(n).replace(/^(中国|国家|全国|中华|中央|教育部)/,'').replace(/[·（）()【】\s\-—_、]/g,'');
  if(!s)s=String(n).replace(/[·（）()【】\s\-—_、]/g,'');
  if(/^[A-Za-z]/.test(s)){
    const w=s.replace(/[^A-Za-z ]/g,'').trim().split(/\s+/).filter(Boolean);
    if(w.length>=2)return (w[0][0]+w[1][0]).toUpperCase();
    const m=s.match(/[A-Za-z]{1,2}/);return m?m[0].toUpperCase():'A';
  }
  return s.slice(0,2)||'?';
}
function logo(u,n,size,cat){
  const co=(catOf(cat||'prep').co||'#4661e8');
  const j=(hue(String(u))%3)-1;                 /* -1 / 0 / 1，只做明度微抖 */
  const a=58+j*6, b=46+j*6;                     /* 亮端 / 暗端占比 */
  /* 能引用真实图标就引用：向站点自己的 /favicon.ico 要一张。
     拿不到（离线、站点没放、被墙）就静默退回下面的字母块，不影响离线使用 */
  let fav='';
  if(DB.favIcon!==false){
    let o='';
    try{o=new URL(u).origin}catch(err){o=''}
    if(o)fav='<img class="lg-real" src="'+esc(o)+'/favicon.ico" alt="" loading="lazy" decoding="async" '
      +'onload="this.classList.add(\'ok\')" onerror="this.classList.add(\'dead\')">';
  }
  return '<span class="lg '+(size||'sm')+'" style="background:linear-gradient(145deg,'+
    'color-mix(in srgb,'+co+' '+a+'%,#ffffff),'+
    'color-mix(in srgb,'+co+' '+b+'%,#000000))">'+esc(abbr(n))+fav+'</span>';
}
function catOf(id){return CATS.filter(c=>c.id===id)[0]||CATS[0]}
function visible(cid){const r=DB.cats.filter(c=>c.id===cid)[0];return !r||!r.hidden}
function allSites(){return DB.sites.filter(s=>!(DB.hideOver&&s.f==='over'))}
/* v4：引用式精选 —— 只按 URL 从主库取真实条目，不复制数据 */
function pickSites(cid){
  const p=(DB.picks||{})[cid];if(!p||!Array.isArray(p.groups))return [];
  const out=[],seen={};
  p.groups.forEach(g=>(g.urls||[]).forEach(u=>{
    const x=byU[u];if(!x||seen[u])return;seen[u]=1;
    if(DB.hideOver&&x.f==='over')return;
    out.push(Object.assign({},x,{t:g.t,_pick:cid}));
  }));
  return out;
}

function catCount(cid){const c=catOf(cid);return c&&c.pick?pickSites(cid).length:DB.sites.filter(s=>s.c===cid).length}
function hi(txt){
  const q=S.q.trim();const s=esc(txt||'');
  if(!q)return s;
  try{
    const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return s.replace(re,'<mark class="hl">$1</mark>');
  }catch(e){return s}
}
function hexToHsl(hex){
  let h=String(hex).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let hu=0,sa=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;sa=l>.5?d/(2-mx-mn):d/(mx+mn);
    hu=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);hu*=60}
  return [Math.round(hu),Math.round(sa*100),Math.round(l*100)];
}

/* --- 侧栏拖拽排序：直接重排 DB.cats，顺序会被持久化 --- */
let dragId=null;
function ensureCatRows(){
  let added=0;
  CATS.forEach((c,ci)=>{
    if((DB.cats||[]).some(x=>x.id===c.id))return;
    added++;
    const row={id:c.id,hidden:false};
    /* 按 CATS 里的位置插进去，新分类才不会永远掉在最后 */
    const prev=CATS[ci-1];
    const at=prev?DB.cats.findIndex(x=>x.id===prev.id):-1;
    if(at>=0)DB.cats.splice(at+1,0,row);
    else if(ci===0)DB.cats.unshift(row);
    else DB.cats.push(row);
  });
  /* 新增分类补进 DB.cats 后要落盘，否则下次打开又得重算一遍 */
  if(added)try{save()}catch(e){}
  return added;
}
function idxOf(arr,id){for(let i=0;i<arr.length;i++)if(arr[i].id===id)return i;return -1}
function clearDropMarks(){
  const side=$('#side');if(!side)return;
  side.classList.remove('drag-on');
  const all=side.querySelectorAll('.nav-i');
  for(let i=0;i<all.length;i++)all[i].classList.remove('dragging','drop-before','drop-after');
}
function moveCat(fromId,toId,after){
  ensureCatRows();
  const arr=DB.cats;
  const fi=idxOf(arr,fromId);if(fi<0)return;
  const item=arr.splice(fi,1)[0];
  let ti=idxOf(arr,toId);
  if(ti<0)ti=arr.length;else if(after)ti++;
  arr.splice(ti,0,item);
  save();
  const vis=DB.cats.filter(x=>!x.hidden);
  const cn=catOf(fromId).n, rank=idxOf(vis,fromId)+1;
  render();
  toast('「'+cn+'」已移到第 '+rank+' 位');
  const n=document.querySelector('.nav-i[data-cid="'+fromId+'"]');
  if(n){movePill();try{n.focus()}catch(err){}}
}
/* 键盘版：Alt+↑↓ 一次挪一格，避开已隐藏的分类 */
function stepCat(cid,down){
  ensureCatRows();
  const vis=DB.cats.filter(x=>!x.hidden);
  const i=idxOf(vis,cid);if(i<0)return;
  const j=i+(down?1:-1);if(j<0||j>=vis.length)return;
  moveCat(cid,vis[j].id,down);
}
function bindSideDrag(){
  const nav=$('#nav2'),side=$('#side');
  if(!nav||!side||nav.dataset.bound)return;
  nav.dataset.bound='1';
  nav.addEventListener('dragstart',e=>{
    const t=e.target.closest?e.target.closest('.nav-i'):null;
    if(!t||!t.dataset.cid)return;
    dragId=t.dataset.cid;t.classList.add('dragging');side.classList.add('drag-on');
    try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(err){}
  });
  nav.addEventListener('dragend',()=>{dragId=null;clearDropMarks()});
  nav.addEventListener('dragover',e=>{
    if(!dragId)return;
    e.preventDefault();
    try{e.dataTransfer.dropEffect='move'}catch(err){}
    clearDropMarks();
    const t=e.target.closest?e.target.closest('.nav-i'):null;
    if(!t||!t.dataset.cid||t.dataset.cid===dragId){return}
    const r=t.getBoundingClientRect();
    t.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');
  });
  nav.addEventListener('drop',e=>{
    if(!dragId)return;
    e.preventDefault();
    const t=e.target.closest?e.target.closest('.nav-i'):null;
    const to=t&&t.dataset.cid;
    if(!to||to===dragId){dragId=null;clearDropMarks();return}
    const r=t.getBoundingClientRect();
    const after=e.clientY>=r.top+r.height/2;
    const from=dragId;dragId=null;clearDropMarks();
    moveCat(from,to,after);
  });
  nav.addEventListener('dragleave',e=>{
    if(!e.relatedTarget||!nav.contains(e.relatedTarget))clearDropMarks();
  });
}
/* 侧栏高亮胶囊：滑动跟随当前项 */
function movePill(){
  const side=$('#side');if(!side||!side.querySelectorAll)return;

  for(let i=0;i<all.length;i++)all[i].classList.remove('on');

  if(kc&&kc.indexOf('var(')<0)pill.style.setProperty('--kc',kc);
  else pill.style.removeProperty('--kc');

}

function pinnedList(){
  const ok=u=>byU[u]&&!(DB.hideOver&&byU[u].f==='over');
  const base=DB.pinned.filter(ok);
  const set=base.slice();
  Object.keys(DB.visits).forEach(u=>{if(ok(u)&&set.indexOf(u)<0)set.push(u)});
  for(let i=0;i<DEFAULT_PINNED.length;i++){
    if(set.length>=12)break;
    const u=DEFAULT_PINNED[i];if(ok(u)&&set.indexOf(u)<0)set.push(u);
  }
  const ord={};base.forEach((u,i)=>{ord[u]=i});
  set.sort((a,b)=>{
    const va=DB.visits[a]||0,vb=DB.visits[b]||0;
    if(va!==vb)return vb-va;
    return (a in ord?ord[a]:999)-(b in ord?ord[b]:999);
  });
  return set.slice(0,12);
}

/* ================= 搜索 / 收藏 ================= */
const VERB=/^(去|做|下|找|怎么|如何|免费|好用的?|有没有|求|哪个)/;
function hay(x){
  const c=catOf(x.c);
  const sn=(c.subs.filter(s=>s[0]===x.t)[0]||['',''])[1];
  const ver=x.v==='sp'?'特别版 破解版 精简版':(x.v?'官方版 原版':'');
  return (x.n+' '+(x.d||'')+' '+(x.w||'')+' '+x.u+' '+sn+' '+c.n+' '+ver).toLowerCase();
}
function searchList(q){
  const raw=String(q||'').trim().toLowerCase();
  if(!raw)return [];
  const terms=[raw];
  const alt=raw.replace(VERB,'');
  if(alt&&alt!==raw)terms.push(alt);
  raw.split(/[\s,，、+]+/).filter(t=>t&&terms.indexOf(t)<0).forEach(t=>terms.push(t));
  const out=[];
  allSites().forEach(x=>{
    const h=hay(x);
    let sc=0;
    for(let i=0;i<terms.length;i++){
      const t=terms[i];
      if(!t)continue;
      if(h.indexOf(t)>=0)sc+=t.length*2+(i===0?1:0);
    }
    if(sc>0)out.push([sc,x]);
  });
  out.sort((a,b)=>b[0]-a[0]);
  /* 同一工具可以同时属于两个分类（7-Zip 既在「软件装机」也在「装机必备」），
     但搜索结果里只保留一条，否则会刷出两行一模一样的 */
  const seen={},uniq=[];
  for(let i=0;i<out.length;i++){
    const x=out[i][1];
    if(seen[x.u])continue;
    seen[x.u]=1;uniq.push(x);
  }
  return uniq;
}
function renderSearch(){
  const list=searchList(S.q);
  let h=searchBox();
  const cur=curEng();
  const qs=(S.q||'').trim();

/* ================= 动效 ================= */
let io=null;
function observeReveal(){
  const nodes=document.querySelectorAll('#view .reveal');
  if(!nodes.length)return;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce||!('IntersectionObserver' in window)){
    for(let i=0;i<nodes.length;i++)nodes[i].classList.add('in');
    return;
  }
  if(io)io.disconnect();
  io=new IntersectionObserver((entries,obs)=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target)}});
  },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  for(let i=0;i<nodes.length;i++)io.observe(nodes[i]);
}
function initMotion(){
  const top=$('#top');
  const onScroll=()=>{if(top)top.classList.toggle('stuck',(window.scrollY||document.documentElement.scrollTop||0)>6)};
  onScroll();
  window.addEventListener('scroll',onScroll,{passive:true});
  let rt=null;
  window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(movePill,140)});
}

function renderDesk(){
  const vw=$('#view');if(!vw)return;
  const it=findDesk(S.desk);
  if(!it){
    vw.innerHTML='<div class="desk-miss"><b>没找到这个工作台</b>'
      +'<p>它可能被改名或删掉了。</p><a class="btn" href="#/">回到全部资源</a></div>';
    return;
  }
  /* 同一台就不重建，免得切回来时里面填到一半的东西被冲掉 */
  const cur=vw.querySelector('.desk-frame iframe');
  if(cur&&cur.getAttribute('data-did')===it.id){requestAnimationFrame(fitDesk);return}

  /* 内嵌型：整页源码就在这个文件里，直接用 srcdoc 装进 iframe。
     这样换电脑、拷 U 盘、线上分享都能用，不依赖本机任何路径 */
  const src=it.src&&typeof DESK_SRC!=='undefined'?DESK_SRC[it.src]:'';
  if(src){
    vw.innerHTML=''
      +'<div class="desk-bar desk-bar-in">'
      +'<a class="dbtn dback" href="#/" title="回到全部资源">'+svg(P.grid)+'<span>返回导航</span></a>'
      +'<span class="dbar-sp"></span>'
      +'<button class="dbtn" id="deskReload" title="重新加载这个工作台">'+svg(P.clock)+'<span>刷新</span></button>'
      +'</div>'
      +'<div class="desk-frame desk-frame-in"><iframe id="deskFrame" data-did="'+it.id+'" '
      +'title="'+esc(it.n)+'" allow="clipboard-read; clipboard-write; fullscreen"></iframe></div>';
    const fr=$('#deskFrame');
    if(fr){
      fr.addEventListener('load',function(){deskTheme();})
      fr.srcdoc=src;
    }
    const rb=$('#deskReload');
    if(rb)rb.onclick=()=>{
      const f=vw.querySelector('.desk-frame iframe');
      if(f)f.srcdoc=DESK_SRC[it.src];
    };
    requestAnimationFrame(fitDesk);
    return;
  }

  const local=location.protocol==='file:';
  const isWeb=/^https?:/i.test(it.u);
  const url=isWeb?it.u:(local?encodeURI(it.u):'');

  if(!url){
    vw.innerHTML='<div class="desk-miss"><b>'+esc(it.n)+'</b>'
      +'<p>这是电脑本机上的工具，网页（线上分享链接）没有权限打开本地文件。</p>'
      +'<p>用本机的《冬阳集.html》打开，就能在这里直接用，左侧菜单也一直都在。</p>'
      +'<a class="btn" href="#/">回到全部资源</a></div>';
    return;
  }

  vw.innerHTML=''
    +'<div class="desk-bar">'
    +'<a class="dbtn dback" href="#/" title="回到全部资源">'+svg(P.grid)+'<span>返回导航</span></a>'
    +'<div class="dt"><b>'+esc(it.n)+'</b>'+(it.d?'<i>'+esc(it.d)+'</i>':'')+'</div>'
    +'<button class="dbtn" id="deskReload" title="重新加载这个工作台">'+svg(P.clock)+'<span>刷新</span></button>'
    +'<a class="dbtn" href="'+url+'" target="_blank" rel="noopener" title="在新窗口单独打开">'+svg(P.out)+'<span>新窗口</span></a>'
    +'</div>'
    +'<div class="desk-frame"><iframe data-did="'+it.id+'" src="'+url+'" '
    +'allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe></div>';

  const rb=$('#deskReload');
  if(rb)rb.onclick=()=>{
    const f=vw.querySelector('.desk-frame iframe');
    if(f)f.src=f.src;
  };
  requestAnimationFrame(fitDesk);
}

/* 工作台跟着导航站换肤：外层切深/浅色，里面立刻跟着变 */
function deskTheme(){
  const f=document.querySelector('.desk-frame iframe');
  if(!f)return;
  try{
    const d=f.contentDocument;
    if(!d||!d.documentElement)return;
    const th=document.documentElement.dataset.theme||'light';
    if(d.documentElement.getAttribute('data-theme')!==th)d.documentElement.setAttribute('data-theme',th);
  }catch(e){}
}

/* 让 iframe 正好占满一屏，避免内外两层滚动条打架 */
function fitDesk(){
  const f=document.querySelector('.desk-frame iframe');
  if(!f)return;
  const top=f.getBoundingClientRect().top+(window.scrollY||0);
  const h=Math.max(360,Math.round(window.innerHeight-top-16));
  f.style.height=h+'px';
}

/* ================= 路由 ================= */
function render(keepSide){
  applyLook();
  document.body.classList.toggle('desk-mode',S.view==='desk');
  if(S.view==='admin'){renderAdmin((location.hash.split('?')[1])||'');return}
  if(!keepSide)renderSide();
  const vw=$('#view');
  if(vw)vw.dataset.mode=S.q.trim()?'search':(S.view||'home');
  if(S.q.trim()){renderSearch();return}
  if(S.view==='home')renderHome();
  else if(S.view==='cat')renderCat();
  else if(S.view==='fav')renderFav();
  else if(S.view==='desk')renderDesk();
  else renderHome();
}
function route(){
  const raw=(location.hash||'').replace(/^#\/?/,'');
  const parts=raw.split('?');
  const seg=parts[0].split('/').filter(Boolean);
  if(seg[0]==='admin'){S.view='admin';render();window.scrollTo(0,0);return}
  if(seg[0]==='desk'){
    S.view='desk';
    const list=deskFlat(DESK_TREE);
    S.desk=seg[1]||(list[0]&&list[0].id)||null;
    S.deskOpen=true;
  }
  else if(seg[0]==='c'&&seg[1]){S.view='cat';S.cat=seg[1];S.sub=seg[2]||'all'}
  else if(seg[0]==='fav'){S.view='fav'}
  else {S.view='home';S.cat=null;S.sub='all'}
  S.q='';
  render();
  window.scrollTo(0,0);
}

function fmtAgo(ts){

/* ==========================================================================
   v2 · 数据源实时更新 + 零成本多设备同步
   设计：内嵌 SEED 是「离线兜底」，远程 sites.json 是「日常更新口」。
   以后加站点、改死链、下架、发公告，只改那一个 JSON，不用重传整个 HTML。
   ========================================================================== */
const FEED_DEFAULT='./sites.json';
function feedURL(){return String(DB.feedUrl||FEED_DEFAULT).trim()||FEED_DEFAULT}
function feedUsable(){
  var u=feedURL();
  if(/^https?:/i.test(u))return true;
  return location.protocol!=='file:';
}
function b64enc(str){
  var by=new TextEncoder().encode(str),o='';
  for(var i=0;i<by.length;i++)o+=String.fromCharCode(by[i]);
  return btoa(o).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(str){
  var t=String(str).replace(/-/g,'+').replace(/_/g,'/');
  while(t.length%4)t+='=';
  var bin=atob(t),a=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(a);
}
function downloadText(txt,name,mime){
  var b=new Blob([txt],{type:mime||'text/plain;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){try{URL.revokeObjectURL(a.href)}catch(e){};a.remove()},1500);
}
function applyFeed(data,fromUser){
  if(!data||!Array.isArray(data.sites)||!data.sites.length)return 0;
  var ver=String(data.ver||''),changed=0;
  /* 同一版本不重复合并；手动点「立即检查」时强制重算一次 */
  if(ver&&ver===DB.feedVer&&!fromUser)return 0;
  var drop=Array.isArray(data.drop)?data.drop:[];
  if(drop.length){
    var before=DB.sites.length;
    DB.sites=DB.sites.filter(function(x){return drop.indexOf(x.u)<0});
    changed+=before-DB.sites.length;
  }
  /* v4：被 drop 下架的地址，即使数据源里还留着也不能被合并回来 */
  var dropSet={};drop.forEach(function(u){dropSet[u]=1});
  var rm={};
  data.sites.forEach(function(x){if(x&&x.u&&!dropSet[x.u])rm[x.u+'|'+x.c]=x});
  var seen={};
  DB.sites.forEach(function(x,i){
    var k=x.u+'|'+x.c;seen[k]=1;
    var r=rm[k];
    if(r){DB.sites[i]=Object.assign({},x,r);changed++}
  });
  var gone=DB.gone||(DB.gone=[]);
  Object.keys(rm).forEach(function(k){
    if(!seen[k]&&gone.indexOf(rm[k].u)<0){DB.sites.push(Object.assign({},rm[k]));changed++}
  });
  if(typeof data.notice==='string')DB.feedNotice=data.notice;
  if(Array.isArray(data.pinned)&&data.pinned.length)DB.pinned=data.pinned.slice();
  if(Array.isArray(data.engines))DB.engines=data.engines.slice();
  if(data.picks&&data.picks.gem)DB.picks=data.picks;
  DB.feedVer=ver;DB.feedAt=Date.now();
  reindex();save();
  return changed;
}
function initFeed(fromUser){
  if(DB.feedOn===false&&!fromUser)return Promise.resolve(0);
  if(!feedUsable()){
    if(fromUser)toast('本机双击打开时，请填完整的 https:// 数据源地址');
    return Promise.resolve(0);
  }
  var u=feedURL(),sep=u.indexOf('?')>=0?'&':'?';
  /* 单位出口把某个 CDN 静默丢包时，不能让页面一直挂着：5 秒就放弃，回退内嵌数据 */
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=ctl?setTimeout(function(){try{ctl.abort()}catch(e){}},5000):null;
  var opt={cache:'no-store'};if(ctl)opt.signal=ctl.signal;
  return fetch(u+sep+'_='+Date.now(),opt)
    .then(function(r){if(timer)clearTimeout(timer);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(d){
      var k=applyFeed(d,fromUser);
      if(fromUser||k){
        if(S.view==='admin'&&S.adminTab==='sync')renderAdBody();
        else try{render()}catch(e){}
        toast(fromUser?('数据源已检查 · '+(k?'同步 '+k+' 条':'已是最新')):('站点已自动更新 · '+k+' 条'));
      }
      return k;
    })
    .catch(function(){
      if(timer)clearTimeout(timer);
      /* 断网 / 没放 JSON / 跨域 / 超时 —— 一律静默回退内嵌数据，不影响正常使用 */
      if(fromUser)toast('没取到数据源：检查网址、网络，或确认 sites.json 与页面在同一目录');
      return 0;
    });
}

    return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes());

    radius:DB.radius,density:DB.density,engines:DB.engines,engine:DB.engine,

function applyProfile(code){
  var c=String(code||'').trim();
  var m=c.match(/(?:^|[#&?])p=([A-Za-z0-9_\-]+)/);if(m)c=m[1];
  if(!c)throw new Error('空同步码');
  var p=JSON.parse(b64dec(c));
  if(!p||typeof p!=='object')throw new Error('同步码格式不对');
  ['fav','pinned','cats','theme','brand','radius','density','engines','engine','wxCity','feedUrl','hideOver','showFlows']
    .forEach(function(k){if(typeof p[k]!=='undefined')DB[k]=p[k]});
