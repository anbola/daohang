.catcard::after{height:3px!important;opacity:1!important}
.catcard .cc-h .cc-t{font-size:13.5px!important;font-weight:700!important}

/* 场景格 / 角色卡：蓝底图标，橙只留给"当前这个" */
.flow{
  border-radius:0!important;
  padding:12px 13px 13px!important;
}
.flow .fi{
  background:color-mix(in srgb,var(--fc,var(--sun)) 11%,transparent)!important;
  color:color-mix(in srgb,var(--fc,var(--sun)) 84%,var(--ink))!important;
}
.flow:hover{background:color-mix(in srgb,var(--fc,var(--sun)) 5%,var(--surface))!important}
.flow .ft{font-size:12.5px!important}

.role{border-radius:12px!important;box-shadow:none!important}
.role:hover{box-shadow:var(--sh-2)!important}
.role::before{background:var(--rc,var(--sun))!important}
.rl-t b{font-size:13px!important}
.rl-steps a{background:var(--surface-3)!important;border-color:var(--line-2)!important}
.rl-steps a:hover{
  background:color-mix(in srgb,var(--rc,var(--sun)) 11%,var(--surface))!important;
  border-color:color-mix(in srgb,var(--rc,var(--sun)) 26%,transparent)!important;
  color:color-mix(in srgb,var(--rc,var(--sun)) 78%,var(--ink))!important;
}

/* 内页：分类头、列表、筛选 */
.cat-head{border-bottom:1px solid var(--line)!important;padding-bottom:13px!important;margin-bottom:13px!important}
.cat-head h1{font-size:25px!important}
.chip{border-radius:6px!important}
.chip.on{background:var(--sun)!important;border-color:var(--sun)!important;color:#fff!important}
.chip:hover{background:var(--sun-soft)!important;border-color:var(--sun-soft-2)!important;color:var(--sun-2)!important}
.sgh i{background:var(--sun)!important}
.item{border-radius:9px!important;box-shadow:none!important}
.item:hover{border-color:var(--sun-soft-2)!important;box-shadow:var(--sh-2)!important}
.fav.on{color:var(--red)!important}

/* 页脚 */
.sign{letter-spacing:.06em;font-size:11px!important}
.sign::before{background:var(--line)!important}

/* --------------------------------------------------------------------------
   6. 中等 / 小屏：首屏还要更矮
   -------------------------------------------------------------------------- */
@media(max-width:1080px){
  .hero{grid-template-columns:minmax(0,1fr)!important;gap:14px!important;padding:16px 18px 46px!important}
  .wbcard{display:grid!important;grid-template-columns:1fr 1fr;gap:2px 8px!important;padding:11px 11px 8px!important}
  .wb-h{grid-column:1/-1;padding-bottom:7px!important;margin-bottom:2px!important}
  .hero-art{height:46px!important}
}
@media(max-width:640px){
  .main{padding:12px 14px 72px!important}
  .hero{padding:14px 14px 40px!important;border-radius:12px!important}
  .hero h1{font-size:21px!important}
  .hero p{font-size:12px!important;margin-bottom:10px!important}
  .hero-art{height:34px!important}
  .sec{margin-bottom:16px!important}
}

/* --------------------------------------------------------------------------
   7. 分类的四组标题：像书的章，不像后台的分区
   -------------------------------------------------------------------------- */
.cg-h{
  display:flex;align-items:baseline;gap:9px;
  margin:16px 0 8px;
  padding-bottom:5px;
  border-bottom:1px solid var(--line-2);
}
.cg-h:first-of-type{margin-top:2px}
.cg-h b{
  font-size:13px;font-weight:750;color:var(--ink);
  letter-spacing:.01em;
  position:relative;
  padding-left:10px;
}
.cg-h b::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:12px;border-radius:1px;background:var(--sun);
}
.cg-h span{font-size:11px;color:var(--ink-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-h i{font-size:10.5px;color:var(--ink-3);font-style:normal;font-family:var(--ff-num)}

/* 分类网格：三列或四列等宽，取消所有跨列，行高跟着内容走 */
.catgrid{
  grid-template-columns:repeat(auto-fit,minmax(268px,1fr))!important;
  grid-auto-rows:auto!important;
  gap:9px!important;
}
.catcard,.catcard.big{grid-column:auto!important}
.catcard{
  padding:13px 14px 12px!important;
  gap:11px!important;
}
.catcard.big{padding:13px 14px 12px!important}
.catcard .cc-ic{width:34px!important;height:34px!important;flex:0 0 34px!important;border-radius:9px!important}
.catcard .cc-ic svg{width:18px!important;height:18px!important}
.catcard .cc-n{font-size:13.5px!important}
.catcard.big .cc-n{font-size:13.5px!important}
.catcard .cc-d{font-size:11px!important;line-height:1.5!important;margin-top:2px!important}
.catcard .cc-tags{margin-top:7px!important;gap:4px!important}
.catcard .cc-tag{font-size:10px!important;padding:1px 6px!important}

/* 常用卡的星：默认是"淡到看不见的小标记"，指着这张卡才亮红。
   之前每张卡右上角都顶一颗红星星，像一排未读红点。 */
.pin .star{
  color:#BFC9D8!important;
  opacity:0!important;
  transition:opacity .14s,color .14s;
}
.pin:hover .star{opacity:.85!important}
.pin .star:hover{color:var(--red)!important;opacity:1!important}
@media (hover:none),(pointer:coarse){
  .pin .star{opacity:.3!important;color:#BFC9D8!important}
  .pin .star.on{opacity:.42!important;color:var(--red)!important}
}

/* 覆盖上一条（.star.on 的红色权重更高，得连它一起压） */
.pin .star,.pin .star.on{color:#C3CDDC!important;opacity:0!important}
.pin:hover .star,.pin:hover .star.on{opacity:.9!important;color:var(--red)!important}
@media (hover:none),(pointer:coarse){
  .pin .star,.pin .star.on{opacity:.32!important;color:#C3CDDC!important}
}


/* ==========================================================================
   8. 顶栏一行数据（原来是首屏里的一整块）
   --------------------------------------------------------------------------
   「464 个站点 / 348 个完全免费 / 17 个分类 / 收藏 / 0 元花费」——这些是
   佐证，不是主角。放顶栏和站名并排，首屏就腾出来了。
   ========================================================================== */
.top-stats{
  display:flex;align-items:center;gap:11px;
  margin-left:13px;padding-left:14px;
  border-left:1px solid var(--line);
  font-size:11.5px;line-height:1;
  color:var(--ink-3);
  white-space:nowrap;overflow:hidden;
  min-width:0;
}
.top-stats .ts{
  display:inline-flex;align-items:baseline;gap:3px;
  color:var(--ink-3);text-decoration:none;transition:color .14s;
}
.top-stats .ts b{
  font-family:var(--ff-num);font-size:12.5px;font-weight:750;
  color:var(--ink-2);letter-spacing:-.01em;
}
.top-stats .ts-free b{color:var(--dan)}
.top-stats .ts-cat b{color:var(--sun)}
.top-stats .ts-fav b{color:var(--red)}
.top-stats .ts:hover{color:var(--ink-2)}
.top-stats .ts:hover b{text-decoration:underline;text-underline-offset:3px}

/* 空间不够时从右往左退，先撤"0 元花费"，再撤收藏，绝不换行 */
@media(max-width:1180px){.top-stats .ts-zero{display:none}}
@media(max-width:1040px){.top-stats .ts-fav{display:none}}
@media(max-width:940px){.top-stats{display:none}}

/* ==========================================================================
   9. 搜索条：两行压成一条 38px，搜索源用品牌色
   ========================================================================== */
.sbar{
  display:flex;align-items:center;
  width:100%;max-width:600px;height:38px;
  padding:0 4px 0 5px;
  border:1px solid var(--line);border-radius:10px;
  background:var(--surface);
  box-shadow:0 1px 2px rgba(18,32,54,.045);
  transition:border-color .16s,box-shadow .18s;
}
.sbar:hover{border-color:color-mix(in srgb,var(--sc) 26%,var(--line))}
.sbar:focus-within{
  border-color:var(--sc);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 12%,transparent);
}
.sebar{
  display:flex;align-items:center;gap:2px;
  flex:0 0 auto;overflow:hidden;
  max-width:min(56%,300px);
}
.se{
  display:inline-flex;align-items:center;gap:4px;
  height:24px;padding:0 7px;
  border:0;border-radius:6px;background:transparent;
  color:var(--ink-3);font-family:inherit;font-size:11px;font-weight:600;
  white-space:nowrap;cursor:pointer;flex:0 0 auto;
  transition:background .14s,color .14s,box-shadow .14s;
}
.se i{
  width:5px;height:5px;border-radius:50%;flex:0 0 5px;
  background:var(--k,#2C63D6);opacity:.9;
}
.se:hover{
  background:color-mix(in srgb,var(--k,#2C63D6) 11%,transparent);
  color:color-mix(in srgb,var(--k,#2C63D6) 80%,var(--ink));
}
.se.on{
  background:var(--k,#2C63D6);color:#fff;
  box-shadow:0 1px 5px -1px color-mix(in srgb,var(--k,#2C63D6) 60%,transparent);
}
.se.on i{background:#fff;opacity:.95}
.se.on:hover{background:var(--k,#2C63D6);color:#fff}
.se-more{
  width:20px;height:20px;flex:0 0 20px;
  display:inline-grid;place-items:center;padding:0;
  border:0;border-radius:5px;background:transparent;
  color:var(--ink-3);opacity:.55;cursor:pointer;transition:.14s;
}
.se-more:hover{opacity:1;background:var(--surface-3);color:var(--ink-2)}
.se-more svg{width:12px;height:12px}

.sbar-div{
  width:1px;height:16px;flex:0 0 1px;
  background:var(--line);margin:0 5px;
}
.sbar input{
  flex:1 1 auto;min-width:0;width:100%;height:100%;
  border:0;border-radius:0;background:transparent;outline:0;
  padding:0 2px;font-family:inherit;font-size:13px;color:var(--ink);
}
.sbar input:focus{border:0;box-shadow:none;outline:0}
.sbar input::placeholder{color:var(--ink-3);font-size:12.5px}
.sbar input::-webkit-search-cancel-button,
.sbar input::-webkit-search-decoration{-webkit-appearance:none;display:none}

.sbar-clr{
  display:none;width:20px;height:20px;flex:0 0 20px;margin-right:2px;
  align-items:center;justify-content:center;padding:0;
  border:0;border-radius:50%;background:var(--surface-3);
  color:var(--ink-3);cursor:pointer;
}
.sbar.val .sbar-clr{display:inline-grid}
.sbar-clr:hover{background:var(--line);color:var(--ink-2)}
.sbar-clr svg{width:10px;height:10px}

.sbar-go{
  display:inline-flex;align-items:center;gap:4px;
  height:30px;flex:0 0 auto;padding:0 11px;
  border:0;border-radius:7px;cursor:pointer;
  background:var(--sc,#2C63D6);color:#fff;
  font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.02em;
  box-shadow:0 2px 7px -3px color-mix(in srgb,var(--sc,#2C63D6) 75%,transparent);
  transition:filter .14s,transform .1s;
}
.sbar-go svg{width:13px;height:13px;stroke-width:2.1}
.sbar-go:hover{filter:brightness(1.08)}
.sbar-go:active{transform:translateY(.5px)}

/* 窄屏：未选中的搜索源只留一个色点，省出来的宽度全给输入框 */
@media(max-width:520px){
  .sbar{height:36px;max-width:none}
  .se{padding:0 6px}
  .se:not(.on) span{display:none}
  .se:not(.on){width:20px;justify-content:center;padding:0}
  .sbar-go span{display:none}
  .sbar-go{padding:0 9px}
}

/* ==========================================================================
   10. 首屏再压一截：标题一行、副题一行、搜索一条
   ========================================================================== */
.hero{
  padding:13px 20px 46px!important;
  gap:20px!important;
  margin-bottom:14px!important;
}
.hero-art{height:46px!important;opacity:.85!important}
.hero h1{
  font-size:clamp(19px,1.82vw,25px)!important;
  line-height:1.22!important;
  margin:0 0 5px!important;
}
.hero p{
  font-size:12px!important;
  line-height:1.6!important;
  margin:0 0 11px!important;
  max-width:46em!important;
}
[data-theme="dark"] .sbar{background:#182534;border-color:var(--line)}
[data-theme="dark"] .se.on{color:#fff}

/* ==========================================================================
   11. 收口：首屏再矮一截，搜索源再清楚一点
   --------------------------------------------------------------------------
   这一版的目标只有一个：第一屏尽可能多地露出来。
   首屏每多 20px，用户就多滚一次。
   ========================================================================== */
.hero{
  padding:11px 18px 26px!important;
  gap:18px!important;
  grid-template-columns:minmax(0,1fr) 286px!important;
}
.hero-art{height:34px!important;opacity:.8!important}
.hero-l{padding-top:1px}

/* 右栏工作台卡：三个条目压成两行字，别再撑高首屏 */
.wbcard{padding:11px 11px 8px!important}
.wb-h{
  font-size:11px!important;
  padding-bottom:7px!important;
  margin-bottom:3px!important;
}
.wb-i{padding:8px 8px!important;gap:9px!important;border-radius:8px!important}
.wb-ic{width:26px!important;height:26px!important;flex:0 0 26px!important;border-radius:7px!important}
.wb-ic svg{width:14px!important;height:14px!important}
.wb-tx b{font-size:12px!important;line-height:1.25!important}
.wb-tx i{
  font-size:10px!important;line-height:1.35!important;margin-top:1px!important;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}

/* 搜索条：短一点，别把左栏填满 */
.sbar{max-width:520px}
.se{gap:5px;font-size:11.5px;height:25px;padding:0 8px}
.se i{width:6px;height:6px;flex:0 0 6px}
.sebar{gap:3px}
.sbar-div{background:color-mix(in srgb,var(--ink-3) 30%,transparent);height:15px;margin:0 6px}
.sbar input{font-size:13px}

/* 顶栏数据行：离站名稍远一点，别像粘在徽标上 */
.top-stats{margin-left:18px;padding-left:18px;gap:12px}
.top-stats .ts{gap:2px}

@media(max-width:1080px){
  .hero{padding:10px 16px 22px!important;grid-template-columns:minmax(0,1fr)!important;gap:12px!important}
  .hero-art{height:28px!important}
}

/* 12. 搜索条长度回到 620：520 太短，输入框被挤，右边反而空一大块 */
.sbar{max-width:620px}
.hero{padding-bottom:20px!important}
.hero-art{height:30px!important;opacity:.72!important}
.wbcard{align-self:center!important;height:auto!important}

/* 13. 首屏两栏顶对齐：卡片不再居中悬空，跟着标题起 */
.hero{align-items:start!important}
.wbcard{align-self:start!important}

/* ==========================================================================
   14. 手机：搜索条与工作台卡重排
   --------------------------------------------------------------------------
   390 宽时原来的问题：搜索源占掉一半宽度，输入框只剩 100px；
   工作台卡被 1080 断点的两列规则切成两半，第二条直接看不见。
   ========================================================================== */
@media(max-width:640px){
  /* 工作台卡回到上下两条，去掉描述只留标题 —— 手机上点的是"哪个"，不是"干嘛的" */
  .wbcard{display:block!important;padding:10px 10px 7px!important}
  .wb-h{padding-bottom:6px!important;margin-bottom:2px!important}
  .wb-i{padding:9px 8px!important;border-radius:8px!important}
  .wb-tx i{display:none!important}
  .wb-tx b{font-size:12.5px!important}
}

@media(max-width:520px){
  .sbar{height:38px;padding:0 3px 0 4px;max-width:none}
  .sebar{max-width:none;overflow:visible;gap:1px;flex:0 0 auto}
  .se{
    height:23px;padding:0 5px;gap:3px;font-size:10.5px;
    letter-spacing:-.01em;
  }
  .se i{width:5px;height:5px;flex:0 0 5px}
  .se-more{display:none}
  .sbar-div{margin:0 3px;height:14px}
  .sbar input{font-size:12.5px;padding:0}
  .sbar input::placeholder{font-size:11.5px}
  .sbar-go{padding:0 8px;height:30px}
  .sbar-go span{display:none}
}

/* 15. 手机上搜索源仍要看得见名字：缩小而不是砍掉 */
@media(max-width:520px){
  .se:not(.on) span{display:inline!important}
  .se:not(.on){width:auto!important;justify-content:flex-start;padding:0 4px!important}
  .se{font-size:10px!important;gap:2px!important;padding:0 4px!important;height:22px}
  .se i{width:4px!important;height:4px!important;flex:0 0 4px!important}
  .sbar input{min-width:0!important}
}

/* 16. 手机上换行：搜索源单独一行（可横滑），输入框拿满第二行
       —— 390 宽塞不下"四个引擎名 + 输入框 + 按钮"，硬塞的结果是每样都不能用 */
@media(max-width:520px){
  .sbar{
    display:flex;flex-wrap:wrap;align-items:center;
    height:auto!important;padding:5px!important;gap:3px;
    max-width:none!important;
  }
  .sebar{
    order:1;flex:0 0 100%;width:100%;max-width:none!important;
    overflow-x:auto;overflow-y:hidden;gap:2px;padding:0 0 2px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .sebar::-webkit-scrollbar{display:none}
  .sebar .se{
    flex:0 0 auto!important;height:22px!important;font-size:10.5px!important;
    padding:0 7px!important;gap:3px!important;
  }
  .sbar-div{display:none!important}
  .sbar input{
    order:2;flex:1 1 0;min-width:0;height:30px;
    font-size:13px!important;padding:0 3px!important;
  }
  .sbar input::placeholder{font-size:12px}
  .sbar-clr{order:3;width:22px;height:22px;flex:0 0 22px}
  .sbar-go{order:4;height:30px!important;padding:0 10px!important;flex:0 0 auto}
  .sbar-go span{display:inline!important}
  .sbar-go svg{width:12px;height:12px}
}

/* 17. 单列断点（≤1080）：搜索条与工作台卡都铺满，别只占左边一半 */
@media(max-width:1080px){
  .sbar{max-width:none!important}
  .hero .wbcard{max-width:none!important;width:100%}
}

/* 18. 深色下搜索条比首屏底色亮一档，像浮起来的输入位，不是凹进去的洞 */
[data-theme="dark"] .sbar{
  background:#1A2635!important;
  border-color:#283A50!important;
  box-shadow:0 1px 2px rgba(0,0,0,.25)!important;
}
[data-theme="dark"] .sbar-div{background:#31435A!important}
[data-theme="dark"] .se{color:#8194AA!important}
[data-theme="dark"] .se:hover{color:#C6D8F5!important}
[data-theme="dark"] .se.on{color:#fff!important}
[data-theme="dark"] .sbar input{color:#E8EEF8!important}

/* 19. 搜索源每个都带自己的淡色底 —— 四种颜色一眼分清，比"灰字 + 小色点"直白 */
.se{
  background:color-mix(in srgb,var(--k,#2C63D6) 8%,transparent)!important;
  color:color-mix(in srgb,var(--k,#2C63D6) 76%,var(--ink))!important;
}
.se:hover{
  background:color-mix(in srgb,var(--k,#2C63D6) 16%,transparent)!important;
  color:color-mix(in srgb,var(--k,#2C63D6) 88%,var(--ink))!important;
}
.se.on{
  background:var(--k,#2C63D6)!important;
  color:#fff!important;
}
.se i{background:var(--k,#2C63D6)!important;opacity:.75!important}
.se.on i{background:#fff!important;opacity:.95!important}
[data-theme="dark"] .se{
  background:color-mix(in srgb,var(--k,#5B8DEF) 15%,transparent)!important;
  color:color-mix(in srgb,var(--k,#5B8DEF) 62%,#DCE7F5)!important;
}
[data-theme="dark"] .se.on{background:var(--k)!important;color:#fff!important}

/* ==========================================================================
   v25 ·「左蓝右白」
   --------------------------------------------------------------------------
   为什么这一版：v24 把整页都刷成浅蓝白，左右完全分不开 —— 看起来像一张
   没画完的稿纸。导航站的信息密度本来就高，左右必须有明确的"分区"。

   这一版只做一件事，但做透：**左边一整块夜蓝，右边浅冷白**。
     · 左栏是"书脊"：深蓝底、图标坐在各自分类色的半透明方块上，
       选中的那一条是一块亮蓝；
     · 右区是"桌面"：冷白 #F1F5FB，卡片纯白浮起来；
     · 深色模式下左栏更黑更沉，右区灰蓝，靠一条亮边分开，不靠亮色块。

   色板
     夜蓝  #123A6B → #0B2547（侧栏渐变，上浅下深，像天光落在书脊上）
     亮蓝  #2E6BE6（选中块）
     冷白  #F1F5FB（右区底）
     纸白  #FFFFFF（卡片）
     暖橙  #D9711F（点睛，只用于"必备"与提示）
   ========================================================================== */

:root{
  --rail-a:#123A6B;
  --rail-b:#0B2547;
  --rail-c:#091D38;
  --rail-tx:#D9E5F6;
  --rail-tx2:#A6BDDA;
  --rail-tx3:#7B95B8;
  --rail-hover:rgba(255,255,255,.075);
  --rail-on:#2E6BE6;
  --rail-line2:rgba(255,255,255,.10);
  --canvas:#F1F5FB;
}
html:not([data-theme="dark"]){--bg:#F1F5FB;--bg-2:#E7EEF9;--rail-line:#DCE6F4}

/* --------------------------------------------------------------------------
   1. 左栏：一整块夜蓝
   -------------------------------------------------------------------------- */
body:not(.admin) .side{
  background:
    radial-gradient(120% 46% at 24% -6%,rgba(96,148,236,.42) 0%,rgba(96,148,236,0) 62%),
    linear-gradient(180deg,var(--rail-a) 0%,var(--rail-b) 52%,var(--rail-c) 100%)!important;
  border-right:1px solid rgba(255,255,255,.07)!important;
  border-radius:0 16px 16px 0!important;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.05),
             14px 0 34px -30px rgba(9,29,56,.9)!important;
  padding-top:14px!important;
}
body:not(.admin) .side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16)!important}
body:not(.admin) .side::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.30)!important}

/* 组标题：像书脊上的烫银小字 */
.side .grp-t{
  color:var(--rail-tx3)!important;
  font-size:10px!important;
  letter-spacing:.16em!important;
  padding:0 12px!important;
  margin:6px 0 7px!important;
}

/* 导航项 */
.side .nav-i{
  color:var(--rail-tx2)!important;
  height:40px!important;
  border-radius:9px!important;
  gap:9px!important;
  padding:0 10px!important;
}
.side .nav-i .n{color:inherit!important}
.side .nav-i .c{
  color:var(--rail-tx3)!important;
  opacity:1!important;
  font-weight:600!important;
  min-width:20px;
  text-align:right;
}
/* 图标坐在分类色的半透明方块里 —— 深蓝底上也能一眼认出来 */
.side .nav-i .nv-ic{
  width:26px!important;height:26px!important;flex:0 0 26px!important;
  border-radius:7px!important;
  display:inline-flex!important;align-items:center!important;justify-content:center!important;
  background:color-mix(in srgb,var(--kc,#4E8BF0) 36%,rgba(255,255,255,.09))!important;
  color:color-mix(in srgb,var(--kc,#4E8BF0) 22%,#fff)!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  transition:background .16s var(--ease),color .16s var(--ease)!important;
}
.side .nav-i .nv-ic svg{width:15px!important;height:15px!important}

.side .nav-i:not(.on):hover{background:var(--rail-hover)!important;color:#fff!important}
.side .nav-i:not(.on):hover .nv-ic{
  background:color-mix(in srgb,var(--kc,#4E8BF0) 48%,transparent)!important;
  color:#fff!important;
}
.side .nav-i:not(.on):hover .c{color:rgba(255,255,255,.6)!important}

/* 选中：亮蓝实心（背景块由 .nav-pill 负责，保留滑动动画） */
.side .nav-pill{
  background:linear-gradient(90deg,#2E6BE6,#2A5DD3)!important;
  border-radius:9px!important;
  box-shadow:0 8px 18px -10px rgba(0,0,0,.85),
             inset 0 1px 0 rgba(255,255,255,.22)!important;
}
.side .nav-i.on,.side .nav-i.on:hover{
  background:transparent!important;
  color:#fff!important;
  box-shadow:none!important;
}
.side .nav-i.on .n{color:#fff!important;font-weight:650!important}
.side .nav-i.on .c{color:rgba(255,255,255,.78)!important}
.side .nav-i.on .nv-ic{background:rgba(255,255,255,.18)!important;color:#fff!important;box-shadow:none!important}
.side .nav-i.on .nv-ic svg{opacity:1}

/* 拖动手柄：只在 hover 时露一点 */
.side .drag-h{color:rgba(255,255,255,.3)!important}
.side .nav-i.on .drag-h{color:rgba(255,255,255,.65)!important}

.side .nav-sep{background:var(--rail-line2)!important;margin:12px 12px!important}

/* 底部提示条 */
.side .nav-tip{
  background:rgba(255,255,255,.055)!important;
  border:1px solid rgba(255,255,255,.09)!important;
  color:#93A9C6!important;
  border-radius:10px!important;
}
.side .nav-tip b{color:#FFC46B!important}
.side .nav-tip kbd{
  background:rgba(255,255,255,.12)!important;
  border-color:rgba(255,255,255,.16)!important;
  color:#CFDDEF!important;
}

/* --------------------------------------------------------------------------
   2. 深色模式：左栏更沉，右区灰蓝，靠亮边分开
   -------------------------------------------------------------------------- */
[data-theme="dark"] body:not(.admin) .side{
  background:
    radial-gradient(120% 46% at 24% -6%,rgba(74,124,206,.34) 0%,rgba(74,124,206,0) 62%),
    linear-gradient(180deg,#17406F 0%,#123257 56%,#0E2A4B 100%)!important;
  border-right:1px solid rgba(255,255,255,.10)!important;
}
[data-theme="dark"] body:not(.admin){background:#0A111B!important}
[data-theme="dark"] body:not(.admin) .main{border-left:0;background:#0A111B!important}
[data-theme="dark"] body .side .nav-pill{
  background:linear-gradient(90deg,#3D7BE8,#2F66D2)!important;
}

/* --------------------------------------------------------------------------
   3. 右区：冷白桌面
   -------------------------------------------------------------------------- */
.main{padding:18px 28px 84px!important}

/* --------------------------------------------------------------------------
   4.「必备」角标：暖橙描边，只在必须装的那一条上出现
   -------------------------------------------------------------------------- */
.item .nm .must{
  display:inline-block;
  margin-left:6px;
  padding:1px 5px;
  border-radius:4px;
  font-size:10px;
  font-weight:800;
  font-style:normal;
  letter-spacing:.04em;
  color:#B4560F;
  background:rgba(217,113,31,.12);
  box-shadow:inset 0 0 0 1px rgba(217,113,31,.28);
  vertical-align:1.5px;
}
[data-theme="dark"] .item .nm .must{color:#F3A35C;background:rgba(217,113,31,.18)}

/* --------------------------------------------------------------------------
   5. 装机必备页顶的整包按钮（蓝奏云合集）
   -------------------------------------------------------------------------- */
.bundle{
  display:flex;
  align-items:center;
  gap:14px;
  margin:14px 0 4px;
  padding:15px 18px;
  border-radius:14px;
  color:#fff;
  background:
    radial-gradient(120% 160% at 8% 0%,rgba(120,170,255,.55) 0%,rgba(120,170,255,0) 58%),
    linear-gradient(105deg,#173E74 0%,#13325E 46%,#0E2A50 100%);
  box-shadow:0 14px 30px -20px rgba(13,40,78,.85),inset 0 1px 0 rgba(255,255,255,.14);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
}
.bundle:hover{transform:translateY(-1px);box-shadow:0 20px 38px -22px rgba(13,40,78,.95),inset 0 1px 0 rgba(255,255,255,.18)}
.bundle .bn-ic{
  width:40px;height:40px;flex:0 0 40px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.14);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
}
.bundle .bn-ic svg{width:20px;height:20px;color:#FFD9A8}
.bundle .bn-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bundle .bn-tx b{font-size:15px;font-weight:750;letter-spacing:.01em}
.bundle .bn-tx i{
  font-style:normal;font-size:12px;color:rgba(255,255,255,.68);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bundle .bn-pw{
  font-size:11.5px;color:rgba(255,255,255,.62);
  padding:5px 9px;border-radius:7px;
  background:rgba(255,255,255,.09);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  white-space:nowrap;
}
.bundle .bn-pw b{color:#FFD9A8;font-weight:800;letter-spacing:.06em}
.bundle .bn-go{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12.5px;font-weight:700;color:#0E2A50;
  background:#fff;border-radius:8px;padding:7px 12px;
  white-space:nowrap;
}
.bundle .bn-ar{width:13px;height:13px}
@media (max-width:720px){
  .bundle{
    display:grid;
    grid-template-columns:38px minmax(0,1fr) auto;
    gap:8px 12px;
    padding:14px;
  }
  .bundle .bn-ic{grid-area:1/1/2/2;width:38px;height:38px;flex:none}
  .bundle .bn-tx{display:contents}
  .bundle .bn-tx b{grid-area:1/2/2/4;align-self:center;font-size:14.5px;line-height:1.35}
  .bundle .bn-tx i{
    grid-area:2/1/3/4;
    font-size:11.5px;line-height:1.5;
    white-space:normal;
    color:rgba(255,255,255,.72);
  }
  .bundle .bn-pw{grid-area:3/2/4/3;justify-self:start;font-size:11px;padding:4px 8px}
  .bundle .bn-go{grid-area:3/3/4/4;justify-self:end;font-size:12px;padding:6px 11px}
}

/* --------------------------------------------------------------------------
   6. 手机上左栏变抽屉：同样是一整块夜蓝
   -------------------------------------------------------------------------- */
@media (max-width:960px){
  body:not(.admin) .side{
    border-radius:0 18px 18px 0!important;
    box-shadow:22px 0 60px -30px rgba(6,18,36,.9)!important;
  }
}

/* --------------------------------------------------------------------------
   7. 顶栏接进同一块夜蓝：左栏 + 顶栏 = 一整块 L 形画框
   -------------------------------------------------------------------------- */
body:not(.admin) .top,
body:not(.admin) .top.stuck{
  background:
    radial-gradient(90% 220% at 6% 0%,rgba(96,148,236,.26) 0%,rgba(96,148,236,0) 62%),
    linear-gradient(180deg,#123A6B 0%,#0F3059 100%)!important;
  border-bottom:1px solid rgba(255,255,255,.09)!important;
  box-shadow:0 8px 24px -22px rgba(9,29,56,.95)!important;
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
}
body:not(.admin) .brand{color:#fff!important}
body:not(.admin) .brand .mark{
  background:linear-gradient(150deg,#3D7BEE 0%,#1E4EA8 100%)!important;
  box-shadow:0 4px 12px -6px rgba(61,123,238,.9),inset 0 0 0 1px rgba(255,255,255,.16)!important;
}
body:not(.admin) .brand small{
  color:#A9C1DE!important;
  border-color:rgba(255,255,255,.16)!important;
  background:rgba(255,255,255,.06);
}
body:not(.admin) .top-stats{color:#9FB7D4!important;border-left-color:rgba(255,255,255,.12)!important}
body:not(.admin) .top-stats .ts{color:#9FB7D4!important}
body:not(.admin) .top-stats .ts b{color:#EAF2FE!important}
body:not(.admin) .top-stats .ts-free b{color:#FFC46B!important}
body:not(.admin) .top-stats .ts-cat b{color:#9DC4FF!important}
body:not(.admin) .top-stats .ts-fav b{color:#FF9C8C!important}
body:not(.admin) .top-stats .ts:hover{color:#fff!important}

body:not(.admin) .tbtn{color:#B6CAE2!important}
body:not(.admin) .tbtn:hover{background:rgba(255,255,255,.10)!important;color:#fff!important}
body:not(.admin) .tbtn .cnt{box-shadow:0 0 0 2px #0F3059!important}

body:not(.admin) .wt{
  background:rgba(255,255,255,.055)!important;
  border:1px solid rgba(255,255,255,.10)!important;
  color:#C3D6EC!important;
}
body:not(.admin) .wt:hover{background:rgba(255,255,255,.10)!important;border-color:rgba(255,255,255,.18)!important}
body:not(.admin) .wt-date{color:#B6CAE2!important}
body:not(.admin) .wt-clk{color:#fff!important}
body:not(.admin) .wt-sep{background:rgba(255,255,255,.16)!important}
body:not(.admin) .wt-wx{color:#C3D6EC!important}
body:not(.admin) .wt-off{color:#8FA6C2!important}
body:not(.admin) .wt-sec{background:rgba(255,196,107,.16)!important;color:#FFC46B!important}

/* 顶栏与左栏的交界：把圆角抹平，连成一整块 */
body:not(.admin) .side{border-top-left-radius:0;border-top-right-radius:0}

/* --------------------------------------------------------------------------
   8. 装机必备：分组前的序号是「安装顺序」，不是装饰
   -------------------------------------------------------------------------- */
.cat-install .sublist{counter-reset:istep}
.cat-install .sublist .sgroup{counter-increment:istep}
.cat-install .sgh b::before{
  content:counter(istep,decimal-leading-zero);
  display:inline-block;
  margin-right:7px;
  padding:1px 5px;
  border-radius:4px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.06em;
  color:#1D4F91;
  background:rgba(29,79,145,.09);
  box-shadow:inset 0 0 0 1px rgba(29,79,145,.14);
  vertical-align:1.5px;
  font-variant-numeric:tabular-nums;
}
[data-theme="dark"] .cat-install .sgh b::before{
  color:#9DC4FF;
  background:rgba(120,170,255,.14);
  box-shadow:inset 0 0 0 1px rgba(120,170,255,.22);
}
/* 序号之后把「按这个顺序装」写进分组标题右端 */
.cat-install .sgh span{font-variant-numeric:tabular-nums}
@media (max-width:520px){
  .cat-install .sgh b::before{margin-right:6px}
}

/* 欢迎 / 首次使用引导（对应班务通「打开先导入」的思路，但只在第一次，之后全自动） */
.ob{padding:4px}
.ob-h{font-size:16px;font-weight:800;letter-spacing:-.3px;margin:0 0 10px}
.ob-p{font-size:13px;color:var(--ink-2);line-height:1.7;margin:0 0 18px}
.ob-p strong{color:var(--brand-ink);font-weight:700}
.ob-row{display:flex;gap:10px;justify-content:flex-end}

/* ================= v2 · 数据源公告 / 同步面板 ================= */
.feed-note{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:10px 14px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--brand) 32%,var(--line));background:var(--brand-soft);
  color:var(--ink-2);font-size:13px;line-height:1.65}
.feed-note .fn-ic{width:18px;height:18px;flex:none;color:var(--brand-ink)}
.feed-note .fn-ic svg{width:18px;height:18px}
.feed-note .fn-tx{flex:1;min-width:0}
.feed-note .fn-x{width:24px;height:24px;flex:none;border-radius:7px;color:var(--ink-3);font-size:17px;line-height:1}
.feed-note .fn-x:hover{background:var(--surface-3);color:var(--ink)}
.sync-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.sync-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}
.sync-card h3{margin:0 0 6px;font-size:14px;font-weight:800;color:var(--ink)}
.sync-card .sd{margin:0 0 12px;font-size:12px;color:var(--ink-3);line-height:1.7}
.sync-card code{background:var(--surface-3);padding:1px 5px;border-radius:4px;font-size:11px;color:var(--brand-ink)}
.sync-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:9px 0}
.sync-row .inp{flex:1;min-width:190px}
.sync-kv{display:flex;gap:8px;font-size:12px;color:var(--ink-2);margin:6px 0}
.sync-kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.sync-code{width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;background:var(--surface-2);color:var(--ink-2);font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.sync-tip{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--surface-3);font-size:11.5px;line-height:1.75;color:var(--ink-3)}
.sync-tip b{color:var(--ink-2)}

/* ---------- 画布与底纹 ---------- */

  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif!important;
  letter-spacing:.006em;-webkit-font-smoothing:antialiased}
html[data-pal] .main{position:relative;isolation:isolate;
  background:var(--v4-bg)!important;
  background-image:
    radial-gradient(1100px 520px at 12% -8%,var(--v4-glow),transparent 68%),
    radial-gradient(900px 460px at 92% -4%,var(--v4-glow2),transparent 66%)!important}
html[data-pal] .wrap{background:transparent!important}
html[data-pal] .cont{position:relative;z-index:1}
/* 纯 CSS 纹理：只在卡片之间的空白透出，正文一律实色底 */
html[data-pal] .bg-art{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:var(--v4-art);background-size:cover;background-position:center 18%;
  background-attachment:fixed;
  opacity:calc(var(--v4-artop) * var(--v4-artop-mult));
  filter:saturate(.72) contrast(.97);mix-blend-mode:multiply;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 26%,rgba(0,0,0,.30) 74%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 26%,rgba(0,0,0,.30) 74%,transparent 100%);
  transition:opacity .45s var(--v4-ease)}
html[data-theme="dark"][data-pal] .bg-art,html[data-pal="night"] .bg-art{
  mix-blend-mode:screen;filter:saturate(.58) brightness(.86)}
html[data-pal] body.art-off .bg-art{display:none!important}
/* 极细网格：Hero Patterns 思路，纯 CSS，不加载任何图 */
html[data-pal] .bg-grid{
  position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.30;
  background-image:linear-gradient(to right,var(--v4-line) 1px,transparent 1px),
                   linear-gradient(to bottom,var(--v4-line) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:linear-gradient(180deg,#000 0,transparent 620px);
  mask-image:linear-gradient(180deg,#000 0,transparent 620px)}
html[data-theme="dark"][data-pal] .bg-grid{opacity:.13}
/* ---------- 顶栏 ---------- */
html[data-pal] .top{background:var(--v4-top)!important;
  border-bottom:1px solid var(--v4-line)!important;
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset!important}

html[data-pal] .brand .mark{border-radius:10px!important;
  background:linear-gradient(140deg,var(--brand),color-mix(in srgb,var(--brand) 55%,var(--accent)))!important;
  box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 70%,transparent)!important}

html[data-pal] .tbtn:hover{background:var(--v4-surface3,var(--surface-3))!important}
/* ---------- 左栏 ---------- */

  background:radial-gradient(120% 46% at 24% -6%,var(--v4-glow2),transparent 64%),
    linear-gradient(180deg,var(--v4-rail1) 0%,var(--v4-rail2) 52%,var(--v4-rail3) 100%)!important;
  border-right:1px solid var(--v4-railline)!important;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.05),14px 0 34px -30px rgba(9,29,56,.85)!important}

  isolation:isolate;overflow:hidden;

             0 2px 5px rgba(20,26,36,.035),
             0 26px 52px -32px var(--v4-shadow)!important}

ar(--sub);margin-top:2px}\n  .today{\n    display:flex;align-items:baseline;gap:8px;background:var(--panel);\n    border:1px solid var(--line);border-radius:999px;padding:10px 18px;\n  }\n  .today b{font-size:24px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}\n  .today span{font-size:12px;color:var(--sub)}\n\n  /* ---------- Tabs ---------- */\n  nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;margin-bottom:6px;scrollbar-width:none}\n  nav.tabs::-webkit-scrollbar{display:none}\n  .tab{\n    flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--sub);\n    padding:9px 16px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap;\n    transition:all .18s ease;font-weight:600;\n  }\n  .tab:hover{color:var(--txt);border-color:var(--line2);transform:translateY(-1px)}\n  .tab.active{background:var(--grad);color:#04121a;border-color:transparent;box-shadow:0 6px 18px rgba(62,230,176,.28)}\n\n  /* ---------- 通用 ---------- */\n  .view{animation:fade .32s ease}\n  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n  .sec-title{display:flex;align-items:center;gap:10px;margin:22px 0 14px}\n  .sec-title h2{font-size:16px;font-weight:800;letter-spacing:.3px}\n  .sec-title .hint{font-size:12px;color:var(--dim);font-weight:400}\n  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:all .2s ease}\n  .card:hover{border-color:var(--line2)}\n  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}\n  .btn{\n    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);\n    color:var(--txt);padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;\n    transition:all .16s ease;font-family:inherit;\n  }\n  .btn:hover{background:var(--panel3);transform:translateY(-1px)}\n  .btn-prim \n];\n\n/* ===================== 状态与工具 ===================== */\nconst KEY='avw_v1';\nfunction normState(s){\n  s=s||{};\n  s.usage=s.usage||{};s.tasks=s.tasks||[];s.compares=s.compares||[];s.custom=s.custom||[];\n  s.tab=s.tab||'home';s.scene=s.scene||'renwu';s.pcat=s.pcat||'全部';\n  s.dir=s.dir||{topic:'',type:'chanpin',style:'film',ratio:'9:16',sub:''};\n  s.projects=s.projects||[];\n  s.cur=s.cur||null;\n  s.assets=s.assets||{};\n  s.folder=s.folder||{name:'',at:0};\n  s.logins=s.logins||{};\n  s.api=s.api||{provider:'ark',key:'',endpoint:'',mode:'mock'};\n  s.projects.forEach(function(p){\n    p.shots=p.shots||[];\n    p.imgPlat=p.imgPlat||'doubao';\n    p.shots.forEach(function(sh,i){\n      sh.id=sh.id||uid();\n      sh.no=sh.no||i+1;\n      sh.status=sh.status||'idea';\n      sh.ver=sh.ver||1;\n    });\n  });\n  return s;\n}\nlet state=(function(){\n  try{\n    const s=JSON.parse(localStorage.getItem(KEY));\n    if(s&&typeof s==='object')return normState(s);\n  }catch(e){}\n  return normState({tab:'home',scene:'renwu',pcat:'全部',\n    dir:{topic:'',type:'chanpin',style:'film',ratio:'9:16',sub:''}});\n})();\n\n/* ---- 文件句柄持久化（IndexedDB，不能进 localStorage） ---- */\nfunction idbOpen(){\n  return new Promise(function(res,rej){\n    const r=indexedDB.open('avw_fs',1);\n    r.onupgradeneeded=function(){r.result.createObjectStore('h');};\n    r.onsuccess=function(){res(r.result);};\n    r.onerror=function(){rej(r.error);};\n  });\n}\nfunction idbSet(k,v){return idbOpen().then(function(db){return new Promise(function(res,rej){\n  const tx=db.transaction('h','readwrite');tx.objectStore('h').put(v,k);\n  tx.oncomplete=function(){res(true);};tx.onerror=function(){rej(tx.error);};\n});});}\nfunction idbGet(k){return idbOpen().then(function(db){return new Promise(function(res){\n  const tx=db.transaction('h','readonly');const rq=tx.objectStore('h').get(k);\n  rq.onsuccess=function(){res(rq.result||null);};rq.onerror=function(){res(null);};\n});});}\n\n/* ---- 运行时文件缓存（objectURL 不能持久化，刷新后重扫） ---- */\nconst FILEURL={};\nconst FILEBLOB={};\nlet DIRHANDLE=null;\n\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}\nfunction todayStr(d){d=d||new Date();const t=new Date(d.getTime()-d.getTimezoneOffset()*60000);return t.toISOString().slice(0,10);}\nfunction uid(){return Math.random().toString(36).slice(2,9);}\nfunction esc(s){return String(s==null?'':s).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c];});}\nfunction usedOf(pid){const d=state.usage[todayStr()]||{};return d[pid]||0;}\nfunction addUsage(pid,n){n=n||1;const k=todayStr();state.usage[k]=state.usage[k]||{};state.usage[k][pid]=(state.usage[k][pid]||0)+n;save();}\nfunction remainClips(p){if(p.isUnlimited)return Infinity;return Math.max(0,Math.floor((p.daily-usedOf(p.id))/p.perClip));}\nfunction todayTotal(){let t=0;PLATFORMS.forEach(function(p){const r=remainClips(p);if(isFinite(r))t+=r;});return t;}\nfunction platById(id){for(let i=0;i<PLATFORMS.length;i++){if(PLATFORMS[i].id===id)return PLATFORMS[i];}return null;}\nfunction allPrompts(){return PROMPTS.concat(state.custom||[]);}\n\n/* ---- 项目 / 镜头 ---- */\nfunction curProj(){\n  if(!state.cur)return null;\n  return state.projects.filter(function(p){return p.id===state.cur;})[0]||null;\n}\nfunction newProject(name,topic,type,style,ratio){\n  const d=new Date();\n  const seq=String(state.projects.length+1);\n  const code='P'+pad2(d.getMonth()+1)+pad2(d.getDate())+(seq.length<2?'0'+seq:seq);\n  const p={id:uid(),name:name||topic||'未命名项目',code:code,topic:topic||'',type:type||'chanpin',\n    style:style||'film',ratio:ratio||'9:16',imgPlat:'doubao',created:Date.now(),shots:[]};\n  state.projects.unshift(p);state.cur=p.id;save();return p;\n}\nfunction shotOf(proj,no){\n  if(!proj)return null;\n  return proj.shots.filter(function(s){return Number(s.no)===Number(no);})[0]||null;\n}\nfunction assetOf(proj,no,kind){\n  if(!proj)return null;\n  const want=buildName(proj,no,kind,'',1).replace(/-S(\\d+)-/,'-S$1-');\n  const pre=proj.code+'-S'+pad2(no)+'-'+kind+'-';\n  const keys=Object.keys(state.assets||{});\n  for(let i=0;i<keys.length;i++){\n    if(keys[i].indexOf(pre)===0){\n      // 取版本号最高的\n      let best=null;\n      keys.forEach(function(k){\n        if(k.indexOf(pre)!==0)return;\n        const q=parseName(k);\n        if(!q)return;\n        if(!best||q.ver>best.ver)best={name:k,ver:q.ver,meta:state.assets[k]};\n      });\n      return best;\n    }\n  }\n  return null;\n}\nfunction projStat(proj){\n  const t={total:0,idea:0,img:0,vid:0,done:0};\n  (proj.shots||[]).forEach(function(s){t.total++;t[s.status]=(t[s.status]||0)+1;});\n  return t;\n}\n/* 扫到文件后自动推进状态：有片→片已出，有图→图已备；已定稿不回落 */\nfunction autoSync(){\n  let changed=0;\n  (state.projects||[]).forEach(function(p){\n    (p.shots||[]).forEach(function(s){\n      const img=assetOf(p,s.no,'IMG');\n      const vid=assetOf(p,s.no,'VID');\n      if(vid&&(s.status==='idea'||s.status==='img')){s.status='vid';changed++;}\n      else if(img&&s.status==='idea'){s.status='img';changed++;}\n    });\n  });\n  if(changed)save();\n  return changed;\n}\n\nlet toastTimer=null;\nfunction toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},1800);}\nfunction copyText(t){\n  if(navigator.clipboard&&navigator.clipboard.writeText){\n    navigator.clipboard.writeText(t).then(function(){toast('已复制到剪贴板 ✓');},function(){fallbackCopy(t);});\n  }else{fallbackCopy(t);}\n}\nfunction fallbackCopy(t){\n  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';\n  document.body.appendChild(ta);ta.select();\n  try{document.execCommand('copy');toast('已复制 ✓');}catch(e){toast('复制失败，请手动选中');}\n  document.body.removeChild(ta);\n}\nfunction copyStepPrompt(sceneId,i){\n  const sc=SCENES.filter(function(s){return s.id===sceneId;})[0];if(!sc)return;\n  const pid=sc.steps[i].p;\n  const tp=PROMPTS.filter(function(p){return (p.best||[]).indexOf(pid)>=0;})[0];\n  if(tp){copyText(tp.text);}else{toast('这步去提示词库挑一条模板吧');}\n}\n\n/* ===================== 教程抽屉 ===================== */\nfunction openDrawer(){document.getElementById('mask').classList.add('on');document.getElementById('drawer').classList.add('on');}\nfunction closeDrawer(){document.getElementById('mask').classList.remove('on');document.getElementById('drawer').classList.remove('on');}\nfunction openTut(pid,extra){\n  const t=TUTORIALS[pid];\n  if(!t){toast('这个平台还没写教程');return;}\n  const p=platById(pid)||{name:'',url:'#'};\n  document.getElementById('dw-title').innerHTML=esc(t.title);\n  document.getElementById('dw-sub').innerHTML=esc(t.sub);\n  let h='';\n  if(extra){h+='<div class=\"dw-sec\"><h4>这一步具体做什么<\/h4><div class=\"mbox acc\">'+extra+'<\/div><\/div>';}\n  h+='<div class=\"dw-sec\"><h4>照着做<\/h4>'+t.steps.map(function(s,i){\n    return '<div class=\"tut-step\"><span class=\"n\">'+(i+1)+'<\/span><div><b>'+esc(s.t)+'<\/b><br>'+s.d+'<\/div><\/div>';\n  }).join('')+'<\/div>';\n  h+='<div class=\"dw-sec\"><h4>最容易踩的坑<\/h4><div class=\"mbox warn\"><ul>'+t.pitfall.map(function(x){return '<li>'+esc(x)+'<\/li>';}).join('')+'<\/ul><\/div><\/div>';\n  h+='<div class=\"dw-sec\"><h4>能不能接 API（全自动）<\/h4><div class=\"mbox\">'+t.api+'<\/div><\/div>';\n  h+='<div class=\"dw-sec\"><h4>成本<\/h4><div class=\"mbox\">'+esc(t.cost)+'<\/div><\/div>';\n  if(p.url){\n    h+='<div class=\"dw-sec\"><a class=\"btn btn-primary\" href=\"'+esc(p.url)+'\" target=\"_blank\" rel=\"noopener\">打开 '+esc(p.name)+' ↗<\/a><\/div>';\n  }\n  document.getElementById('dw-body').innerHTML=h;\n  document.getElementById('dw-body').scrollTop=0;\n  openDrawer();\n}\n\n/* ===================== 导演台 ===================== */\nconst SCENE_DEFAULT={\n chanpin:{场景:'浅灰色极简台面',材质:'磨砂金属与玻璃',光线:'柔和侧逆光',时间:'午后'},\n renwu:{场景:'有落地窗的木质房间',光线:'柔和窗光',人物:'年轻人',年龄:'二十多岁',性别:'女性',情绪:'笃定'},\n qingjie:{场景:'黄昏的老城区街道',人物:'穿深色外套的年轻人',光线:'低角度夕光',时间:'黄昏',情绪:'释然',色调:'冷暖对比'},\n fengjing:{场景:'高原雪山与湖泊',时间:'清晨',光线:'低角度金色晨光',人物:'旅人',前景物:'草叶',细节物:'露水'},\n zhishi:{场景:'浅色工作室',人物:'讲解员',年龄:'三十岁',性别:'女性',光线:'均匀柔光',元素:'三个关键词',类比物:'一条分叉的河流'}\n};\nfunction fillTpl(tpl,vars){\n  return String(tpl).replace(/\\{([^}]+)\\}/g,function(m,k){\n    const v=vars[k];\n    return (v===undefined||v==='')?k:v;\n  });\n}\nconst STYLE_FIX={\n cyber:{时间:'深夜',光线:'霓虹与湿地面反光'},\n jp:{光线:'柔和顺光'},\n retro:{光线:'暖色夕光',时间:'傍晚'},\n clean:{光线:'均匀柔光',时间:''}\n};\nfunction buildShots(){\n  const d=state.dir||{};\n  const st=STORY.filter(function(x){return x.id===d.type;})[0]||STORY[0];\n  const style=STYLES.filter(function(x){return x.id===d.style;})[0]||STYLES[0];\n  const topic=(d.topic||'').trim();\n  const subject=(d.sub||'').trim()||topic||'主体';\n  const base=SCENE_DEFAULT[st.id]||{};\n  const vars={};\n  Object.keys(base).forEach(function(k){vars[k]=base[k];});\n  const fix=STYLE_FIX[style.id]||{};\n  Object.keys(fix).forEach(function(k){if(fix[k])vars[k]=fix[k];});\n  vars['主题']=topic||'这个主题';\n  vars['主体']=subject;\n  const ratioTxt=d.ratio==='16:9'?'16:9 横屏电影画幅':(d.ratio==='1:1'?'1:1 方形构图':'9:16 竖屏');\n  const ratioImg=d.ratio==='16:9'?'16:9 横版构图':(d.ratio==='1:1'?'1:1 方形构图':'9:16 竖版构图');\n  return st.shots.map(function(s,i){\n    const core=fillTpl(s.tpl,vars);\n    return {\n      i:i+1, n:s.n, cam:s.cam, dur:s.dur, best:s.best,\n      prompt:core+'，'+style.kw+'，'+ratioTxt+'，稳定运镜，画面中不出现任何文字',\n      imgPrompt:core+'，'+style.name+'风格，'+ratioImg+'，'+s.cam+'，主体清晰占画面一半，高清细节，真实摄影质感，画面中不出现任何文字'\n    };\n  });\n}\nfunction dirCostTxt(sh){\n  const out={};const tip={};\n  sh.forEach(function(s){\n    const p=platById(s.best);\n    if(!p)return;\n    if(p.isUnlimited){tip[p.id]=1;return;}\n    const clips=Math.max(1,Math.ceil(s.dur/5));\n    out[p.id]=(out[p.id]||0)+clips*p.perClip;\n    tip[p.id]=1;\n  });\n  return out;\n}\nfunction collectDir(){\n  const t=document.getElementById('d-topic');\n  const s=document.getElementById('d-sub');\n  if(t)state.dir.topic=t.value.trim();\n  if(s)state.dir.sub=s.value.trim();\n  save();\n}\n\nfunction renderDirector(){\n  const d=state.dir;\n  const story=STORY.filter(function(x){return x.id===d.type;})[0]||STORY[0];\n  const typeBtns=STORY.map(function(x){\n    return '<button class=\"'+(d.type===x.id?'on':'')+'\" data-action=\"dtype\" data-v=\"'+x.id+'\">'+x.e+' '+esc(x.name)+'<\/button>';\n  }).join('');\n  const styleBtns=STYLES.map(function(x){\n    return '<button class=\"'+(d.style===x.id?'on':'')+'\" data-action=\"dstyle\" data-v=\"'+x.id+'\">'+esc(x.name)+'<\/button>';\n  }).join('');\n  const ratioBtns=['9:16','16:9','1:1'].map(function(r){\n    return '<button class=\"'+(d.ratio===r?'on':'')+'\" data-action=\"dratio\" data-v=\"'+r+'\">'+r+'<\/button>';\n  }).join('');\n\n  const form='<div class=\"genbar\">'\n    +'<div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px\">'\n    +'<div><div style=\"font-size:15px;font-weight:800\">你想做什么？说一句话，我把它拆成分镜<\/div>'\n    +'<div class=\"small muted\" style=\"margin-top:3px\">题材和风格决定镜头结构，你只填主题，剩下的提示词、平台、成本我算好<\/div><\/div>'\n    +'<span class=\"pill acc\">本地生成 · 不联网<\/span><\/div>'\n    +'<label class=\"f\">主题（越具体越好）<\/label>'\n    +'<input id=\"d-topic\" value=\"'+esc(d.topic||'')+'\" placeholder=\"例如：一款冷萃咖啡的夏日广告 / 独居女生的一天 / 为什么天是蓝的\">'\n    +'<div class=\"formgrid\" style=\"margin-top:12px\">'\n    +'<div><label class=\"f\">主体是什么（可留空，默认同主题）<\/label><input id=\"d-sub\" value=\"'+esc(d.sub||'')+'\" placeholder=\"例如：一杯加了冰块的冷萃咖啡\"><\/div>'\n    +'<div><label class=\"f\">画幅<\/label><div class=\"seg\" style=\"margin-top:2px\">'+ratioBtns+'<\/div><\/div>'\n    +'<\/div>'\n    +'<div style=\"margin-top:14px\"><label class=\"f\">题材<\/label><div class=\"seg\" style=\"flex-wrap:wrap\">'+typeBtns+'<\/div><\/div>'\n    +'<div style=\"margin-top:12px\"><label class=\"f\">画面风格<\/label><div class=\"seg\" style=\"flex-wrap:wrap\">'+styleBtns+'<\/div><\/div>'\n    +'<div style=\"margin-top:16px;display:flex;gap:9px;flex-wrap:wrap\">'\n    +'<button class=\"btn btn-primary\" data-action=\"dgen\">生成分镜脚本 →<\/button>'\n    +'<button class=\"btn\" data-action=\"drandom\">换一个风格试试<\/button>'\n    +'<\/div>'\n    +'<div class=\"small dim\" style=\"margin-top:10px\">提示：' + esc(story.hint) + '<\/div>'\n    +'<\/div>';\n\n  if(!(d.topic||'').trim()){\n    return '<div class=\"sec-title\"><h2>导演台<\/h2><span class=\"hint\">从一句话到可执行的分镜清单<\/span><\/div>'\n      +form\n      +'<div class=\"card\" style=\"margin-top:16px;border-style:dashed\"><div class=\"emptystate\"><span class=\"e\">🎬<\/span>上面填个主题，点「生成分镜脚本」<br><span class=\"dim\">它会给你每个镜头的提示词、镜头语言、该派给哪个平台、大概花多少额度<\/span><\/div><\/div>';\n  }\n\n  const shots=buildShots();\n  const totalDur=shots.reduce(function(a,s){return a+s.dur;},0);\n  const cost=dirCostTxt(shots);\n  const costTxt=Object.keys(cost).map(function(k){\n    const p=platById(k);\n    return (p?p.emoji+' '+p.name:k)+' '+cost[k]+(p?p.unit:'');\n  }).join(' · ')||'全部用不限量平台，0 成本';\n\n  const shotHTML=shots.map(function(s){\n    const p=platById(s.best)||{name:'?',emoji:''};\n    return '<div class=\"shot\"><div class=\"shot-no\">'+String(s.i).padStart(2,'0')+'<\/div>'\n      +'<div class=\"shot-card\">'\n      +'<div class=\"shot-h\"><span class=\"nm\">'+esc(s.n)+'<\/span>'\n      +'<span class=\"pill blue\">'+esc(p.emoji+' '+p.name)+'<\/span><\/div>'\n      +'<div class=\"shot-meta\"><span class=\"pill\">'+esc(s.cam)+'<\/span><span class=\"pill\">'+s.dur+' 秒<\/span>'\n      +'<span class=\"pill '+(p.isUnlimited?'acc':'warn')+'\">'+(p.isUnlimited?'不耗额度':(Math.max(1,Math.ceil(s.dur/5))*(p.perClip||1))+' '+esc(p.unit||''))+'<\/span><\/div>'\n      +'<div class=\"shot-prompt\"><span style=\"color:var(--acc);font-size:10.5px;font-weight:800\">视频 <\/span>'+esc(s.prompt)+'<\/div>'\n      +'<div class=\"shot-prompt\" style=\"margin-top:6px;color:var(--dim);font-size:11.5px\"><span style=\"color:var(--purple);font-size:10.5px;font-weight:800\">生图 <\/span>'+esc(s.imgPrompt)+'<\/div>'\n      +'<div class=\"shot-acts\">'\n      +'<button class=\"btn btn-sm btn-primary\" data-action=\"copyshot\" data-i=\"'+s.i+'\">复制视频词<\/button>'\n      +'<button class=\"btn btn-sm\" data-action=\"copyimg\" data-i=\"'+s.i+'\">复制生图词<\/button>'\n      +'<a class=\"btn btn-sm\" href=\"https://doubao.com\" target=\"_blank\" rel=\"noopener\">去生图 ↗<\/a>'\n      +'<a class=\"btn btn-sm\" href=\"'+esc(p.url||'#')+'\" target=\"_blank\" rel=\"noopener\">去出片 ↗<\/a>'\n      +'<button class=\"btn btn-sm btn-ghost\" data-action=\"tut\" data-pid=\"'+s.best+'\">怎么用 ?<\/button>'\n      +'<\/div><\/div><\/div>';\n  }).join('');\n\n  const saved=state.projects.filter(function(p){return p.topic===d.topic&&p.style===d.style&&p.type===d.type;})[0];\n\n  return '<div class=\"sec-title\"><h2>导演台<\/h2><span class=\"hint\">从一句话到可执行的分镜清单<\/span><\/div>'\n    +form\n    +'<div class=\"sec-title\"><h2>分镜脚本：'+esc(d.topic)+'<\/h2><span class=\"hint\">共 '+shots.length+' 个镜头<\/span><\/div>'\n    +'<div class=\"stat-row\">'\n    +'<div class=\"stat\"><div class=\"k\">总时长<\/div><div class=\"v\">'+totalDur+'<small>秒<\/small><\/div><\/div>'\n    +'<div class=\"stat\"><div class=\"k\">镜头数<\/div><div class=\"v\">'+shots.length+'<small>个<\/small><\/div><\/div>'\n    +'<div class=\"stat\"><div class=\"k\">画幅<\/div><div class=\"v\" style=\"font-size:15px\">'+esc(d.ratio)+'<\/div><\/div>'\n    +'<\/div>'\n    +'<div class=\"card\" style=\"margin-bottom:16px;background:rgba(74,158,255,.06);border-color:rgba(74,158,255,.25)\">'\n    +'<div class=\"small\" style=\"color:var(--sub);margin-bottom:9px\">预计消耗：<b style=\"color:var(--warn)\">'+esc(costTxt)+'<\/b><\/div>'\n    +'<div class=\"small muted\">▶ <b style=\"color:var(--txt)\">正确拍法：<\/b>第 1 遍把这 '+shots.length+' 条全丢给 <b style=\"color:var(--acc)\">智谱清影<\/b>（免费不限量）跑一遍草稿，只判断构图和动作对不对；选中的镜头，再按右边推荐的平台重出正式版。这样额度几乎不浪费。<\/div>'\n    +'<div style=\"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap\">'\n    +'<button class=\"btn btn-sm btn-primary\" data-action=\"saveproj\">'+(saved?'更新项目镜头表 →':'保存为项目 → 镜头表')+'<\/button>'\n    +'<button class=\"btn btn-sm\" data-action=\"copyallshots\">复制全部视频词<\/button>'\n    +'<button class=\"btn btn-sm\" data-action=\"copyallimg\">复制全部生图词<\/button>'\n    +(saved?'<button class=\"btn btn-sm\" data-action=\"tab\" data-tab=\"shots\">去镜头表 →<\/button>':'')\n    +'<\/div>'\n    +'<div class=\"small dim\" style=\"margin-top:10px\">保存后每个镜头会自动获得标准文件名（如 '+esc(buildName({code:'P1030'+'1'},1,'IMG','doubao',1))+'），生完图存成这个名字，工作台就能认出来。<\/div>'\n    +'<\/div>'\n    +shotHTML;\n}\n\nfunction copyShotPrompt(i){\n  const s=buildShots().filter(function(x){return x.i===Number(i);})[0];\n  if(s)copyText(s.prompt);else toast('没找到这个镜头');\n}\n\n/* ===================== v3.0 镜头表 ===================== */\nconst ST_MAP={idea:['待生图','s-idea'],img:['图已备','s-img'],vid:['片已出','s-vid'],done:['已定稿','s-done']};\nconst ST_NEXT={idea:'img',img:'vid',vid:'done',done:'idea'};\nfunction renderPipeBar(active){\n  return '<div class=\"pipe\">'+PIPE.map(function(p,i){\n    return (i?'<span class=\"pipe-ar\">›<\/span>':'')+'<div class=\"pipe-i'+(p.tab===active?' on':'')+'\" data-action=\"tab\" data-tab=\"'+p.tab+'\"><b>'+p.n+'<\/b>'+esc(p.label)+'<\/div>';\n  }).join('')+'<\/div>';\n}\nfunction projBar(){\n  const opts=state.projects.map(function(p){\n    return '<option value=\"'+p.id+'\"'+(p.id===state.cur?' selected':'')+'>'+esc(p.name)+'（'+esc(p.code)+'）<\/option>';\n  }).join('');\n  const proj=curProj();\n  const iopts=[['doubao','豆包生图'],['jimeng','即梦生图'],['tongyi','通义生图'],['zhipu','清言生图']].map(function(x){\n    return '<option value=\"'+x[0]+'\"'+((proj&&proj.imgPlat||'doubao')===x[0]?' selected':'')+'>'+x[1]+'<\/option>';\n  }).join('');\n  return '<div class=\"projbar\">'\n    +'<select class=\"proj-sel\" style=\"min-width:180px\" onchange=\"selProj(this.value)\">'+(state.projects.length?opts:'<option>还没有项目<\/option>')+'<\/select>'\n    +'<button class=\"btn btn-sm btn-primary\" data-action=\"tab\" data-tab=\"director\">＋ 新建（去导演台）<\/button>'\n    +'<button class=\"btn btn-sm\" data-action=\"rencode\" '+(state.cur?'':'disabled')+'>改代号<\/button>'\n    +'<button class=\"btn btn-sm\" data-action=\"delproj\" '+(state.cur?'':'disabled')+'>删除项目<\/button>'\n    +'<span class=\"small dim\" style=\"display:inline-flex;align-items:center;gap:6px;white-space:nowrap\">生图用'\n      +'<select class=\"proj-sel\" style=\"min-width:104px;padding:6px 8px;font-size:12px\" onchange=\"setImgPlat(this.value)\">'+iopts+'<\/select><\/span>'\n    +'<\/div>';\n}\nfunction renderShots(){\n  const proj=curProj();\n  const head='<div class=\"sec-title\"><h2>② 镜头表<\/h2><span class=\"hint\">一个镜头一行，拖动可排序；状态点一下就往后走一格<\/span><\/div>';\n  if(!proj){\n    return head+renderPipeBar('shots')+projBar()\n      +'<div class=\"empty-box\">还没有项目。<br>先去 <b style=\"color:var(--acc)\">导演台<\/b> 写一句主题、生成分镜，再点「保存为项目」。<br><span class=\"small\">保存后每个镜头才会拿到标准文件名。<\/span><\/div>';\n  }\n  const st=projStat(proj);\n  const pct=st.total?Math.round(st.done/st.total*100):0;\n  const rows=proj.shots.map(function(s,i){\n    const img=assetOf(proj,s.no,'IMG');\n    const vid=assetOf(proj,s.no,'VID');\n    const p=platById(s.plat)||{name:'?',emoji:'',url:'#'};\n    const url=img&&FILEURL[img.name];\n    const stt=ST_MAP[s.status]||ST_MAP.idea;\n    return '<tr class=\"row\" draggable=\"true\" data-shotid=\"'+s.id+'\">'\n      +'<td style=\"width:22px\"><span class=\"grip\">⋮⋮<\/span><\/td>'\n      +'<td style=\"width:42px\"><span class=\"rno\">S'+pad2(s.no)+'<\/span><\/td>'\n      +'<td><div class=\"rname\">'+esc(s.title)+'<\/div><div class=\"rprompt\">'+esc(s.prompt||'')+'<\/div><\/td>'\n      +'<td style=\"width:104px\">'\n        +'<div class=\"thumb'+(img?' ok':'')+'\">'+(url?'<img src=\"'+url+'\" alt=\"\">':'<span class=\"ph\">'+(img?'图在<br>文件夹':'待生图')+'<\/span>')+'<\/div>'\n        +'<div style=\"margin-top:5px\">'+(img\n          ?'<span class=\"fn\" title=\"点击复制文件名\" data-action=\"copyfn\" data-n=\"'+esc(img.name)+'\">'+esc(img.name)+'<\/span>'\n          :'<span class=\"fn miss\" title=\"点击复制该镜头的标准文件名\" data-action=\"copyfn\" data-n=\"'+esc(imgName(proj,s.no,1))+'\">'+esc(imgName(proj,s.no,1))+'<\/span>')\n        +'<\/div>'\n      +'<\/td>'\n      +'<td style=\"width:96px\"><span class=\"pill blue\">'+esc(p.emoji+' '+p.name)+'<\/span>'\n        +(vid?'<div style=\"margin-top:5px\"><span class=\"fn\" data-action=\"copyfn\" data-n=\"'+esc(vid.name)+'\">'+esc(vid.name)+'<\/span><\/div>':'')\n      +'<\/td>'\n      +'<td style=\"width:76px\"><button class=\"st '+stt[1]+'\" data-action=\"cyc\" data-id=\"'+s.id+'\">'+stt[0]+'<\/button><\/td>'\n      +'<td style=\"width:176px\"><div style=\"display:flex;gap:5px;flex-wrap:nowrap\">'\n        +'<button class=\"btn btn-sm btn-ghost\" data-action=\"copyimg2\" data-id=\"'+s.id+'\" title=\"复制这张图的生图提示词\">图词<\/button>'\n        +'<button class=\"btn btn-sm btn-ghost\" data-action=\"copyshot2\" data-id=\"'+s.id+'\" title=\"复制视频提示词\">影词<\/button>'\n        +'<a class=\"btn btn-sm\" href=\"'+esc(p.url||'#')+'\" target=\"_blank\" rel=\"noopener\">出片↗<\/a>'\n      +'<\/div><\/td>'\n      +'<\/tr>';\n  }).join('');\n\n  const legacy=(state.tasks||[]).length?'<div class=\"card\" style=\"margin-top:18px\"><div class=\"small muted\" style=\"margin-bottom:8px\">旧版「任务队列」里的 '+(state.tasks||[]).length+' 条零散待办（可以忽略，也可以清空）<\/div><button class=\"btn btn-sm\" data-action=\"cleartasks\">清空旧待办<\/button><\/div>':'';\n\n  return head+renderPipeBar('shots')+projBar()\n    +'<div class=\"card\" style=\"margin-bottom:16px\">'\n    +'<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px\">'\n    +'<div><div style=\"font-weight:800;font-size:14.5px\">'+esc(proj.name)+'<\/div>'\n    +'<div class=\"small dim\">代号 <b style=\"color:var(--acc)\">'+esc(proj.code)+'<\/b> · '+esc(proj.ratio)+' · '+st.total+' 个镜头 · 约 '+proj.shots.reduce(function(a,x){return a+(x.dur||0);},0)+' 秒<\/div><\/div>'\n    +'<div style=\"display:flex;gap:6px;flex-wrap:wrap\">'\n    +'<span class=\"pill\">待生图 '+st.idea+'<\/span><span class=\"pill warn\">图已备 '+st.img+'<\/span><span class=\"pill blue\">片已出 '+st.vid+'<\/span><span class=\"pill acc\">已定稿 '+st.done+'<\/span>'\n    +'<\/div><\/div>'\n    +'<div class=\"bar\"><i style=\"width:'+pct+'%\"><\/i><\/div>'\n    +'<div class=\"small dim\" style=\"margin-top:6px\">完成度 '+pct+'% · 素材齐了 '+((st.img+st.vid+st.done))+'/'+st.total+'<\/div>'\n    +'<\/div>'\n    +'<div style=\"overflow-x:auto;-webkit-overflow-scrolling:touch\"><table class=\"tbl\" style=\"min-width:860px\"><thead><tr>'\n    +'<th><\/th><th>镜<\/th><th>镜头 / 提示词<\/th><th>参照图<\/th><th>出片平台<\/th><th>状态<\/th><th>操作<\/th>'\n    +'<\/tr><\/thead><tbody id=\"shotbody\">'+(rows||'<tr><td colspan=\"7\" class=\"small dim\" style=\"text-align:center;padding:20px\">这个项目还没有镜头<\/td><\/tr>')+'<\/tbody><\/table><\/div>'\n    +'<div class=\"card\" style=\"margin-top:16px;background:rgba(62,230,176,.05);border-color:rgba(62,230,176,.22)\">'\n    +'<div class=\"small\"><b style=\"color:var(--acc)\">用法：<\/b>把这张表当成拍摄通告单。点文件名复制 → 到豆包生图，另存为这个名字 → 回资产库扫描一次，缩略图就会自己长出来；带着这张图去视频平台做图生视频，成品也按规范存，再扫一次就自动打勾。<\/div>'\n    +'<div style=\"display:flex;gap:8px;margin-top:11px;flex-wrap:wrap\">'\n    +'<button class=\"btn btn-sm btn-primary\" data-action=\"copyfilenames\">复制全部文件名清单<\/button>'\n    +'<button class=\"btn btn-sm\" data-action=\"exportcsv\">导出分镜表 CSV<\/button>'\n    +'<button class=\"btn btn-sm\" data-action=\"tab\" data-tab=\"assets\">去资产库挂文件夹 →<\/button>'\n    +'<button class=\"btn btn-sm\" data-action=\"tab\" data-tab=\"call\">生成今日开工单 →<\/button>'\n    +'<\/div><\/div>'\n    +legacy;\n}\n\n/* ===================== v3.0 资产库 ===================== */\nlet PENDING=[];\nconst IMG_ONLY=/\\.(png|jpe?g|webp|gif|bmp)$/i;\nasync function mountFolder(){\n  if(!window.showDirectoryPicker){toast('这个浏览器不支持直接挂载，用下面的「只读扫描」');return;}\n  try{\n    const h=await window.showDirectoryPicker({mode:'readwrite'});\n    DIRHANDLE=h;await idbSet('dir',h);\n    state.folder={name:h.name,at:Date.now()};save();\n    await scanDir(true);\n  }catch(e){if(e&&e.name!=='AbortError')toast('选择文件夹失败：'+(e.message||''));}\n}\nasync function scanDir(noisy){\n  if(!DIRHANDLE){if(noisy)toast('先挂载一个文件夹');return;}\n  let perm='granted';\n  try{perm=await DIRHANDLE.queryPermission({mode:'readwrite'});}catch(e){}\n  if(perm!=='granted'){\n    try{perm=await DIRHANDLE.requestPermission({mode:'readwrite'});}catch(e){}\n  }\n  const assets={};let n=0,bad=0;\n  try{\n    for await (const ent of DIRHANDLE.values()){\n      if(ent.kind!=='file')continue;\n      const name=ent.name;\n      if(!/\\.(png|jpe?g|webp|gif|bmp|mp4|mov|webm|mp3|wav|m4a)$/i.test(name)){bad++;continue;}\n      const q=parseName(name);\n      if(!q){bad++;continue;}\n      let f=null;\n      try{f=await ent.getFile();}catch(e){continue;}\n      assets[name]={no:q.no,kind:q.kind,plat:q.plat,ver:q.ver,size:f.size,at:f.lastModified};\n      if(q.kind==='IMG'&&f.size<60*1024*1024){\n        if(FILEURL[name])URL.revokeObjectURL(FILEURL[name]);\n        FILEURL[name]=URL.createObjectURL(f);FILEBLOB[name]=f;\n      }\n      n++;\n    }\n    state.assets=assets;state.folder.at=Date.now();\n    const ch=autoSync();save();\n    if(noisy)toast('扫描完成：识别 '+n+' 个规范文件'+(bad?'，忽略 '+bad+' 个命名不规范的':'')+(ch?'，'+ch+' 个镜头状态已推进':''));\n  }catch(e){if(noisy)toast('扫描出错：'+(e.message||''));}\n  render();\n}\nfunction pickFolderReadonly(){\n  const inp=document.createElement('input');\n  inp.type='file';inp.webkitdirectory=true;inp.multiple=true;inp.style.display='none';\n  inp.onchange=function(){handleFiles(Array.prototype.slice.call(inp.files));};\n  document.body.appendChild(inp);inp.click();\n  setTimeout(function(){document.body.removeChild(inp);},1000);\n}\nfunction handleFiles(files){\n  let ok=0,bad=0;\n  files.forEach(function(f){\n    const nm=f.name;\n    if(IMG_ONLY.test(nm)&&f.size<60*1024*1024){\n      if(FILEURL[nm])URL.revokeObjectURL(FILEURL[nm]);\n      FILEURL[nm]=URL.createObjectURL(f);FILEBLOB[nm]=f;\n    }\n    const q=parseName(nm);\n    if(!q){\n      bad++;\n      PENDING.push({id:uid(),file:f,name:nm,kind:IMG_ONLY.test(nm)?'IMG':'VID'});\n      return;\n    }\n    state.assets[nm]={no:q.no,kind:q.kind,plat:q.plat,ver:q.ver,size:f.size,at:f.lastModified};\n    ok++;\n  });\n  if(!state.folder.name)state.folder={name:'（临时导入）',at:Date.now()};\n  state.folder.at=Date.now();\n  autoSync();save();render();\n  toast('识别 '+ok+' 个规范文件'+(bad?('，'+bad+' 个待归类（见下方）'):''));\n}\nasync function writeToFolder(blob,name){\n  if(!DIRHANDLE){toast('没有挂载文件夹，无法自动改名写入');return false;}\n  try{\n    const fh=await DIRHANDLE.getFileHandle(name,{create:true});\n    const w=await fh.createWritable();\n    await w.write(blob);await w.close();\n    return true;\n  }catch(e){toast('写入失败：'+(e.message||''));return false;}\n}\nasync function archivePending(id,projId,no,kind){\n  const it=PENDING.filter(function(x){return x.id===id;})[0];\n  if(!it)return;\n  const proj=state.projects.filter(function(p){return p.id===projId;})[0];\n  if(!proj){toast('选一个项目');return;}\n  const name=buildName(proj,no,kind,state.api&&state.api.lastPlat||'doubao',1);\n  const done=await writeToFolder(it.file,name);\n  if(done){\n    if(FILEURL[name])URL.revokeObjectURL(FILEURL[name]);\n    FILEURL[name]=URL.createObjectURL(it.file);FILEBLOB[name]=it.file;\n    const q=parseName(name);\n    state.assets[name]={no:q.no,kind:q.kind,plat:q.plat,ver:q.ver,size:it.file.size,at:Date.now()};\n    PENDING=PENDING.filter(function(x){return x.id!==id;});\n    const sh=shotOf(proj,no);\n    if(sh&&kind==='IMG'&&sh.status==='idea')sh.status='img';\n    autoSync();save();render();toast('已按规范写入文件夹：'+name);\n  }else{\n    toast('没权限写入。请用 Chrome/Edge 的「挂载文件夹」，或手动改名另存');\n  }\n}\nfunction exportCSV(){\n  const proj=curProj();\n  if(!proj)return toast('先建一个项目');\n  const rows=[['镜号','标题','镜头语言','时长(秒)','平台','状态','参照图文件名','成品文件名','生图提示词','视频提示词']];\n  proj.shots.forEach(function(s){\n    const p=platById(s.plat)||{name:''};\n    rows.push(['S'+pad2(s.no),s.title,s.cam,s.dur,p.name,(ST_MAP[s.status]||[''])[0],\n      imgName(proj,s.no,1),vidName(proj,s.no,s.plat,1),s.imgPrompt||'',s.prompt||'']);\n  });\n  const csv=rows.map(function(r){\n    return r.map(function(c){return '\"'+String(c==null?'':c).replace(/\"/g,'\"\"')+'\"';}).join(',');\n  }).join('\\r\\n');\n  const blob=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'});\n  const a=document.createElement('a');\n  a.href=URL.createObjectURL(blob);\n  a.download=proj.code+'_分镜表.csv';\n  document.body.appendChild(a);a.click();\n  setTimeout(function(){URL.revokeObjectURL(a.href);if(a.parentNode)a.parentNode.removeChild(a);},2000);\n  toast('已导出 CSV，Excel 能直接打开');\n}\nasync function writeListToFolder(){\n  const proj=curProj();\n  if(!proj)return toast('先建一个项目');\n  if(!DIRHANDLE)return toast('先挂载文件夹（要有读写权限）');\n  const lines=[];\n  lines.push('【'+proj.name+'】项目代号 '+proj.code+' · 画幅 '+proj.ratio);\n  lines.push('生成时间：'+new Date().toLocaleString('zh-CN'));\n  lines.push('说明：文件名必须和下面一字不差，工作台靠文件名认素材。');\n  lines.push('');\n  proj.shots.forEach(function(s){\n    const p=platById(s.plat)||{name:'?'};\n    const img=assetOf(proj,s.no,'IMG');\n    const vid=assetOf(proj,s.no,'VID');\n    lines.push('S'+pad2(s.no)+'  '+s.title+'   → '+p.name);\n    lines.push('  参照图 '+(img?'[已有] ':'[待生] ')+imgName(proj,s.no,1));\n    lines.push('  成品片 '+(vid?'[已有] ':'[待出] ')+vidName(proj,s.no,s.plat,1));\n    lines.push('  生图词：'+(s.imgPrompt||''));\n    lines.push('  视频词：'+(s.prompt||''));\n    lines.push('');\n  });\n  const blob=new Blob([lines.join('\\r\\n')],{type:'text/plain;charset=utf-8'});\n  const ok=await writeToFolder(blob,'_命名清单_'+proj.code+'.txt');\n  if(ok)toast('已写入 _命名清单_'+proj.code+'.txt');\n}\nfunction renderAssets(){\n  const proj=curProj();\n  const f=state.folder||{name:'',at:0};\n  const names=Object.keys(state.assets||{});\n  const imgs=names.filter(function(n){return (state.assets[n]||{}).kind==='IMG';});\n  const vids=names.filter(function(n){return (state.assets[n]||{}).kind==='VID';});\n  const head='<div class=\"sec-title\"><h2>③ 资产库<\/h2><span class=\"hint\">整条流水线的接头：文件名就是索引<\/span><\/div>';\n\n  const mountCard='<div class=\"card\" style=\"margin-bottom:16px\">'\n    +'<div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start\">'\n    +'<div><div style=\"font-weight:800;font-size:14.5px\">挂载你的素材文件夹<\/div>'\n    +'<div class=\"small muted\" style=\"margin-top:3px\">一次授权，之后每次回来自动认得上次那个文件夹<\/div><\/div>'\n    +'<span class=\"pill '+(f.name?'acc':'')+'\">'+(f.name?('已挂：'+esc(f.name)):'未挂载')+'<\/span>'\n    +'<\/div>'\n    +'<div style=\"display:flex;gap:8px;margin-top:13px;flex-wrap:wrap\">'\n    +'<button class=\"btn btn-primary\" data-action=\"mount\">选择文件夹（可读写）<\/button>'\n    +((f.name&&!DIRHANDLE)?'<button class=\"btn btn-primary\" data-action=\"restoredir\">恢复「'+esc(f.name)+'」（点一下授权）<\/button>':'')\n    +'<button class=\"btn\" data-action=\"rescan\">重新扫描<\/button>'\n    +'<button class=\"btn\" data-action=\"readonly\">只读扫描（拖进来也行）<\/button>'\n    +'<button class=\"btn\" data-action=\"writelist\">把命名清单写进文件夹<\/button>'\n    +'<\/div>'\n    +'<div class=\"small dim\" style=\"margin-top:10px\">识别的扩展名：png / jpg / webp / mp4 / mov / mp3 · 只认符合命名规范的文件，其他会被忽略并列入「待归类」<\/div>'\n    +(f.at?'<div class=\"small dim\" style=\"margin-top:4px\">上次扫描：'+new Date(f.at).toLocaleString('zh-CN')+'<\/div>':'')\n    +'<\/div>';\n\n  const nameCard='<div class=\"card\" style=\"margin-bottom:16px\">'\n    +'<div style=\"font-weight:800;font-size:14.5px;margin-bottom:4px\">命名规范（必须照抄，一个字都不能改）<\/div>'\n    +'<div class=\"codeblk\" style=\"margin:10px 0\">'+esc(NAME_RULE.pattern)+'<br><i>　　　　　　　　　　　　　　　　　　↑ 例：<\/i><em>'+esc(NAME_RULE.sample)+'<\/em><\/div>'\n    +'<table class=\"ptbl\"><tr><th style=\"width:110px\">段位<\/th><th>含义<\/th><th style=\"width:150px\">可用值<\/th><\/tr>'\n    +'<tr><td>项目代号<\/td><td>你这个片子的短代码，大写字母+数字<\/td><td class=\"small\">如 CQF、P10301<\/td><\/tr>'\n    +'<tr><td>S01<\/td><td>第几镜，必须两位，从 01 开始<\/td><td class=\"small\">S01 / S02 … S12<\/td><\/tr>'\n    +'<tr><td>IMG / VID / AUD<\/td><td>这张文件是参照图、成品片、还是配音<\/td><td class=\"small\">IMG / VID / AUD<\/td><\/tr>'\n    +'<tr><td>平台<\/td><td>哪个平台出的，小写英文<\/td><td class=\"small\">doubao / hailuo / kling / jimeng / vidu …<\/td><\/tr>'\n    +'<tr><td>v1<\/td><td>版本号，同一镜头出第 2 版就 v2<\/td><td class=\"small\">v1 / v2 / v3<\/td><\/tr>'\n    +'<tr><td>扩展名<\/td><td>图 png、视频 mp4、音频 mp3<\/td><td class=\"small\">.png / .mp4 / .mp3<\/td><\/tr>'\n    +'<\/table>'\n    +'<div class=\"small muted\" style=\"margin-top:11px\">为什么这样定：<b style=\"color:var(--txt)\">镜号在文件名里定死，视频就知道该配哪张图<\/b>；平台和版本分开，同一个镜头出 3 版也不会互相覆盖；全英文无空格，任何系统都不会乱码。<\/div>'\n    +'<\/div>';\n\n  const pend=PENDING.length?('<div class=\"card\" style=\"margin-bottom:16px;border-color:rgba(255,194,75,.3)\">'\n    +'<div style=\"font-weight:800;font-size:14px;margin-bottom:10px;color:var(--warn)\">待归类 '+PENDING.length+' 个（名字不规范，工作台认不出来）<\/div>'\n    +PENDING.map(function(it){\n      const opt=(proj?proj.shots.map(function(s){return '<option value=\"'+s.no+'\">S'+pad2(s.no)+' '+esc(s.title)+'<\/option>';}).join(''):'');\n      return '<div style=\"display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap\">'\n        +'<div class=\"thumb\" style=\"width:44px;height:44px\">'+(it.kind==='IMG'&&FILEURL[it.name]?'<img src=\"'+FILEURL[it.name]+'\">':'<span class=\"ph\">文件<\/span>')+'<\/div>'\n        +'<div style=\"flex:1;min-width:160px\"><div class=\"small\" style=\"word-break:break-all\">'+esc(it.name)+'<\/div>'\n        +'<div class=\"small dim\">'+(it.file.size/1024).toFixed(0)+' KB<\/div><\/div>'\n        +'<select class=\"proj-sel\" style=\"min-width:auto;padding:5px 8px;font-size:12px\" id=\"pk-'+it.id+'\">'+opt+'<\/select>'\n        +'<button class=\"btn btn-sm btn-primary\" data-action=\"archive\" data-id=\"'+it.id+'\" data-kind=\"'+it.kind+'\">按规范改名归档<\/button>'\n        +'<\/div>';\n    }).join('')\n    +'<div class=\"small dim\" style=\"margin-top:9px\">归档会把文件以新名字写入你挂载的文件夹（需要读写权限）。不想自动写，就手动改名另存。<\/div>'\n    +'<\/div>'):'';\n\n  const grid=names.length?('<div class=\"agrid\">'+names.sort().map(function(n){\n    const a=state.assets[n]||{};\n    const u=FILEURL[n];\n    return '<div class=\"asset\"><div class=\"tagline\">S'+pad2(a.no||0)+' · '+esc(a.kind||'')+'<\/div>'\n      +'<div class=\"box\">'+(u?'<img src=\"'+u+'\" alt=\"\">':'<span class=\"ic\">'+(a.kind==='VID'?'🎞':'📄')+'<\/span>')+'<\/div>'\n      +'<div class=\"inf\"><div class=\"nm\">'+esc(n)+'<\/div><div class=\"mt\">v'+(a.ver||1)+' · '+((a.size||0)/1024/1024).toFixed(1)+' MB<\/div><\/div><\/div>';\n  }).join('')+'<\/div>'):('<div class=\"empty-box\">文件夹里还没有规范命名的素材。<br><span class=\"small\">先生图 → 另存为 <b style=\"color:var(--acc)\">'+esc(proj?buildName(proj,1,'IMG','doubao',1):NAME_RULE.sample)+'<\/b> → 回来「重新扫描」。<\/span><\/div>');\n\n  const dr='<div class=\"card\" style=\"margin-bottom:16px\"><div class=\"small\"><b style=\"color:var(--acc2)\">为什么你「生的图」视频能找到：<\/b>视频平台看图生视频，认的是「你上传的那个文件」。所以流程是——豆包生图 → 存成本规范名 → 在镜头表里点这个名字复制 → 到视频平台那张图上传时，你手上拿的就是同一个文件、同一个名字。工作台再把扫描到的文件名对回镜号，于是「谁配谁」永远不乱。<\/div><\/div>';\n\n  const imgCard='<div class=\"sec-title\"><h2>参照图从哪来<\/h2><span class=\"hint\">生图这一步全用免费的，别动积分<\/span><\/div>'\n    +'<div class=\"grid\" style=\"margin-bottom:20px\">'+IMG_PLATFORMS.map(function(p){\n      return '<div class=\"card\" style=\"padding:14px\">'\n        +'<div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\">'\n        +'<div style=\"font-weight:800;font-size:13.5px\">'+esc(p.emoji+' '+p.name)+'<\/div>'\n        +'<span class=\"pill '+(p.role==='首选'?'acc':(p.role==='试错'?'blue':''))+'\">'+esc(p.role)+'<\/span><\/div>'\n        +'<div class=\"small dim\" style=\"margin:5px 0 7px\">'+esc(p.free)+'<\/div>'\n        +'<div class=\"small muted\" style=\"line-height:1.65\">'+esc(p.why)+'<\/div>'\n        +'<div class=\"small\" style=\"color:var(--warn);margin-top:7px;line-height:1.55\">⚠ '+esc(p.tip)+'<\/div>'\n        +'<a class=\"btn btn-sm\" style=\"margin-top:9px\" href=\"'+esc(p.url)+'\" target=\"_blank\" rel=\"noopener\">去生图 ↗<\/a>'\n        +'<\/div>';\n    }).join('')+'<\/div>';\n\n  return head+renderPipeBar('assets')+mountCard+imgCard+dr+nameCard+pend\n    +'<div class=\"sec-title\"><h2>已入库<\/h2><span class=\"hint\">图 '+imgs.length+' · 视频 '+vids.length+' · 共 '+names.length+'<\/span><\/div>'\n    +grid;\n}\n\n/* ===================== v3.0 开工单 ===================== */\nfunction buildPlan(proj){\n  const needImg=[],needVid=[],done=[];\n  (proj.shots||[]).forEach(function(s){\n    const img=assetOf(proj,s.no,'IMG');\n    const vid=assetOf(proj,s.no,'VID');\n    if(!img)needImg.push(s);\n    else if(!vid)needVid.push(s);\n    else done.push(s);\n  });\n  return {needImg:needImg,needVid:needVid,done:done};\n}\nfunction callCost(shots){\n  const out={};\n  shots.forEach(function(s){\n    const p=platById(s.plat);if(!p||p.isUnlimited)return;\n    const clips=Math.max(1,Math.ceil((s.dur||5)/5));\n    out[p.id]=(out[p.id]||0)+clips*(p.perClip||1);\n  });\n  return out;\n}\nfunction renderCall(){\n  const head='<div class=\"sec-title\"><h2>④ 开工单<\/h2><span class=\"hint\">今天照着这张单子做，不用再想「下一步干嘛」<\/span><\/div>';\n  const proj=curProj();\n  if(!proj)return head+renderPipeBar('call')+projBar()+'<div class=\"empty-box\">先建一个项目，这里才会长出工单。<\/div>';\n  const plan=buildPlan(proj);\n  const cost=callCost(plan.needVid);\n  const over=[];\n  Object.keys(cost).forEach(function(k){\n    const p=platById(k);if(!p)return;\n    const rem=remainClips(p);\n    if(cost[k]>rem*p.perClip)over.push({p:p,need:cost[k],rem:rem});\n  });\n\n  let h=head+renderPipeBar('call')+projBar();\n  h+='<div class=\"stat-row\" style=\"margin-bottom:16px\">'\n    +'<div class=\"stat\"><div class=\"k\">要生图<\/div><div class=\"v\">'+plan.needIm
