.item.has-dl .nm .bg{font-size:10px;padding:2px 6px}

/* ==========================================================================
   v8 · 登录页：密码默认隐藏 + 小眼睛 + 忘记密码折叠块
   ========================================================================== */
.pwbox{position:relative;margin-top:2px}
.pwbox .inp{width:100%;padding-right:44px}
.pweye{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;display:grid;place-items:center;
  border:0;background:transparent;border-radius:9px;
  color:var(--ink-3);cursor:pointer;transition:var(--t)}
.pweye:hover{background:var(--surface-3);color:var(--brand)}
.pweye:active{transform:translateY(-50%) scale(.92)}
.pweye svg{width:17px;height:17px}

.pwforgot{
  margin-top:16px;padding-top:13px;
  border-top:1px solid var(--line-2);
  font-size:11.5px;color:var(--ink-3);line-height:1.75}
.pwforgot summary{
  cursor:pointer;list-style:none;font-weight:800;font-size:11.5px;
  color:var(--brand);display:flex;align-items:center;gap:6px;
  padding:3px 0;transition:var(--t)}
.pwforgot summary::-webkit-details-marker{display:none}
.pwforgot summary::after{
  content:'';width:6px;height:6px;margin-left:auto;
  border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;
  transform:rotate(45deg) translateY(-2px);transition:transform .2s var(--ease)}
.pwforgot[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.pwforgot summary:hover{color:var(--brand-ink)}
.pwforgot p{
  margin:10px 0 0;padding:10px 12px;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px}
.pwforgot code{
  font-family:ui-monospace,Consolas,monospace;font-size:10.8px;
  background:var(--surface-3);color:var(--brand-ink);
  border:1px solid var(--line);border-radius:5px;padding:1.5px 5px;
  word-break:break-all}

/* 下载按钮分色：直链=蓝，蓝奏=青绿，发布页=灰蓝 */
.item.has-dl .dl.dir{background:linear-gradient(135deg,#2563EB,#1D4ED8)}
.item.has-dl .dl.pan{background:linear-gradient(135deg,#0E9F6E,#0B7A55)}
.item.has-dl .dl.rel{background:linear-gradient(135deg,#5A6A84,#41506A)}

/* 没有直链时给一条克制的「官网」提示，卡片不至于显得缺一块 */
.dmeta.none b{background:transparent;color:var(--ink-3);border:1px solid var(--line);font-weight:700}
.dmeta.none em{color:var(--ink-3);font-weight:400}

/* ==========================================================================
   v9 · 配色收敛（2026-10）
   1) 画布加深一档蓝，卡片不再跟背景糊成一片
   2) 首屏统计：四块淡色底 + 本色数字，取代“全白 + 细竖条”
   3) 渐变尺：色条透明度统一，像一把尺子而不是彩笔堆
   4) 卡片描边带一点蓝，白卡有轮廓
   ========================================================================== */

/* ---------- 1. 画布 ---------- */
body:not(.admin) .main{
  background:
    radial-gradient(120% 50% at 44% -12%,rgba(37,99,235,.10),rgba(37,99,235,0) 60%),
    linear-gradient(180deg,#E7EFFA 0%,#E3ECF8 46%,#E9F0F9 100%)}
[data-theme="dark"] body:not(.admin) .main{
  background:
    radial-gradient(120% 50% at 44% -12%,rgba(79,140,247,.10),rgba(79,140,247,0) 60%),
    linear-gradient(180deg,#0A1220 0%,#0B1526 100%)}

/* ---------- 2. 首屏统计 ---------- */
.hero .stat{
  gap:8px;background:transparent;border:0;box-shadow:none;overflow:visible}
.hero .stat>div{
  border:1px solid color-mix(in srgb,var(--stat-c) 20%,var(--line-2));
  border-radius:12px;
  background:color-mix(in srgb,var(--stat-c) 7%,var(--surface));
  box-shadow:0 1px 2px -1px rgba(20,40,80,.06)}
.hero .stat>div::before{display:none}
.hero .stat>div:nth-child(1){--stat-c:#2563EB}
.hero .stat>div:nth-child(2){--stat-c:#0D9488}
.hero .stat>div:nth-child(3){--stat-c:#4F46E5}
.hero .stat>div:nth-child(4){--stat-c:#D97706}
.hero .stat>b,.hero .stat b{color:color-mix(in srgb,var(--stat-c) 78%,var(--ink))}
.hero .stat span{color:color-mix(in srgb,var(--stat-c) 42%,var(--ink-3))}
[data-theme="dark"] .hero .stat>div{
  background:color-mix(in srgb,var(--stat-c) 13%,#0E1A2B);
  border-color:color-mix(in srgb,var(--stat-c) 30%,transparent)}
[data-theme="dark"] .hero .stat b{color:color-mix(in srgb,var(--stat-c) 40%,#F2F6FC)}

/* ---------- 3. 渐变尺 ---------- */
.chalkbar i{opacity:.9;filter:none}
.chalkbar i:hover{transform:scaleY(1.35)}

/* ---------- 4. 卡片轮廓 ---------- */
.item,.pin,.cat,.card,.panel{
  border-color:color-mix(in srgb,var(--brand) 12%,var(--line))}
.item{box-shadow:0 1px 2px -1px rgba(23,49,92,.07)}
.item:hover{box-shadow:0 8px 20px -10px rgba(23,49,92,.28),
                     0 0 0 1px color-mix(in srgb,var(--brand) 22%,transparent)}
[data-theme="dark"] .item{box-shadow:none}

/* 分类页顶部的下载说明条：从土黄底改成冷灰蓝底，只留琥珀图标做提示 */
.warn{
  background:color-mix(in srgb,var(--brand) 5%,var(--surface));
  border-color:color-mix(in srgb,var(--brand) 16%,var(--line-2))}
.warn p{color:var(--ink-2)}
[data-theme="dark"] .warn{
  background:color-mix(in srgb,var(--brand) 9%,#0F1B2C);
  border-color:color-mix(in srgb,var(--brand) 22%,transparent)}

/* 分组标题（解压缩 / 输入法 …）在深色下别糊成一片 */
.sgh b{color:var(--ink);font-weight:800}
[data-theme="dark"] .sgh b{color:#E4EDF9}
[data-theme="dark"] .sgh span{
  color:#A9BBD1;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}

/* ==========================================================================
   v9 · 搜索源：从“没有文字的彩色小棒”改成带名字的胶囊
   ========================================================================== */
.chalk-box{
  background:transparent;border:0;padding:0;gap:4px;align-items:center;
  max-width:100%;overflow:hidden}
.chalk{
  width:auto;height:28px;display:inline-flex;align-items:center;gap:5px;
  padding:0 9px;border-radius:8px;border:1px solid transparent;
  background:transparent;opacity:1;filter:none;transform:none;
  font-size:11.5px;font-weight:650;color:var(--ink-3);
  transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease)}
.chalk i{width:7px;height:7px;border-radius:50%;background:var(--k);flex:0 0 7px}
.chalk::after{display:none}
.chalk:hover{opacity:1;transform:none;filter:none;
  background:color-mix(in srgb,var(--k) 9%,transparent);color:var(--ink-2)}
.chalk.on{
  opacity:1;transform:none;filter:none;box-shadow:none;
  background:color-mix(in srgb,var(--k) 14%,var(--surface));
  border-color:color-mix(in srgb,var(--k) 36%,transparent);
  color:color-mix(in srgb,var(--k) 58%,var(--ink))}
.chalk.on i{box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 22%,transparent)}
.eng-now{display:none}

@media(max-width:720px){
  .chalk-box{display:none}
  .eng-now{display:inline-flex}
}

/* 顶栏天气文字别再被 12ch 截断成“北京 · 天气来…” */
.wt-off{max-width:none;overflow:visible;text-overflow:clip}
.wt-wx{white-space:nowrap}

/* ==========================================================================
   v10 · 搜索源做成四色按钮组 + 网盘下载色 + 多端自适应
   ========================================================================== */

/* ---------- 1. 搜索源：一条带底色的分段控件，四个引擎各自本色 ---------- */
.chalk-box{
  background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:11px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.chalk-box::-webkit-scrollbar{display:none}
.chalk{
  height:28px;padding:0 10px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--ink-2);font-size:11.5px;font-weight:650;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chalk i{width:7px;height:7px;border-radius:50%;background:var(--k);box-shadow:none}
.chalk:hover{
  background:color-mix(in srgb,var(--k) 10%,var(--surface));
  border-color:color-mix(in srgb,var(--k) 34%,transparent);
  color:color-mix(in srgb,var(--k) 68%,var(--ink))}
.chalk.on{
  background:var(--k);border-color:var(--k);color:#fff;
  box-shadow:0 3px 10px -4px color-mix(in srgb,var(--k) 75%,transparent)}
.chalk.on i{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22)}
[data-theme="dark"] .chalk-box{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10)}
[data-theme="dark"] .chalk:hover{background:color-mix(in srgb,var(--k) 22%,transparent)}
[data-theme="dark"] .chalk.on{color:#fff}

/* ---------- 2. 下载方式配色：直链蓝 / 蓝奏绿 / 网盘深蓝 / 发布页灰 ---------- */
.item.has-dl .dl.bd{background:linear-gradient(135deg,#3B5BDB,#2B45B0)}
.dmeta.bd b{background:#3B5BDB}

/* ---------- 3. 平板：卡片两列、首屏统计两列、侧栏收窄 ---------- */
@media(min-width:641px) and (max-width:1024px){
  .items{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .pinned{grid-template-columns:repeat(6,1fr)}
  .hero .stat{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- 4. 大屏：内容区别无限拉宽，卡片最多四列 ---------- */
@media(min-width:1500px){
  .items{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
}


/* 未选中的引擎：文字带本色，四个源一眼分得开 */
.chalk{color:color-mix(in srgb,var(--k) 52%,var(--ink-2))}
.chalk.on{color:#fff}

/* 手机上把四个搜索源放到第二行，保证能点能切（原来被整块藏掉了） */
@media(max-width:720px){
  .search{flex-wrap:wrap;min-height:auto;padding:9px 10px 7px;gap:6px}
  .search .si{order:1}
  .search input{order:2;flex:1 1 60%;min-width:0}
  .search .clr{order:3}

.ad-tab:hover{background:var(--surface);color:var(--ink);

.ad-tab.on{

/* ---------- 1. 最上面那行：数字统计，不再用四个方框 ---------- */

/* ---------- 2. 搜索框 ---------- */
.sbox{
  position:relative;display:flex;align-items:center;

  border:1px solid var(--line);border-radius:999px;

.sbox:hover{border-color:color-mix(in srgb,var(--sc) 30%,var(--line))}
.sbox:focus-within{

.sbox input:focus{border:0;box-shadow:none;outline:0}
.sbox input::placeholder{color:var(--ink-3);font-weight:400}
.sbox input::-webkit-search-cancel-button,
.sbox input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.sbox-clr{
  display:none;flex:0 0 26px;width:26px;height:26px;margin-right:6px;
  align-items:center;justify-content:center;padding:0;
  border:0;border-radius:50%;background:var(--surface-3);color:var(--ink-3);cursor:pointer;
  transition:background .16s,color .16s,transform .18s}
.sbox-clr svg{width:13px;height:13px}
.sbox-clr:hover{background:color-mix(in srgb,var(--ink) 12%,var(--surface-3));color:var(--ink);
  transform:rotate(90deg)}
.sbox.val .sbox-clr{display:inline-flex}
.sbox-go{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:42px;padding:0 20px;margin-left:2px;

  box-shadow:0 8px 18px -10px color-mix(in srgb,var(--sc) 85%,transparent),
             inset 0 1px 0 rgba(255,255,255,.22);

/* 搜索源一排：小字 + 颜色圆点，不再是竖着的粉笔 */

/* ==========================================================================
   v22 · 「教案纸」视觉系统  —— 一次性接管全部观感
   --------------------------------------------------------------------------
   为什么重做：v7 是「深海军蓝侧栏 + 浅蓝内容区」的 AdminLTE 后台模板结构。
   老师打开一个资源导航，看到的却是企业管理后台 —— 气质不对，越调越像模板。

   新方向：印刷品。纸张、墨、发丝线、一处批改红。
   参考对象（胡楚靓工作台）身上真正值得抄的三件事：
     1) 侧栏与内容同色同底，只有一根分隔线 —— 不分层，才像"一个东西"
     2) 每个模块是有边界的卡片 —— 信息有段落感，不糊成一片
     3) 选中态一眼看得见 —— 当前在哪，永远是第一优先级

   色板（5 色，克制到底）
     paper  #FAFAF6   纸白（暖 0.5 度，不是纯白）
     ink    #16191D   墨
     rule   #E5E5DC   发丝线
     red    #B5382C   批改红 —— 唯一强调色，全页出现不超过 5 处
     teal   #2A6178   钢青 —— 链接与图标的次要色
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Token：浅色
   -------------------------------------------------------------------------- */
:root{
  --paper:#FAFAF6;
  --paper-2:#F3F3ED;
  --paper-3:#EFEFE7;

  --bg:#FAFAF6; --bg-2:#F3F3ED;
  --surface:#FFFFFF; --surface-2:#F7F7F2; --surface-3:#EFEFE7;
  --ink-c:#16191D; --ink-2c:#4E5661; --ink-3c:#8A9099;
  --ink:#16191D; --ink-2:#4E5661; --ink-3:#8A9099;
  --line:#E5E5DC; --line-2:#EDEDE6;

  --brand:#2A6178; --brand-ink:#1E4A5C;
  --brand-soft:rgba(42,97,120,.09); --brand-soft-2:rgba(42,97,120,.20);
  --on-brand:#FFFFFF;

  --accent:#B5382C; --accent-soft:rgba(181,56,44,.10);
  --verm:#B5382C; --verm-ink:#8E2A20;
  --verm-soft:rgba(181,56,44,.09); --verm-soft-2:rgba(181,56,44,.22);
  --red:#B5382C;

  --dawn:transparent; --dawn-op:0;

  --sh-1:0 1px 1px rgba(22,25,29,.03);
  --sh-2:0 2px 6px -2px rgba(22,25,29,.07),0 1px 2px rgba(22,25,29,.04);
  --sh-3:0 12px 28px -14px rgba(22,25,29,.18);
  --sh-brand:0 8px 20px -10px rgba(42,97,120,.45);

  /* 顶栏 / 侧栏 —— 现在与纸面同色，不再是"深色画框" */
  --rail-1:#FAFAF6; --rail-2:#F3F3ED; --rail-3:#FAFAF6;
  --rail-ink:#16191D; --rail-ink-2:#4E5661; --rail-ink-3:#8A9099;
  --rail-line:#E5E5DC;
  --rail-hover:rgba(22,25,29,.045);
  --rail-on:rgba(22,25,29,.055);

  --sc:#2A6178; --sc-soft:rgba(42,97,120,.10);

  /* 字体三职 */
  --ff:-apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,
       "Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  --ff-num:ui-monospace,"SF Mono","Cascadia Mono","Consolas","Roboto Mono",monospace;
  --ff-kai:"Kaiti SC","KaiTi","STKaiti","FangSong","SimSun",serif;

  --r:10px; --r2:8px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

/* --------------------------------------------------------------------------
   2. Token：深色（墨纸）
   -------------------------------------------------------------------------- */
[data-theme="dark"]{
  --paper:#131518; --paper-2:#171A1E; --paper-3:#1E2227;
  --bg:#131518; --bg-2:#171A1E;
  --surface:#171A1E; --surface-2:#1B1F24; --surface-3:#22272D;
  --ink-c:#E9E6DF; --ink-2c:#A8AFB8; --ink-3c:#767E88;
  --ink:#E9E6DF; --ink-2:#A8AFB8; --ink-3:#767E88;
  --line:#2A2F36; --line-2:#232830;

  --brand:#7FB2C6; --brand-ink:#A9CFDE;
  --brand-soft:rgba(127,178,198,.13); --brand-soft-2:rgba(127,178,198,.28);
  --on-brand:#0E1418;

  --accent:#E0685C; --accent-soft:rgba(224,104,92,.13);
  --verm:#E0685C; --verm-ink:#F09085;
  --verm-soft:rgba(224,104,92,.12); --verm-soft-2:rgba(224,104,92,.28);
  --red:#E0685C;

  --sh-1:0 1px 1px rgba(0,0,0,.35);
  --sh-2:0 2px 8px -2px rgba(0,0,0,.5);
  --sh-3:0 14px 34px -16px rgba(0,0,0,.75);
  --sh-brand:0 8px 20px -10px rgba(0,0,0,.6);

  --rail-1:#131518; --rail-2:#171A1E; --rail-3:#131518;
  --rail-ink:#E9E6DF; --rail-ink-2:#A8AFB8; --rail-ink-3:#767E88;
  --rail-line:#2A2F36;
  --rail-hover:rgba(255,255,255,.05);
  --rail-on:rgba(255,255,255,.07);

  --sc:#7FB2C6; --sc-soft:rgba(127,178,198,.14);
}

/* 主内容区：纸面，不再有蓝色顶光渐变 */

/* --------------------------------------------------------------------------
   3. 顶栏：纸面 + 一根发丝线，不用阴影

.wt{

.wt-help{color:var(--ink-3)!important}
.wt-off{color:var(--ink-3)!important}

/* --------------------------------------------------------------------------
   4. 侧栏：与纸面同色，只有一根右边界线。选中 = 批改红左条
   -------------------------------------------------------------------------- */
body:not(.admin) .side{
  background:transparent!important;
  border-right:1px solid var(--line)!important;
  border-radius:0!important;
  box-shadow:none!important;
  padding-top:6px;
}
body:not(.admin) .side::-webkit-scrollbar-thumb{background:var(--line)!important}
body:not(.admin) .side::-webkit-scrollbar-thumb:hover{background:var(--ink-3)!important}

.side .grp-t{
  color:var(--ink-3)!important;
  font-size:10.5px!important;
  font-weight:700;
  letter-spacing:.16em!important;
  text-transform:none;
  padding-left:14px;
}
.side .nav-i{
  color:var(--ink-2)!important;
  border-radius:7px!important;
  font-weight:500;
  transition:background .16s var(--ease),color .16s var(--ease);
}
.side .nav-i .n{color:inherit!important}
.side .nav-i .c{
  color:var(--ink-3)!important;
  opacity:1!important;
  font-family:var(--ff-num);
  font-size:11px;
}
.side .nav-i .nv-ic{
  background:transparent!important;
  color:var(--ink-3)!important;
  box-shadow:none!important;
}
.side .nav-i:not(.on):hover{
  background:var(--paper-2)!important;
  color:var(--ink)!important;
}
.side .nav-i:not(.on):hover .nv-ic{
  background:transparent!important;
  color:var(--kc,var(--ink-2))!important;
}

/* 选中：淡底 + 红左条 + 墨字，不发光 */
.side .nav-i.on{
  background:var(--paper-2)!important;
  color:var(--ink)!important;
  font-weight:650!important;
  box-shadow:none!important;
}
.side .nav-i.on .n{color:var(--ink)!important}
.side .nav-i.on .c{color:var(--ink-2)!important}
.side .nav-i.on .nv-ic{
  background:transparent!important;
  color:var(--ink)!important;
  box-shadow:none!important;
}
.side .nav-pill{
  background:var(--red)!important;
  box-shadow:none!important;
  width:2.5px!important;
  border-radius:0 2px 2px 0!important;
  opacity:1!important;
}
.side .nav-sep{background:var(--line)!important}

.side .nav-tip{
  background:transparent!important;
  border-color:var(--line)!important;
  color:var(--ink-3)!important;
}
.side .nav-tip b{color:var(--ink-2)!important}
.side .nav-tip kbd{
  background:var(--paper-2)!important;
  border-color:var(--line)!important;
  color:var(--ink-2)!important;
}

/* --------------------------------------------------------------------------
   5. Hero：不再是一块渐变色卡，就是纸面上的一段字
   -------------------------------------------------------------------------- */
.hero{
  background:none!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
  padding:30px 0 26px!important;
  margin-bottom:0!important;
  display:grid;
  grid-template-columns:minmax(0,1fr) 306px;
  gap:44px;
  align-items:start;
  border-bottom:1px solid var(--line)!important;
}
@media(max-width:1080px){
  .hero{grid-template-columns:1fr;gap:24px}
}
.hero-l{min-width:0}
.hero .dawn{display:none!important}

/* ---- 首屏右栏：我的工作台 · 墨色卡片（全页唯一的反色块，用来定视觉重心） ---- */
.wbcard{
  background:var(--ink);
  color:var(--paper);
  border-radius:12px;
  padding:18px 18px 14px;
  box-shadow:0 14px 34px -22px rgba(22,25,29,.55);
  position:relative;
  overflow:hidden;
  align-self:end;              /* 与左栏底部（搜索框）对齐，卡才站得住 */
}
.wbcard::after{
  content:'';
  position:absolute;right:-40px;top:-40px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.10),transparent 68%);
  pointer-events:none;
}
.wb-h{
  display:flex;align-items:baseline;gap:8px;
  font-size:14px;font-weight:700;
  letter-spacing:-.01em;
  padding:0 2px 11px;
  margin-bottom:4px;
  border-bottom:1px solid rgba(255,255,255,.14);
}
.wb-h small{
  margin-left:auto;
  font-size:10.5px;font-weight:500;
  color:rgba(255,255,255,.45);
  letter-spacing:.02em;
}
.wb-i{
  display:flex;align-items:center;gap:10px;
  padding:10px 8px;margin:0 -8px;
  border-radius:8px;
  color:inherit;
  text-decoration:none;
  transition:background .16s var(--ease);
}
.wb-i:hover{background:rgba(255,255,255,.09)}
.wb-ic{
  flex:0 0 28px;width:28px;height:28px;
  display:grid;place-items:center;
  border-radius:7px;
  background:rgba(255,255,255,.10);
  color:rgba(255,255,255,.92);
}
.wb-ic svg{width:15px;height:15px}
.wb-tx{min-width:0;flex:1}
.wb-tx b{
  display:block;
  font-size:12.8px;font-weight:650;
  letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wb-tx i{
  display:block;
  font-style:normal;
  font-size:10.8px;
  line-height:1.45;
  color:rgba(255,255,255,.50);
  margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wb-ar{
  flex:0 0 auto;
  color:rgba(255,255,255,.32);
  font-size:13px;
  transition:transform .18s var(--ease),color .18s var(--ease);
}
.wb-i:hover .wb-ar{transform:translateX(2px);color:rgba(255,255,255,.8)}
/* 深色主题下墨卡变浅底，仍保持"反色块"关系 */
[data-theme="dark"] .wbcard{box-shadow:0 14px 34px -22px rgba(0,0,0,.8)}
[data-theme="dark"] .wb-h{border-bottom-color:rgba(0,0,0,.16)}
[data-theme="dark"] .wb-h small{color:rgba(0,0,0,.45)}
[data-theme="dark"] .wb-i:hover{background:rgba(0,0,0,.07)}
[data-theme="dark"] .wb-ic{background:rgba(0,0,0,.09);color:rgba(0,0,0,.8)}
[data-theme="dark"] .wb-tx i{color:rgba(0,0,0,.5)}
[data-theme="dark"] .wb-ar{color:rgba(0,0,0,.3)}
[data-theme="dark"] .wb-i:hover .wb-ar{color:rgba(0,0,0,.75)}

/* 顶部一行数据：等宽数字 + 细竖线分隔，安静地待着 */
.hero .kpi{
  display:flex;flex-wrap:wrap;align-items:center;gap:0;
  font-size:12.5px;color:var(--ink-3);
  letter-spacing:.005em;
  margin:0 0 20px!important;
  padding:0;
}
.hero .kpi .ki{
  display:inline-flex;align-items:baseline;gap:4px;
  color:var(--ink-3);
  padding:0;
}
.hero .kpi .ki b{
  font-family:var(--ff-num);
  font-size:13.5px;font-weight:600;
  color:var(--ink);
  letter-spacing:-.02em;
}
.hero .kpi .kd{
  display:inline-block;
  width:1px;height:10px;
  background:var(--line);
  margin:0 11px;
  font-size:0;color:transparent;
  align-self:center;
}
.hero .kpi a.ki{border-bottom:0}
.hero .kpi a.ki:hover b{color:var(--red)}

.hero h1{
  position:relative;
  padding-top:19px;
  font-size:clamp(30px,3.15vw,41px)!important;
  line-height:1.16!important;
  letter-spacing:-.028em!important;
  font-weight:800!important;
  color:var(--ink)!important;
  margin:0 0 12px!important;
  max-width:26em!important;
}
/* 章节起首的那一笔红：全站识别符，只在首屏出现一次 */
.hero h1::before{
  content:'';
  position:absolute;left:3px;top:0;
  width:26px;height:2px;
  background:var(--red);
  border-radius:1px;
}
.hero h1 em{
  font-style:normal!important;
  color:var(--ink)!important;
}
/* 强调不靠换色也不靠下划线 —— 靠字号、字重、负字距。删掉装饰，才像印刷品 */
.hero h1 em::after{display:none!important}
.hero p{
  font-size:14px!important;
  line-height:1.72!important;
  color:var(--ink-2)!important;
  max-width:none!important;
  margin:0 0 22px!important;
}

/* --------------------------------------------------------------------------
   6. 搜索框：纸上的一个凹槽 —— 白面 + 墨线 + 聚焦时红环
   -------------------------------------------------------------------------- */
.sbox{
  background:var(--surface)!important;
  border:1px solid var(--ink-3)!important;
  border-radius:9px!important;
  box-shadow:none!important;
  max-width:640px!important;
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
}
.sbox:focus-within{
  border-color:var(--ink)!important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 12%,transparent)!important;
}
.sbox-ic{color:var(--ink-3)!important}
.sbox input{
  background:transparent!important;
  font-size:14.5px!important;
  color:var(--ink)!important;
  letter-spacing:-.005em;
}
.sbox input::placeholder{color:var(--ink-3)!important}
.sbox-go{
  background:var(--ink)!important;
  color:var(--paper)!important;
  border-radius:6px!important;
  box-shadow:none!important;
  font-weight:600!important;
  letter-spacing:.01em;
}
.sbox-go:hover{background:var(--red)!important;color:#fff!important}
.sbox-go svg{display:none}

.sbox-foot{margin-top:9px;gap:8px}
.sbf-lbl{
  color:var(--ink-3)!important;
  font-size:10.5px!important;
  font-weight:700;letter-spacing:.14em;
}
.sbf-engs{gap:2px!important}
.eng{
  border:1px solid transparent!important;
  background:transparent!important;
  color:var(--ink-3)!important;
  border-radius:5px!important;
  font-size:12px!important;
  padding:2px 7px!important;
  box-shadow:none!important;
}
.eng i{display:none!important}
.eng:hover{background:var(--paper-2)!important;color:var(--ink)!important}
.eng.on{
  background:var(--paper-2)!important;
  color:var(--ink)!important;
  border-color:var(--line)!important;
  font-weight:600;
}
.sbf-more{
  border:1px solid transparent!important;
  background:transparent!important;
  color:var(--ink-3)!important;
  font-size:12px!important;
  border-radius:5px!important;
}
.sbf-more:hover{background:var(--paper-2)!important;color:var(--ink)!important}
.sbf-kb{color:var(--ink-3)!important;font-size:11.5px!important}
.sbf-kb kbd{
  background:var(--paper-2)!important;
  border:1px solid var(--line)!important;
  border-radius:4px!important;
  color:var(--ink-2)!important;
  font-family:var(--ff-num);
  padding:0 5px!important;
}

/* 粉笔彩条：删掉。彩色渐变对内容无任何编码意义，只是装饰噪音 */
.chalkbar{display:none!important}

/* --------------------------------------------------------------------------
   7. 区块标题：页边红批注 —— 全站的签名元素
   -------------------------------------------------------------------------- */
.sec{margin:0 0 30px!important;padding-top:26px}
.sec-h{
  display:flex;align-items:baseline;gap:10px;
  margin:0 0 14px!important;
  padding:0!important;
  border:0!important;
}
.sec-h h2{
  position:relative;
  font-size:15.5px!important;
  font-weight:800!important;
  letter-spacing:.01em;
  color:var(--ink)!important;
  padding-left:11px!important;
  margin:0!important;
}
/* 红批注竖线：老师改作业时在页边画的那一笔 */
.sec-h h2::before{
  content:'';
  position:absolute;left:0;top:.24em;
  width:2px;height:.92em;
  background:var(--red);
  border-radius:1px;
  transition:height .22s var(--ease),top .22s var(--ease);
}
.sec:hover .sec-h h2::before{height:1.12em;top:.14em}
.sec-h .sub{
  font-size:12px!important;
  color:var(--ink-3)!important;
  letter-spacing:.005em;
}
.sec-h .sp{flex:1}
.sec-h .more{
  font-size:12px!important;
  color:var(--ink-2)!important;
  border-bottom:1px solid var(--line);
  padding-bottom:1px;
}
.sec-h .more:hover{color:var(--red)!important;border-color:var(--red)!important}

/* --------------------------------------------------------------------------
   8. 常用：图标做成"卡片上的印章"，白底方框，hover 才抬手
   -------------------------------------------------------------------------- */
.pinned{
  display:grid!important;
  grid-template-columns:repeat(6,minmax(0,1fr))!important;
  gap:8px!important;
}
@media(min-width:1080px){
  .pinned{grid-template-columns:repeat(12,minmax(0,1fr))!important}
}
@media(max-width:620px){
  .pinned{grid-template-columns:repeat(4,minmax(0,1fr))!important}
}
.pin{
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-radius:9px!important;
  box-shadow:none!important;
  padding:12px 8px 9px!important;
  transition:border-color .18s var(--ease),transform .18s var(--ease),background .18s var(--ease);
}
.pin:hover{
  border-color:var(--ink-3)!important;
  transform:translateY(-1px);
  box-shadow:none!important;
}
.pin .nm{
  font-size:11.5px!important;
  color:var(--ink-2)!important;
  letter-spacing:.005em;
  margin-top:7px!important;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-align:center;
}
.pin:hover .nm{color:var(--ink)!important}
.pin .star{color:var(--ink-3)!important}
.pin .star.on{color:var(--red)!important}

/* --------------------------------------------------------------------------
   9. 按场景走：五条路径 —— 编号是真的有顺序，所以编号有意义
   -------------------------------------------------------------------------- */
.flows{
  display:grid!important;
  grid-template-columns:repeat(auto-fit,minmax(178px,1fr))!important;
  gap:0!important;
  border-top:1px solid var(--line);
}
.flow{
  background:transparent!important;
  border:0!important;
  border-bottom:1px solid var(--line)!important;
  border-right:1px solid var(--line)!important;
  border-radius:0!important;
  box-shadow:none!important;
  padding:14px 15px 15px!important;
  gap:10px!important;
  min-height:88px;
  align-items:flex-start!important;
  transition:background .18s var(--ease);
}
.flow:first-child{border-left:1px solid var(--line)!important}
.flow:hover{
  background:var(--paper-2)!important;
  border-color:var(--line)!important;
}
.flow .fi{
  width:28px!important;height:28px!important;
  border-radius:6px!important;
  background:var(--paper-2)!important;
  border:1px solid var(--line)!important;
  color:var(--ink-2)!important;
  box-shadow:none!important;
  transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease);
}
.flow:hover .fi{
  background:var(--ink)!important;
  border-color:var(--ink)!important;
  color:var(--paper)!important;
}
.flow .ft{
  font-size:13.5px!important;
  font-weight:700!important;
  color:var(--ink)!important;
  letter-spacing:-.005em;
}
.flow .fd{
  font-size:11px!important;
  color:var(--ink-3)!important;
  margin-top:4px!important;
  line-height:1.6!important;
  letter-spacing:.005em;
}

/* --------------------------------------------------------------------------
   10. 全部分类：印刷目录卡 —— 细框、编号、克制的分类色
   -------------------------------------------------------------------------- */
.catgrid{
  display:grid!important;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr))!important;
  grid-auto-rows:1fr!important;      /* 每行等高，网格才是"齐"的 */
  gap:10px!important;
}
/* 取消「大卡跨两列」：跨列会把网格打成豁口，一行高一行矮，看着就乱 */
.catcard.big{grid-column:auto!important;padding:15px 16px!important}

.catcard{
  position:relative;
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-radius:10px!important;
  box-shadow:none!important;
  padding:15px 16px!important;
  height:100%;
  transition:border-color .18s var(--ease),transform .18s var(--ease);
}
.catcard:hover{
  border-color:var(--ink-3)!important;
  transform:translateY(-1px);
  box-shadow:none!important;
}

.catcard .cc-ic{
  background:transparent!important;
  color:var(--cc,var(--ink-2))!important;
  border:0!important;
  box-shadow:none!important;
  width:22px!important;height:22px!important;
  flex:0 0 22px!important;
  opacity:1;
  filter:saturate(.72);
  margin-top:1px;
}
.catcard .cc-ic svg{width:22px!important;height:22px!important}
.catcard .cc-n{
  font-size:14.5px!important;
  font-weight:700!important;
  color:var(--ink)!important;
  letter-spacing:-.005em;
}
.catcard.big .cc-n{font-size:15.5px!important}
.catcard .cc-c{
  font-family:var(--ff-num);
  font-size:11px!important;
  color:var(--ink-3)!important;
  background:var(--paper-2)!important;
  border:1px solid var(--line)!important;
  border-radius:4px!important;
  padding:1px 5px!important;
}
.catcard .cc-d{
  font-size:12.5px!important;
  color:var(--ink-2)!important;
  line-height:1.6!important;
  margin-top:5px!important;
}
.catcard .cc-tags{gap:5px!important;margin-top:9px!important}
.catcard .cc-tag{
  font-size:11px!important;
  color:var(--ink-3)!important;
  background:transparent!important;
  border:1px solid var(--line)!important;
  border-radius:4px!important;
  padding:1px 6px!important;
}
.catcard:hover .cc-tag{
  color:var(--ink-2)!important;
  border-color:var(--line)!important;
}

/* --------------------------------------------------------------------------
   11. 页脚
   -------------------------------------------------------------------------- */
.foot-note{
  font-size:12px!important;
  color:var(--ink-3)!important;
  line-height:1.8!important;
  border-top:1px solid var(--line)!important;
  padding-top:16px!important;
  margin:34px 0 10px!important;
  max-width:60em;
}

/* --------------------------------------------------------------------------
   12. 通用：卡片 / 列表项 / 按钮 / 面板 —— 统一成同一种纸感
   -------------------------------------------------------------------------- */
.item,.cc,.panel,.card,
.search input,.search{
  border-color:var(--line)!important;
  box-shadow:none!important;
}
.item{
  background:var(--surface)!important;
  border-radius:9px!important;
}
.item:hover{
  border-color:var(--ink-3)!important;
  box-shadow:none!important;
  background:var(--surface)!important;
}
.item .nm{color:var(--ink)!important;font-weight:650!important}
.item .ds{color:var(--ink-2)!important}
.panel,.card{
  background:var(--surface)!important;
  border-radius:10px!important;
}

.btn{
  border-radius:7px!important;
  box-shadow:none!important;
  font-weight:600;
  letter-spacing:.005em;
}
.btn.pri{
  background:var(--ink)!important;
  border-color:var(--ink)!important;
  color:var(--paper)!important;
  box-shadow:none!important;
}
.btn.pri:hover{
  background:var(--red)!important;
  border-color:var(--red)!important;
  color:#fff!important;
}
.btn.danger{color:var(--verm-ink)!important;border-color:var(--verm-soft-2)!important}

/* 表单控件 */
input[type=text],input[type=search],input[type=number],select,textarea{
  border-color:var(--line)!important;
  background:var(--surface)!important;
  border-radius:7px!important;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--ink-3)!important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 10%,transparent)!important;
  outline:none!important;
}

/* 焦点可见（键盘用户） */
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--red);
  outline-offset:2px;
  border-radius:5px;
}

/* 版本标记 */
.ver-chip{
  color:var(--ink-2)!important;
  background:var(--paper-2)!important;
  border:1px solid var(--line)!important;
  font-family:var(--ff-num);
  font-weight:600!important;
}

/* --------------------------------------------------------------------------
   13. 移动端
   -------------------------------------------------------------------------- */
@media(max-width:900px){
  body:not(.admin) .side{
    background:var(--paper)!important;
    border-right:1px solid var(--line)!important;
    border-radius:0!important;
    box-shadow:18px 0 50px -30px rgba(22,25,29,.4)!important;
  }
  .drawer-mask{background:rgba(22,25,29,.42)!important}
  .hero{padding:20px 0 2px!important}
  .hero h1{font-size:26px!important}
  .catgrid{grid-template-columns:1fr!important}
  .flows{grid-template-columns:1fr!important}
  .flow:first-child{border-left:1px solid var(--line)!important}
  .flow{border-right:none!important}
}

/* 减少动效 */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ==========================================================================
   14. 分类页 / 搜索结果页 / 收藏页 —— 把内页也拉回同一套纸墨语言
   ========================================================================== */

/* 面包屑：小字，一条发丝线交代层级 */
.crumb{
  font-size:12px!important;
  color:var(--ink-3)!important;
  margin:0 0 10px!important;
  padding:0!important;
}
.crumb a{color:var(--ink-2)!important}
.crumb a:hover{color:var(--red)!important}
.crumb .cr-arrow{opacity:.4;width:12px;height:12px}

/* 分类头：原来是一块分类色渐变横幅，现在退回纸面，色只留在图标上 */
.cat-head{
  background:none!important;
  background-image:none!important;
  border:0!important;
  border-bottom:1px solid var(--line)!important;
  border-radius:0!important;
  box-shadow:none!important;
  padding:2px 0 18px!important;
  margin:0 0 18px!important;
  gap:13px!important;
  display:flex!important;
  align-items:center!important;
}
.cat-head .cc-ic{
  background:transparent!important;
  color:var(--cc,var(--ink-2))!important;
  border:0!important;
  box-shadow:none!important;
  width:30px!important;height:30px!important;
  flex:0 0 30px!important;
  filter:saturate(.7);
}
.cat-head .cc-ic svg{width:30px!important;height:30px!important}
.cat-head h1{
  font-size:29px!important;
  font-weight:800!important;
  letter-spacing:-.025em!important;
  color:var(--ink)!important;
  line-height:1.2!important;
  margin:0!important;
}
.cat-head p{
  font-size:12.5px!important;
  color:var(--ink-3)!important;
  margin:4px 0 0!important;
  line-height:1.55!important;
}

/* 筛选 chip：方一点，别做成药丸 */
.chips{gap:6px!important;margin:14px 0 6px!important}
.chip{
  border:1px solid var(--line)!important;
  background:transparent!important;
  color:var(--ink-2)!important;
  border-radius:6px!important;
  font-size:12px!important;
  padding:3px 9px!important;
  box-shadow:none!important;
}
.chip:hover{border-color:var(--ink-3)!important;background:var(--paper-2)!important;color:var(--ink)!important}
.chip.on{
  background:var(--ink)!important;
  border-color:var(--ink)!important;
  color:var(--paper)!important;
  font-weight:600!important;
}
.chip .n{opacity:.6;font-family:var(--ff-num);font-size:11px}

/* 分组标题 */
.sgh{
  margin:22px 0 9px!important;
  border-bottom:1px solid var(--line)!important;
  padding-bottom:7px!important;
}
.sgh b{
  font-size:13px!important;
  font-weight:700!important;
  color:var(--ink)!important;
  letter-spacing:.005em;
}
.sgh span{
  font-family:var(--ff-num);
  font-size:11px!important;
  color:var(--ink-3)!important;
  background:transparent!important;
  border:0!important;
}
.sgh i{background:var(--red)!important;width:2px!important;border-radius:1px!important;opacity:.9}

/* 站点列表：等宽等高，网格才整齐 */
.items{
  display:grid!important;
  grid-template-columns:repeat(auto-fill,minmax(330px,1fr))!important;
  grid-auto-rows:1fr!important;
  gap:8px!important;
}
.item{
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-radius:9px!important;
  box-shadow:none!important;
  height:100%;
  transition:border-color .16s var(--ease),transform .16s var(--ease);
}
.item:hover{
  border-color:var(--ink-3)!important;
  transform:translateY(-1px);
  box-shadow:none!important;
  background:var(--surface)!important;
}
.item .nm{font-size:13.5px!important;font-weight:650!important;color:var(--ink)!important;letter-spacing:-.005em}
.item .ds{font-size:11.5px!important;color:var(--ink-3)!important;line-height:1.55!important}
.item .lg,.item .lg2{border-radius:8px!important;box-shadow:none!important}

/* 免费 / 开源 / 部分 —— 三种状态统一成同一种描边徽章，只用文字区分 */
.item .bg,
.item .bg.free,.item .bg.open,.item .bg.part,.item .bg.pay{
  background:transparent!important;
  border:1px solid var(--line)!important;
  color:var(--ink-3)!important;
  border-radius:4px!important;
  font-size:10px!important;
  font-weight:500!important;
  padding:0 4px!important;
  letter-spacing:.02em;
}

/* 版本号、来源等小标记 */
.item .meta,.item .mt{color:var(--ink-3)!important}

/* 收藏星 */
.fav{color:var(--ink-3)!important}
.fav.on{color:var(--red)!important}

/* ==========================================================================
   15. 管理后台登录
   ========================================================================== */
.login .card{
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-radius:12px!important;
  box-shadow:0 18px 46px -30px rgba(22,25,29,.35)!important;
}
.login .mark{
  background:var(--paper-2)!important;
  background-image:none!important;
  color:var(--ink)!important;
  border:1px solid var(--line)!important;
  border-radius:10px!important;
  box-shadow:none!important;
}
.login .mark svg{width:22px;height:22px}
.login h2{color:var(--ink)!important;letter-spacing:-.02em}
.login .s{color:var(--ink-3)!important;line-height:1.7!important}
.login .s b{color:var(--ink-2)!important;font-family:var(--ff-num)}
.pwforgot summary{
  color:var(--ink-2)!important;
  font-size:12px!important;
}
.pwforgot summary:hover{color:var(--ink)!important}
.pwforgot p{color:var(--ink-3)!important;line-height:1.75!important}
.pwforgot code{
  background:var(--paper-2)!important;
  border:1px solid var(--line)!important;
  color:var(--ink-2)!important;
  font-family:var(--ff-num);
  border-radius:4px!important;
}
.login .err{color:var(--red)!important}

/* ==========================================================================
   16. 深色：把层次拉开，卡片要看得见
   ========================================================================== */
[data-theme="dark"]{
  --bg:#101215; --paper:#101215;
  --surface:#181C21; --surface-2:#1D2228; --surface-3:#232931;
  --line:#2C333C; --line-2:#242A32;
  --rail-line:#2C333C;
}
[data-theme="dark"] .item,[data-theme="dark"] .catcard,[data-theme="dark"] .pin{
  background:var(--surface)!important;
}
[data-theme="dark"] .wbcard{background:var(--ink)}

/* ==========================================================================
   17. 收口：站点/分类的悬停位移在触摸设备上没意义
   ========================================================================== */
@media (hover:none){
  .item:hover,.catcard:hover,.pin:hover{transform:none}
}

/* 18. 清掉遗留的装饰性伪元素：彩色光斑、悬停色条、图标浮动动画 */
.cat-head::after,.cat-head::before{display:none!important}
.item::before,.item::after{display:none!important}
.cat-head .cc-ic{animation:none!important;box-shadow:none!important}
.catcard::before{display:none!important}
.sec-h::after,.hero::after{display:none!important}

/* 19. 精细收口 */
/* 首屏搜索框撑满左栏，别在半路停住 */
.hero .sbox{max-width:none!important}
.hero h1{padding-top:16px}
/* 分类卡：数量紧跟标题，别甩到最右边 */
.catcard .cc-h{justify-content:flex-start!important;gap:8px!important}
.catcard .cc-h .cc-c{margin-left:0!important}
/* 工作台卡：撑满右栏高度，站得住 */
.wbcard{padding:20px 20px 16px!important}
.wb-i{padding:12px 9px!important}
.wb-h{padding-bottom:12px!important}

/* 20. 深色下的工作台卡：不做反色白块，改成比背景亮一档的凸起面板 */
[data-theme="dark"] .wbcard{
  background:#1C2229!important;
  color:var(--ink)!important;
  border:1px solid var(--line);
  box-shadow:0 18px 40px -26px rgba(0,0,0,.9)!important;
}
[data-theme="dark"] .wbcard::after{
  background:radial-gradient(circle,rgba(255,255,255,.05),transparent 68%)!important;
}
[data-theme="dark"] .wb-h{border-bottom-color:var(--line)!important}
[data-theme="dark"] .wb-h small{color:var(--ink-3)!important}
[data-theme="dark"] .wb-i:hover{background:rgba(255,255,255,.06)!important}
[data-theme="dark"] .wb-ic{
  background:rgba(255,255,255,.08)!important;
  color:var(--ink)!important;
}
[data-theme="dark"] .wb-tx b{color:var(--ink)!important}
[data-theme="dark"] .wb-tx i{color:var(--ink-3)!important}
[data-theme="dark"] .wb-ar{color:var(--ink-3)!important}
[data-theme="dark"] .wb-i:hover .wb-ar{color:var(--ink)!important}

/* 21. 中等宽度（≤1080）：hero 收成一栏，工作台卡改成两条并排，别占满一屏 */
@media(max-width:1080px) and (min-width:641px){
  .wbcard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 10px;
    padding:14px 14px 10px;
  }
  .wb-h{grid-column:1 / -1;padding-bottom:9px;margin-bottom:2px}
  .wb-i{padding:9px 8px!important}
  .hero{padding-bottom:18px!important}
}

/* 22. 触屏设备：收藏按钮不能只在 hover 时出现（平板 / 触屏本点不到） */
@media (hover:none), (pointer:coarse){
  .item .fav{display:grid!important;opacity:.5}
  .item .fav.on{opacity:1}
  .pin .star{opacity:.55}
  .pin .star.on{opacity:1}
}

/* ==========================================================================
   v23 ·「冬阳」视觉系统 —— 商山、丹江、冬日暖阳
   --------------------------------------------------------------------------
   为什么再改一次：v22 把页面做成了「纸 + 墨」的印刷品，方向没错，但把颜色
   一起收干掉了 —— 全页只剩黑灰，卡片之间没有区别，17 个分类长得一模一样。
   老师打开第一眼是"没做完"，不是"高级"。

   这一版保留 v22 的结构（同底侧栏 / 有边界的卡片 / 一眼可见的选中态），
   把颜色重新请回来，且让颜色带意义：

     色板
       宣纸  #FBF7EF   暖白纸，不是纯白
       墨    #1D2320   正文
       冬阳  #D97A2B   主色：按钮、选中、强调
       丹江  #1F6F6B   次色：链接、数据、图标底
       朱砂  #B23A2E   只用于收藏与警示
     分类色沿用数据里的 c.co，以「12% 淡底 + 原色图标」的形式出现，
     一眼能分出是"备课"还是"机房"，又不至于花。

   签名元素：首屏一道商山剪影 + 一枚冬日暖阳，把"商洛"写进构图里。
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Token
   -------------------------------------------------------------------------- */
:root{
  --paper:#FBF7EF;
  --paper-2:#F4EEE2;
  --paper-3:#EDE6D8;

  --bg:#FBF7EF; --bg-2:#F4EEE2;
  --surface:#FFFFFF; --surface-2:#FDFBF6; --surface-3:#F6F1E6;
  --ink:#1D2320; --ink-2:#4C544F; --ink-3:#8B918B;
  --ink-c:#1D2320; --ink-2c:#4C544F; --ink-3c:#8B918B;
  --line:#E7DDCB; --line-2:#EFE7D9;

  --sun:#D97A2B; --sun-2:#B85F1C; --sun-3:#F2B36B;
  --sun-soft:rgba(217,122,43,.10); --sun-soft-2:rgba(217,122,43,.20);
  --dan:#1F6F6B; --dan-2:#164F4C; --dan-soft:rgba(31,111,107,.09);
  --red:#B23A2E; --verm:#B23A2E; --verm-ink:#8E2A20;
  --verm-soft:rgba(178,58,46,.09); --verm-soft-2:rgba(178,58,46,.20);
  --accent:#D97A2B; --accent-soft:rgba(217,122,43,.10);
  --brand:#1F6F6B; --brand-ink:#164F4C; --brand-soft:rgba(31,111,107,.09);

  --sh-1:0 1px 2px rgba(74,52,24,.045);
  --sh-2:0 2px 10px -3px rgba(74,52,24,.10),0 1px 2px rgba(74,52,24,.05);
  --sh-3:0 18px 40px -22px rgba(74,52,24,.30);
  --sh-brand:0 10px 24px -12px rgba(31,111,107,.42);
  --sh-sun:0 8px 20px -10px rgba(217,122,43,.55);

  --rail-1:#FBF7EF; --rail-2:#F4EEE2; --rail-3:#FBF7EF;
  --rail-ink:#1D2320; --rail-ink-2:#4C544F; --rail-ink-3:#8B918B;
  --rail-line:#E7DDCB;
  --rail-hover:rgba(120,90,50,.055);
  --rail-on:rgba(217,122,43,.10);

  --sc:#1F6F6B; --sc-soft:rgba(31,111,107,.10);
}

[data-theme="dark"]{
  --paper:#14171A;
  --paper-2:#1A1E21;
  --paper-3:#20252A;

  --bg:#14171A; --bg-2:#1A1E21;
  --surface:#1B2024; --surface-2:#20262B; --surface-3:#262D32;
  --ink:#EDE7DC; --ink-2:#B0B6B2; --ink-3:#7D857F;
  --ink-c:#EDE7DC; --ink-2c:#B0B6B2; --ink-3c:#7D857F;
  --line:#2C3338; --line-2:#242A2F;

  --sun:#E8914A; --sun-2:#F0A868; --sun-3:#F5C08A;
  --sun-soft:rgba(232,145,74,.14); --sun-soft-2:rgba(232,145,74,.26);
  --dan:#6FAFA8; --dan-2:#8CC6BF; --dan-soft:rgba(111,175,168,.13);
  --red:#DB6A5C; --verm:#DB6A5C; --verm-ink:#EFA096;
  --verm-soft:rgba(219,106,92,.13); --verm-soft-2:rgba(219,106,92,.24);
  --accent:#E8914A; --accent-soft:rgba(232,145,74,.14);
  --brand:#6FAFA8; --brand-ink:#8CC6BF; --brand-soft:rgba(111,175,168,.13);

  --sh-1:0 1px 2px rgba(0,0,0,.30);
  --sh-2:0 2px 12px -3px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);
  --sh-3:0 20px 44px -24px rgba(0,0,0,.85);
  --sh-brand:0 10px 24px -14px rgba(0,0,0,.8);
  --sh-sun:0 8px 22px -12px rgba(232,145,74,.55);

  --rail-1:#14171A; --rail-2:#1A1E21; --rail-3:#14171A;
  --rail-ink:#EDE7DC; --rail-ink-2:#B0B6B2; --rail-ink-3:#7D857F;
  --rail-line:#2C3338;
  --rail-hover:rgba(255,255,255,.055);
  --rail-on:rgba(232,145,74,.14);

  --sc:#6FAFA8; --sc-soft:rgba(111,175,168,.14);
}

/* 主区：纸面 + 一层极淡的暖光，避免"死白" */
.main,body:not(.admin) .main,
[data-theme="dark"] .main,[data-theme="dark"] body:not(.admin) .main{
  background:
    radial-gradient(900px 420px at 88% -10%, rgba(217,122,43,.07), transparent 70%),
    radial-gradient(700px 360px at 6% 4%, rgba(31,111,107,.045), transparent 72%),
    var(--paper)!important;
}
[data-theme="dark"] .main{
  background:
    radial-gradient(900px 420px at 88% -10%, rgba(232,145,74,.055), transparent 70%),
    var(--paper)!important;
}
.cont{max-width:1200px}

/* --------------------------------------------------------------------------
   2. 顶栏：纸色 + 一枚暖阳标
   -------------------------------------------------------------------------- */
.top{
  background:color-mix(in srgb,var(--paper) 82%,transparent)!important;
  border-bottom:1px solid var(--line-2)!important;
  box-shadow:none!important;
}
.top.stuck{background:color-mix(in srgb,var(--paper) 95%,transparent)!important}
.brand{color:var(--ink)!important;font-weight:700;letter-spacing:.01em}
.brand .mark{
  background:linear-gradient(150deg,var(--sun) 0%,#C4611F 100%)!important;
  color:#FFF8EA!important;
  border-radius:9px!important;
  box-shadow:0 4px 10px -5px rgba(217,122,43,.75)!important;
  width:28px;height:28px;
}
.brand span:nth-child(2){letter-spacing:.06em}
.brand small{
  color:var(--sun-2)!important;
  background:var(--sun-soft)!important;
  border:1px solid var(--sun-soft-2)!important;
  font-family:var(--ff-num)!important;
  font-size:10px!important;
  letter-spacing:.02em;
  border-radius:5px!important;
  padding:1.5px 6px!important;
}
.tbtn{color:var(--ink-2)!important;border-radius:9px!important}
.tbtn:hover{background:var(--sun-soft)!important;color:var(--sun-2)!important}
.tbtn .cnt{box-shadow:0 0 0 2px var(--paper)!important;background:var(--red)!important;color:#fff!important}

.wt{
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-radius:9px!important;
  color:var(--ink-2)!important;
  box-shadow:var(--sh-1);
}
.wt:hover{background:var(--surface-3)!important;border-color:var(--sun-soft-2)!important}
.wt-clk{color:var(--sun-2)!important;font-family:var(--ff-num)!important;letter-spacing:-.01em;font-weight:600}
.wt-date{color:var(--ink-2)!important}

/* --------------------------------------------------------------------------
   3. 侧栏：选中 = 暖阳色块 + 左侧 2px 实条
   -------------------------------------------------------------------------- */
body:not(.admin) .side{
  background:transparent!important;
  border-right:1px solid var(--line-2)!important;
  box-shadow:none!important;
}
.side .grp-t{color:var(--ink-3)!important;letter-spacing:.10em!important;font-size:10.5px!important}
.side .nav-i{border-radius:9px!important;color:var(--ink-2)!important}
.side .nav-i:not(.on):hover{background:var(--rail-hover)!important;color:var(--ink)!important}
.side .nav-i.on{
  background:var(--sun-soft)!important;
  color:var(--sun-2)!important;
  box-shadow:inset 2px 0 0 var(--sun)!important;
}
.side .nav-i.on .n{color:var(--sun-2)!important;font-weight:700}
.side .nav-i.on .c{color:var(--sun-2)!important;opacity:.72}
.side .nav-i.on .nv-ic{color:var(--sun)!important;background:transparent!important}
.side .nav-i .nv-ic{color:var(--ink-3)}
.side .nav-i:not(.on):hover .nv-ic{color:var(--dan)!important}
.side .nav-sep{background:var(--line-2)!important}

/* --------------------------------------------------------------------------
   4. 首屏：一枚冬阳，一道商山
   -------------------------------------------------------------------------- */
.hero{
  position:relative!important;
  display:grid!important;
  grid-template-columns:minmax(0,1fr) 336px!important;
  gap:34px!important;
  align-items:stretch!important;
  background:
    radial-gradient(620px 300px at 82% -6%, rgba(242,179,107,.34), transparent 68%),
    radial-gradient(760px 380px at 10% -20%, rgba(255,255,255,.55), transparent 70%),
    linear-gradient(168deg,#FFF9ED 0%,#FDF2E1 46%,#FBF6EC 100%)!important;
  border:1px solid var(--line)!important;
  border-radius:20px!important;
  box-shadow:0 2px 14px -8px rgba(120,82,36,.22)!important;
  padding:32px 34px 96px!important;
  margin:14px 0 26px!important;
  overflow:hidden!important;
}
[data-theme="dark"] .hero{
  background:
    radial-gradient(620px 300px at 82% -6%, rgba(232,145,74,.16), transparent 68%),
    linear-gradient(168deg,#1C2124 0%,#191E21 50%,#161A1D 100%)!important;
  border-color:var(--line)!important;
}

/* 山与江：贴着首屏底边的一道剪影，只在视觉上"落地"，不抢字 */
.hero-art{
  position:absolute!important;
  left:0;right:0;bottom:0;
  height:104px;
  pointer-events:none;
  z-index:0;
  opacity:1;
}
.hero-art svg{width:100%;height:100%;display:block}
.hero-l{position:relative;z-index:2;min-width:0}
.hero .wbcard{position:relative;z-index:3}

/* 数据行：数字上色，别再做成一排灰字 */
.hero .kpi{
  display:flex!important;flex-wrap:wrap;align-items:baseline;gap:0 10px!important;
  margin:0 0 20px!important;
  font-size:12px!important;color:var(--ink-3)!important;
  letter-spacing:.01em;
}
.hero .kpi .ki{color:var(--ink-3)!important}
.hero .kpi .ki b{
  font-family:var(--ff-num)!important;
  font-size:14.5px!important;
  color:var(--sun-2)!important;
  font-weight:700;
  margin-right:2px;
  letter-spacing:-.01em;
}
.hero .kpi .ki:nth-child(3) b{color:var(--dan)!important}
.hero .kpi a.ki b{color:var(--red)!important}
.hero .kpi a.ki:hover b{text-decoration:underline;text-underline-offset:3px}
.hero .kpi .kd{
  width:3px;height:3px;border-radius:50%;
  background:var(--line)!important;
  display:inline-block;vertical-align:middle;
  font-size:0;color:transparent;
}

/* 标题：冬阳橙垫在字下，像暖光打在纸上 */
.hero h1{
  font-size:clamp(30px,3.05vw,42px)!important;
  line-height:1.18!important;
  letter-spacing:-.022em!important;
  font-weight:800!important;
  color:var(--ink)!important;
  margin:0 0 14px!important;
  max-width:20em!important;
  padding-top:0!important;
}
.hero h1 em{
  font-style:normal!important;
  color:var(--ink)!important;
  white-space:nowrap;
  position:relative;
  z-index:0;
}
.hero h1 em::after{
  content:''!important;
  position:absolute;left:-2px;right:-2px;bottom:.02em;
  height:.34em;
  background:linear-gradient(90deg,rgba(242,179,107,.85),rgba(242,179,107,.35))!important;
  border-radius:2px;
  z-index:-1;
  display:block!important;
}
.hero p{
  font-size:14px!important;
  line-height:1.78!important;
  color:var(--ink-2)!important;
  max-width:40em!important;
  margin:0 0 22px!important;
}

/* --------------------------------------------------------------------------
   5. 搜索框：白底 + 冬阳色按钮
   -------------------------------------------------------------------------- */
.sbox{
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-radius:14px!important;
  box-shadow:var(--sh-2)!important;
  max-width:none!important;
  padding:5px 5px 5px 14px!important;
  transition:box-shadow .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease);
}
.sbox:focus-within{
  border-color:var(--sun-soft-2)!important;
  box-shadow:0 0 0 4px var(--sun-soft),var(--sh-2)!important;
}
.sbox-ic{color:var(--sun)!important}
.sbox input{font-size:15px!important;color:var(--ink)!important;background:transparent!important}
.sbox input::placeholder{color:var(--ink-3)!important}
.sbox-go{
  background:linear-gradient(150deg,var(--sun),#C4611F)!important;
  color:#FFF8EA!important;
  border-radius:10px!important;
  box-shadow:var(--sh-sun)!important;
}
.sbox-go:hover{background:linear-gradient(150deg,#E88A3A,#B0531A)!important;color:#fff!important}
.eng{border-top:1px dashed var(--line)!important;margin-top:2px!important}
.eng a,.eng button{color:var(--ink-3)!important}
.eng a:hover,.eng button:hover{color:var(--sun-2)!important}
.sbf-ic{color:var(--ink-3)!important}
.sbf.on{background:var(--sun-soft)!important;color:var(--sun-2)!important}

/* --------------------------------------------------------------------------
   6. 工作台入口卡：深墨底 + 暖阳描边，首屏唯一的深色块
   -------------------------------------------------------------------------- */
.wbcard{
  background:linear-gradient(165deg,#232B27 0%,#171D1A 100%)!important;
  color:#F3EDE1!important;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px!important;
  box-shadow:0 20px 44px -26px rgba(29,35,32,.75)!important;
  padding:18px 18px 14px!important;
}
.wbcard::before{
  content:'';position:absolute;right:-40px;top:-56px;
  width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,179,107,.34),transparent 66%);
  pointer-events:none;
}
.wb-h{
  color:#F6EFE2!important;
  font-size:13px!important;font-weight:700;
  letter-spacing:.02em;
  border-bottom:1px solid rgba(255,255,255,.09)!important;
}
.wb-h small{color:rgba(243,237,225,.5)!important}
.wb-i{border-radius:10px!important}
.wb-i:hover{background:rgba(242,179,107,.13)!important}
.wb-ic{
  background:rgba(242,179,107,.16)!important;
  color:#F2B36B!important;
  border-radius:9px!important;
}
.wb-tx b{color:#F6EFE2!important;font-weight:650}
.wb-tx i{color:rgba(243,237,225,.52)!important}
.wb-ar{color:rgba(242,179,107,.55)!important}
.wb-i:hover .wb-ar{color:#F2B36B!important;transform:translateX(2px)}

/* --------------------------------------------------------------------------
   7. 区块标题：一枚暖阳色方点 + 发丝线
   -------------------------------------------------------------------------- */
.sec{margin-bottom:30px!important}
.sec-h{
  display:flex!important;align-items:center!important;
  gap:9px!important;
  border-bottom:1px solid var(--line-2)!important;
  padding-bottom:9px!important;
  margin-bottom:14px!important;
}
.sec-h h2{
  font-size:16px!important;font-weight:750!important;
  color:var(--ink)!important;letter-spacing:.01em;
  display:inline-flex!important;align-items:center;gap:8px;
}
.sec-h h2::before{
  content:''!important;
  width:7px;height:7px;border-radius:2px;
  background:linear-gradient(150deg,var(--sun),#C4611F)!important;
  box-shadow:0 0 0 3px var(--sun-soft);
  flex:0 0 7px;
}
.sec-h .sub{color:var(--ink-3)!important;font-size:11.5px!important}
.sec-h .more{color:var(--dan)!important;font-size:12px!important}
.sec-h .more:hover{color:var(--sun-2)!important}

/* --------------------------------------------------------------------------
   8. 常用 / 分类卡：颜色回到每一张卡上
   -------------------------------------------------------------------------- */
.pinned{
  display:grid!important;
  grid-template-columns:repeat(auto-fill,minmax(92px,1fr))!important;
  gap:9px!important;
}
.pin{
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-radius:13px!important;
  box-shadow:var(--sh-1)!important;
  padding:13px 8px 11px!important;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);
}
.pin:hover{
  transform:translateY(-2px);
  box-shadow:var(--sh-2)!important;
  border-color:var(--sun-soft-2)!important;
}
.pin .lg2{width:34px!important;height:34px!important;border-radius:10px!important}
.pin .nm{font-size:11.5px!important;color:var(--ink-2)!important;font-weight:550}

.catgrid{gap:12px!important}
.catcard{
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-radius:14px!important;
  box-shadow:var(--sh-1)!important;
  padding:16px 16px 15px!important;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);
  overflow:hidden;
}
.catcard::after{
  content:''!important;
  position:absolute!important;
  left:0!important;right:0!important;top:0!important;bottom:auto!important;
  height:2px!important;
  background:linear-gradient(90deg,var(--cc,var(--sun)),transparent 78%)!important;
  opacity:.5!important;
  border-radius:0!important;
  transition:opacity .18s var(--ease)!important;
}
.catcard:hover{
  transform:translateY(-2px);
  box-shadow:var(--sh-2)!important;
  border-color:color-mix(in srgb,var(--cc,var(--sun)) 26%,var(--line))!important;
}
.catcard:hover::after{opacity:1!important}
.catcard .cc-ic{
  width:36px!important;height:36px!important;
  border-radius:11px!important;
  background:color-mix(in srgb,var(--cc,#D97A2B) 11%,var(--surface))!important;
  color:var(--cc,#D97A2B)!important;
  border:1px solid color-mix(in srgb,var(--cc,#D97A2B) 18%,transparent)!important;
  box-shadow:none!important;
  opacity:1!important;
  display:grid!important;place-items:center!important;
}
.catcard .cc-ic svg{width:19px;height:19px}
.catcard .cc-n{font-size:14.5px!important;font-weight:700!important;color:var(--ink)!important;letter-spacing:.005em}
.catcard .cc-c{
  font-family:var(--ff-num)!important;
  font-size:10.5px!important;
  color:color-mix(in srgb,var(--cc,#D97A2B) 68%,var(--ink-3))!important;
  background:color-mix(in srgb,var(--cc,#D97A2B) 8%,transparent)!important;
  border-radius:5px!important;padding:1px 6px!important;
  font-weight:600;
}
.catcard .cc-d{font-size:11.5px!important;color:var(--ink-3)!important;line-height:1.6!important}
.catcard .cc-tags span,.catcard .cc-tag{
  border:1px solid var(--line-2)!important;
  background:var(--surface-2)!important;
  color:var(--ink-3)!important;
  border-radius:5px!important;
  font-size:10.5px!important;
}
.catcard.big{padding:18px 18px 16px!important}

/* --------------------------------------------------------------------------
   9. 按场景走：四格拼图，各自一处淡彩
   -------------------------------------------------------------------------- */
.flow{
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-bottom:1px solid var(--line)!important;
  border-right:1px solid var(--line)!important;
  border-radius:0!important;
  box-shadow:none!important;
  padding:15px 16px 16px!important;
  transition:background .18s var(--ease);
}
.flow:hover{background:var(--sun-soft)!important}
.flow .ft{color:var(--ink)!important;font-weight:700!important;font-size:13px!important}
.flow .fd{color:var(--ink-3)!important;font-size:11.5px!important;line-height:1.55!important}
.flow .fi{color:var(--sun)!important}

/* --------------------------------------------------------------------------
   10. 内页：分类头 / 站点列表 / 筛选
   -------------------------------------------------------------------------- */
.cat-head{
  border-bottom:1px solid var(--line)!important;
  background:none!important;
  padding:6px 0 20px!important;
  margin:0 0 20px!important;
}
.cat-head .cc-ic{
  width:44px!important;height:44px!important;flex:0 0 44px!important;
  border-radius:13px!important;
  background:color-mix(in srgb,var(--cc,#D97A2B) 11%,var(--surface))!important;
  border:1px solid color-mix(in srgb,var(--cc,#D97A2B) 18%,transparent)!important;
  color:var(--cc,#D97A2B)!important;
  display:grid!important;place-items:center!important;
  filter:none!important;
}
.cat-head .cc-ic svg{width:23px!important;height:23px!important}
.cat-head h1{font-size:30px!important;font-weight:800!important;letter-spacing:-.022em!important;color:var(--ink)!important}
.cat-head p{font-size:12.5px!important;color:var(--ink-3)!important;margin-top:5px!important}

.chip{
  border:1px solid var(--line)!important;
  background:var(--surface)!important;
  color:var(--ink-2)!important;
  border-radius:8px!important;
}
.chip:hover{border-color:var(--sun-soft-2)!important;background:var(--sun-soft)!important;color:var(--sun-2)!important}
.chip.on{
  background:linear-gradient(150deg,var(--sun),#C4611F)!important;
  border-color:transparent!important;
  color:#FFF8EA!important;
  box-shadow:var(--sh-sun);
}
.chip.on .n{color:rgba(255,248,234,.75)!important}

.sgh{border-bottom:1px solid var(--line-2)!important}
.sgh i{background:var(--sun)!important;width:3px!important;border-radius:2px!important}
.sgh b{font-weight:700!important;color:var(--ink)!important}

.items{gap:10px!important}
.item{
  background:var(--surface)!important;
  border:1px solid var(--line)!important;
  border-radius:12px!important;
  box-shadow:var(--sh-1)!important;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),border-color .16s var(--ease);
}
.item:hover{
  transform:translateY(-2px);
  border-color:var(--sun-soft-2)!important;
  box-shadow:var(--sh-2)!important;
}
.item .nm{font-size:13.5px!important;font-weight:650!important;color:var(--ink)!important}
.item .ds{font-size:11.5px!important;color:var(--ink-3)!important}
.item .lg,.item .lg2{border-radius:9px!important;box-shadow:0 1px 2px rgba(74,52,24,.10)!important}
.item .bg,.item .bg.free,.item .bg.open,.item .bg.part,.item .bg.pay{
  background:var(--surface-3)!important;
  border:1px solid var(--line-2)!important;
  color:var(--ink-2)!important;
  border-radius:5px!important;
}
.fav{color:var(--ink-3)!important}
.fav.on{color:var(--red)!important}

/* 面包屑 */
.crumb{color:var(--ink-3)!important;font-size:12px!important}
.crumb a{color:var(--dan)!important}
.crumb a:hover{color:var(--sun-2)!important}

/* --------------------------------------------------------------------------
   11. 深色：卡片要比底亮一档，暖阳色提亮
   -------------------------------------------------------------------------- */
[data-theme="dark"] .wbcard{
  background:linear-gradient(165deg,#242B27 0%,#191E1B 100%)!important;
  border-color:rgba(255,255,255,.09);
}
[data-theme="dark"] .pin,[data-theme="dark"] .catcard,
[data-theme="dark"] .item,[data-theme="dark"] .flow,[data-theme="dark"] .chip{
  background:var(--surface)!important;
}
[data-theme="dark"] .flow:hover{background:var(--sun-soft)!important}
[data-theme="dark"] .sbox{background:var(--surface)!important}
[data-theme="dark"] .chip.on{background:linear-gradient(150deg,#C97C33,#A85E1F)!important;color:#FFF8EA!important}

/* --------------------------------------------------------------------------
   12. 响应式
   -------------------------------------------------------------------------- */
@media(max-width:1080px){
  .hero{grid-template-columns:minmax(0,1fr)!important;gap:22px!important;padding:26px 24px 56px!important}
  .hero-art{height:118px}
  .hero .wbcard{max-width:620px}
}
@media(max-width:640px){
  .hero{
    border-radius:16px!important;
    padding:22px 18px 46px!important;
    margin:10px 0 22px!important;
  }
  .hero h1{font-size:27px!important;line-height:1.24!important}
  .hero p{font-size:13px!important;margin-bottom:18px!important}
  .hero .kpi{font-size:11.5px!important;gap:0 8px!important;margin-bottom:16px!important}
  .hero .kpi .ki b{font-size:13px!important}
  .hero-art{height:92px}
  .cont{padding-left:14px!important;padding-right:14px!important}
  .catgrid{grid-template-columns:1fr!important}
  .items{grid-template-columns:1fr!important}
  .pinned{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))!important}
  .cat-head h1{font-size:24px!important}
}
/* 深色：剪影降饱和，别抢字 */
[data-theme="dark"] .hero-art{opacity:.38;filter:saturate(.7) brightness(.9)}

/* 分类卡：让颜色更明确一点（13% 底 + 22% 描边 + 3px 顶线） */
.catcard::after{height:3px!important;opacity:.8!important}
.catcard .cc-ic{
  width:38px!important;height:38px!important;
  background:color-mix(in srgb,var(--cc,#D97A2B) 13%,var(--surface))!important;
  border-color:color-mix(in srgb,var(--cc,#D97A2B) 22%,transparent)!important;
}
.catcard .cc-ic svg{width:20px;height:20px}
.catcard .cc-c{
  background:color-mix(in srgb,var(--cc,#D97A2B) 11%,transparent)!important;
  color:color-mix(in srgb,var(--cc,#D97A2B) 80%,var(--ink))!important;
}
.catcard:hover{
  background:color-mix(in srgb,var(--cc,#D97A2B) 2.4%,var(--surface))!important;
}

/* --------------------------------------------------------------------------
   13. 按角色走：三种人，三条线
   -------------------------------------------------------------------------- */
.roles{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:12px;
}
.role{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 16px 14px 18px;
  box-shadow:var(--sh-1);
  overflow:hidden;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);
}
.role::before{
  content:'';position:absolute;left:0;top:16px;bottom:16px;
  width:3px;border-radius:0 2px 2px 0;background:var(--rc,var(--sun));opacity:.85;
}
.role:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:color-mix(in srgb,var(--rc,var(--sun)) 24%,var(--line))}
.rl-h{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.rl-ic{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  display:grid;place-items:center;
  background:color-mix(in srgb,var(--rc,var(--sun)) 12%,var(--surface));
  border:1px solid color-mix(in srgb,var(--rc,var(--sun)) 20%,transparent);
  color:var(--rc,var(--sun));
}
.rl-ic svg{width:18px;height:18px}
.rl-t b{display:block;font-size:14px;font-weight:750;color:var(--ink);letter-spacing:.01em}
.rl-t i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:2px;letter-spacing:.02em}
.rl-steps{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:10px}
.rl-steps a{
  font-size:11.5px;padding:3px 9px;border-radius:7px;
  background:var(--surface-3);border:1px solid var(--line-2);
  color:var(--ink-2);text-decoration:none;transition:.15s;
}
.rl-steps a:hover{
  background:color-mix(in srgb,var(--rc,var(--sun)) 12%,var(--surface));
  border-color:color-mix(in srgb,var(--rc,var(--sun)) 26%,transparent);
  color:color-mix(in srgb,var(--rc,var(--sun)) 82%,var(--ink));
}
.rl-ar{color:var(--ink-3);font-size:10px;opacity:.6}
.rl-d{font-size:11.5px;line-height:1.7;color:var(--ink-3);margin:0}

/* 深色：标题上的暖色高亮别太亮 */
[data-theme="dark"] .hero h1 em::after{
  background:linear-gradient(90deg,rgba(242,179,107,.42),rgba(242,179,107,.12))!important;
}

/* 角色卡：整张带一点本色，左侧条加粗，三张才不像三张白纸 */
.role{background:color-mix(in srgb,var(--rc,var(--sun)) 3.2%,var(--surface))}
.role::before{width:4px;opacity:1}

/* 场景格：每个场景用自己的色，一格一色，整排才活起来 */
.flow .fi{
  color:var(--fc,var(--sun))!important;
  background:color-mix(in srgb,var(--fc,var(--sun)) 10%,transparent);
  border-radius:9px;
  width:30px;height:30px;
  display:grid;place-items:center;
  flex:0 0 30px;
}
.flow .fi svg{width:16px;height:16px}
.flow:hover{background:color-mix(in srgb,var(--fc,var(--sun)) 6%,var(--surface))!important}
.flow .ft{color:var(--ink)!important}

/* 常用卡右上角的星：去掉白底圆圈，只留一枚小星，别像未读红点 */
.pin .star{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  color:var(--ink-3)!important;
  padding:0!important;
}
.pin .star.on{color:var(--red)!important}
.pin .star:hover{color:var(--sun)!important;transform:scale(1.1)}
@media (hover:none),(pointer:coarse){
  .pin .star{opacity:.38}
  .pin .star.on{opacity:.9}
}

/* 页脚签名 */
.sign{
  margin:26px 0 8px;
  font-size:11.5px;
  color:var(--ink-3);
  letter-spacing:.08em;
  display:flex;align-items:center;gap:8px;
}
.sign::before{
  content:'';width:18px;height:1px;background:var(--line);display:inline-block;
}
.sign span{color:var(--ink-3);opacity:.6;letter-spacing:.06em}

/* ==========================================================================
   v24 ·「冬阳汇」蓝白 + 蓝橙
   --------------------------------------------------------------------------
   为什么再改：v23 的暖纸 + 墨，加上默认跟随系统深色，用户打开是"黑白的"，
   而且首屏占了太多高度 —— 一屏只看到标题和搜索框，什么都得往下拉。

   这一版三条硬要求：
   1. 默认浅色（不再跟随系统），主色是蓝，橙只做点睛，不是主色；
   2. 首屏压到 260px 上下，第一屏就能看见「常用」和「分类」；
   3. 颜色仍有意义：蓝＝可点，橙＝标记，朱＝警示，分类色只落在图标与顶线。

   色板
     底   #F5F8FD   冷白（不是纯白，长看不刺眼）
     墨   #122036   正文
     蓝   #2C63D6   主色
     橙   #D9711F   点睛（首屏标题下的暖带、数字强调）
     朱   #C0392B   收藏与警示
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Token：蓝白底
   -------------------------------------------------------------------------- */
:root{
  --paper:#F5F8FD;
  --paper-2:#EBF1FA;
  --paper-3:#E3EBF7;

  --bg:#F5F8FD; --bg-2:#EBF1FA;
  --surface:#FFFFFF; --surface-2:#FAFCFF; --surface-3:#EFF4FB;
  --ink:#122036; --ink-2:#445770; --ink-3:#7B8CA4;
  --ink-c:#122036; --ink-2c:#445770; --ink-3c:#7B8CA4;
  --line:#E0E8F4; --line-2:#EBF1F9;

  --sun:#2C63D6; --sun-2:#1E4AA6; --sun-3:#7FA5E8;
  --sun-soft:rgba(44,99,214,.09); --sun-soft-2:rgba(44,99,214,.20);
  --dan:#D9711F; --dan-2:#B35A12; --dan-soft:rgba(217,113,31,.10);
  --red:#C0392B; --verm:#C0392B; --verm-ink:#96291E;
  --verm-soft:rgba(192,57,43,.08); --verm-soft-2:rgba(192,57,43,.18);
  --accent:#D9711F; --accent-soft:rgba(217,113,31,.10);
  --brand:#2C63D6; --brand-ink:#1E4AA6; --brand-soft:rgba(44,99,214,.09);

  --sh-1:0 1px 2px rgba(18,32,54,.05);
  --sh-2:0 2px 10px -4px rgba(18,32,54,.10),0 1px 2px rgba(18,32,54,.04);
  --sh-3:0 18px 40px -24px rgba(18,32,54,.28);
  --sh-brand:0 8px 18px -10px rgba(44,99,214,.55);
  --sh-sun:0 8px 18px -10px rgba(44,99,214,.5);

  --rail-1:#F5F8FD; --rail-2:#EBF1FA; --rail-3:#F5F8FD;
  --rail-ink:#122036; --rail-ink-2:#445770; --rail-ink-3:#7B8CA4;
  --rail-line:#E0E8F4;
  --rail-hover:rgba(28,52,92,.05);
  --rail-on:rgba(44,99,214,.09);

  --sc:#2C63D6; --sc-soft:rgba(44,99,214,.10);
}

/* 深色仍在，但只在用户手动切换时才用（默认 light，见 app.js 的 theme 初值） */
[data-theme="dark"]{
  --paper:#0E1622;
  --paper-2:#131E2C;
  --paper-3:#182534;

  --bg:#0E1622; --bg-2:#131E2C;
  --surface:#141F2D; --surface-2:#182534; --surface-3:#1D2B3C;
  --ink:#E8EEF8; --ink-2:#A9B8CC; --ink-3:#7387A0;
  --ink-c:#E8EEF8; --ink-2c:#A9B8CC; --ink-3c:#7387A0;
  --line:#243549; --line-2:#1C2B3C;

  --sun:#5B8DEF; --sun-2:#7FA5E8; --sun-3:#A8C3F5;
  --sun-soft:rgba(91,141,239,.14); --sun-soft-2:rgba(91,141,239,.26);
  --dan:#E8913F; --dan-2:#F0A868; --dan-soft:rgba(232,145,63,.14);
  --red:#E06B5C; --verm:#E06B5C; --verm-ink:#EFA096;
  --verm-soft:rgba(224,107,92,.13); --verm-soft-2:rgba(224,107,92,.24);
  --accent:#E8913F; --accent-soft:rgba(232,145,63,.14);
  --brand:#5B8DEF; --brand-ink:#7FA5E8; --brand-soft:rgba(91,141,239,.13);

  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 2px 12px -4px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);
  --sh-3:0 20px 44px -26px rgba(0,0,0,.85);
  --sh-brand:0 8px 20px -12px rgba(0,0,0,.8);
  --sh-sun:0 8px 20px -12px rgba(0,0,0,.8);

  --rail-1:#0E1622; --rail-2:#131E2C; --rail-3:#0E1622;
  --rail-ink:#E8EEF8; --rail-ink-2:#A9B8CC; --rail-ink-3:#7387A0;
  --rail-line:#243549;
  --rail-hover:rgba(255,255,255,.05);
  --rail-on:rgba(91,141,239,.14);

  --sc:#5B8DEF; --sc-soft:rgba(91,141,239,.14);
}

/* 主区：极淡的蓝白渐变，不要暖光 */
.main,body:not(.admin) .main{
  background:
    radial-gradient(820px 360px at 88% -12%, rgba(44,99,214,.075), transparent 70%),
    radial-gradient(620px 320px at 4% 0%, rgba(44,99,214,.04), transparent 72%),
    var(--paper)!important;
}
[data-theme="dark"] .main,
[data-theme="dark"] body:not(.admin) .main{
  background:
    radial-gradient(820px 360px at 88% -12%, rgba(91,141,239,.10), transparent 70%),
    var(--paper)!important;
}

/* --------------------------------------------------------------------------
   2. 顶栏：压薄 4px，标变成蓝底白字
   -------------------------------------------------------------------------- */
.top{height:52px!important}
.top-in{padding:0 20px!important}
.brand{font-size:14.5px!important;font-weight:750!important;letter-spacing:.02em!important}
.brand .mark{
  background:linear-gradient(150deg,#3A74E6 0%,#1F4EAE 100%)!important;
  color:#fff!important;
  border-radius:9px!important;
  box-shadow:0 4px 10px -6px rgba(44,99,214,.8)!important;
  width:27px;height:27px;
}
.brand small{
  color:var(--sun-2)!important;
  background:var(--sun-soft)!important;
  border:1px solid var(--sun-soft-2)!important;
  font-size:9.5px!important;
}
.tbtn:hover{background:var(--sun-soft)!important;color:var(--sun-2)!important}
.wt{border-radius:8px!important;box-shadow:none!important}
.wt-clk{color:var(--sun-2)!important}
.wt:hover{border-color:var(--sun-soft-2)!important;background:var(--surface-3)!important}

/* --------------------------------------------------------------------------
   3. 侧栏：选中 = 淡蓝底 + 左侧 2px 蓝条
   -------------------------------------------------------------------------- */
.main{padding:16px 26px 80px!important}
body:not(.admin) .side{border-right:1px solid var(--line-2)!important}
.side .nav-i{border-radius:8px!important}
.side .nav-i.on{
  background:var(--sun-soft)!important;
  color:var(--sun-2)!important;
  box-shadow:inset 2px 0 0 var(--sun)!important;
}
.side .nav-i.on .nv-ic{color:var(--sun)!important}
.side .nav-i:not(.on):hover .nv-ic{color:var(--sun)!important}
.side .nav-i .nv-ic{color:var(--ink-3)!important}

/* --------------------------------------------------------------------------
   4. 首屏：从 400px 压到 270px 上下
   -------------------------------------------------------------------------- */
.hero{
  grid-template-columns:minmax(0,1fr) 300px!important;
  gap:26px!important;
  background:
    linear-gradient(122deg,#FFFFFF 0%,#F2F7FF 52%,#EAF1FD 100%)!important;
  border:1px solid var(--line)!important;
  border-radius:16px!important;
  box-shadow:var(--sh-2)!important;
  padding:18px 22px 52px!important;
  margin:0 0 16px!important;
}
[data-theme="dark"] .hero{
  background:linear-gradient(122deg,#16222F 0%,#17273A 60%,#152234 100%)!important;
  border-color:var(--line)!important;
}
.hero-art{height:58px!important;opacity:.92!important}
[data-theme="dark"] .hero-art{opacity:.42!important;filter:saturate(.85)}

/* 数据行：一行小字，紧贴标题上方 */
.hero .kpi{
  margin:0 0 8px!important;
  font-size:11.5px!important;
  gap:0 8px!important;
}
.hero .kpi .ki b{font-size:13px!important;color:var(--sun-2)!important;font-weight:750}
.hero .kpi .ki:nth-child(3) b{color:var(--dan)!important}
.hero .kpi a.ki b{color:var(--red)!important}

/* 标题：小一号，橙色的暖带只垫在关键词下 */
.hero h1{
  font-size:clamp(22px,2.15vw,30px)!important;
  line-height:1.24!important;
  letter-spacing:-.02em!important;
  margin:0 0 7px!important;
  max-width:24em!important;
}
.hero h1 em::after{
  height:.30em!important;
  bottom:.04em!important;
  background:linear-gradient(90deg,rgba(217,113,31,.30),rgba(217,113,31,.10))!important;
}
[data-theme="dark"] .hero h1 em::after{
  background:linear-gradient(90deg,rgba(232,145,63,.34),rgba(232,145,63,.10))!important;
}
.hero p{
  font-size:12.5px!important;
  line-height:1.62!important;
  margin:0 0 12px!important;
  max-width:52em!important;
  color:var(--ink-2)!important;
}
.hero-l{padding-top:2px}

/* 搜索框：矮一点，够大够顺手就行 */
.sbox{
  border-radius:11px!important;
  padding:4px 4px 4px 12px!important;
  box-shadow:0 1px 2px rgba(18,32,54,.05)!important;
}
.sbox:focus-within{
  border-color:var(--sun-soft-2)!important;
  box-shadow:0 0 0 4px var(--sun-soft)!important;
}
.sbox input{font-size:14px!important}
.sbox-ic{color:var(--sun)!important}
.sbox-go{
  background:linear-gradient(150deg,#3A74E6,#2255BE)!important;
  color:#fff!important;
  border-radius:8px!important;
  box-shadow:var(--sh-sun)!important;
}
.sbox-go:hover{background:linear-gradient(150deg,#4A83F0,#1E4AA6)!important}
.eng a:hover,.eng button:hover{color:var(--sun-2)!important}
.sbf.on{background:var(--sun-soft)!important;color:var(--sun-2)!important}

/* 工作台入口卡：深海军蓝，不是黑 */
.wbcard{
  background:linear-gradient(158deg,#1B2C46 0%,#122036 100%)!important;
  border:1px solid rgba(255,255,255,.09)!important;
  border-radius:13px!important;
  box-shadow:0 16px 34px -24px rgba(18,32,54,.7)!important;
  padding:13px 13px 10px!important;
}
.wbcard::before{
  background:radial-gradient(circle,rgba(91,141,239,.42),transparent 66%)!important;
}
.wb-h{
  font-size:11.5px!important;
  padding-bottom:8px!important;
  color:#F2F6FD!important;
}
.wb-h small{color:rgba(226,236,250,.5)!important;font-size:10px!important}
.wb-i{border-radius:8px!important;padding:8px 7px!important}
.wb-i:hover{background:rgba(91,141,239,.16)!important}
.wb-ic{background:rgba(255,255,255,.09)!important;color:#CFE0FF!important;width:26px!important;height:26px!important}
.wb-tx b{font-size:12.5px!important;color:#F2F6FD!important}
.wb-tx i{font-size:10.5px!important;color:rgba(226,236,250,.52)!important}
.wb-ar{color:rgba(147,180,240,.6)!important}
.wb-i:hover .wb-ar{color:#9EC0FF!important}

/* --------------------------------------------------------------------------
   5. 区块：往上收，第一屏能看到「常用」
   -------------------------------------------------------------------------- */
.sec{margin-bottom:20px!important}
.sec-h{
  padding-bottom:7px!important;
  margin-bottom:10px!important;
  border-bottom:1px solid var(--line-2)!important;
}
.sec-h h2{font-size:14.5px!important;font-weight:750!important}
.sec-h h2::before{
  width:3px!important;height:13px!important;border-radius:1px!important;
  background:var(--sun)!important;
  box-shadow:none!important;
}
.sec-h .sub{font-size:11px!important}
.sec-h .more{color:var(--sun)!important;font-size:11.5px!important}
.sec-h .more:hover{color:var(--sun-2)!important}

/* 常用：矮卡，一屏放满 */
.pinned{gap:8px!important}
.pin{
  border-radius:10px!important;
  box-shadow:none!important;
  padding:10px 6px 9px!important;
}
.pin:hover{
  box-shadow:var(--sh-2)!important;
  border-color:var(--sun-soft-2)!important;
  transform:translateY(-1px);
}
.pin .lg2{width:30px!important;height:30px!important;border-radius:9px!important}
.pin .nm{font-size:11px!important;margin-top:5px!important}

/* 分类卡：顶线保留分类色，其余走蓝白 */
.catcard{
  border-radius:10px!important;
  box-shadow:none!important;
}
.catcard:hover{
  border-color:color-mix(in srgb,var(--cc,var(--sun)) 38%,var(--line))!important;
  box-shadow:var(--sh-2)!important;
}
