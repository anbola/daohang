}
function copyText(txt,okMsg){
  var done=function(){toast(okMsg||'已复制')};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,function(){fallback()});
  }else fallback();
  function fallback(){
    var ta=document.createElement('textarea');ta.value=txt;
    ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);
    ta.select();try{document.execCommand('copy');done()}catch(e){toast('复制失败，请手动全选复制')}
    ta.remove();
  }
}

function boot(){
  ensureCatRows();
  /* v2：带 ?p= 的同步链接，打开即导入个人配置 */
  try{
    var _ph=(location.hash||'').match(/^#p=([A-Za-z0-9_\-]+)/);
    var _pq=(location.search||'').match(/[?&]p=([^&]+)/);   /* 兼容旧版链接 */
    var _code=_ph?_ph[1]:(_pq?decodeURIComponent(_pq[1]):'');
    if(_code){
      applyProfile(_code);toast('已导入同步配置');
      /* 同步码只留在 fragment，用完立刻抹掉，不留在地址栏 / 历史记录里 */
      try{history.replaceState(null,'',location.pathname+location.search+'#/')}
      catch(e){try{location.hash='#/'}catch(e2){}}
    }
  }catch(e){}
  applyTheme();applyLook();

/* ================= 页面保护（挡右键 / 查看源码 / 复制 / 拖拽） =================
   说清楚：这是"提高门槛"，不是加密。挡得住随手右键和 F12 的老师、学生，
   挡不住存心研究的人（对方禁用 JS 就全看见了）。所以不做混淆，那只是给自己添麻烦。
   自己要调试：地址后加 ?protect=0；或在控制台跑
   localStorage.setItem('teacherhub.protect','0') 再刷新。恢复保护改成 '1'。 */
(function(){
  let on=true;
  try{
    const q=location.search||'';
    if(/[?&]protect=0(?:&|$)/.test(q))localStorage.setItem('teacherhub.protect','0');
    if(/[?&]protect=1(?:&|$)/.test(q))localStorage.setItem('teacherhub.protect','1');
    on=localStorage.getItem('teacherhub.protect')!=='0';
  }catch(e){}
  const root=document.documentElement;
  root.classList.add(on?'protect':'no-protect');
  if(!on)return;

  /* 输入框、可编辑区放行，不然连搜索和后台都改不了字 */
  const soft=e=>{
    const t=e.target;
    return !!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"],.no-guard'));
  };

  document.addEventListener('contextmenu',e=>{if(soft(e))return;e.preventDefault()},true);
  document.addEventListener('dragstart',e=>{if(soft(e))return;e.preventDefault()},true);
  document.addEventListener('selectstart',e=>{if(soft(e))return;e.preventDefault()},true);
  document.addEventListener('copy',e=>{if(soft(e))return;e.preventDefault()},true);
  document.addEventListener('cut',e=>{if(soft(e))return;e.preventDefault()},true);

  document.addEventListener('keydown',e=>{
    const k=(e.key||'').toLowerCase();
    if(e.key==='F12'){e.preventDefault();e.stopPropagation();return}
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','e','k'].indexOf(k)>=0){e.preventDefault();return}
    if((e.ctrlKey||e.metaKey)&&(k==='u'||k==='s')){e.preventDefault();return}
    if((e.ctrlKey||e.metaKey)&&k==='a'&&!soft(e)){e.preventDefault();return}
  },true);
})();

/* ==========================================================================
   v6.1 · 本地数据目录：选一次文件夹，之后自动写「冬阳汇-数据.json」。
   本机 Edge / Chromium CDP 实测（2026-11-05）：
     file:// 顶层页 isSecureContext=true，localStorage / sessionStorage / IndexedDB
     全部可用；showDirectoryPicker() 也被允许；普通 srcdoc iframe 与内嵌教师工作台
     共用同一个 'wb_teacher_fs' 库的 'dir' 句柄；不同的本地 HTML 文件之间同样共享。
     只有「sandbox 且未加 allow-same-origin」的 iframe 会同步抛 SecurityError
     （access to the Indexed Database API is denied in this context）。
     本站 iframe 不加 sandbox，但下面仍必须 catch：一旦同步抛错而 Promise 不 settle，
     用户点「选择文件夹」会永久卡住。
     共同判据：picker 与 IndexedDB 都要求非 opaque origin。file:// 是否算 opaque
     由浏览器版本与上下文决定，本机可用不等于所有机器可用 —— 所以不写成保证，
     导出 / 导入 JSON 始终是最稳的兜底。
   浏览器不允许网页自己指定 D:/C: 盘路径，也不允许无授权写盘 —— 必须用户手选一次。
   ========================================================================== */
const HUBFS={
  handle:null,name:'',ok:false,writing:false,lastAt:'',_t:0,idbErr:null,
  support(){return typeof window.showDirectoryPicker==='function'},
  open(){return new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('no idb'));
    let r,done=false;
    const fin=(v,e)=>{if(done)return;done=true;e?rej(e):res(v)};
    try{r=indexedDB.open('wb_teacher_fs',1)}
    catch(e){HUBFS.idbErr=e;return fin(null,e||new Error('idb denied'))}
    r.onupgradeneeded=()=>{try{r.result.createObjectStore('h')}catch(e){}};
    r.onsuccess=()=>{HUBFS.idbErr=null;fin(r.result)};
    r.onerror=()=>{HUBFS.idbErr=r.error;fin(null,r.error||new Error('idb error'))};
    r.onblocked=()=>fin(null,new Error('idb blocked'));
    setTimeout(()=>fin(null,new Error('idb timeout')),3000);
  })},
  get(k){return HUBFS.open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('h','readonly').objectStore('h').get(k);
    t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)}))},
  set(k,v){return HUBFS.open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('h','readwrite').objectStore('h').put(v,k);
    t.onsuccess=()=>res(true);t.onerror=()=>rej(t.error)}))},
  del(k){return HUBFS.open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('h','readwrite').objectStore('h').delete(k);
    t.onsuccess=()=>res(true);t.onerror=()=>rej(t.error)}))},
  payload(){return JSON.stringify({app:'冬阳汇',ver:1,savedAt:new Date().toISOString(),
    profile:CUR_PID,data:DB},null,1)},
  async restore(){
    if(!HUBFS.support())return;
    try{
      const h=await HUBFS.get('dir');
      if(!h)return;
      HUBFS.handle=h;HUBFS.name=h.name;HUBFS.idbErr=null;
      const p=await h.queryPermission({mode:'readwrite'});
      HUBFS.ok=(p==='granted');
    }catch(e){HUBFS.idbErr=e}
    renderFsState();
  },
  async pick(){
    if(!HUBFS.support()){toast('这个浏览器不支持选文件夹，请用 Chrome / Edge，或改用导出 JSON');return false}
    try{
      const h=await window.showDirectoryPicker({id:'dongyanghui',mode:'readwrite',startIn:'documents'});
      HUBFS.handle=h;HUBFS.name=h.name;HUBFS.ok=true;
      let remembered=false;
      try{await HUBFS.set('dir',h);remembered=true;HUBFS.idbErr=null}catch(e){HUBFS.idbErr=e}
      toast(remembered?'已记住「'+h.name+'」，以后每次改动会自动写进去'
        :'本次已连上「'+h.name+'」，但浏览器不让记住，刷新后要重选；长期请用「导出备份 JSON」');
      await HUBFS.write(true);
      return true;
    }catch(e){
      if(e&&e.name==='AbortError')return false;
      const n=(e&&e.name)||'';
      if(n==='SecurityError'||n==='NotAllowedError'||n==='TypeError'){
        toast('浏览器没允许选文件夹。把网页放到 https 上更稳，临时请用「导出备份 JSON」');
      }else toast('没选成：'+((e&&e.message)||n));
      return false;
    }
  },
  async ensure(){
    if(!HUBFS.handle)return false;
    try{
      let p=await HUBFS.handle.queryPermission({mode:'readwrite'});
      if(p!=='granted')p=await HUBFS.handle.requestPermission({mode:'readwrite'});
      HUBFS.ok=(p==='granted');return HUBFS.ok;
    }catch(e){HUBFS.ok=false;return false}
  },
  schedule(){clearTimeout(HUBFS._t);HUBFS._t=setTimeout(()=>HUBFS.write(false),900)},
  async write(force){
    if(!HUBFS.handle)return false;
    /* 恢复出来的句柄权限常是 'prompt'，必须借用户这次点击去 requestPermission；
       自动保存那条路径没有手势，ensure 失败就静寞停手，等用户点按钮再授权。 */
    if(!HUBFS.ok){const ok=await HUBFS.ensure();if(!ok)return false}
    if(HUBFS.writing)return false;
    HUBFS.writing=true;
    try{
      const fh=await HUBFS.handle.getFileHandle('冬阳汇-数据.json',{create:true});
      /* createWritable 默认 mode:'siloed'：多标签页并发写会各写临时文件、后完成的覆盖前一个。
         显式 exclusive 让第二个写入者直接报错，好过静默覆盖（旧版忽略未知选项，无害）。 */
      const w=await fh.createWritable({mode:'exclusive'});
      await w.write(HUBFS.payload());await w.close();
      HUBFS.lastAt=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      /* 每天第一笔改动额外留一份当天快照，误删好回滚 */
      try{
        const day=new Date().toISOString().slice(0,10);
        if(DB.fsLastBackup!==day){
          const dir=await HUBFS.handle.getDirectoryHandle('每日备份',{create:true});
          const bf=await dir.getFileHandle('冬阳汇-'+day+'.json',{create:true});
          const bw=await bf.createWritable();await bw.write(HUBFS.payload());await bw.close();
          DB.fsLastBackup=day;
          try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}
        }
      }catch(e){}
      HUBFS.ok=true;renderFsState();return true;
    }catch(e){
      HUBFS.ok=false;renderFsState();
      toast((e&&e.name)==='NoModificationAllowedError'
        ?'另一个标签页正在写同一个文件，稍等一下再试'
        :'写文件失败：'+((e&&e.message)||'权限不足')+'，请到后台重新点一次「选择文件夹」');
      return false;
    }finally{HUBFS.writing=false}
  },
  async read(){
    if(!HUBFS.handle)return false;
    if(!HUBFS.ok){const ok=await HUBFS.ensure();if(!ok)return false}
    try{
      const fh=await HUBFS.handle.getFileHandle('冬阳汇-数据.json');
      const f=await fh.getFile();const o=JSON.parse(await f.text());
      if(!o||!o.data||!Array.isArray(o.data.sites))throw new Error('文件格式不对');
      DB=Object.assign(defaults(),o.data);reindex();save();
      applyTheme();applyLook();paintTopStats();renderSide();render();
      return true;
    }catch(e){toast('读取失败：'+((e&&e.message)||'找不到备份文件'));return false}
  }
};
window.HUBFS=HUBFS;
function renderFsState(){
  const el=document.getElementById('fsState');if(!el)return;
  let t='未连接';
  if(!HUBFS.support())t='此浏览器不支持（需要 Chrome / Edge）';
  else if(HUBFS.handle&&HUBFS.ok)t='已连接 · '+HUBFS.name+(HUBFS.lastAt?' · 上次 '+HUBFS.lastAt:'');
  else if(HUBFS.handle)t='待授权 · '+HUBFS.name+'（点一次「选择文件夹」重新授权）';
  else if(HUBFS.idbErr)t='浏览器不给记住文件夹（存储受限），仍可临时选一次；长期请用「导出备份 JSON」';
  el.textContent=t;
}
function handleFsAct(a,el){
  if(a==='profSwitch'){switchProfile(el.dataset.id);renderAdBody();return}
  if(a==='profNew'){
    const n=prompt('新配置档名称（例如：张老师）');if(!n||!n.trim())return;
    const id='p'+Date.now().toString(36),ps=profiles();
    ps.push({id:id,n:n.trim().slice(0,12)});setProfiles(ps);
    switchProfile(id);renderAdBody();return;
  }
  if(a==='profRename'){
    const ps=profiles(),p=ps.filter(x=>x.id===CUR_PID)[0];if(!p)return;
    const n=prompt('把「'+p.n+'」改成',p.n);if(!n||!n.trim())return;
    p.n=n.trim().slice(0,12);setProfiles(ps);renderAdBody();return;
  }
  if(a==='profDel'){
    if(!confirm('删除「'+profName(CUR_PID)+'」？这一档的所有数据会一起删掉，不能恢复。'))return;
    setProfiles(profiles().filter(x=>x.id!==CUR_PID));
    try{localStorage.removeItem(lsKey(CUR_PID))}catch(e){}
    switchProfile('main');renderAdBody();toast('已删除，切回默认档');return;
  }
  if(a==='fsPick'){HUBFS.pick().then(()=>renderAdBody());return}
  if(a==='fsWrite'){HUBFS.write(true).then(ok=>{if(ok)toast('已备份到文件夹');renderAdBody()});return}
  if(a==='fsRead'){
    if(!confirm('用文件夹里的「冬阳汇-数据.json」覆盖当前「'+profName(CUR_PID)+'」？建议先导出备份。'))return;
    HUBFS.read().then(ok=>{if(ok)toast('已从文件夹恢复');renderAdBody()});return;
  }
  if(a==='fsOff'){
    HUBFS.handle=null;HUBFS.ok=false;
    HUBFS.del('dir').catch(()=>{});renderAdBody();toast('已断开本地目录');return;
  }
}

function pwModeText(){
  if(DB.pwOn===false)return'本机免密 —— 打开就直接进';
  var until=0;
  try{until=parseInt(localStorage.getItem('th.authUntil')||'0',10)}catch(e){}
  if(until>Date.now()){
    var d=new Date(until);
    return'记住登录 —— 到 '+(d.getMonth()+1)+'月'+d.getDate()+'日为止';
  }
  return'每次都要密码（关掉标签页就得重输）';
}

  const c=catOf(x.c);
  let h='<div class="dlg-h"><h3>'+(isNew?'新增站点':'编辑站点')+'</h3><button class="ibtn" data-act="close">'+svg(P.close)+'</button></div>'
    +'<div class="dlg-b">'

    +'<div class="field"><label>网址</label><input class="inp" id="fU" value="'+esc(x.u)+'" placeholder="https://…"><div class="tip">必须带 https:// 或 http://</div></div>'
    +'<div class="grid2">'
    +'<div class="field"><label>分类</label><select class="inp" id="fCat">';

    +'<div class="field"><label>子分类</label><select class="inp" id="fSub">';

  h+='</select></div></div>'
    +'<div class="field"><label>免费程度</label><select class="inp" id="fF">'
    +[['free','完全免费'],['open','开源免费'],['quota','有免费额度'],['part','部分免费'],['over','海外（需网络条件）']]
      .map(o=>'<option value="'+o[0]+'" '+(o[0]===x.f?'selected':'')+'>'+o[1]+'</option>').join('')
    +'</select></div>'
    +'<div class="grid2">'
    +'<div class="field"><label>版本属性（软件类才有）</label><select class="inp" id="fV">'
    +[['','不显示'],['off','官方版'],['sp','特别版']].map(o=>'<option value="'+o[0]+'" '+((x.v||'')===o[0]?'selected':'')+'>'+o[1]+'</option>').join('')
    +'</select></div>'
    +'<div class="field"><label>下载方式</label><select class="inp" id="fDlk">'
    +[['direct','直链（点开就下）'],['pan','网盘分享页'],['rel','官方发布页']].map(o=>'<option value="'+o[0]+'" '+((x.dlk||'direct')===o[0]?'selected':'')+'>'+o[1]+'</option>').join('')
    +'</select></div></div>'
    +'<div class="field"><label>下载地址（留空则不显示下载按钮）</label><input class="inp" id="fDl" value="'+esc(x.dl||'')+'" placeholder="https://…/xxx.exe"><div class="tip">直链要指向 .exe / .zip 本体；网盘填具体分享页，别填官网首页</div></div>'
    +'<div class="field"><label>一句话说明</label><input class="inp" id="fD" value="'+esc(x.d||'')+'" placeholder="这东西解决什么问题"></div>'
    +'<div class="field" style="margin-bottom:0"><label>使用提示（可选）</label><input class="inp" id="fW" value="'+esc(x.w||'')+'" placeholder="坑在哪、要注意什么"><div class="tip">这条会显示在搜索里，也会出现在鼠标悬停提示上</div></div>'
    +'</div><div class="dlg-f"><button class="btn" data-act="close">取消</button>'
    +'<button class="btn pri" id="fSave" data-key="'+esc(key||'')+'">保存</button></div>';
  modal(h);
}

document.addEventListener('click',e=>{
  const t=e.target;

  /* v6：登录页点空白遮罩 = 返回站点，不必被迫输密码 */
  if(t.id==='loginMask'){location.hash='#/';return}

  /* 密码显示 / 隐藏（默认隐藏） */
  if(t.closest('#pwEye')){
    const inp=document.getElementById('pw'),bt=document.getElementById('pwEye');
    if(inp&&bt){
      const show=inp.type==='password';
      inp.type=show?'text':'password';
      bt.innerHTML=show?EYE_OFF:EYE;
      bt.setAttribute('aria-label',show?'隐藏密码':'显示密码');
      try{inp.focus({preventScroll:true})}catch(er){}
    }
    return;
  }
  if(t.closest('#pwOk')||t.closest('#pw')){
    const inp=document.getElementById('pw');
    if(!inp)return;
    if(t.closest('#pwOk')||e.key==='Enter'){
      const v=String(inp.value||'');
      /* admin 双身份：默认密码 + 忘记密码时的重置口令。
         输 admin 一定进得去，并把被改乱的密码重置回 admin。 */
      const isReset=(v==='admin'&&DB.pw!=='admin');
      if(v===DB.pw||isReset){
        if(isReset){DB.pw='admin';save()}
        sessionStorage.setItem('th.auth','1');
        var rm=document.getElementById('rm30');
        if(rm&&rm.checked){
          try{localStorage.setItem('th.authUntil',String(Date.now()+30*24*3600*1000))}catch(e){}
        }
        renderAdmin(location.hash.split('?')[1]||'');
        toast(isReset?'密码已重置为 admin，并已登录':'已登录');
      }
      else{const er=document.getElementById('pwErr');if(er)er.classList.add('on');inp.select()}
    }
    return;
  }
  if(t.closest('#adOut')){
    try{sessionStorage.removeItem('th.auth');localStorage.removeItem('th.authUntil')}catch(e){}
    renderAdmin('');toast('已退出登录');return}
  if(t.closest('#adAdd')){siteForm(null);return}

  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    /* v6：配置档 / 本地目录动作 */
    if(a.indexOf('prof')===0||a.indexOf('fs')===0){handleFsAct(a,act);return}
    /* v2：数据源 / 个人同步面板的动作统一收口，原逻辑完全不动 */
    if(a==='feedNoteClose'||a.indexOf('feed')===0||a.indexOf('sync')===0){handleSyncAct(a,act);return}
    if(a==='close'){closeModal();return}
    if(a==='pin'){
      const u=act.dataset.u,i=DB.pinned.indexOf(u);
      if(i>=0)DB.pinned.splice(i,1);else DB.pinned.push(u);
      save();renderAdBody();toast(i>=0?'已取消常用':'已加入常用');return;
    }
    if(a==='edit'){siteForm(act.dataset.u);return}
    if(a==='del'){
      const u=act.dataset.u;const x=byU[u];
      if(!x)return;
      if(!confirm('确定删除「'+x.n+'」？\n\n这只影响你本机的导航站，不会影响那个网站本身。')){
        return;
      }
      DB.sites=DB.sites.filter(s=>s.u!==u);
      DB.gone=DB.gone||[];if(DB.gone.indexOf(u)<0)DB.gone.push(u);
      DB.pinned=DB.pinned.filter(p=>p!==u);
      DB.fav=DB.fav.filter(p=>p!==u);
      reindex();save();renderAdBody();toast('已删除');return;
    }
    if(a==='togglepin'||a==='unpin'){
      const u=act.dataset.u,i=DB.pinned.indexOf(u);
      if(i>=0)DB.pinned.splice(i,1);else DB.pinned.push(u);
      save();renderAdBody();return;
    }
    if(a==='catup'||a==='catdown'){
      const id=act.dataset.id;
      const arr=DB.cats.map(c=>c.id);
      const i=arr.indexOf(id);
      const j=a==='catup'?i-1:i+1;
      if(j<0||j>=arr.length)return;
      const tmp=DB.cats[i];DB.cats[i]=DB.cats[j];DB.cats[j]=tmp;
      save();renderAdBody();renderSide();toast('顺序已更新');return;
    }
    if(a==='cattg'){
      const id=act.dataset.id;
      const r=DB.cats.filter(c=>c.id===id)[0];
      if(r){r.hidden=!r.hidden;save();renderAdBody();renderSide();toast(r.hidden?'已隐藏':'已显示')}
      return;
    }
    if(a==='pal'){applyPal(act.dataset.v);renderAdBody();return}
    if(a==='arttg'){DB.artOn=DB.artOn===false;save();applyTheme();renderAdBody();toast(DB.artOn?'底纹已开启':'底纹已关闭');return}
    if(a==='brand'){DB.brand=act.dataset.v;DB.brandTouched=true;save();applyTheme();renderAdBody();return}
    if(a==='tgflows'){DB.showFlows=DB.showFlows===false;save();renderAdBody();return}
    if(a==='tgover'){DB.hideOver=DB.hideOver!==true;save();renderAdBody();return}
    if(a==='tgfav'){DB.favIcon=DB.favIcon===false;save();renderAdBody();render();toast(DB.favIcon?'已开启真实图标':'已关闭，改用字母图标');return}
  }

  const seg=t.closest('.seg button');
  if(seg&&seg.parentNode.dataset.seg){
    const kind=seg.parentNode.dataset.seg;
    const v=seg.dataset.v;
    if(kind==='theme'){DB.theme=v;save();applyTheme();renderAdBody()}
    if(kind==='radius'){DB.radius=parseInt(v,10);save();applyLook();renderAdBody()}
    if(kind==='density'){DB.density=parseInt(v,10);save();applyLook();renderAdBody()}
    if(kind==='artlv'){DB.artLv=v;save();applyLook();renderAdBody()}
    return;
  }

  if(t.closest('#fSave')){
    const key=t.closest('#fSave').dataset.key;
    const n=(document.getElementById('fN').value||'').trim();
    let u=(document.getElementById('fU').value||'').trim();
    const c=document.getElementById('fCat').value;
    const sb=document.getElementById('fSub').value;
    const f=document.getElementById('fF').value;
    const d=(document.getElementById('fD').value||'').trim();
    const w=(document.getElementById('fW').value||'').trim();
    if(!n){alert('名称不能为空');return}
    if(!/^https?:\/\//i.test(u)){alert('网址要以 http:// 或 https:// 开头');return}
    if(!key&&byU[u]){alert('这个网址已经收录过了：'+byU[u].n);return}
    if(key&&key!==u&&byU[u]){alert('改成的网址和其他站点重复了');return}
    const fv=(document.getElementById('fV')||{}).value||'';
    const fdl=((document.getElementById('fDl')||{}).value||'').trim();
    const fdlk=(document.getElementById('fDlk')||{}).value||'direct';
    if(key){
      const x=byU[key];
      if(x){
        x.n=n;x.u=u;x.c=c;x.t=sb;x.f=f;x.d=d;x.w=w;
        if(fv)x.v=fv;else delete x.v;
        if(fdl){x.dl=fdl;x.dlk=fdlk}else{delete x.dl;delete x.dlk;delete x.dls;delete x.dlp}
      }
      if(key!==u){
        DB.pinned=DB.pinned.map(p=>p===key?u:p);
        DB.fav=DB.fav.map(p=>p===key?u:p);
        if(DB.visits[key]){DB.visits[u]=DB.visits[key];delete DB.visits[key]}
      }
    }else{
      const nw={n:n,u:u,c:c,t:sb,f:f,d:d,w:w};
      if(fv)nw.v=fv;
      if(fdl){nw.dl=fdl;nw.dlk=fdlk}
      DB.sites.unshift(nw);
    }
    reindex();save();closeModal();renderAdBody();toast(key?'已保存':'已新增');
    return;
  }

  if(t.closest('#pReset')){
    DB.pinned=DEFAULT_PINNED.slice();save();renderAdBody();toast('已恢复默认常用');return;
  }
  if(t.closest('#adSync')){
    const n=mergeSeed(DB);
    save();reindex();renderAdBody();renderSide();
    toast(n?('已补进 '+n+' 个站点'):'已经是最新的了，没有要补的');
    return;
  }
  if(t.closest('#adExport')){
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='冬阳集备份-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    toast('已导出');return;
  }
  if(t.closest('#adReset')){
    if(!confirm('恢复出厂设置会清空你所有的增删改、收藏和外观设置，回到最初的样子。\n\n建议先导出备份。要继续吗？'))return;
    DB=defaults();reindex();save();applyTheme();applyLook();renderAdBody();renderSide();toast('已恢复出厂设置');return;
  }
  if(t.closest('#pwOff')){DB.pwOn=false;save();renderAdBody();toast('已设为：本机免密');return}
  if(t.closest('#pwRemember')){
    DB.pwOn=true;
    try{localStorage.setItem('th.authUntil',String(Date.now()+30*24*3600*1000))}catch(e){}
    save();renderAdBody();toast('这台电脑 30 天内免输密码');return}
  if(t.closest('#pwStrict')){
    DB.pwOn=true;
    try{localStorage.removeItem('th.authUntil')}catch(e){}
    save();renderAdBody();toast('已恢复：下次进后台要密码');return}
  if(t.closest('#pwSave')){
    const a=document.getElementById('pw1').value;
    const b=document.getElementById('pw2').value;
    if(a.length<4){alert('密码至少 4 位');return}
    if(a!==b){alert('两次输入不一致');return}
    DB.pw=a;save();
    document.getElementById('pw1').value='';document.getElementById('pw2').value='';
    toast('密码已更新');return;
  }
});

document.addEventListener('change',e=>{
  if(e.target.id!=='adImport')return;
  const f=e.target.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const o=JSON.parse(fr.result);
      if(!o||!Array.isArray(o.sites)||!o.sites.length){alert('文件格式不对，缺少 sites 数组');return}
      if(!confirm('导入会覆盖当前的 '+DB.sites.length+' 个站点，确定吗？'))return;
      const d=defaults();
      DB=Object.assign(d,o);
      if(!DB.cats||!DB.cats.length)DB.cats=d.cats;
      reindex();save();applyTheme();applyLook();renderAdBody();renderSide();toast('导入成功，共 '+DB.sites.length+' 个站点');
    }catch(err){alert('解析失败：'+err.message)}
  };
  fr.readAsText(f);
});

/* v6：页面起来后尝试恢复上次选过的文件夹句柄 */
setTimeout(function(){try{HUBFS.restore()}catch(e){}},420);
</script>
</body>
</html>
