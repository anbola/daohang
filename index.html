T 协议，免费）：输入一个主题，它自动写文案 → 找免版权素材 → AI 配音 → 生成字幕 → 合成 1080P 视频。它不能「生成」画面，但能「组装」成片，适合口播、资讯、知识类。<br><span class=\"dim\">注意：要装 Python 环境，字幕模型约 3G，路径别用中文。<\/span><\/div><\/div>'\n    +'<div class=\"card\" style=\"margin-top:14px;border-style:dashed\"><div class=\"small muted\">想走路线 B 或 C，跟我说一句「帮我把 API 这条路搭起来」，我可以按你实际要用的平台，把本地转发服务和调用代码配好——那样这个工作台就真能一键到底了。<\/div><\/div>';\n}\n\n\n/* ===================== 渲染 ===================== */\nfunction renderTabs(){\n  document.getElementById('tabs').innerHTML=TABS.map(function(t){\n    if(t.id==='sep')return '<span class=\"tsep\"><\/span>';\n    return '<button class=\"tab'+(t.sub?' sub':'')+(state.tab===t.id?' active':'')+'\" data-action=\"tab\" data-tab=\"'+t.id+'\">'+t.name+'<\/button>';\n  }).join('');\n}\nfunction updateTodayCount(){document.getElementById('todayCount').textContent=todayTotal();}\n\nfunction renderHome(){\n  const total=todayTotal();\n  const cards=PLATFORMS.map(function(p){\n    const used=usedOf(p.id),rem=remainClips(p);\n    const pct=p.isUnlimited?0:Math.min(100,Math.round(used/p.daily*100));\n    const barCls=pct>=90?'danger':(pct>=60?'warn':'');\n    const remTxt=p.isUnlimited?'∞':(rem+' 条');\n    const usedTxt=p.isUnlimited?('已用 '+used+' 条'):(used+' / '+p.daily+' '+p.unit);\n    const tcls=p.type==='积分'?'purple':(p.type==='灵感值'?'blue':(p.type==='不限量'?'acc':'warn'));\n    return '<div class=\"card plat\">'\n      +'<div class=\"plat-head\"><div><div class=\"plat-name\">'+p.emoji+' '+esc(p.name)+'<\/div>'\n      +'<div class=\"plat-meta\">'+esc(p.maxDur)+' · '+esc(p.res)+' · '+esc(p.wm)+'<\/div><\/div>'\n      +'<div style=\"display:flex;align-items:center;gap:6px;flex:0 0 auto\"><span class=\"pill '+tcls+'\">'+esc(p.type)+'<\/span>'\n      +'<button class=\"qbtn\" data-action=\"tut\" data-pid=\"'+p.id+'\" title=\"看这个平台怎么用\">?<\/button><\/div><\/div>'\n      +'<div class=\"kv\"><span>今日额度<\/span><span><b>'+usedTxt+'<\/b><\/span><\/div>'\n      +'<div class=\"bar '+barCls+(p.isUnlimited?' inf':'')+'\"><i style=\"width:'+(p.isUnlimited?100:pct)+'%\"><\/i><\/div>'\n      +'<div class=\"kv\" style=\"margin-top:8px\"><span>还能出<\/span><span class=\"remain\">'+remTxt+'<\/span><\/div>'\n      +'<div class=\"tags\">'+p.tags.map(function(t){return '<span class=\"pill\">'+esc(t)+'<\/span>';}).join('')+'<\/div>'\n      +'<div class=\"strength\">💡 '+esc(p.strength)+'<\/div>'\n      +'<div class=\"tip\">⚠ '+esc(p.tip)+'<\/div>'\n      +'<div class=\"plat-actions\"><button class=\"btn btn-sm\" data-action=\"addusage\" data-pid=\"'+p.id+'\">出片了，+1<\/button>'\n      +'<a class=\"btn btn-sm btn-ghost\" href=\"'+esc(p.url)+'\" target=\"_blank\" rel=\"noopener\">去官网 ↗<\/a><\/div>'\n      +'<\/div>';\n  }).join('');\n\n  return '<div class=\"card\" style=\"background:linear-gradient(135deg,rgba(62,230,176,.10),rgba(74,158,255,.08));border-color:rgba(62,230,176,.25)\">'\n    +'<div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap\">'\n    +'<div><div style=\"font-size:15px;font-weight:800;margin-bottom:4px\">今天还能免费出 <span style=\"color:var(--acc)\">'+total+'<\/span> 条左右<\/div>'\n    +'<div class=\"small muted\">额度用完就没了，别囤——大多数平台每天 0 点清零。先用不限量的试错，再上真正的好模型出片。<\/div><\/div>'\n    +'<div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn btn-primary\" data-action=\"tab\" data-tab=\"director\">🎬 从一句话开始写分镜<\/button>'\n    +'<button class=\"btn\" data-action=\"tab\" data-tab=\"flow\">按场景安排今天<\/button><\/div>'\n    +'<\/div><\/div>'\n    +projHero()\n    +'<div class=\"sec-title\"><h2>各平台今日额度<\/h2><span class=\"hint\">点\"出片了，+1\"记录一次生成，进度条会变<\/span><\/div>'\n    +'<div class=\"grid\">'+cards+'<\/div>';\n}\nfunction projHero(){\n  const proj=curProj();\n  if(!proj){\n    return '<div class=\"card\" style=\"margin-top:14px;border-style:dashed\">'\n      +'<div class=\"small\"><b style=\"color:var(--txt)\">还没有项目。<\/b>去 <b style=\"color:var(--acc)\">① 导演台<\/b> 写一句话，它会替你拆成 5 个镜头、起好标准文件名，之后每一步都能对上。<\/div>'\n      +'<div style=\"margin-top:10px\"><button class=\"btn btn-sm btn-primary\" data-action=\"tab\" data-tab=\"director\">去写第一句 →<\/button><\/div><\/div>';\n  }\n  const st=projStat(proj);\n  const plan=buildPlan(proj);\n  const pct=st.total?Math.round(st.done/st.total*100):0;\n  let next,tag;\n  if(plan.needImg.length){tag='要生图';next='还差 <b>'+plan.needImg.length+'<\/b> 张参照图。去「③ 资产库」看命名规范，或直接开「④ 开工单」照单做。';}\n  else if(plan.needVid.length){tag='要出片';next='图齐了，还差 <b>'+plan.needVid.length+'<\/b> 条片子。开「④ 开工单」，按顺序出、按额度排。';}\n  else {tag='可收尾';next='全部齐活了。去「⑤ 复盘」打个分，把这次的经验存下来。';}\n  return '<div class=\"card\" style=\"margin-top:14px;border-color:rgba(74,158,255,.3);background:rgba(74,158,255,.05)\">'\n    +'<div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start\">'\n    +'<div><div class=\"small dim\">当前项目<\/div><div style=\"font-weight:800;font-size:15px;margin-top:2px\">'+esc(proj.name)+'<\/div>'\n    +'<div class=\"small dim\" style=\"margin-top:2px\">代号 '+esc(proj.code)+' · '+st.total+' 镜 · 完成 '+pct+'%<\/div><\/div>'\n    +'<span class=\"pill warn\">'+tag+'<\/span><\/div>'\n    +'<div class=\"bar\" style=\"margin:11px 0 9px\"><i style=\"width:'+pct+'%\"><\/i><\/div>'\n    +'<div class=\"small muted\">'+next+'<\/div>'\n    +'<div style=\"display:flex;gap:7px;margin-top:11px;flex-wrap:wrap\">'\n    +'<button class=\"btn btn-sm btn-primary\" data-action=\"tab\" data-tab=\"call\">开今日开工单 →<\/button>'\n    +'<button class=\"btn btn-sm\" data-action=\"tab\" data-tab=\"shots\">看镜头表<\/button>'\n    +'<button class=\"btn btn-sm btn-ghost\" data-action=\"tab\" data-tab=\"assets\">资产库<\/button>'\n    +'<\/div><\/div>';\n}\n\nfunction renderFlow(){\n  const scenes=SCENES.map(function(s){\n    return '<div class=\"scene'+(state.scene===s.id?' active':'')+'\" data-action=\"scene\" data-scene=\"'+s.id+'\"><span class=\"e\">'+s.e+'<\/span><span>'+esc(s.name)+'<\/span><\/div>';\n  }).join('');\n  const sc=SCENES.filter(function(s){return s.id===state.scene;})[0]||SCENES[0];\n  const steps=sc.steps.map(function(st,i){\n    const p=platById(st.p)||{name:'?',emoji:'',url:'#',isUnlimited:false};\n    const rem=remainClips(p);\n    const remTxt=p.isUnlimited?'不限量':(rem+' 条可用');\n    return '<div class=\"step\"><div class=\"dot\">'+(i+1)+'<\/div><div class=\"step-body\">'\n      +'<div class=\"step-role r'+(i+1)+'\">'+esc(st.r)+'<\/div>'\n      +'<div class=\"step-plat\">'+p.emoji+' '+esc(p.name)+' <span class=\"pill\">今日剩 '+remTxt+'<\/span>'\n      +(TUTORIALS[st.p]?'<button class=\"qbtn\" data-action=\"tutstep\" data-pid=\"'+st.p+'\" data-scene=\"'+sc.id+'\" data-i=\"'+i+'\" title=\"这一步怎么做\">?<\/button>':'')\n      +'<\/div>'\n      +'<div class=\"step-desc\">'+esc(st.d)+'<\/div>'\n      +'<div class=\"step-why\">为什么选它：'+esc(st.w)+'<\/div>'\n      +'<div style=\"margin-top:10px;display:flex;gap:8px;flex-wrap:wrap\">'\n      +'<a class=\"btn btn-sm btn-primary\" href=\"'+esc(p.url)+'\" target=\"_blank\" rel=\"noopener\">去 '+esc(p.name)+' ↗<\/a>'\n      +'<button class=\"btn btn-sm\" data-action=\"copystep\" data-scene=\"'+sc.id+'\" data-i=\"'+i+'\">复制这步提示词<\/button>'\n      +'<\/div><\/div><\/div>';\n  }).join('');\n  return '<div class=\"sec-title\"><h2>你今天想做什么？<\/h2><span class=\"hint\">选一个场景，给你一套「试错 → 出片 → 成品」的免费流水线<\/span><\/div>'\n    +'<div class=\"scene-grid\">'+scenes+'<\/div>'\n    +'<div class=\"sec-title\"><h2>推荐流水线：'+esc(sc.name)+'<\/h2><span class=\"hint\">照这个顺序走，额度最省<\/span><\/div>'\n    +'<div class=\"flow\">'+steps+'<\/div>'\n    +'<div class=\"card\" style=\"margin-top:20px;border-style:dashed\">'\n    +'<div class=\"small muted\">💡 同一段提示词跨平台跑，再回「效果对比」打分，你会越来越清楚哪家适合什么场景——这就是你自己的经验库。<\/div>'\n    +'<\/div>';\n}\n\nfunction renderPrompts(){\n  const list=allPrompts();\n  const cats=['全部'].concat(Array.from(new Set(list.map(function(p){return p.cat||'其他';}))));\n  const catBtns=cats.map(function(c){\n    return '<button class=\"btn btn-sm'+(state.pcat===c?' btn-primary':'')+'\" data-action=\"pcat\" data-cat=\"'+esc(c)+'\">'+esc(c)+'<\/button>';\n  }).join('');\n  const items=list.filter(function(p){return state.pcat==='全部'||(p.cat||'其他')===state.pcat;});\n  const cards=items.map(function(p){\n    const realIdx=list.indexOf(p);\n    const vars=(p.vars||[]).map(function(v){return '<span class=\"pvar\">'+esc(v)+'<\/span>';}).join('');\n    const best=(p.best||[]).map(function(id){const pp=platById(id);return pp?'<span class=\"pill blue\">'+esc(pp.name)+'<\/span>':'';}).join('');\n    return '<div class=\"card pcard\">'\n      +'<h3><span>'+esc(p.title)+'<\/span><span class=\"pill\">'+esc(p.cat||'其他')+'<\/span><\/h3>'\n      +'<div class=\"pbody\">'+esc(p.text)+'<\/div>'\n      +'<div class=\"pvars\">'+vars+'<\/div>'\n      +'<div class=\"pfoot\"><div style=\"display:flex;gap:5px;flex-wrap:wrap\">'+best+'<\/div>'\n      +'<button class=\"btn btn-sm btn-primary\" data-action=\"copyidx\" data-idx=\"'+realIdx+'\">复制<\/button><\/div>'\n      +'<\/div>';\n  }).join('');\n  return '<div class=\"sec-title\"><h2>提示词库<\/h2><span class=\"hint\">花括号里是变量，替换成你要的主体就能用<\/span><\/div>'\n    +'<div class=\"pcat\">'+catBtns+'<\/div>'\n    +'<div class=\"grid\">'+cards+'<\/div>'\n    +'<div class=\"sec-title\"><h2>加一条我的提示词<\/h2><\/div>'\n    +'<div class=\"card\">'\n    +'<div class=\"formgrid\"><div><label class=\"f\">标题<\/label><input id=\"cp-title\" placeholder=\"例如：我的咖啡店片头\"><\/div>'\n    +'<div><label class=\"f\">分类<\/label><input id=\"cp-cat\" placeholder=\"例如：品牌 / 人物 / 风景\"><\/div><\/div>'\n    +'<div style=\"margin-top:12px\"><label class=\"f\">提示词正文<\/label><textarea id=\"cp-text\" placeholder=\"写你的提示词，可用 {变量} 占位\"><\/textarea><\/div>'\n    +'<div style=\"margin-top:12px\"><button class=\"btn btn-primary\" data-action=\"addprompt\">保存到我的库<\/button><\/div>'\n    +'<\/div>';\n}\n\nfunction renderTasks(){\n  const opts=PLATFORMS.map(function(p){return '<option value=\"'+p.id+'\">'+esc(p.name)+'<\/option>';}).join('');\n  const rows=(state.tasks||[]).slice().reverse().map(function(t){\n    const p=platById(t.platform);\n    const stCls=t.status==='满意'?'acc':(t.status==='弃用'?'':'blue');\n    const statusSel=['待生成','已生成','满意','弃用'].map(function(s){return '<option'+(t.status===s?' selected':'')+'>'+s+'<\/option>';}).join('');\n    return '<div class=\"trow\"><div class=\"tmain\">'\n      +'<div class=\"ttitle\">'+esc(t.title)+'<\/div>'\n      +'<div class=\"tprompt\">'+esc(t.prompt||'（无提示词）')+'<\/div>'\n      +'<div style=\"margin-top:6px;display:flex;gap:6px;flex-wrap:wrap\">'\n      +(p?'<span class=\"pill blue\">'+esc(p.emoji+' '+p.name)+'<\/span>':'')\n      +'<span class=\"pill '+stCls+'\">'+esc(t.status)+'<\/span>'\n      +'<\/div><\/div>'\n      +'<div class=\"tacts\">'\n      +'<select data-action=\"tstatus\" data-id=\"'+t.id+'\" style=\"width:auto;padding:5px 8px;font-size:12px\">'+statusSel+'<\/select>'\n      +(p?'<button class=\"btn btn-sm\" data-action=\"tdone\" data-id=\"'+t.id+'\">记一次出片<\/button>':'')\n      +'<button class=\"btn btn-sm btn-ghost\" data-action=\"tdel\" data-id=\"'+t.id+'\">删<\/button>'\n      +'<\/div><\/div>';\n  }).join('');\n  return '<div class=\"sec-title\"><h2>新建任务<\/h2><span class=\"hint\">把想法拆成任务，派给具体平台<\/span><\/div>'\n    +'<div class=\"card\">'\n    +'<div class=\"formgrid\"><div><label class=\"f\">任务名<\/label><input id=\"t-title\" placeholder=\"例如：第 1 镜 人物回头\"><\/div>'\n    +'<div><label class=\"f\">派给哪个平台<\/label><select id=\"t-platform\">'+opts+'<\/select><\/div><\/div>'\n    +'<div style=\"margin-top:12px\"><label class=\"f\">提示词<\/label><textarea id=\"t-prompt\" placeholder=\"粘贴或写提示词\"><\/textarea><\/div>'\n    +'<div style=\"margin-top:12px\"><button class=\"btn btn-primary\" data-action=\"addtask\">加入队列<\/button><\/div>'\n    +'<\/div>'\n    +'<div class=\"sec-title\"><h2>任务队列<\/h2><span class=\"hint\">共 '+(state.tasks||[]).length+' 条<\/span><\/div>'\n    +((state.tasks&&state.tasks.length)?'<div class=\"card\" style=\"padding:4px 0\">'+rows+'<\/div>':'<div class=\"card\"><div class=\"emptystate\"><span class=\"e\">🗂️<\/span>还没有任务，上面加一条试试<\/div><\/div>');\n}\n\nfunction renderCompare(){\n  const opts=PLATFORMS.map(function(p){return '<option value=\"'+p.id+'\">'+esc(p.name)+'<\/option>';}).join('');\n  const groups={};\n  (state.compares||[]).forEach(function(c){const k=c.prompt||'（未填提示词）';(groups[k]=groups[k]||[]).push(c);});\n  let blocks='';\n  Object.keys(groups).forEach(function(k){\n    const arr=groups[k].slice().sort(function(a,b){return b.stars-a.stars;});\n    const rows=arr.map(function(c,i){\n      const p=platById(c.platform);\n      const stars='★'.repeat(c.stars)+'☆'.repeat(5-c.stars);\n      return '<div class=\"cmp-row\"><div>'+esc(p?p.emoji+' '+p.name:'?')+(i===0&&arr.length>1?' <span class=\"winner\">最佳<\/span>':'')+'<\/div>'\n        +'<div class=\"stars\">'+stars+'<\/div>'\n        +'<div class=\"small muted\">'+esc(c.note||'')+' <button class=\"btn btn-sm btn-ghost\" data-action=\"cdel\" data-id=\"'+c.id+'\" style=\"float:right\">删<\/button><\/div><\/div>';\n    }).join('');\n    blocks+='<div class=\"cmp\"><div class=\"cmp-head\"><span class=\"cmp-prompt\">'+esc(k.length>70?k.slice(0,70)+'…':k)+'<\/span><span class=\"dim\">'+arr.length+' 个平台<\/span><\/div>'+rows+'<\/div>';\n  });\n  return '<div class=\"sec-title\"><h2>记一条对比结果<\/h2><span class=\"hint\">同一段提示词，不同平台出来的效果打分，攒自己的经验库<\/span><\/div>'\n    +'<div class=\"card\">'\n    +'<div><label class=\"f\">提示词（相同提示词的记录会自动归到一组）<\/label><input id=\"c-prompt\" placeholder=\"粘贴这次用的提示词\"><\/div>'\n    +'<div class=\"formgrid\" style=\"margin-top:12px\">'\n    +'<div><label class=\"f\">平台<\/label><select id=\"c-platform\">'+opts+'<\/select><\/div>'\n    +'<div><label class=\"f\">效果评分<\/label><select id=\"c-stars\"><option value=\"5\">★★★★★ 惊艳<\/option><option value=\"4\" selected>★★★★☆ 好用<\/option><option value=\"3\">★★★☆☆ 一般<\/option><option value=\"2\">★★☆☆☆ 凑合<\/option><option value=\"1\">★☆☆☆☆ 翻车<\/option><\/select><\/div>'\n    +'<\/div>'\n    +'<div style=\"margin-top:12px\"><label class=\"f\">备注（哪里好 / 哪里崩）<\/label><input id=\"c-note\" placeholder=\"例如：人脸稳，但手部变形\"><\/div>'\n    +'<div style=\"margin-top:12px\"><button class=\"btn btn-primary\" data-action=\"addcmp\">记录<\/button><\/div>'\n    +'<\/div>'\n    +'<div class=\"sec-title\"><h2>我的经验库<\/h2><span class=\"hint\">'+((state.compares||[]).length)+' 条记录<\/span><\/div>'\n    +(blocks||'<div class=\"card\"><div class=\"emptystate\"><span class=\"e\">📊<\/span>还没有对比记录，先跑一条试试<\/div><\/div>');\n}\n\nfunction renderLedger(){\n  const days=Object.keys(state.usage||{}).sort().reverse().slice(0,7);\n  let blocks='';\n  if(!days.length){blocks='<div class=\"card\"><div class=\"emptystate\"><span class=\"e\">📒<\/span>还没有用量记录，去首页点\"出片了，+1\"<\/div><\/div>';}\n  days.forEach(function(d){\n    const u=state.usage[d]||{};const total=Object.keys(u).reduce(function(a,k){return a+(u[k]||0);},0);\n    const rows=Object.keys(u).map(function(k){const p=platById(k);return '<div class=\"lrow\"><span>'+esc(p?p.emoji+' '+p.name:k)+'<\/span><span>'+u[k]+' '+esc(p?p.unit:'')+'<\/span><\/div>';}).join('');\n    blocks+='<div class=\"ledger-day\"><div class=\"ldate\">'+(d===todayStr()?'今天 · ':'')+d+' <span class=\"pill\">共 '+total+'<\/span><\/div><div class=\"card\" style=\"padding:10px 15px\">'+rows+'<\/div><\/div>';\n  });\n  const todayU=state.usage[todayStr()]||{};\n  const todayTotalUsed=Object.keys(todayU).reduce(function(a,k){return a+todayU[k];},0);\n  return '<div class=\"sec-title\"><h2>今日用量<\/h2><span class=\"hint\">合计 '+todayTotalUsed+' 单位<\/span><\/div>'\n    +'<div class=\"grid\">'+PLATFORMS.map(function(p){\n      const used=usedOf(p.id);const pct=p.isUnlimited?0:Math.min(100,Math.round(used/p.daily*100));\n      return '<div class=\"card\"><div class=\"kv\"><span>'+p.emoji+' '+esc(p.name)+'<\/span><span><b>'+(p.isUnlimited?used+' 条':used+'/'+p.daily)+'<\/b><\/span><\/div><div class=\"bar '+(pct>=90?'danger':(pct>=60?'warn':''))+(p.isUnlimited?' inf':'')+'\"><i style=\"width:'+(p.isUnlimited?100:pct)+'%\"><\/i><\/div><\/div>';\n    }).join('')+'<\/div>'\n    +'<div class=\"sec-title\"><h2>近 7 天<\/h2><\/div>'+blocks;\n}\n\nfunction renderGuide(){\n  const steps=GUIDE.steps.map(function(s){\n    return '<div class=\"guide-step\"><div class=\"gday\">'+esc(s.d)+'<\/div><div class=\"gbody\"><h3>'+esc(s.t)+'<\/h3><p>'+esc(s.p)+'<\/p><\/div><\/div>';\n  }).join('');\n  const rules=GUIDE.rules.map(function(r){\n    return '<div class=\"rule\"><div class=\"n\">'+r.n+'<\/div><p><b>'+esc(r.t)+'<\/b><br>'+r.p+'<\/p><\/div>';\n  }).join('');\n  return '<div class=\"sec-title\"><h2>7 天上路计划<\/h2><span class=\"hint\">照着走，一周就能跑通一条完整流水线<\/span><\/div>'\n    +'<div class=\"card\" style=\"padding:22px\">'+steps+'<\/div>'\n    +'<div class=\"sec-title\"><h2>省额度 6 条军规<\/h2><\/div>'\n    +'<div class=\"rules\">'+rules+'<\/div>';\n}\n\nfunction renderView(){\n  const v=document.getElementById('view');\n  let html='';\n  if(state.tab==='home')html=renderHome();\n  else if(state.tab==='director')html=renderDirector();\n  else if(state.tab==='shots')html=renderShots();\n  else if(state.tab==='assets')html=renderAssets();\n  else if(state.tab==='call')html=renderCall();\n  else if(state.tab==='flow')html=renderFlow();\n  else if(state.tab==='prompts')html=renderPrompts();\n  else if(state.tab==='params')html=renderParams();\n  else if(state.tab==='tasks')html=renderTasks();\n  else if(state.tab==='compare')html=renderCompare();\n  else if(state.tab==='ledger')html=renderLedger();\n  else if(state.tab==='connect')html=renderConnect();\n  else if(state.tab==='auto')html=renderAuto();\n  else html=renderGuide();\n  v.innerHTML=html;\n  v.classList.remove('view');void v.offsetWidth;v.classList.add('view');\n}\nfunction render(){renderTabs();updateTodayCount();renderView();}\n\n/* ===================== 事件 ===================== */\ndocument.getElementById('mask').addEventListener('click',closeDrawer);\ndocument.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer();});\n\ndocument.addEventListener('click',function(e){\n  const el=e.target.closest('[data-action]');\n  if(!el)return;\n  const a=el.getAttribute('data-action');\n  if(a==='saveproj'){saveProjectFromDirector();}\n  else if(a==='copyimg'){\n    const s=buildShots().filter(function(x){return x.i===Number(el.getAttribute('data-i'));})[0];\n    if(s)copyText(s.imgPrompt);else toast('没找到');\n  }\n  else if(a==='copyallimg'){\n    copyText(buildShots().map(function(s){return '【S'+pad2(s.i)+' '+s.n+'】\\n'+s.imgPrompt;}).join('\\n\\n'));\n  }\n  else if(a==='copyimg2'||a==='copyshot2'){\n    const e2=shotById(el.getAttribute('data-id'));\n    if(!e2)return toast('没找到这个镜头');\n    copyText(a==='copyimg2'?(e2.s.imgPrompt||e2.s.prompt):(e2.s.prompt||''));\n  }\n  else if(a==='cyc'){\n    const e2=shotById(el.getAttribute('data-id'));\n    if(!e2)return;\n    e2.s.status=ST_NEXT[e2.s.status]||'idea';\n    save();render();\n    toast('S'+pad2(e2.s.no)+' → '+(ST_MAP[e2.s.status]||['?'])[0]);\n  }\n  else if(a==='copyfn'){copyText(el.getAttribute('data-n')||'');}\n  else if(a==='copyfilenames'){\n    const proj=curProj();if(!proj)return;\n    const lines=proj.shots.map(function(s){\n      return 'S'+pad2(s.no)+' '+s.title+'\\n  图：'+imgName(proj,s.no,1)+'\\n  片：'+buildName(proj,s.no,'VID',s.plat,1);\n    });\n    copyText('【'+proj.name+'】项目代号 '+proj.code+'\\n\\n'+lines.join('\\n\\n'));\n  }\n  else if(a==='mount'){mountFolder();}\n  else if(a==='rescan'){scanDir(true);}\n  else if(a==='readonly'){pickFolderReadonly();}\n  else if(a==='restoredir'){restoreDir(true);}\n  else if(a==='archive'){\n    const id=el.getAttribute('data-id');\n    const sel=document.getElementById('pk-'+id);\n    const no=sel?parseInt(sel.value,10):1;\n    archivePending(id,state.cur,no,el.getAttribute('data-kind'));\n  }\n  else if(a==='cleartasks'){state.tasks=[];save();render();toast('已清空旧待办');}\n  else if(a==='rencode'){\n    const proj=curProj();if(!proj)return;\n    const v=window.prompt('新的项目代号（2–10 位大写字母或数字，会出现在所有文件名开头）',proj.code);\n    if(!v)return;\n    const c=String(v).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);\n    if(c.length<2)return toast('至少 2 位');\n    proj.code=c;save();render();toast('代号已改为 '+c+'（旧文件需要改名才对得上）');\n  }\n  else if(a==='logok'){\n    const pid=el.getAttribute('data-pid');\n    const rec=state.logins[pid]||{};\n    if(rec.ok&&Date.now()-(rec.at||0)<60000){delete state.logins[pid];}\n    else state.logins[pid]={ok:true,at:Date.now()};\n    save();render();\n    toast('已记录，明天的巡检表会提醒你');\n  }\n  else if(a==='logall'){state.logins={};save();render();toast('巡检状态已重置');}\n  else if(a==='copycurl'){copyText(genCurl());}\n  else if(a==='apitest'){\n    toast('正在测试 127.0.0.1:8787 …');\n    fetch('http://127.0.0.1:8787/health',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){\n      toast('连通 ✓ 服务在跑（provider='+(j&&j.provider||'?')+'）');\n    }).catch(function(){\n      toast('连不上。先双击「启动出片服务.bat」，看那个黑窗口有没有报错');\n    });\n  }\n  else if(a==='copycall'){\n    const proj=curProj();if(!proj)return;\n    const plan=buildPlan(proj);\n    let t='【'+proj.name+'】今日开工单 '+todayStr()+'\\n代号 '+proj.code+' · '+proj.ratio+'\\n\\n';\n    t+='一、生参照图（免费）\\n';\n    plan.needImg.forEach(function(s){\n      t+='S'+pad2(s.no)+' '+s.title+'\\n  提示词：'+(s.imgPrompt||s.prompt)+'\\n  存成：'+imgName(proj,s.no,1)+'\\n\\n';\n    });\n    if(!plan.needImg.length)t+='（都齐了）\\n\\n';\n    t+='二、图生视频\\n';\n    plan.needVid.forEach(function(s){\n      const p=platById(s.plat)||{name:'?'};\n      const img=assetOf(proj,s.no,'IMG');\n      t+='S'+pad2(s.no)+' '+s.title+' → '+p.name+'\\n  上传图：'+(img?img.name:imgName(proj,s.no,1))+'\\n  提示词：'+s.prompt+'\\n  存成：'+buildName(proj,s.no,'VID',s.plat,1)+'\\n\\n';\n    });\n    if(!plan.needVid.length)t+='（都齐了）\\n';\n    copyText(t);\n  }\n  else if(a==='printcall'){window.print();}\n  else if(a==='apigen'){apiGen(el.getAttribute('data-id'));}\n  else if(a==='writelist'){writeListToFolder();}\n  else if(a==='exportcsv'){exportCSV();}\n  else if(a==='delproj'){\n    const proj=curProj();if(!proj)return;\n    if(!window.confirm('删除项目「'+proj.name+'」？\\n镜头和进度会一起没，但文件夹里的素材不会动。'))return;\n    state.projects=state.projects.filter(function(p){return p.id!==proj.id;});\n    state.cur=state.projects[0]?state.projects[0].id:null;\n    save();render();toast('项目已删除（素材文件没动）');\n  }\n  else if(a==='tut'){openTut(el.getAttribute('data-pid'));}\n  else if(a==='tutstep'){\n    const pid=el.getAttribute('data-pid');\n    const sid=el.getAttribute('data-scene');\n    const idx=parseInt(el.getAttribute('data-i'),10);\n    const sc=SCENES.filter(function(x){return x.id===sid;})[0];\n    const st=sc?sc.steps[idx]:null;\n    const extra=st?('<b>'+esc(st.r)+'：<\/b>'+esc(st.d)+'<br><br><b>为什么是它：<\/b>'+esc(st.w)):'';\n    openTut(pid,extra);\n  }\n  else if(a==='closetut'){closeDrawer();}\n  else if(a==='dtype'){collectDir();state.dir.type=el.getAttribute('data-v');save();renderView();}\n  else if(a==='dstyle'){collectDir();state.dir.style=el.getAttribute('data-v');save();renderView();}\n  else if(a==='dratio'){collectDir();state.dir.ratio=el.getAttribute('data-v');save();renderView();}\n  else if(a==='dgen'){\n    collectDir();\n    if(!(state.dir.topic||'').trim()){toast('先写一句你想做什么');return;}\n    renderView();toast('分镜已生成 ✓');\n  }\n  else if(a==='drandom'){\n    collectDir();\n    const others=STYLES.filter(function(x){return x.id!==state.dir.style;});\n    state.dir.style=others[Math.floor(Math.random()*others.length)].id;\n    save();renderView();\n  }\n  else if(a==='copyshot'){copyShotPrompt(el.getAttribute('data-i'));}\n  else if(a==='queueshot'){\n    const i=el.getAttribute('data-i');\n    const s=buildShots().filter(function(x){return x.i===Number(i);})[0];\n    if(!s)return;\n    state.tasks.push({id:uid(),title:'第'+s.i+'镜 · '+s.n,platform:s.best,prompt:s.prompt,status:'待生成'});\n    save();toast('已加入任务队列 ✓');\n  }\n  else if(a==='copyallshots'){\n    copyText(buildShots().map(function(s){return '【第'+s.i+'镜 '+s.n+'】'+s.prompt;}).join('\\n\\n'));\n  }\n  else if(a==='queueallshots'){\n    buildShots().forEach(function(s){\n      state.tasks.push({id:uid(),title:'第'+s.i+'镜 · '+s.n,platform:s.best,prompt:s.prompt,status:'待生成'});\n    });\n    save();toast('全部已加入任务队列 ✓');\n  }\n  else if(a==='tab'){state.tab=el.getAttribute('data-tab');save();render();}\n  else if(a==='addusage'){addUsage(el.getAttribute('data-pid'),1);toast('已记录一次出片 +1');render();}\n  else if(a==='scene'){state.scene=el.getAttribute('data-scene');save();renderView();}\n  else if(a==='pcat'){state.pcat=el.getAttribute('data-cat');save();renderView();}\n  else if(a==='copyidx'){const p=allPrompts()[parseInt(el.getAttribute('data-idx'),10)];if(p)copyText(p.text);}\n  else if(a==='copystep'){copyStepPrompt(el.getAttribute('data-scene'),parseInt(el.getAttribute('data-i'),10));}\n  else if(a==='addprompt'){\n    const title=(document.getElementById('cp-title').value||'').trim();\n    const cat=(document.getElementById('cp-cat').value||'').trim()||'我的';\n    const text=(document.getElementById('cp-text').value||'').trim();\n    if(!text){toast('提示词正文不能为空');return;}\n    state.custom.push({cat:cat,title:title||'未命名',text:text,vars:[],best:[],mine:true});\n    save();toast('已保存到我的库 ✓');renderView();\n  }\n  else if(a==='addtask'){\n    const title=(document.getElementById('t-title').value||'').trim();\n    const platform=document.getElementById('t-platform').value;\n    const prompt=(document.getElementById('t-prompt').value||'').trim();\n    if(!title){toast('任务名不能为空');return;}\n    state.tasks.push({id:uid(),title:title,platform:platform,prompt:prompt,status:'待生成'});\n    save();toast('已加入队列 ✓');renderView();\n  }\n  else if(a==='tdone'){\n    const id=el.getAttribute('data-id');\n    const t=(state.tasks||[]).filter(function(x){return x.id===id;})[0];\n    if(t){addUsage(t.platform,1);t.status='已生成';save();toast('已记录出片 +1');renderView();}\n  }\n  else if(a==='tdel'){\n    const id=el.getAttribute('data-id');\n    state.tasks=(state.tasks||[]).filter(function(x){return x.id!==id;});save();renderView();\n  }\n  else if(a==='addcmp'){\n    const prompt=(document.getElementById('c-prompt').value||'').trim();\n    const platform=document.getElementById('c-platform').value;\n    const stars=parseInt(document.getElementById('c-stars').value,10)||3;\n    const note=(document.getElementById('c-note').value||'').trim();\n    if(!prompt){toast('先填提示词');return;}\n    state.compares.push({id:uid(),prompt:prompt,platform:platform,stars:stars,note:note,date:todayStr()});\n    save();toast('已记录 ✓');renderView();\n  }\n  else if(a==='cdel'){\n    const id=el.getAttribute('data-id');\n    state.compares=(state.compares||[]).filter(function(x){return x.id!==id;});save();renderView();\n  }\n});\n\ndocument.addEventListener('change',function(e){\n  const el=e.target;\n  if(el.getAttribute&&el.getAttribute('data-action')==='tstatus'){\n    const id=el.getAttribute('data-id');\n    const t=(state.tasks||[]).filter(function(x){return x.id===id;})[0];\n    if(t){t.status=el.value;save();renderView();}\n  }\n});\n\n/* ===================== v3.0 交互 · 项目 · 拖拽 · 文件夹 ===================== */\nfunction shotById(id){\n  const proj=curProj();if(!proj)return null;\n  for(let i=0;i<proj.shots.length;i++){\n    if(proj.shots[i].id===id)return {s:proj.shots[i],p:proj};\n  }\n  return null;\n}\nfunction selProj(id){state.cur=id;save();render();}\nfunction setApiProv(id){state.api=state.api||{};state.api.provider=id;save();renderView();}\nfunction setImgPlat(id){\n  const proj=curProj();if(!proj)return toast('先建一个项目');\n  proj.imgPlat=id;save();render();\n  toast('参照图文件名已切换为 '+id+' 开头');\n}\n\n/* ---- 路线 B：真的调 API 出片 ---- */\nfunction fileToDataURL(blob){\n  return new Promise(function(res,rej){\n    const r=new FileReader();\n    r.onload=function(){res(r.result);};\n    r.onerror=function(){rej(new Error('读图失败'));};\n    r.readAsDataURL(blob);\n  });\n}\nasync function apiGen(id){\n  const a=state.api||{};\n  if(!a.key){toast('先到「登录与 API」填 Key');state.tab='connect';render();return;}\n  const e2=shotById(id);if(!e2)return;\n  const s=e2.s,proj=e2.p;\n  const img=assetOf(proj,s.no,'IMG');\n  let dataUrl=null;\n  if(img&&FILEBLOB[img.name]){\n    try{dataUrl=await fileToDataURL(FILEBLOB[img.name]);}catch(e){}\n  }\n  s.apiState='提交中…';s.apiTask='';s.apiUrl='';save();render();\n  try{\n    const r=await fetch('http://127.0.0.1:8787/api/generate',{\n      method:'POST',headers:{'Content-Type':'application/json'},\n      body:JSON.stringify({provider:a.provider,key:a.key,prompt:s.prompt,image:dataUrl,duration:s.dur,ratio:proj.ratio})\n    });\n    const j=await r.json();\n    if(j.error){\n      s.apiState='失败：'+j.error;\n    }else{\n      s.apiTask=j.taskId;s.apiState='已提交，等待生成…';s.apiTries=0;\n      save();render();pollApi(id);\n      return;\n    }\n  }catch(err){\n    s.apiState='连不上本地服务（先运行「启动出片服务.bat」）';\n  }\n  save();render();\n}\nasync function pollApi(id){\n  const e2=shotById(id);if(!e2)return;\n  const s=e2.s;\n  const a=state.api||{};\n  s.apiTries=(s.apiTries||0)+1;\n  if(s.apiTries>40){s.apiState='超时了，去平台控制台看结果';save();render();return;}\n  try{\n    const r=await fetch('http://127.0.0.1:8787/api/task?provider='+encodeURIComponent(a.provider||'')+\n      '&id='+encodeURIComponent(s.apiTask||'')+'&key='+encodeURIComponent(a.key||''));\n    const j=await r.json();\n    if(j.videoUrl){\n      s.apiState='完成 ✓';s.apiUrl=j.videoUrl;save();render();\n      toast('出来了，点「看片」');\n    }else{\n      s.apiState='生成中（第 '+s.apiTries+' 次查询）…';save();render();\n      setTimeout(function(){pollApi(id);},6000);\n    }\n  }catch(err){s.apiState='查询失败';save();render();}\n}\n\nfunction saveProjectFromDirector(){\n  const d=state.dir||{};\n  const shots=buildShots();\n  if(!shots.length){toast('先写个主题');return;}\n  let proj=state.projects.filter(function(p){\n    return p.topic===d.topic&&p.style===d.style&&p.type===d.type;\n  })[0];\n  const isNew=!proj;\n  if(isNew){proj=newProject(d.topic||'未命名',d.topic||'',d.type,d.style,d.ratio);}\n  else{proj.ratio=d.ratio;proj.type=d.type;proj.style=d.style;}\n  const old={};\n  proj.shots.forEach(function(s){old[s.no]=s;});\n  proj.shots=shots.map(function(s){\n    const prev=old[s.i]||{};\n    return {\n      id:prev.id||uid(),no:s.i,title:s.n,cam:s.cam,dur:s.dur,plat:s.best,\n      prompt:s.prompt,imgPrompt:s.imgPrompt,\n      status:prev.status||'idea',note:prev.note||'',ver:prev.ver||1\n    };\n  });\n  state.cur=proj.id;\n  save();\n  toast(isNew?('已建项目「'+proj.name+'」，代号 '+proj.code):'镜头表已更新');\n  state.tab='shots';render();\n}\n\nfunction reorderShots(fromId,toId){\n  const proj=curProj();if(!proj)return;\n  const arr=proj.shots.slice();\n  let fi=-1,ti=-1;\n  for(let i=0;i<arr.length;i++){\n    if(arr[i].id===fromId)fi=i;\n    if(arr[i].id===toId)ti=i;\n  }\n  if(fi<0||ti<0||fi===ti)return;\n  const m=arr.splice(fi,1)[0];\n  arr.splice(ti,0,m);\n  arr.forEach(function(s,i){s.no=i+1;});\n  proj.shots=arr;save();render();\n  toast('顺序已更新，镜号自动重排');\n}\n\nasync function restoreDir(interactive){\n  try{\n    const h=await idbGet('dir');\n    if(!h){if(interactive)toast('没有记录，先挂载一次文件夹');return;}\n    DIRHANDLE=h;\n    let perm='prompt';\n    try{perm=await h.queryPermission({mode:'readwrite'});}catch(e){}\n    if(perm!=='granted'&&interactive){\n      try{perm=await h.requestPermission({mode:'readwrite'});}catch(e){}\n    }\n    if(perm==='granted'){\n      state.folder={name:h.name,at:Date.now()};save();\n      await scanDir(interactive);\n    }else{\n      DIRHANDLE=null;\n      if(interactive)toast('浏览器拦住了，需要你点一下弹窗里的「允许」');\n      render();\n    }\n  }catch(e){if(interactive)toast('恢复失败：'+(e.message||''));}\n}\n\nlet DRAGID=null;\ndocument.addEventListener('dragstart',function(e){\n  const tr=e.target.closest?e.target.closest('tr.row'):null;\n  if(!tr)return;\n  DRAGID=tr.getAttribute('data-shotid');\n  tr.classList.add('dragging');\n  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',DRAGID);}catch(err){}\n});\ndocument.addEventListener('dragover',function(e){\n  if(DRAGID){\n    const tr=e.target.closest?e.target.closest('tr.row'):null;\n    if(tr){\n      e.preventDefault();\n      Array.prototype.forEach.call(document.querySelectorAll('tr.row.over'),function(x){x.classList.remove('over');});\n      tr.classList.add('over');\n    }\n    return;\n  }\n  if(state.tab==='assets'&&e.dataTransfer&&e.dataTransfer.types&&e.dataTransfer.types.indexOf('Files')>=0){\n    e.preventDefault();\n  }\n});\ndocument.addEventListener('drop',function(e){\n  const tr=e.target.closest?e.target.closest('tr.row'):null;\n  if(DRAGID&&tr){\n    e.preventDefault();\n    reorderShots(DRAGID,tr.getAttribute('data-shotid'));\n    DRAGID=null;return;\n  }\n  if(state.tab==='assets'&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){\n    e.preventDefault();\n    handleFiles(Array.prototype.slice.call(e.dataTransfer.files));\n  }\n});\ndocument.addEventListener('dragend',function(){\n  DRAGID=null;\n  Array.prototype.forEach.call(document.querySelectorAll('tr.row'),function(x){x.classList.remove('dragging','over');});\n});\n\n/* ===================== 启动 ===================== */\nrender();\nrestoreDir(false);\n<\/script>\n<\/body>\n<\/html>\n",
  teacher:"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<meta name=\"color-scheme\" content=\"light dark\">\n<title>教师工作台<\/title>\n<\!-- 单文件、零外链：所有样式与脚本都在本文件内；数据只存在你自己电脑上 -->\n<style>\n/* ==========================================================================\n   教师工作台 — 单文件样式\n   配色跟导航站同源：中性板岩骨架 + 红笔朱砂做动作 + 分类蓝做数据\n   ========================================================================== */\n\n:root{\n  --bg:#F4F5F6; --bg-2:#EAEDEF;\n  --surface:#FFFFFF; --surface-2:#FAFBFB; --surface-3:#F1F3F4;\n  --ink:#151A21; --ink-2:#454E59; --ink-3:#6E7883;\n  --line:#DFE3E6; --line-2:#E9ECEE;\n\n  --verm:#C4341F; --verm-ink:#A02A16; --verm-soft:rgba(196,52,31,.08);\n  --blue:#2B6CB8; --blue-soft:rgba(43,108,184,.09);\n  --green:#3F8A32; --green-soft:rgba(63,138,50,.10);\n  --amber:#C08518; --amber-soft:rgba(192,133,24,.12);\n  --violet:#6B3FA0; --violet-soft:rgba(107,63,160,.10);\n  --teal:#0E9A8C; --teal-soft:rgba(14,154,140,.10);\n\n  --shadow-1:0 1px 2px rgba(16,24,32,.05);\n  --shadow-2:0 10px 28px -18px rgba(16,24,32,.42);\n  --r:14px; --r-sm:9px;\n  --ui:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n  --num:\"SF Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\n\nhtml[data-theme=\"dark\"]{\n  --bg:#12161B; --bg-2:#0D1116;\n  --surface:#191E24; --surface-2:#1E242B; --surface-3:#232A32;\n  --ink:#E7EBEF; --ink-2:#AEB8C3; --ink-3:#7E8A97;\n  --line:#2B333C; --line-2:#232A32;\n\n  --verm:#E4705A; --verm-ink:#F0907C; --verm-soft:rgba(228,112,90,.13);\n  --blue:#6AA6E8; --blue-soft:rgba(106,166,232,.14);\n  --green:#6DBE5C; --green-soft:rgba(109,190,92,.14);\n  --amber:#DDB259; --amber-soft:rgba(221,178,89,.15);\n  --violet:#A98BE0; --violet-soft:rgba(169,139,224,.15);\n  --teal:#4FC3B4; --teal-soft:rgba(79,195,180,.14);\n\n  --shadow-1:0 1px 2px rgba(0,0,0,.30);\n  --shadow-2:0 12px 30px -18p nk-3);padding:0 5px;border-radius:4px;background:var(--surface-3);white-space:nowrap}\n\n.empty{\n  padding:22px 12px;text-align:center;color:var(--ink-3);font-size:12.5px;\n}\n.empty svg{width:26px;height:26px;opacity:.4;display:block;margin:0 auto 7px}\n\n/* 关注清单 */\n.watch{display:flex;flex-direction:column;gap:7px}\n.wrow{\n  display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;\n  background:var(--surface-2);font-size:12.5px;\n}\n.wrow .ic{width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:flex;\n  align-items:center;justify-content:center;background:var(--surface-3);color:var(--ink-2)}\n.wrow .ic svg{width:13px;height:13px}\n.wrow b{font-weight:700}\n.wrow .sp{flex:1 1 auto}\n.wrow.warn .ic{background:var(--verm-soft);color:var(--verm)}\n.wrow.amber .ic{background:var(--amber-soft);color:var(--amber)}\n.wrow.blue .ic{background:var(--blue-soft);color:var(--blue)}\n\n/* 小工具 */\n.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}\n.tool{\n  display:flex;align-items:center;gap:9px;padding:11px;border-radius:10px;\n  border:1px solid var(--line);background:var(--surface-2);cursor:pointer;\n  font-size:12.5px;font-weight:650;text-align:left;transition:all .15s;\n}\n.tool svg{width:17px;height:17px;color:var(--blue);flex:0 0 17px}\n.tool:hover{border-color:var(--blue);background:var(--blue-soft)}\n.tool:active{transform:scale(.985)}\n\n/* ---------------------------- 表格 ---------------------------- */\n.tblwrap{overflow:auto;border-radius:10px;border:1px solid var(--line);max-height:520px}\ntable.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}\n.tbl th{\n  position:sticky;top:0;z-index:2;background:var(--surface-3);\n  text-align:left;font-size:11px;font-weight:750;color:var(--ink-3);\n  letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);\n  white-space:nowrap;\n}\n.tbl td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}\n.tbl tr:last-child t lid var(--line-2);\n}\n.stat .k{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}\n.stat .v{font-family:var(--num);font-size:19px;font-weight:800;letter-spacing:-.02em;\n  line-height:1.25;font-variant-numeric:tabular-nums}\n.stat .v small{font-size:11px;font-weight:650;color:var(--ink-3);margin-left:2px}\n.stat.b .v{color:var(--blue)} .stat.g .v{color:var(--green)}\n.stat.r .v{color:var(--verm)} .stat.a .v{color:var(--amber)}\n\n.chart{margin-top:4px}\n.chart svg{display:block;width:100%;height:auto;overflow:visible}\n.axis{font-size:9.5px;fill:var(--ink-3);font-family:var(--ui)}\n.bar{transition:opacity .15s}\n.bar:hover{opacity:.75}\n\n.stulist{max-height:530px;overflow:auto;padding-right:3px;-webkit-mask-image:linear-gradient(180deg,#000 93%,transparent);mask-image:linear-gradient(180deg,#000 93%,transparent)}\n.srow{\n  display:grid;grid-template-columns:26px 1fr 78px;gap:9px;align-items:center;\n  padding:5px 2px;font-size:12.5px;\n}\n.srow .rk{font-family:var(--num);font-size:11px;color:var(--ink-3);text-align:right}\n.sbar{display:block;height:7px;border-radius:5px;background:var(--surface-3);overflow:hidden}\n.sbar i{display:block;height:100%;border-radius:5px;background:var(--blue);min-width:3px}\n.sbar i.red{background:var(--verm)} .sbar i.grn{background:var(--green)}\n.sname{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}\n\n/* ---------------------------- 事务 ---------------------------- */\n.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\n.chip{\n  display:inline-flex;align-items:center;gap:5px;height:29px;padding:0 11px;\n  border-radius:8px;border:1px solid var(--line);background:var(--surface);\n  font-size:12px;font-weight:650;color:var(--ink-2);cursor:pointer;transition:all .15s;\n}\n.chip:hover{background:var(--surface-3)}\n.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}\n.chip .n{font-family:var(--num);font-size:10.5px;opacity:.75}\n\n.rec{\n  display:flex;gap:11px;padding:11px 13px;border-radius:10px;\n  border:1px solid var(--line-2);background:var(--surface-2);margin-bottom:8px;\n}\n.rec .ty{\n  width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:flex;\n  align-items:center;justify-content:center;background:var(--surface-3);color:var(--ink-2);\n}\n.rec .ty svg{width:16px;height:16px}\n.rec[data-t=\"hw\"] .ty{background:var(--blue-soft);color:var(--blue)}\n.rec[data-t=\"home\"] .ty{background:var(--violet-soft);color:var(--violet)}\n.rec[data-t=\"talk\"] .ty{background:var(--teal-soft);color:var(--teal)}\n.rec[data-t=\"listen\"] .ty{background:var(--amber-soft);color:var(--amber)}\n.rec[data-t=\"point\"] .ty{background:var(--green-soft);color:var(--green)}\n.rec[data-t=\"meet\"] .ty{background:var(--verm-soft);color:var(--verm)}\n.rec .bd{flex:1 1 auto;min-width:0}\n.rec .ti{font-size:13px;font-weight:680;display:flex;gap:7px;align-items:center;flex-wrap:wrap}\n.rec .ds{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.55;word-break:break-word}\n.rec .mt{font-size:11px;color:var(--ink-3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}\n\n/* ---------------------------- 数据页 ---------------------------- */\n.storecard{\n  display:flex;gap:13px;padding:14px 15px;border-radius:11px;\n  border:1px solid var(--line);background:var(--surface-2);align-items:flex-start;\n}\n.storecard+.storecard{margin-top:10px}\n.storecard .ic{\n  width:38px;height:38px;flex:0 0 38px;border-radius:10px;\n  display:flex;align-items:center;justify-content:center;background:var(--surface-3);color:var(--ink-2);\n}\n.storecard .ic svg{width:18px;height:18px}\n.storecard.on{border-color:rgba(63,138,50,.35);background:var(--green-soft)}\n.storecard.on .ic{background:var(--green);color:#fff}\n.storecard.off .ic{background:var(--amber-soft);color:var(--amber)}\n.storecard h3{margin:0 0 3px;font-size:13px;font-weight:750;display:flex;align-items:center;gap:7px}\n.storecard p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.6}\n.storecard code{\n  font-family:var(--num);font-size:11.5px;padding:1px 5px;border-radius:4px;\n  background:var(--surface-3);color:var(--ink);\n}\n.path{font-family:var(--num);font-size:11.5px;color:var(--green);word-break:break-all;margin-top:4px}\n\n.help{font-size:12px;color:var(--ink-2);line-height:1.75}\n.help b{color:var(--ink)}\n.help p{margin:4px 0 0}\n.help code,.help .kbd{font-family:var(--num);font-size:11.5px;padding:1px 5px;border-radius:4px;\n  background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink);white-space:nowrap}\n.help ol,.help ul{margin:6px 0 0;padding-left:18px}\n.help li{margin:3px 0}\n.kbd{\n  font-family:var(--num);font-size:11px;padding:1px 5px;border-radius:4px;\n  border:1px solid var(--line);border-bottom-width:2px;background:var(--surface-2);\n}\n\n/* ---------------------------- 弹窗/提示 ---------------------------- */\n.mask{\n  position:fixed;inset:0;z-index:80;background:rgba(12,18,26,.42);\n  display:flex;align-items:center;justify-content:center;padding:20px;\n  animation:fade .16s ease;\n}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n.dlg{\n  width:100%;max-width:520px;max-height:88vh;overflow:auto;\n  background:var(--surface);border-radius:16px;border:1px solid var(--line);\n  box-shadow:0 30px 70px -30px rgba(0,0,0,.5);\n  animation:pop .18s cubic-bezier(.2,.9,.3,1.2);\n}\n@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}\n.dlg-h{\n  display:flex;align-items:center;gap:10px;padding:15px 18px 12px;\n  border-bottom:1px solid var(--line-2);\n}\n.dlg-h h3{margin:0;font-size:14.5px;font-weight:780;flex:1 1 auto}\n.dlg-b{padding:15px 18px}\n.dlg-f{\n  display:flex;gap:8px;justify-content:flex-end;padding:0 18px 16px;\n}\n.xbtn{\n  width:28px;height:28px;border-radius:7px;border:0;background:transparent;\n  color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;\n}\n.xbtn:hover{background:var(--surface-3);color:var(--ink)}\n.xbtn svg{width:15px;height:15px}\n\n.toastbox{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;\n  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}\n.toast{\n  padding:9px 16px;border-radius:10px;background:var(--ink);color:var(--surface);\n  font-size:12.5px;font-weight:650;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);\n  animation:up .2s ease;max-width:88vw;text-align:center;\n}\n@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n\n/* 倒计时/点名 大屏 */\n.bigtool{text-align:center;padding:8px 0 4px}\n.bigtool .cnt{\n  font-family:var(--num);font-size:64px;font-weight:800;letter-spacing:-.04em;\n  line-height:1.1;font-variant-numeric:tabular-nums;\n}\n.bigtool .who{font-size:44px;font-weight:800;letter-spacing:-.01em;line-height:1.25;\n  padding:10px 0;word-break:break-all}\n.bigtool .sub{font-size:12px;color:var(--ink-3);margin-top:4px}\n\n/* ---------------------------- 响应式 ---------------------------- */\n@media(max-width:1000px){\n  .g-hero{grid-template-columns:minmax(0,1fr)}\n  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}\n}\n@media(max-width:720px){\n  .wrap{padding:12px 13px 34px}\n  html[data-embed] .wrap{padding:10px 12px 26px}\n  .top{gap:9px;padding-bottom:11px}\n  .brand h1{font-size:15px}\n  #brandSub{display:none}\n  .logo{width:34px;height:34px;flex:0 0 34px;border-radius:10px}\n  .logo svg{width:18px;height:18px}\n  .todaybox b{font-size:16px}\n  .todaybox span{display:none}\n  .top-sp{display:none}\n  .clswitch{order:5;flex:1 1 100%}\n  .clswitch select{max-width:100%;width:100%}\n  .sstat{height:28px;font-size:11px;padding:0 9px}\n  .tabs{gap:3px;margin-bottom:12px;overflow:visible}\n  .tab{flex:1 1 0;min-width:0;justify-content:center;height:35px;padding:0 4px;\n    font-size:12.5px;gap:4px}\n  .tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .tab .badge{position:absolute;top:-4px;right:-1px;min-width:14px;height:14px;\n    font-size:9px;padding:0 3px;border:2px solid var(--surface)}\n  .tab svg{width:15px;height:15px;flex:0 0 15px}\n  .today-hd{gap:8px}\n  .today-hd .btn.pri{margin-left:auto}\n  .g-2,.g-3{grid-template-columns:minmax(0,1fr)}\n  .today-hd h2{font-size:17px}\n  .tools{grid-template-columns:1fr}\n  .inp{height:38px;font-size:16px}\n  textarea.inp{font-size:15px}\n  .btn{height:34px}\n  .btn.sm{height:28px}\n  .dlg{max-width:100%;border-radius:14px}\n  .frow{flex-direction:column;gap:0}\n  .frow>*{flex:1 1 auto}\n  .bigtool .cnt{font-size:52px}\n  .bigtool .who{font-size:34px}\n  .seat{font-size:10.5px;min-height:40px;padding:4px 2px}\n  .tbl .cut{max-width:130px}\n  .toastbox{bottom:calc(16px + env(safe-area-inset-bottom))}\n}\n@media(max-width:400px){\n  .seat{font-size:9.5px;min-height:36px}\n}\n\n/* 打印座位表 */\n@media print{\n  .top,.tabs,.seatbar,.btn,.sstat,.toastbox{display:none!important}\n  body{background:#fff}\n  .card{border:0;box-shadow:none}\n}\n\n/* ==========================================================================\n   v22 · 与「教师导航」外壳统一成同一套：纸白 / 墨 / 发丝线 / 一处批改红\n   --------------------------------------------------------------------------\n   外层改成了印刷品质感，内层如果还是蓝白科技风，两边就会打架。\n   这里只换色、换圆角、换阴影 —— 不动任何结构尺寸，功能零风险。\n   ========================================================================== */\n:root{\n  --bg:#FAFAF6; --bg-2:#F3F3ED;\n  --surface:#FFFFFF; --surface-2:#F8F8F3; --surface-3:#F1F1E9;\n  --ink:#16191D; --ink-2:#4E5661; --ink-3:#8A9099;\n  --line:#E5E5DC; --line-2:#EDEDE6;\n\n  --verm:#B5382C; --verm-ink:#8E2A20; --verm-soft:rgba(181,56,44,.08);\n  --blue:#2A6178; --blue-soft:rgba(42,97,120,.09);\n  --green:#3F7A55; --green-soft:rgba(63,122,85,.10);\n  --amber:#A8701A; --amber-soft:rgba(168,112,26,.12);\n  --violet:#5F5A72; --violet-soft:rgba(95,90,114,.10);\n  --teal:#2A6178; --teal-soft:rgba(42,97,120,.10);\n\n  --shadow-1:0 1px 1px rgba(22,25,29,.03);\n  --shadow-2:0 12px 28px -20px rgba(22,25,29,.26);\n  --r:10px; --r-sm:8px;\n  --ui:-apple-system,\"SF Pro Text\",\"Segoe UI Variable Text\",\"Segoe UI\",system-ui,\n       \"Microsoft YaHei UI\",\"Microsoft YaHei\",\"PingFang SC\",\"Hiragino Sans GB\",sans-serif;\n}\nhtml[data-theme=\"dark\"]{\n  --bg:#101215; --bg-2:#0C0E11;\n  --surface:#181C21; --surface-2:#1D2228; --surface-3:#232931;\n  --ink:#E9E6DF; --ink-2:#A8AFB8; --ink-3:#767E88;\n  --line:#2C333C; --line-2:#242A32;\n\n  --verm:#E0685C; --verm-ink:#F09085; --verm-soft:rgba(224,104,92,.13);\n  --blue:#7FB2C6; --blue-soft:rgba(127,178,198,.13);\n  --green:#79B48C; --green-soft:rgba(121,180,140,.13);\n  --amber:#DFAE5C; --amber-soft:rgba(223,174,92,.14);\n  --violet:#A99CC4; --violet-soft:rgba(169,156,196,.14);\n  --teal:#7FB2C6; --teal-soft:rgba(127,178,198,.13);\n  --shadow-1:0 1px 1px rgba(0,0,0,.35);\n  --shadow-2:0 12px 30px -20px rgba(0,0,0,.8);\n}\n\nbody{background:var(--bg);font-family:var(--ui)}\n\n/* 顶栏：纸面 + 一条发丝线 */\n.top{\n  background:color-mix(in srgb,var(--bg) 92%,transparent)!important;\n  border-bottom:1px solid var(--line)!important;\n  box-shadow:none!important;\n  -webkit-backdrop-filter:blur(12px);\n  backdrop-filter:blur(12px);\n}\n.brand .logo{\n  background:var(--ink)!important;\n  color:var(--bg)!important;\n  border-radius:7px!important;\n  box-shadow:none!important;\n}\n.brand h1{letter-spacing:-.02em}\n.brand .sub{color:var(--ink-3)}\n.brand .ver{\n  background:var(--surface-3)!important;\n  color:var(--ink-2)!important;\n  border:1px solid var(--line)!important;\n  border-radius:4px!important;\n  font-family:var(--num);\n}\n\n/* 选项卡：选中项用墨底反白，比\"白底浮起来\"更定 */\n.tabs{background:transparent!important;border-bottom:1px solid var(--line)!important}\n.tab{\n  border-radius:7px!important;\n  color:var(--ink-2)!important;\n  border:1px solid transparent!important;\n  box-shadow:none!important;\n}\n.tab:hover{background:var(--surface-3)!important;color:var(--ink)!important}\n.tab.on{\n  background:var(--ink)!important;\n  color:var(--bg)!important;\n  border-color:var(--ink)!important;\n  box-shadow:none!important;\n  font-weight:650;\n}\n.tab.on svg{opacity:1!important;color:var(--bg)!important}\n.tab .badge{background:var(--verm)!important;color:#fff!important}\n\n/* 卡片：发丝边框，去掉浮起阴影 */\n.card{\n  background:var(--surface)!important;\n  border:1px solid var(--line)!important;\n  border-radius:10px!important;\n  box-shadow:none!important;\n}\n.card-h{\n  border-bottom:1px solid var(--line)!important;\n  background:transparent!important;\n}\n.card-h h2{\n  letter-spacing:.005em;\n  font-weight:750;\n}\n.card-h h2::before{\n  content:'';\n  display:inline-block;\n  width:2px;height:.92em;\n  background:var(--verm);\n  border-radius:1px;\n  margin-right:8px;\n  vertical-align:-.08em;\n}\n\n/* 按钮：主按钮墨色，危险还是红 */\n.btn{\n  border-radius:7px!important;\n  box-shadow:none!important;\n  font-weight:600;\n}\n.btn.pri{\n  background:var(--ink)!important;\n  border-color:var(--ink)!important;\n  color:var(--bg)!important;\n}\n.btn.pri:hover{\n  background:var(--verm)!important;\n  border-color:var(--verm)!important;\n  color:#fff!important;\n}\n\n/* 输入控件 */\ninput,select,textarea{\n  border-radius:7px!important;\n  border-color:var(--line)!important;\n  background:var(--surface)!important;\n}\ninput:focus,select:focus,textarea:focus{\n  border-color:var(--ink-3)!important;\n  box-shadow:0 0 0 3px color-mix(in srgb,var(--verm) 10%,transparent)!important;\n  outline:none!important;\n}\n\n/* 顶部班级选择 / 日期 / 存储状态 */\n.clswitch select{background:var(--surface)!important;border:1px solid var(--line)!important}\n.sstat{\n  background:var(--surface-3)!important;\n  border:1px solid var(--line)!important;\n  border-radius:7px!important;\n  color:var(--ink-2)!important;\n}\n.sstat:hover{background:var(--surface-2)!important;color:var(--ink)!important}\n\n/* 焦点可见 */\na:focus-visible,button:focus-visible,select:focus-visible,[tabindex]:focus-visible{\n  outline:2px solid var(--verm);\n  outline-offset:2px;\n  border-radius:5p tring(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction uid(p){return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}\nfunction pad2(n){return n<10?'0'+n:''+n}\nfunction iso(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}\nfunction today(){return iso(new Date())}\nfunction parseD(s){const p=String(s||'').split('-');return new Date(+p[0],+p[1]-1,+p[2])}\nfunction dayDiff(a,b){return Math.round((parseD(a)-parseD(b))/86400000)}\nfunction wd(d){const w=(d||new Date()).getDay();return w===0?7:w}\nfunction cnDate(s){const d=s?parseD(s):new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日'}\nconst WK=['一','二','三','四','五','六','日'];\nfunction weekName(n){return '周'+(WK[(n||1)-1]||'一')}\nfunction n1(n){return (Math.round(n*10)/10).toFixed(1)}\nfunction clamp(v,a,b){return v<a?a:v>b?b:v}\n\nfunction toast(msg,ms){\n  const b=$('#toast'); if(!b)return;\n  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;\n  b.appendChild(d);\n  setTimeout(()=>{d.style.transition='opacity .25s,transform .25s';d.style.opacity='0';d.style.transform='translateY(6px)';\n    setTimeout(()=>d.remove(),260)}, ms||2000);\n}\n\n/* ------------------------------ 数据模型 ------------------------------ */\nconst KEY='wb_teacher_v1';\n\nfunction defaults(){\n  const NAMES=['张一诺','李思远','王梓涵','刘雨萱','陈嘉豪','杨梦琪','赵子轩','周若曦','吴嘉怡','徐浩然','孙嘉宁','马文博'];\n  const st=NAMES.map((n,i)=>({\n    id:'s'+(i+1), n:n, no:pad2(i+1), sex:i%2?'F':'M',\n    tags:(i===2?['留守']:i===5?['学困']:i===8?['单亲']:[]),\n    phone:''\n  }));\n  const T={\n    1:[{p:1,sub:'数学',cls:'高一(3)班',room:'301'},{p:2,sub:'数学',cls:'高一(3)班',room:'301'},{p:3,sub:'班会',cls:'高一(3)班',room:'301'},{p:6,sub:'数学',cls:'高一(5)班',room:'305'}],\n    2:[{p:2,sub:'数学',cls:'高一(5)班',room:'305'},{p:4,sub:'数学',cls:'高一(3)班',room:'301'}],\n    3:[{p:1,sub:'数学',cls:'高一(3)班',room:'301'},{p:3,sub:'教研活动',cls:'数学组',room:'会议室'},{p:5,sub:'数学',cls:'高一(5)班',room:'305'}],\n    4:[{p:2,sub:'数学',cls:'高一(3)班',room:'301'},{p:6,sub:'数学',cls:'高一(5)班',room:'305'}],\n    5:[{p:1,sub:'数学',cls:'高一(5)班',room:'305'},{p:4,sub:'数学',cls:'高一(3)班',room:'301'},{p:7,sub:'社团',cls:'数学社',room:'302'}],\n    6:[],7:[]\n  };\n  const d0=today();\n  return {\n    v:'1.0.1',\n    profile:{name:'',school:'',subject:'数学'},\n    classes:[{id:'c1',name:'高一(3)班',grade:'高一',students:st}],\n    cur:'c1',\n    timetable:T,\n    todos:[\n      {id:uid('t'),t:'把教研组材料交到教务处',note:'纸质一份 + 电子稿发群里',due:iso(new Date(Date.now()-86400000)),pri:'P0',cat:'教学',done:false,ts:Date.now()},\n      {id:uid('t'),t:'第 2 节公开课磨课',note:'重点看例题梯度和板书位置',due:d0,pri:'P0',cat:'教学',done:false,ts:Date.now()},\n      {id:uid('t'),t:'批完本周周记（12 本）',note:'挑 3 篇做范文',due:d0,pri:'P1',cat:'教学',done:false,ts:Date.now()},\n      {id:uid('t'),t:'家长会 PPT 初稿',note:'先出框架，数据等月考后再填',due:iso(new Date(Date.now()+3*86400000)),pri:'P2',cat:'班级',done:false,ts:Date.now()}\n    ],\n    exams:[{id:'e1',name:'第一次月考',date:iso(new Date(Date.now()-6*86400000)),subject:'数学',full:120,cls:'c1',\n      map:{s1:112,s2:98,s3:76,s4:88,s5:64,s6:52,s7:105,s8:94,s9:81,s10:73,s11:59,s12:101}}],\n    logs:[\n      {id:uid('l'),ty:'hw',date:iso(new Date(Date.now()-86400000)),title:'第 3 章 作业收缴',\n       note:'应交 12 人，实交 10 人',meta:'数学 · 练习册 3-1',val:10},\n      {id:uid('l'),ty:'home',date:iso(new Date(Date.now()-2*86400000)),title:'与王梓涵妈妈电话沟通',\n       note:'反映孩子最近晚上玩手机到很晚，白天上课打瞌睡。约定家长晚上 10 点收手机，我这边一周内多留意课堂状态。',stu:'s3'},\n      {id:uid('l'),ty:'talk',date:iso(new Date(Date.now()-3*86400000)),title:'找陈嘉豪谈作业拖欠',\n       note:'不是不会，是拖。约定每天中午交前一天的，先坚持一周。',stu:'s5'}\n    ],\n    attend:{},\n    seats:{c1:{cols:6,order:['s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12']}},\n    settings:{dirName:'',auto:true,lastBackup:'',server:''}\n  };\n}\n\nlet DB=defaults();\n\n/* 补全旧数据结构，避免以后加字段时老数据报错 */\nfunction normalize(d){\n  const def=defaults();\n  if(!d||typeof d!=='object')return def;\n  ['profile','settings'].forEach(k=>{d[k]=Object.assign({},def[k],d[k]||{})});\n  ['classes','todos','exams','logs'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=def[k]});\n  if(!d.timetable||typeof d.timetable!=='object')d.timetable={};\n  if(!d.attend||typeof d.attend!=='object')d.attend={};\n  if(!d.seats||typeof d.seats!=='object')d.seats={};\n  if(!d.classes.length)d.classes=def.classes;\n  if(!d.classes.some(c=>c.id===d.cur))d.cur=d.classes[0].id;\n  d.classes.forEach(c=>{if(!Array.isArray(c.students))c.students=[]});\n  if(!d.v)d.v='1.0.1';\n  return d;\n}\n\nfunction cls(){return DB.classes.find(c=>c.id===DB.cur)||DB.classes[0]}\nfunction stu(id){const c=cls();return (c&&c.students||[]).find(s=>s.id===id)}\nfunction stuName(id){const s=stu(id);return s?s.n:''}\n\n/* ------------------------------ 本地存储 ------------------------------ */\nfunction loadLocal(){\n  try{\n    const raw=localStorage.getItem(KEY);\n    if(raw)DB=normalize(JSON.parse(raw));\n    else {DB=defaults();saveLocal();}\n  }catch(e){DB=defaults()}\n}\nfunction saveLocal(){\n  try{localStorage.setItem(KEY,JSON.stringify(DB));return true}\n  catch(e){toast('本机存储写不进去了（可能满了）');return false}\n}\n\n/* ------------------------------ 目录句柄（用户手选文件夹） ------------------------------ */\nconst IDB={\n  db:null,\n  open(){\n    return new Promise((res,rej)=>{\n      if(IDB.db)return res(IDB.db);\n      if(!window.indexedDB)return rej(new Error('no idb'));\n      let r;try{r=indexedDB.open('wb_teacher_fs',1)}catch(e){return rej(e)}\n      r.onupgradeneeded=()=>{r.result.createObjectStore('h')};\n      r.onsuccess=()=>{IDB.db=r.result;res(r.result)};\n      r.onerror=()=>rej(r.error);\n    });\n  },\n  get(k){return IDB.open().then(db=>new Promise((res,rej)=>{\n    const t=db.transaction('h','readonly').objectStore('h').get(k);\n    t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)}))},\n  set(k,v){return IDB.open().then(db=>new Promise((res,rej)=>{\n    const t=db.transaction('h','readwrite').objectStore('h').put(v,k);\n    t.onsuccess=()=>res(true);t.onerror=()=>rej(t.error)}))}\n};\n\nconst FS={\n  handle:null, name:'', ok:false, writing:false, lastAt:'',\n  support(){return typeof window.showDirectoryPicker==='function'},\n  async restore(){\n    if(!FS.support())return false;\n    try{\n      const h=await IDB.get('dir');\n      if(!h)return false;\n      const p=await h.queryPermission({mode:'readwrite'});\n      FS.handle=h; FS.name=h.name;\n      FS.ok=(p==='granted');\n      return FS.ok;\n    }catch(e){return false}\n  },\n  async pick(){\n    if(!FS.support()){toast('这个浏览器不支持选文件夹，请用 Chrome / Edge');return false}\n    try{\n      const h=await window.showDirectoryPicker({id:'teacherdesk',mode:'readwrite',startIn:'documents'});\n      FS.handle=h;FS.name=h.name;FS.ok=true;\n      let remembered=false;try{await IDB.set('dir',h);remembered=true}catch(e){}\n      toast(remembered?'已记住这个文件夹，以后每次改动都会自动写进去':'本次已连上，但浏览器不让记住，刷新后要重选；长期请用导出 JSON');\n      await FS.write(true);\n      return true;\n    }catch(e){\n      if(e&&e.name==='AbortError')return false;\n      const n=(e&&e.name)||'';\n      if(n==='SecurityError'||n==='NotAllowedError'||n==='TypeError'){\n        toast('嵌在导航站里时浏览器不许选文件夹，单独打开「教师工作台.html」再连一次');\n      }else{\n        toast('没选成文件夹：'+((e&&e.message)||n));\n      }\n      return false;\n    }\n  },\n  async ensure(){\n    if(!FS.handle)return false;\n    try{\n      let p=await FS.handle.queryPermission({mode:'readwrite'});\n      if(p!=='granted')p=await FS.handle.requestPermission({mode:'readwrite'});\n      FS.ok=(p==='granted');\n      return FS.ok;\n    }catch(e){FS.ok=false;return false}\n  },\n  payload(){\n    return JSON.stringify({app:'教师工作台',ver:'1.0.1',savedAt:new Date().toISOString(),data:DB},null,1);\n  },\n  async write(force){\n    if(!FS.handle)return false;\n    if(!FS.ok&&!force){const ok=await FS.ensure();if(!ok)return false}\n    if(FS.writing)return false;\n    FS.writing=true;\n    try{\n      const fh=await FS.handle.getFileHandle('教师工作台-数据.json',{create:true});\n      const w=await fh.createWritable({mode:'exclusive'});\n      await w.write(FS.payload());\n      await w.close();\n      FS.lastAt=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});\n      /* 每天第一笔改动，额外存一份当天快照，误删好回滚 */\n      const d=today();\n      if(DB.settings.lastBackup!==d){\n        try{\n          const dir=await FS.handle.getDirectoryHandle('每日备份',{create:true});\n          const bf=await dir.getFileHandle('教师工作台-'+d+'.json',{create:true});\n          const bw=await bf.createWritable();\n          await bw.write(FS.payload());await bw.close();\n          DB.settings.lastBackup=d;\n          try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}\n        }catch(e){}\n      }\n      return true;\n    }catch(e){\n      FS.ok=false;\n      toast('写文件失败：'+(e.message||e.name));\n      return false;\n    }finally{FS.writing=false}\n  }\n};\n\n/* ------------------------------ 服务器模式（手机同网段） ------------------------------ */\nconst SRV={on:false,dir:'',checked:false};\nfunction srvBase(){return ''}\nasync function srvPing(){\n  if(location.protocol==='file:')return false;\n  try{\n    const r=await fetch('/api/ping',{cache:'no-store'});\n    if(!r.ok)return false;\n    const j=await r.json();\n    if(j&&j.ok){SRV.on=true;SRV.dir=j.dir||'';return true}\n  }catch(e){}\n  return false;\n}\nasync function srvLoad(){\n  try{\n    const r=await fetch('/api/load',{cache:'no-store'});\n    if(!r.ok)return null;\n    const j=await r.json();\n    return j&&j.data?j.data:null;\n  }catch(e){return null}\n}\nasync function srvSave(){\n  try{\n    await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},\n      body:JSON.stringify({ver:'1.0.1',data:DB})});\n    return true;\n  }catch(e){return false}\n}\n\n/* ------------------------------ 保存调度 ------------------------------ */\nlet saveTimer=null, saveState='idle';\n\nfunction renderSaveState(){\n  const b=$('#saveState'); if(!b)return;\n  b.className='sstat';\n  let t='本机存储', cls='ok';\n  if(SRV.on){t='已存到 '+shortDir(SRV.dir);cls='ok'}\n  else if(FS.handle&&FS.ok){t='自动备份 · '+FS.name;cls='ok'}\n  else if(FS.handle&&!FS.ok){t='待授权 · '+FS.name;cls='warn'}\n  else {t='仅本机浏览器';cls='warn'}\n  if(saveState==='busy'){cls='busy';t='保存中…'}\n  b.classList.add(cls);\n  b.innerHTML='<i><\/i><span>'+esc(t)+'<\/span>';\n}\nfunction shortDir(p){if(!p)return '服务器';const m=String(p).match(/^([A-Za-z]:)/);return m?m[1]+'盘':'服务器'}\n\nfunction scheduleSave(){\n  saveState='busy';renderSaveState();\n  clearTimeout(saveTimer);\n  saveTimer=setTimeout(flushSave,600);\n}\nasync function flushSave(){\n  saveLocal();\n  if(SRV.on)await srvSave();\n  else if(FS.handle)await FS.write(false);\n  saveState='idle';renderSaveState();\n}\n\n/* 手动：立即写一次 */\nasync function saveNow(showTip){\n  clearTimeout(saveTimer);\n  saveLocal();\n  let ok=true;\n  if(SRV.on)ok=await srvSave();\n  else if(FS.handle)ok=await FS.write(true);\n  saveState='idle';renderSaveState();\n  if(showTip)toast(ok?'已保存'+(FS.handle?'到「'+FS.name+'」':'到本机'):'已存到本机浏览器');\n  return ok;\n}\n\n/* ------------------------------ 导入导出 ------------------------------ */\nfunction download(name,text,mime){\n  try{\n    const blob=new Blob([text],{type:(mime||'application/json')+';charset=utf-8'});\n    const a=document.createElement('a');\n    a.href=URL.createObjectURL(blob);a.download=name;\n    document.body.appendChild(a);a.click();\n    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200);\n    return true;\n  }catch(e){toast('导出失败：'+e.message);return false}\n}\nfunction exportJSON(){\n  download('教师工作台-备份-'+today()+'.json',FS.payload());\n  try{localStorage.setItem(KEY+'.didIO','1')}catch(e){}\n  toast('已导出备份文件');\n}\nfunction exportStudentsCSV(){\n  const c=cls();\n  const rows=[['姓名','学号','性别','标签','家长电话']];\n  (c.students||[]).forEach(s=>rows.push([s.n,s.no||'',s.sex==='F'?'女':'男',(s.tags||[]).join('/'),s.phone||'']));\n  download('学生名单-'+c.name+'-'+today()+'.csv','\\ufeff'+rows.map(r=>r.map(x=>'\"'+String(x).replace(/\"/g,'\"\"')+'\"').join(',')).join('\\r\\n'),'text/csv');\n  toast('已导出学生名单');\n}\nfunction exportScoresCSV(examId){\n  const e=DB.exams.find(x=>x.id===examId)||DB.exams[0]; if(!e)return;\n  const c=DB.classes.find(x=>x.id===e.cls)||cls();\n  const ss=(c.students||[]).slice().map(s=>({s,v:e.map[s.id]}));\n  ss.sort((a,b)=>(b.v==null?-1:b.v)-(a.v==null?-1:a.v));\n  const rows=[['排名','姓名','学号',e.subject+'分数','满分','得分率']];\n  ss.forEach((x,i)=>rows.push([x.v==null?'':i+1,x.s.n,x.s.no||'',x.v==null?'':x.v,e.full,\n    x.v==null?'':Math.round(x.v/e.full*1000)/10+'%']));\n  download(e.name+'-'+c.name+'-'+today()+'.csv','\\ufeff'+rows.map(r=>r.map(x=>'\"'+String(x).replace(/\"/g,'\"\"')+'\"').join(',')).join('\\r\\n'),'text/csv');\n  toast('已导出成绩表');\n}\nfunction importJSON(file){\n  const fr=new FileReader();\n  fr.onload=()=>{\n    try{\n      const j=JSON.parse(fr.result);\n      const d=j&&j.data?j.data:j;\n      if(!d||!Array.isArray(d.classes))throw new Error('不像是工作台的备份文件');\n      DB=normalize(d);\n      saveLocal();scheduleSave();refreshAll();\n      toast('导入成功：'+DB.classes.length+' 个班、'+DB.classes.reduce((a,c)=>a+c.students.length,0)+' 名学生');\n      try{localStorage.setItem(KEY+'.didIO','1')}catch(e){}\n    }catch(e){toast('导入失败：'+e.message)}\n  };\n  fr.readAsText(file);\n}\n\n/* ------------------------------ CSV 模板与导入（从班务通融进来的\"按表头自动识别\"导入） ------------------------------ */\n/* 简易 CSV 解析：支持引号包裹、双引号转义、逗号分隔，兼容 Excel 导出的 UTF-8(BOM) */\nfunction parseCSV(text){\n  const out=[];let row=[],cur='',q=false;\n  text=String(text).replace(/^\\ufeff/,'');\n  for(let i=0;i<text.length;i++){const c=text[i];\n    if(q){ if(c==='\"'){ if(text[i+1]==='\"'){cur+='\"';i++}else q=false } else cur+=c }\n    else{ if(c==='\"')q=true; else if(c===','){row.push(cur);cur=''}\n      else if(c==='\\r'){} else if(c==='\\n'){row.push(cur);out.push(row);row=[];cur=''}\n      else cur+=c }\n  }\n  if(cur!==''||row.length){row.push(cur);out.push(row)}\n  return out;\n}\nfunction tplStudentsCSV(){\n  const head=['姓名','学号','性别','家长电话','标签（用/分隔）'];\n  download('学生导入模板.csv','\\ufeff'+[head].map(r=>r.map(x=>'\"'+x+'\"').join(',')).join('\\r\\n'),'text/csv');\n  toast('模板已下载：至少填「姓名」，其它选填');\n}\nfunction tplScoresCSV(){\n  const head=['考试名称','科目','满分','学号','姓名','分数'];\n  download('成绩导入模板.csv','\\ufeff'+[head].map(r=>r.map(x=>'\"'+x+'\"').join(',')).join('\\r\\n'),'text/csv');\n  toast('模板已下载：按表头填，系统按学号/姓名自动对号');\n}\nfunction importStudentsCSV(file){\n  const fr=new FileReader();\n  fr.onload=()=>{ try{\n    const rows=parseCSV(fr.result);\n    if(rows.length<2)throw new Error('表格里至少要有一行学生');\n    const head=rows[0].map(x=>String(x).trim());\n    const find=(keys)=>{ for(let i=0;i<head.length;i++){ if(keys.some(k=>head[i]===k||head[i].indexOf(k)>=0))return i; } return -1; };\n    const ni=find(['姓名','名字','学生']); if(ni<0)throw new Error('没找到「姓名」列');\n    const noI=find(['学号','编号']),sexI=find(['性别','男/女']),phI=find(['电话','手机','家长']),tagI=find(['标签','分组','类型']);\n    const c=cls(); if(!c)throw new Error('请先建一个班级');\n    let n=0;\n    for(let r=1;r<rows.length;r++){\n      const row=rows[r]; const name=String(row[ni]||'').trim();\n      if(!name)continue;\n      const sex=row[sexI]?(String(row[sexI]).indexOf('女')>=0?'F':'M'):'M';\n      const tags=row[tagI]?String(row[tagI]).split(/[\\/、,，]/).map(s=>s.trim()).filter(Boolean):[];\n      c.students.push({id:uid('s'),n:name,no:(row[noI]?String(row[noI]).trim():''),sex:sex,\n        phone:(row[phI]?String(row[phI]).trim():''),tags:tags,seat:null});\n      n++;\n    }\n    scheduleSave();refreshAll();\n    toast('已导入 '+n+' 名学生到「'+c.name+'」');\n    try{localStorage.setItem(KEY+'.didIO','1')}catch(e){}\n  }catch(e){toast('导入失败：'+e.message)} };\n  fr.readAsText(file);\n}\nfunction importScoresCSV(file){\n  const fr=new FileReader();\n  fr.onload=()=>{ try{\n    const rows=parseCSV(fr.result);\n    if(rows.length<2)throw new Error('表格里至少要有一行成绩');\n    const head=rows[0].map(x=>String(x).trim());\n    const f=h=>head.findIndex(x=>new RegExp(h).test(x));\n    const nameI=f('考试|名称'),subI=f('科目'),fullI=f('满分'),noI=f('学号'),nmI=f('姓名'),scI=f('分数|成绩|得分');\n    if(scI<0)throw new Error('没找到「分数/成绩」列');\n    const examName=(nameI>=0&&rows[1][nameI])?String(rows[1][nameI]).trim():'导入考试';\n    const subj=(subI>=0&&rows[1][subI])?String(rows[1][subI]).trim():'总分';\n    const full=(fullI>=0&&parseFloat(rows[1][fullI]))||100;\n    const c=cls(); const e={id:uid('x'),name:examName,subject:subj,full:full,date:today(),cls:c.id,map:{}};\n    let n=0;\n    for(let r=1;r<rows.length;r++){\n      const row=rows[r]; const v=parseFloat(String(row[scI])); if(isNaN(v))continue;\n      const no=(noI>=0?String(row[noI]).trim():''), nm=(nmI>=0?String(row[nmI]).trim():'');\n      let st=null;\n      if(no)st=c.students.find(s=>s.no&&s.no===no);\n      if(!st&&nm)st=c.students.find(s=>s.n===nm);\n      if(!st)st=c.students[r-1];\n      if(st){e.map[st.id]=v;n++;}\n    }\n    DB.exams=DB.exams||[];DB.exams.push(e);scheduleSave();refreshAll();\n    toast('已导入「'+examName+'」'+n+' 条成绩');\n    try{localStorage.setItem(KEY+'.didIO','1')}catch(e){}\n  }catch(e){toast('导入失败：'+e.message)} };\n  fr.readAsText(file);\n}\n\n/* ------------------------------ 统计（计算层） ------------------------------ */\nfunction classStats(){\n  const c=cls(); const st=c.students||[];\n  return {n:st.length, m:st.filter(s=>s.sex==='M').length, f:st.filter(s=>s.sex==='F').length,\n    tagged:st.filter(s=>(s.tags||[]).length).length};\n}\nfunction examStat(e){\n  const c=DB.classes.find(x=>x.id===e.cls)||cls();\n  const arr=(c.students||[]).map(s=>({s,v:e.map[s.id]})).filter(x=>typeof x.v==='number'&&!isNaN(x.v));\n  const vs=arr.map(x=>x.v);\n  const full=e.full||120;\n  const sum=vs.reduce((a,b)=>a+b,0);\n  const avg=vs.length?sum/vs.length:0;\n  const pass=vs.filter(v=>v>=full*0.6).length;\n  const good=vs.filter(v=>v>=full*0.8).length;\n  arr.sort((a,b)=>b.v-a.v);\n  return {arr:arr, n:vs.length, avg:avg, max:vs.length?Math.max.apply(null,vs):0,\n    min:vs.length?Math.min.apply(null,vs):0, passRate:vs.length?pass/vs.length*100:0,\n    goodRate:vs.length?good/vs.length*100:0, full:full,\n    std:vs.length?Math.sqrt(vs.reduce((a,b)=>a+(b-avg)*(b-avg),0)/vs.length):0};\n}\nfunction bands(e){\n  const full=e.full||120;\n  const edges=[0,0.3,0.45,0.6,0.75,0.85,1.001];\n  const label=['极低','偏低','不及格','及格','良好','优秀'];\n  const cnt=new Array(6).fill(0);\n  (cls().students||[]).forEach(s=>{\n    const v=e.map[s.id];\n    if(typeof v!=='number')return;\n    const r=v/full;\n    let i=0;\n    for(let k=0;k<6;k++){if(r>=edges[k]&&r<edges[k+1]){i=k;break}}\n    cnt[i]++;\n  });\n  return {label:label,cnt:cnt,edges:edges,full:full};\n}\nfunction overdueTodos(){\n  const d=today();\n  return (DB.todos||[]).filter(t=>!t.done&&t.due&&t.due<d);\n}\nfunction todayTodos(){\n  const d=today();\n  return (DB.todos||[]).filter(t=>!t.done&&t.due===d);\n}\nfunction laterTodos(){\n  const d=today();\n  return (DB.todos||[]).filter(t=>!t.done&&(!t.due||t.due>d));\n}\n\n/* 今日课程 */\nfunction lessonsOf(day){\n  const arr=(DB.timetable&&DB.timetable[String(day)])||[];\n  return arr.slice().sort((a,b)=>a.p-b.p);\n}\nfunction nowPeriod(){\n  const h=new Date().getHours()+new Date().getMinutes()/60;\n  if(h<8)return 0; if(h<8.75)return 1; if(h<9.6)return 2; if(h<10.6)return 3; if(h<11.4)return 4;\n  if(h<14)return 0; if(h<14.75)return 5; if(h<15.6)return 6; if(h<16.5)return 7; if(h<17.4)return 8;\n  return 0;\n}\n\n/* ==========================================================================\n   教师工作台 V1.0.6 —— 视图层\n   每个 renderXxx 只读数据、只写自己的容器；互相之间不调用\n   ========================================================================== */\n'use strict';\n\nconst V={tab:'home',logFilter:'all',examId:null,seatSel:null,seatCols:null};\nconst TABS=[\n  {id:'home',n:'今天',i:'cal'},\n  {id:'tt',n:'课表',i:'grid'},\n  {id:'cls',n:'班级',i:'users'},\n  {id:'score',n:'成绩',i:'chart'},\n  {id:'log',n:'事务',i:'list'},\n  {id:'data',n:'数据',i:'db'}\n];\n\n/* ------------------------------ 统一刷新入口 ------------------------------ */\nfunction refreshAll(){\n  renderTabs();\n  renderClassSel();\n  renderSaveState();\n  const box=$('#view'); if(!box)return;\n  if(V.tab==='home')box.innerHTML=renderHome();\n  else if(V.tab==='cls')box.innerHTML=renderClass();\n  else if(V.tab==='tt')box.innerHTML=renderTT();\n  else if(V.tab==='score')box.innerHTML=renderScore();\n  else if(V.tab==='log')box.innerHTML=renderLog();\n  else box.innerHTML=renderData();\n}\n\n/* ------------------------------ Tab / 班级 ------------------------------ */\nfunction renderTabs(){\n  const n=overdueTodos().length+todayTodos().length;\n  $('#tabs').innerHTML=TABS.map(t=>{\n    const b=(t.id==='home'&&n)?'<span class=\"badge\">'+n+'<\/span>':'';\n    return '<button class=\"tab'+(V.tab===t.id?' on':'')+'\" data-act=\"tab\" data-tab=\"'+t.id+'\">'+svg(t.i)+'<span>'+t.n+'<\/span>'+b+'<\/button>';\n  }).join('');\n}\nfunction renderClassSel(){\n  const s=$('#clsSel'); if(!s)return;\n  s.innerHTML=DB.classes.map(c=>'<option value=\"'+esc(c.id)+'\"'+(c.id===DB.cur?' selected':'')+'>'+\n    esc(c.name)+' · '+c.students.length+'人<\/option>').join('');\n}\n\n/* ------------------------------ 今天 ------------------------------ */\nfunction renderHome(){\n  const d=new Date();\n  const od=overdueTodos(), td=todayTodos(), lt=laterTodos();\n  const doneT=(DB.todos||[]).filter(t=>t.done).length;\n  const total=(DB.todos||[]).length;\n  const ls=lessonsOf(wd(d));\n  const np=nowPeriod();\n\n  let h='<div class=\"today-hd\">'\n    +'<h2>'+cnDate()+' '+weekName(wd(d))+'<\/h2>'\n    +'<span class=\"meta\">'+(ls.length?('今天 '+ls.length+' 节课'):'今天没课')\n    +(od.length?(' · <b style=\"color:var(--verm)\">'+od.length+' 件逾期<\/b>'):'')\n    +'<\/span><span class=\"sp\"><\/span>'\n    +'<button class=\"btn pri\" data-act=\"tnew\">'+svg('plus')+'记一件事<\/button>'\n    +'<\/div>';\n\n  /* 首次进入工作台：用闪烁按钮提醒「先导入/备份」，不做弹窗。做过一次后自动消失 */\n  let _didIO=false;try{_didIO=localStorage.getItem(KEY+'.didIO')==='1'}catch(e){}\n  if(!_didIO){\n    h+='<div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;'\n      +'border:1.5px solid var(--verm);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--verm-soft)\">'\n      +'<div style=\"flex:1;min-width:200px\"><div style=\"font-weight:800;font-size:13.5px;color:var(--verm-ink)\">第一次用？先把班级接进来<\/div>'\n      +'<div style=\"font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.6\">数据只存在你这台电脑，不上传。导入学生名单，或导出一份备份，之后全自动保存。<\/div><\/div>'\n      +'<button class=\"btn pri io-flash\" data-act=\"tab\" data-tab=\"data\" style=\"white-space:nowrap\">'+svg('ul')+'去导入 / 备份<\/button>'\n      +'<\/div>';\n  }\n\n  /* 一屏之内先给五个数：多少人、多少课、该办几件、有没有逾期、上次考得怎么样 */\n  const _c=cls();\n  const _wk=(function(){let n=0;[1,2,3,4,5].forEach(d=>{n+=lessonsOf(d).length});return n})();\n  const _ex=(DB.exams||[]).slice().sort((a,b)=>(b.date||'')<(a.date||'')?-1:1)[0];\n  const _st=_ex?examStat(_ex):null;\n  h+='<div class=\"kstrip\">'\n    +'<div class=\"k\"><b>'+(_c?_c.students.length:0)+'<\/b><span>班级人数<\/span><\/div>'\n    +'<div class=\"k blue\"><b>'+_wk+'<\/b><span>本周课时<\/span><\/div>'\n    +'<div class=\"k blue\"><b>'+td.length+'<\/b><span>今天要办<\/span><\/div>'\n    +'<div class=\"k'+((od.length)?' bad':'')+'\"><b>'+od.length+'<\/b><span>逾期未办<\/span><\/div>'\n    +'<div class=\"k\"><b>'+(_st?n1(_st.avg):'—')+'<\/b><span>'+(_ex?esc(_ex.name)+' 均分':'还没有考试')+'<\/span><\/div>'\n    +'<\/div>';\n\n  h+='<div class=\"grid g-hero\">';\n\n  /* 今天要处理 */\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>今天要处理<\/h2>'\n    +'<span class=\"cnt\">'+(od.length+td.length)+'<\/span><span class=\"sp\"><\/span>'\n    +'<span style=\"font-size:11px;color:var(--ink-3)\">已完成 '+doneT+'/'+total+'<\/span><\/div>'\n    +'<div class=\"card-b\">';\n  const doneToday=(DB.todos||[]).filter(t=>t.done&&t.doneAt&&new Date(t.doneAt).toDateString()===new Date().toDateString());\n  if(!od.length&&!td.length&&!lt.length&&!doneToday.length){\n    h+='<div class=\"empty\">'+svg('check')+'这事办完了，歇会儿<\/div>';\n  }else{\n    if(od.length){\n      h+='<div style=\"font-size:11px;font-weight:750;color:var(--verm);letter-spacing:.04em;margin:2px 0 6px\">逾期 · 先处理这些<\/div>';\n      od.sort((a,b)=>(a.due||'')<(b.due||'')?-1:1).forEach(t=>{h+=todoHTML(t,'over')});\n    }\n    if(td.length){\n      h+='<div style=\"font-size:11px;font-weight:750;color:var(--amber);letter-spacing:.04em;margin:12px 0 6px\">今天<\/div>';\n      td.sort((a,b)=>(a.pri||'P2')<(b.pri||'P2')?-1:1).forEach(t=>{h+=todoHTML(t,'today')});\n    }\n    if(lt.length){\n      h+='<div style=\"font-size:11px;font-weight:750;color:var(--ink-3);letter-spacing:.04em;margin:12px 0 6px\">接下来<\/div>';\n      lt.slice(0,6).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1).forEach(t=>{h+=todoHTML(t,'')});\n    }\n    if(doneToday.length){\n      h+='<div style=\"font-size:11px;font-weight:750;color:var(--green);letter-spacing:.04em;margin:12px 0 6px\">今天已经办完<\/div>';\n      doneToday.slice(0,5).forEach(t=>{h+=todoHTML(t,'')});\n    }\n  }\n  h+='<\/div><\/section>';\n\n  /* 右列 */\n  h+='<div class=\"grid\" style=\"gap:14px;align-content:start\">';\n\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>今日课程<\/h2><span class=\"cnt\">'+weekName(wd(d))+'<\/span>'\n    +'<span class=\"sp\"><\/span><button class=\"btn gh sm\" data-act=\"tt\" title=\"编辑课程表\">'+svg('edit')+'<\/button><\/div><div class=\"card-b\">';\n  if(!ls.length){\n    /* 今天没课不等于没话说：把接下来要上的课排出来，比一句\"今天没课\"有用 */\n    const next=[];\n    const dw=wd(d);\n    for(let k=1;k<=7&&next.length<3;k++){\n      const dd=(dw-1+k)%7+1;\n      const arr=lessonsOf(dd);\n      if(arr.length)next.push({d:dd,n:arr.length,first:arr[0]});\n    }\n    if(next.length){\n      h+='<div class=\"lessons\">'+next.map(x=>'<div class=\"lrow\">'\n        +'<span class=\"lno\">'+weekName(x.d)+'<\/span>'\n        +'<span class=\"lsub\">'+esc(x.first.sub)+'<\/span>'\n        +'<span class=\"lcls\">'+esc(x.first.cls||'')+'<\/span>'\n        +'<span class=\"lroom\">'+x.n+' 节<\/span><\/div>').join('')+'<\/div>'\n        +'<div class=\"help\" style=\"margin:8px 2px 0\">今天没课。上面是接下来三次要上的课，点右上角可以改课表。<\/div>';\n    }else{\n      h+='<div class=\"empty\">'+svg('book')+'课表还是空的，先把这一周的课排上<\/div>'\n        +'<div style=\"text-align:center;padding:0 0 4px\"><button class=\"btn pri sm\" data-act=\"tab\" data-tab=\"tt\">去排课表<\/button><\/div>';\n    }\n  }else{\n    h+='<div class=\"lessons\">'+ls.map(l=>'<div class=\"lrow'+(np===l.p?' now':'')+'\">'\n      +'<span class=\"lno\">'+l.p+'<\/span><span class=\"lsub\">'+esc(l.sub)+'<\/span>'\n      +'<span class=\"lcls\">'+esc(l.cls||'')+'<\/span>'\n      +(l.room?'<span class=\"lroom\">'+esc(l.room)+'<\/span>':'')\n      +'<\/div>').join('')+'<\/div>';\n  }\n  h+='<\/div><\/section>';\n\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>课堂小工具<\/h2><span class=\"sp\"><\/span>'\n    +'<span style=\"font-size:11px;color:var(--ink-3)\">上课随手用<\/span><\/div><div class=\"card-b\">'\n    +'<div class=\"tools\">'\n    +'<button class=\"tool\" data-act=\"pick\">'+svg('kid')+'随机点名<\/button>'\n    +'<button class=\"tool\" data-act=\"timer\">'+svg('timer')+'课堂倒计时<\/button>'\n    +'<button class=\"tool\" data-act=\"tab\" data-tab=\"cls\">'+svg('grid')+'排座位<\/button>'\n    +'<button class=\"tool\" data-act=\"tab\" data-tab=\"cls\">'+svg('check')+'今天点名<\/button>'\n    +'<\/div><\/div><\/section>';\n\n  h+='<\/div><\/div>';\n\n  /* 第二行 */\n  h+='<div class=\"grid g-2\" style=\"margin-top:14px\">';\n\n  h+='<section class=\"card\"><div class=\"card-h\"><h2>值得看一眼<\/h2><span class=\"sp\"><\/span><\/div><div class=\"card-b\"><div class=\"watch\">';\n  const w=watchList();\n  if(!w.length)h+='<div class=\"empty\">'+svg('check')+'班里没什么异常<\/div>';\n  else w.forEach(x=>{\n    h+='<div class=\"wrow '+x.cls+'\"><span class=\"ic\">'+svg(x.ic)+'<\/span>'\n      +'<span>'+x.t+'<\/span><span class=\"sp\"><\
